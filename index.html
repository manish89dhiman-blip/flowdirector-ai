function MonthlyView({ data, patch, onGoToDay }){
  const now = new Date();
  const [y, setY] = useState(now.getFullYear());
  const [m, setM] = useState(now.getMonth() + 1);
  const [selectedDay, setSelectedDay] = useState(now.getDate());
  const [showComplianceModal, setShowComplianceModal] = useState(false);
  const [notice, setNotice] = useState("");
  const say = (t) => { setNotice(t); setTimeout(() => setNotice(""), 4500); };

  const mk = `${y}-${m}`;
  const month = data.monthly[mk] || { days: {}, buffers: [] };
  const upd = (fn) => patch(d => { if (!d.monthly[mk]) d.monthly[mk] = { days: {}, buffers: [] }; fn(d.monthly[mk]); });
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDow = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const nav = (n) => { let nm = m + n, ny = y; if (nm > 12) { nm = 1; ny++; } if (nm < 1) { nm = 12; ny--; } setM(nm); setY(ny); };
  const toggleBuffer = (n) => upd(x => { x.buffers = x.buffers.includes(n) ? x.buffers.filter(b => b !== n) : [...x.buffers, n]; });
  const cells = []; for (let i = 0; i < firstDow; i++) cells.push(null); for (let n = 1; n <= daysInMonth; n++) cells.push(n);
  const place = (item, n) => patch(d => {
    if (!d.monthly[mk]) d.monthly[mk] = { days: {}, buffers: [] };
    const prev = d.monthly[mk].days[n] || "";
    d.monthly[mk].days[n] = prev ? prev + " · " + item.text : item.text;
    d.monthlyTray = d.monthlyTray.filter(t => t.id !== item.id);
    if (!d.recurringMonthly) d.recurringMonthly = [];
    d.recurringMonthly.push({ id: item.id, text: item.text, tag: item.tag, day: n, time: item.time || "" });
  });
  const dropTray = (id) => { if (!confirm("Delete this item? This can't be undone.")) return; patch(d => { d.monthlyTray = d.monthlyTray.filter(t => t.id !== id); }); };
  const stopRecurring = (id) => patch(d => { d.recurringMonthly = (d.recurringMonthly || []).filter(r => r.id !== id); });
  const updateTrayField = (id, field, value) => patch(d => { const t = d.monthlyTray.find(x => x.id === id); if (t) t[field] = value; });
  const updateRecurringField = (id, field, value) => patch(d => { const r = (d.recurringMonthly || []).find(x => x.id === id); if (r) r[field] = value; });
  const dueMap = dueItemsByDate(data);

  useEffect(() => {
    const recurring = data.recurringMonthly || [];
    if (recurring.length === 0) return;
    const monthDays = (data.monthly[mk] || { days: {} }).days || {};
    const additions = recurring.filter(r => r.day <= daysInMonth && !(monthDays[r.day] || "").includes(r.text));
    if (additions.length === 0) return;
    patch(d => {
      if (!d.monthly[mk]) d.monthly[mk] = { days: {}, buffers: [] };
      additions.forEach(r => {
        const cur = d.monthly[mk].days[r.day] || "";
        if (!cur.includes(r.text)) d.monthly[mk].days[r.day] = cur ? cur + " · " + r.text : r.text;
      });
    });
  }, [mk]);

  const activeMobileDateKey = `${y}-${pad2(m)}-${pad2(selectedDay || 1)}`;
  const activeMobileDue = dueMap[activeMobileDateKey] || [];
  const activeMobileIsBuffer = month.buffers.includes(selectedDay);

  return (
    <div className="space-y-4">
      <Callout>Only what is FIXED — deliveries, GST, payments, family, health. Not goals. Mark exactly 2 buffer days (click the star).</Callout>

      {notice && (
        <div className="rounded-xl border border-emerald-300 bg-emerald-50 px-4 py-3 text-xs font-extrabold text-emerald-900 shadow-xs">
          {notice}
        </div>
      )}

      {/* Header Month Control */}
      <div className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border-2 border-slate-200 bg-white p-3.5 shadow-xs">
        <div className="flex items-center gap-2">
          <button onClick={() => nav(-1)} className="rounded-xl border border-slate-200 bg-slate-50 px-2.5 py-1.5 text-slate-700 hover:bg-slate-100 transition shadow-2xs font-bold">
            <Ic n="left"/>
          </button>
          <div>
            <div className="font-black text-sm sm:text-base text-slate-950 flex items-center gap-2">
              <span>📅</span>
              <span>{MONTHS[m - 1]} {y}</span>
            </div>
            <div className="text-xs font-bold text-emerald-700 flex items-center gap-1">
              <span>⭐</span> Buffer Days: {month.buffers.length} / 2 reserved
            </div>
          </div>
          <button onClick={() => nav(1)} className="rounded-xl border border-slate-200 bg-slate-50 px-2.5 py-1.5 text-slate-700 hover:bg-slate-100 transition shadow-2xs font-bold">
            <Ic n="right"/>
          </button>
        </div>

        <button 
          onClick={() => setShowComplianceModal(true)}
          className="rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-800 px-3.5 py-2 text-xs font-bold transition shadow-2xs flex items-center gap-1.5"
        >
          <span>🏛️</span>
          <span>Tax &amp; Holiday Calendars</span>
        </button>
      </div>

      {showComplianceModal && (
        <ComplianceAndHolidaysModal 
          data={data} 
          patch={patch} 
          onClose={() => setShowComplianceModal(false)} 
          onNotice={say} 
        />
      )}

      {data.monthlyTray.length > 0 && (
        <div className="rounded-2xl border border-amber-200 bg-amber-50 p-4 shadow-xs">
          <div className="mb-1 text-xs font-black uppercase tracking-wider text-amber-800">To Place on a Date</div>
          <p className="mb-3 text-xs text-amber-900/80">Placing it registers the day-of-month — it auto-fills on this day every future month too.</p>
          <div className="space-y-2">
            {data.monthlyTray.map(t => (
              <BackupItemRow key={t.id} item={t} data={data}
                onUpdate={(f, v) => updateTrayField(t.id, f, v)} onRemove={() => dropTray(t.id)}
                onToggleDone={() => updateTrayField(t.id, "done", !t.done)}
                extra={<PlaceControl max={daysInMonth} onPlace={n => place(t, n)} />} />
            ))}
          </div>
        </div>
      )}

      {(data.recurringMonthly || []).length > 0 && (
        <details className="rounded-2xl border border-slate-200 bg-white p-4 shadow-xs">
          <summary className="cursor-pointer text-xs font-black uppercase tracking-wider text-slate-700">
            🔁 Recurring Every Month ({data.recurringMonthly.length})
          </summary>
          <div className="mt-3 space-y-1.5">
            {data.recurringMonthly.map(r => (
              <RecurringMonthlyRow key={r.id} item={r} daysInMonth={daysInMonth}
                onUpdate={(f, v) => updateRecurringField(r.id, f, v)} onStop={() => stopRecurring(r.id)} />
            ))}
          </div>
        </details>
      )}

      {/* 1. Mobile Compact Calendar & Selected Day Inspector (< md) */}
      <div className="block md:hidden space-y-3">
        {/* Compact 7-Column Date Matrix */}
        <div className="rounded-2xl border border-slate-200 bg-white p-3 shadow-xs">
          <div className="grid grid-cols-7 gap-1 text-center">
            {["M","T","W","T","F","S","S"].map((d, i) => (
              <div key={i} className="pb-1 text-[10px] font-black uppercase tracking-wider text-slate-400">
                {d}
              </div>
            ))}
            {cells.map((n, i) => {
              if (n === null) return <div key={"me" + i} className="h-9 rounded-xl bg-slate-50/50" />;
              const isBuffer = month.buffers.includes(n);
              const isToday = now.getFullYear() === y && now.getMonth() + 1 === m && now.getDate() === n;
              const isSelected = selectedDay === n;
              const hasText = !!month.days[n];
              const dueCount = (dueMap[`${y}-${pad2(m)}-${pad2(n)}`] || []).length;

              return (
                <button
                  key={n}
                  onClick={() => setSelectedDay(n)}
                  className={`h-10 rounded-xl flex flex-col items-center justify-center relative transition-all border ${
                    isSelected
                      ? "border-slate-950 bg-slate-950 text-white shadow-sm font-extrabold"
                      : isToday
                      ? "border-amber-400 bg-amber-50 text-amber-950 font-black"
                      : isBuffer
                      ? "border-emerald-300 bg-emerald-50 text-emerald-950 font-bold"
                      : "border-slate-100 bg-white text-slate-700 hover:bg-slate-50"
                  }`}
                >
                  <span className="text-xs">{n}</span>
                  <div className="flex items-center gap-0.5 mt-0.5">
                    {isBuffer && <span className="h-1 w-1 rounded-full bg-emerald-500"></span>}
                    {hasText && <span className="h-1 w-1 rounded-full bg-amber-500"></span>}
                    {dueCount > 0 && <span className="h-1 w-1 rounded-full bg-blue-500"></span>}
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        {/* Selected Day Agenda Detail Inspector */}
        <div className="rounded-2xl border border-slate-200 bg-white p-4 shadow-xs space-y-3">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-sm font-black text-slate-900">
                {new Intl.DateTimeFormat("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" }).format(new Date(activeMobileDateKey + "T00:00:00"))}
              </div>
              {activeMobileIsBuffer && (
                <div className="text-xs font-black text-emerald-700 mt-0.5">
                  ⭐ Reserved Buffer Day (Zero Meetings)
                </div>
              )}
            </div>

            <div className="flex items-center gap-1.5">
              <button
                onClick={() => toggleBuffer(selectedDay)}
                className={`rounded-xl border px-3 py-1 text-xs font-bold transition shadow-2xs ${
                  activeMobileIsBuffer ? "border-emerald-300 bg-emerald-100 text-emerald-900 font-black" : "border-slate-200 bg-slate-50 text-slate-700"
                }`}
              >
                {activeMobileIsBuffer ? "⭐ Buffer Active" : "☆ Mark Buffer"}
              </button>
              <button
                onClick={() => onGoToDay(activeMobileDateKey)}
                className="rounded-xl bg-amber-400 text-slate-950 px-3 py-1 text-xs font-black transition shadow-2xs"
              >
                Open Day →
              </button>
            </div>
          </div>

          <div>
            <label className="block text-[11px] font-black uppercase tracking-wider text-slate-500 mb-1">
              Monthly Blueprint Fixed Deliverable
            </label>
            <textarea
              value={month.days[selectedDay] || ""}
              onChange={e => upd(x => { x.days[selectedDay] = e.target.value; })}
              rows={3}
              placeholder="Add key deliverable, launch date, or fixed commitment..."
              className="w-full rounded-xl border border-slate-200 bg-slate-50/70 p-2.5 text-xs font-semibold text-slate-900 outline-none focus:border-amber-400 focus:bg-white transition"
            />
          </div>

          {activeMobileDue.length > 0 && (
            <div className="space-y-1.5 pt-1">
              <div className="text-[11px] font-black uppercase tracking-wider text-sky-800">
                📌 Statutory &amp; Scheduled Tasks ({activeMobileDue.length})
              </div>
              {activeMobileDue.map((it, idx) => (
                <div key={idx} className="rounded-xl border border-sky-200 bg-sky-50 px-3 py-1.5 text-xs font-bold text-sky-950">
                  {it.time ? `${it.time} · ` : ""}{it.text}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* 2. Desktop Full 7-Column Grid (Visible on Desktop/Tablet >= md) */}
      <div className="hidden md:block overflow-x-auto rounded-2xl border border-slate-200 bg-white p-3 shadow-xs">
        <div className="grid grid-cols-7 gap-1.5">
          {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => (
            <div key={d} className="pb-1.5 text-center text-xs font-black uppercase tracking-wider text-slate-500">
              {d}
            </div>
          ))}
          {cells.map((n, i) => {
            if (n === null) return <div key={"e" + i} className="rounded-xl bg-slate-50/50 min-h-[96px]" />;
            const isBuffer = month.buffers.includes(n);
            const isToday = now.getFullYear() === y && now.getMonth() + 1 === m && now.getDate() === n;
            const dueOnDay = dueMap[`${y}-${pad2(m)}-${pad2(n)}`] || [];
            return (
              <div key={n} className={`rounded-xl border p-2 min-h-[96px] transition-all flex flex-col justify-between ${
                isBuffer ? "border-emerald-300 bg-emerald-50/70" : isToday ? "border-amber-300 bg-amber-50/30" : "border-slate-100 bg-white hover:border-slate-300"
              }`}>
                <div>
                  <div className="flex items-center justify-between mb-1">
                    <button 
                      onClick={() => onGoToDay(`${y}-${pad2(m)}-${pad2(n)}`)} 
                      title="Open Daily Cockpit"
                      className={`mono rounded-lg px-1.5 py-0.5 text-xs font-bold transition hover:underline ${
                        isToday ? "bg-amber-400 font-black text-slate-950 shadow-2xs" : "text-slate-700 hover:text-amber-700"
                      }`}
                    >
                      {n}
                    </button>
                    <button 
                      onClick={() => toggleBuffer(n)} 
                      title="Mark Buffer Day" 
                      className={isBuffer ? "text-emerald-600 font-bold" : "text-slate-300 hover:text-emerald-500"}
                    >
                      <Ic n={isBuffer ? "star" : "starO"}/>
                    </button>
                  </div>
                  <textarea 
                    value={month.days[n] || ""} 
                    onChange={e => upd(x => { x.days[n] = e.target.value; })} 
                    rows={2}
                    placeholder="Focus..."
                    className="w-full resize-none rounded-lg bg-transparent text-[11px] font-semibold leading-tight text-slate-800 outline-none placeholder:text-slate-300 focus:bg-amber-50" 
                  />
                </div>
                <div className="space-y-0.5 mt-1">
                  {dueOnDay.map((it, idx) => (
                    <div key={idx} className="truncate rounded-md bg-sky-50 border border-sky-200 px-1 py-0.2 text-[9px] font-bold text-sky-800" title={it.text}>
                      📌 {it.time ? it.time + " " : ""}{it.text}
                    </div>
                  ))}
                  {isBuffer && <span className="text-[10px] font-black uppercase text-emerald-700 block">⭐ Buffer</span>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}
function PlaceControl({ max, onPlace }){
  const [n,setN]=useState("");
  return (
    <span className="flex items-center gap-1">
      <input type="number" min={1} max={max} value={n} onChange={e=>setN(e.target.value)} placeholder="date" className="w-16 rounded border border-slate-200 px-1 py-0.5 text-xs outline-none" />
      <button onClick={()=>{const v=parseInt(n,10);if(v>=1&&v<=max){onPlace(v);setN("");}}} className="rounded bg-slate-900 px-2 py-0.5 text-xs font-medium text-white hover:bg-slate-700">Place</button>
    </span>
  );
}
function RecurringMonthlyRow({ item, daysInMonth, onUpdate, onStop }){
  const [editing,setEditing]=useState(false);
  if(!editing){
    return (

function MaybeView({ data, patch }){
  const [item,setItem]=useState(""); const [cat,setCat]=useState("Decision");
  const add=()=>{ if(!item.trim())return; patch(d=>d.maybe.unshift({id:uid(),added:new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short"}),item:item.trim(),category:cat,revisit:"",decision:""})); setItem(""); };
  const set=(id,f,v)=>patch(d=>{const r=d.maybe.find(x=>x.id===id);if(r)r[f]=v;});
  const remove=(id)=>patch(d=>{d.maybe=d.maybe.filter(x=>x.id!==id);});
  const commit=(row)=>patch(d=>{ d.captures.unshift({id:uid(),date:new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short"}),item:row.item,category:row.category==="Decision"?"Ops":row.category,taskType:"",details:"committed from Maybe",status:"Open"}); d.maybe=d.maybe.filter(x=>x.id!==row.id); });
  return (
    <div>
      <Callout>Sapne bhoolne ke liye nahi, park karne ke liye hote hain. Every item gets a revisit date. Parking is a decision.</Callout>
      <div className="mb-4 flex flex-col gap-2 rounded-lg border border-slate-200 bg-white p-4 sm:flex-row">
        <input value={item} onChange={e=>setItem(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Second helipad? Europe trip? New aircraft?…"
          className="flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
        <select value={cat} onChange={e=>setCat(e.target.value)} className="rounded-md border border-slate-200 px-2 py-2 text-sm">{(data.categories||DEFAULT_CATEGORIES).map(c=><option key={c}>{c}</option>)}</select>
        <button onClick={add} className="flex items-center justify-center gap-1 rounded-md bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-700"><Ic n="plus"/> Park it</button>
      </div>
      <div className="overflow-x-auto rounded-lg border border-slate-200 bg-white">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-left text-xs uppercase tracking-wide text-slate-400">
            <tr><th className="p-2">Added</th><th className="p-2">Item</th><th className="p-2">Category</th><th className="p-2">Revisit</th><th className="p-2">Decision</th><th className="p-2"></th></tr>
          </thead>
          <tbody>
            {data.maybe.length===0 && <tr><td colSpan={6} className="p-8 text-center text-slate-400">Nothing parked yet.</td></tr>}
            {data.maybe.map(r=>(
              <tr key={r.id} className="border-t border-slate-100">
                <td className="p-2 mono text-xs text-slate-400">{r.added}</td>
                <td className="p-2"><input value={r.item} onChange={e=>set(r.id,"item",e.target.value)} className="w-full min-w-[10rem] rounded border border-slate-200 px-1 py-0.5 text-sm text-slate-700 outline-none focus:border-amber-400" /></td>
                <td className="p-2"><select value={r.category} onChange={e=>set(r.id,"category",e.target.value)} className="rounded border border-slate-200 bg-white px-1 py-0.5 text-xs text-slate-600 outline-none">{(data.categories||DEFAULT_CATEGORIES).map(c=><option key={c}>{c}</option>)}</select></td>
                <td className="p-2"><input type="date" value={r.revisit||""} onChange={e=>set(r.id,"revisit",e.target.value)} className="rounded border border-amber-200 bg-amber-50 px-1 py-0.5 text-xs outline-none" /></td>
                <td className="p-2"><input value={r.decision||""} onChange={e=>set(r.id,"decision",e.target.value)} placeholder="commit / re-park" className="w-full rounded border border-slate-200 px-1 py-0.5 text-xs outline-none focus:border-amber-400" /></td>
                <td className="p-2"><div className="flex gap-1">
                  <button onClick={()=>commit(r)} title="Commit → send to Capture" className="rounded bg-amber-400 px-2 py-0.5 text-xs font-semibold text-slate-900 hover:bg-amber-300">Commit</button>
                  <button onClick={()=>remove(r.id)} className="text-slate-300 hover:text-rose-500"><Ic n="trash"/></button>
                </div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ReferenceView({ data, patch }){
  const [text,setText]=useState("");
  const add=()=>{ if(!text.trim())return; patch(d=>d.reference.unshift({id:uid(),text:text.trim(),note:""})); setText(""); };
  const remove=(id)=>patch(d=>{d.reference=d.reference.filter(x=>x.id!==id);});
  const setNote=(id,v)=>patch(d=>{const r=d.reference.find(x=>x.id===id);if(r)r.note=v;});
  const setItemText=(id,v)=>patch(d=>{const r=d.reference.find(x=>x.id===id);if(r)r.text=v;});
  return (
    <div>
      <Callout>Information disguised as a task is clutter. Reference & automate items live here — no action needed.</Callout>
      <div className="mb-4 flex gap-2 rounded-lg border border-slate-200 bg-white p-4">
        <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="A number, a link, a fact to keep…"
          className="flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
        <button onClick={add} className="flex items-center gap-1 rounded-md bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-700"><Ic n="plus"/> Save</button>
      </div>
      <div className="space-y-2">
        {data.reference.length===0 && <Ghost>No reference notes yet.</Ghost>}
        {data.reference.map(r=>(
          <div key={r.id} className="rounded-lg border border-slate-200 bg-white p-3">
            <div className="flex items-start justify-between gap-2">
              <input value={r.text} onChange={e=>setItemText(r.id,e.target.value)}
                className="min-w-0 flex-1 rounded-md border border-transparent bg-transparent px-1 py-0.5 font-medium text-slate-800 outline-none hover:border-slate-200 focus:border-amber-400 focus:bg-amber-50" />
              <button onClick={()=>remove(r.id)} className="text-slate-300 hover:text-rose-500"><Ic n="trash"/></button>
            </div>
            <input value={r.note||""} onChange={e=>setNote(r.id,e.target.value)} placeholder="note…" className="mt-1 w-full rounded-md border border-slate-100 bg-stone-50 px-2 py-1 text-xs outline-none focus:border-amber-300" />
          </div>
        ))}
      </div>
    </div>
  );
}

function CategoriesSection({ data, patch }){
  const [name,setName]=useState("");
  const list = data.categories||DEFAULT_CATEGORIES;
  const add=()=>{ const n=name.trim(); if(!n || list.includes(n)) return; patch(d=>{ if(!d.categories) d.categories=[...DEFAULT_CATEGORIES]; d.categories.push(n); }); setName(""); };
  const rename=(oldName,newName)=>{
    const n=newName.trim();
    if(!n || n===oldName) return;
    patch(d=>{
      if(!d.categories) d.categories=[...DEFAULT_CATEGORIES];
      const idx=d.categories.indexOf(oldName);
      if(idx>=0) d.categories[idx]=n;
      d.captures.forEach(c=>{ if(c.category===oldName) c.category=n; });
      d.maybe.forEach(m=>{ if(m.category===oldName) m.category=n; });
    });
  };
  const remove=(catName)=>{
    if(!confirm(`Remove "${catName}" from your category list? Items already tagged with it keep the label — it just won't be offered for new items.`)) return;
    patch(d=>{ d.categories=(d.categories||DEFAULT_CATEGORIES).filter(x=>x!==catName); });
  };
  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <h3 className="mb-3 font-semibold text-slate-700">Categories</h3>
      <p className="mb-3 text-xs text-slate-400">Used in Capture and Maybe. Renaming updates it everywhere already tagged with it; removing just stops offering it going forward.</p>
      <div className="flex gap-2">
        <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="New category name"
          className="flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
        <button onClick={add} className="flex items-center gap-1 rounded-md bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-700"><Ic n="plus"/> Add</button>
      </div>
      <div className="mt-3 space-y-1">
        {list.map(catName=>(
          <div key={catName} className="flex items-center gap-2">
            <input defaultValue={catName} onBlur={e=>rename(catName,e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); }}
              className="flex-1 rounded-md border border-slate-200 bg-white px-2 py-1 text-sm outline-none focus:border-amber-400" />
            <button onClick={()=>remove(catName)} className="text-slate-300 hover:text-rose-500"><Ic n="trash"/></button>
          </div>
        ))}
      </div>
    </div>
  );
}

};

  const quarter = quarterOfMonth(period);
  const periods = [period, quarter];

  useEffect(() => {
    if (myRank <= 1 || !orgId) { setMembers([]); return; }
    loadTeam(orgId).then(setMembers).catch(() => setMembers([]));
  }, [orgId, myRole]);

  const refresh = () => {
    const targetUserId = who || meId;
    if (!targetUserId) return;
    return loadGoals(targetUserId, periods)
      .then(setGoals)
      .catch(e => { 
        console.warn("Goals load error:", e);
        setMsg(e.message || "Couldn't load goals."); 
        setGoals({ kras:[], kpis:[], values:[], dailyLogs:[] }); 
      });
  };

  useEffect(() => { 
    setGoals(null); 
    refresh(); 
  }, [who, period, meId]);

  // Strict role and department filtering
  const visible = filterVisibleTeamMembers(members || [], meId, myRole, myDept);

                    className="rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-600 px-2.5 py-1.5 text-xs font-bold transition"
                  >
                    ✎
                  </button>
                  <button 
                    onClick={() => { if (confirm(`Delete responsibility area "${kra.title}"? Its KPIs will stay unfiled.`)) act(() => deleteKra(kra.id)); }}
                    className="rounded-xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1.5 text-xs font-bold transition"
                  >
                    ✕
                  </button>
                </div>
              )}
            </div>

            <KpiList 
              kpis={kpisOfKra(kra.id)} 
              valueOf={valueOf} 
              canManage={canManage}
              onActual={saveActual} 
              onEdit={setKpiDraft}
              onDelete={k => { if (confirm(`Delete KPI "${k.name}"?`)) act(() => deleteKpi(k.id)); }} 
              dailyLogs={goals.dailyLogs || []}
              orgCtx={orgCtx}
              meId={meId}
              onRefresh={refresh}
            />
          </div>
        ))}

        {looseKpis.length > 0 && (
          <div className="rounded-3xl border border-slate-200 bg-white p-5 sm:p-6 shadow-xs space-y-4">
            <div className="border-b border-slate-100 pb-2">
              <h3 className="font-extrabold text-slate-900 text-sm">Other Organization KPIs</h3>
              <p className="text-xs text-slate-500">Standalone metrics not attached to a specific responsibility area.</p>
            </div>
            <KpiList 
              kpis={looseKpis} 
              valueOf={valueOf} 
              canManage={canManage}
              onActual={saveActual} 
              onEdit={setKpiDraft}
              onDelete={k => { if (confirm(`Delete KPI "${k.name}"?`)) act(() => deleteKpi(k.id)); }} 
              dailyLogs={goals.dailyLogs || []}
              orgCtx={orgCtx}
              meId={meId}
              onRefresh={refresh}
            />
          </div>
        )}
      </div>

      {canManage && (goals.kras || []).length > 0 && !kpiDraft && (
        <button 
          onClick={() => setKpiDraft({ kra_id: null, name: "", unit: "", target: "", direction: "up", cadence: "monthly", aggregation: "sum" })}
          className="rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 px-4 py-2 text-xs font-bold text-slate-700 transition shadow-2xs"
        >
          + Add Standalone KPI (Unfiled)
        </button>
      )}

      {kpiDraft && (
        <KpiEditor 
          draft={kpiDraft} 
          kras={goals.kras || []} 
          onCancel={() => setKpiDraft(null)}
          onSave={d => act(async () => {
            await saveKpi(d.id ? d : { ...d, org_id: orgId || orgCtx?.org?.id, user_id: who || meId, created_by: meId, target: Number(d.target) || 0 });
            setKpiDraft(null);
          })} 
        />
      )}
    </div>
  );
}

function KpiDailyLogModal({ kpi, orgCtx, meId, onUpdate, onClose }){
  const today = todayKey();
  const [logDate, setLogDate] = useState(today);
  const [logValue, setLogValue] = useState("");
  const [logNotes, setLogNotes] = useState("");
  const [busy, setBusy] = useState(false);
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [notice, setNotice] = useState("");

  const say = (t) => { setNotice(t); setTimeout(() => setNotice(""), 4000); };
  const myName = orgCtx?.profile?.full_name || orgCtx?.profile?.email || "Team Member";

  const fetchLogs = async () => {
    setLoading(true);
    try {
      const { data, error } = await sb
        .from("kpi_daily_logs")
        .select("*")
        .eq("kpi_id", kpi.id)
        .order("date", { ascending: false });
      if (!error && data) setLogs(data);
    } catch (e) {
      console.warn("Failed to fetch logs:", e);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    fetchLogs();
  }, [kpi.id]);

  const handleAddLog = async (e) => {
    e.preventDefault();
    if (logValue === "" || isNaN(Number(logValue))) {
      alert("Please enter a valid numeric value.");
      return;
    }
    setBusy(true);
    try {
      await saveKpiDailyLog({
        kpi_id: kpi.id,
        org_id: orgCtx?.org?.id || kpi.org_id,
        user_id: kpi.user_id,
        date: logDate,
        value: Number(logValue),
        notes: logNotes,
        logged_by: meId,
        logged_by_name: myName,
        kpiObj: kpi
      });
      setLogValue("");
      setLogNotes("");
      say(`✓ Entry for ${logDate} recorded! Scorecard recalculated.`);
      await fetchLogs();
      if (onUpdate) onUpdate();
    } catch (err) {
      alert(err.message || "Couldn't save daily log.");
    } finally {
      setBusy(false);
    }
  };

  const handleDeleteLog = async (logItem) => {
    if (!confirm(`Delete entry for ${logItem.date} (${logItem.value} ${kpi.unit || ""})?`)) return;
    try {
      await deleteKpiDailyLog(logItem.id, kpi.id, logItem.date, meId, kpi);
      say(`✓ Entry deleted and totals updated.`);
      await fetchLogs();
      if (onUpdate) onUpdate();
    } catch (err) {
      alert(err.message || "Couldn't delete entry.");
    }
  };

  // Group by current month and calculate week-by-week subtotals
  const currentMonthKey = today.substring(0, 7);
  const currentMonthLogs = logs.filter(l => (l.date || "").startsWith(currentMonthKey));

  const aggMethod = kpi.aggregation || "sum";
  let monthTotal = 0;
  if (aggMethod === "avg") {
    const sum = currentMonthLogs.reduce((a, b) => a + (Number(b.value) || 0), 0);
    monthTotal = currentMonthLogs.length ? Math.round((sum / currentMonthLogs.length) * 10) / 10 : 0;
  } else {
    monthTotal = Math.round((currentMonthLogs.reduce((a, b) => a + (Number(b.value) || 0), 0)) * 100) / 100;
  }

  const attain = kpiAttainment(kpi, currentMonthLogs.length ? monthTotal : null);
  const tone = kpiTone(attain);

  // Group into weeks
  const weeks = [
    { label: "Week 1 (1st–7th)", filter: (d) => { const day = Number(d.split("-")[2]); return day >= 1 && day <= 7; } },
    { label: "Week 2 (8th–14th)", filter: (d) => { const day = Number(d.split("-")[2]); return day >= 8 && day <= 14; } },
    { label: "Week 3 (15th–21st)", filter: (d) => { const day = Number(d.split("-")[2]); return day >= 15 && day <= 21; } },
    { label: "Week 4 (22nd–28th)", filter: (d) => { const day = Number(d.split("-")[2]); return day >= 22 && day <= 28; } },
    { label: "Week 5 (29th–31st)", filter: (d) => { const day = Number(d.split("-")[2]); return day >= 29; } },
  ];

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm animate-fade-in overflow-y-auto">
      <div className="w-full max-w-3xl rounded-3xl border border-slate-200 bg-white p-6 shadow-2xl space-y-6 my-8 max-h-[90vh] overflow-y-auto">
        {/* Header */}
        <div className="flex items-start justify-between gap-4 border-b border-slate-100 pb-4">
          <div className="space-y-1">
            <div className="flex items-center gap-2">
              <span className="rounded-full bg-amber-100 text-amber-900 px-2.5 py-0.5 text-[10px] font-black uppercase tracking-wider">
                📅 DAILY KPI AUDIT LOG
              </span>
              <span className="rounded-full bg-slate-100 text-slate-700 px-2 py-0.5 text-[10px] font-bold">
                {aggMethod === "avg" ? "⌀ Average Calculation" : "∑ Cumulative Sum"}
              </span>
            </div>
            <h2 className="text-xl font-black text-slate-950">{kpi.name}</h2>
            <p className="text-xs text-slate-500 font-medium">
              Target: {kpi.direction === "down" ? "≤" : "≥"} <b>{kpi.target} {kpi.unit || ""}</b> · Cadence: <b>{kpi.cadence}</b>
            </p>
          </div>
          <button onClick={onClose} className="rounded-full p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-800 transition text-lg font-bold">
            ✕
          </button>
        </div>

        {notice && (
          <div className="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-2 text-xs font-bold text-emerald-900 shadow-2xs">
            {notice}
          </div>
        )}

        {/* 4 Scorecard Metrics Cards */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div className="rounded-2xl border border-slate-200 bg-slate-50/70 p-3.5 space-y-1 text-center">
            <span className="text-[10px] font-bold uppercase text-slate-400 block">Target</span>
            <span className="text-base font-black text-slate-900">{kpi.target} {kpi.unit || ""}</span>
          </div>

          <div className="rounded-2xl border border-amber-200 bg-amber-50/50 p-3.5 space-y-1 text-center">
            <span className="text-[10px] font-bold uppercase text-amber-800 block">This Month Rollup</span>
            <span className="text-base font-black text-amber-950">
              {currentMonthLogs.length ? monthTotal : "—"} {kpi.unit || ""}
            </span>
          </div>

          <div className={`rounded-2xl border p-3.5 space-y-1 text-center ${TONE_CLS[tone]}`}>
            <span className="text-[10px] font-bold uppercase block opacity-75">Attainment</span>
            <span className="text-base font-black block">
              {attain === null ? "—" : attain + "%"}
            </span>
          </div>

          <div className="rounded-2xl border border-slate-200 bg-slate-50/70 p-3.5 space-y-1 text-center">
            <span className="text-[10px] font-bold uppercase text-slate-400 block">Days Logged</span>
            <span className="text-base font-black text-slate-900">{currentMonthLogs.length} Days</span>
          </div>
        </div>

        {/* Form: Add / Log Daily Entry */}
        <div className="rounded-2xl border-2 border-amber-300 bg-amber-50/60 p-4 sm:p-5 space-y-3 shadow-xs">
          <h3 className="text-xs font-black uppercase text-amber-950 tracking-wider flex items-center gap-1.5">
            <span>⚡</span>
            <span>Record Daily Entry</span>
          </h3>
          <form onSubmit={handleAddLog} className="grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-end">
            <div className="sm:col-span-3">
              <label className="text-[10px] font-bold uppercase text-slate-600 block mb-1">Date</label>
              <input
                type="date"
                value={logDate}
                onChange={e => setLogDate(e.target.value)}
                className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-900 outline-none focus:border-amber-500"
              />
            </div>

            <div className="sm:col-span-3">
              <label className="text-[10px] font-bold uppercase text-slate-600 block mb-1">Value ({kpi.unit || "number"})</label>
              <input
                type="number"
                step="any"
                value={logValue}
                onChange={e => setLogValue(e.target.value)}
                placeholder={`e.g. ${kpi.target || 10}`}
                className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-900 outline-none focus:border-amber-500"
              />
            </div>

            <div className="sm:col-span-4">
              <label className="text-[10px] font-bold uppercase text-slate-600 block mb-1">Notes / Flight or Client Reference</label>
              <input
                value={logNotes}
                onChange={e => setLogNotes(e.target.value)}
                placeholder="e.g. VT-XYZ charter DEL-GOI"
                className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-medium text-slate-900 outline-none focus:border-amber-500"
              />
            </div>

            <div className="sm:col-span-2">
              <button
                type="submit"
                disabled={busy}
                className="w-full rounded-xl bg-slate-950 text-white hover:bg-slate-800 py-2 text-xs font-black transition shadow-xs disabled:opacity-60"
              >
                {busy ? "Saving…" : "+ Save Log"}
              </button>
            </div>
          </form>
        </div>

        {/* Weekly Subtotals Strip */}
        <div className="space-y-2">
          <h4 className="text-xs font-black uppercase text-slate-700 tracking-wider">Weekly Performance Breakdown ({prettyPeriod(currentMonthKey)})</h4>
          <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
            {weeks.map((wk, idx) => {
              const wkLogs = currentMonthLogs.filter(l => wk.filter(l.date));
              let wkVal = 0;
              if (aggMethod === "avg") {
                const sum = wkLogs.reduce((a, b) => a + (Number(b.value) || 0), 0);
                wkVal = wkLogs.length ? Math.round((sum / wkLogs.length) * 10) / 10 : 0;
              } else {
                wkVal = Math.round((wkLogs.reduce((a, b) => a + (Number(b.value) || 0), 0)) * 100) / 100;
              }

              return (
                <div key={idx} className="rounded-xl border border-slate-200 bg-slate-50 p-2.5 text-center space-y-0.5">
                  <span className="text-[9px] font-bold text-slate-500 block truncate">{wk.label}</span>
                  <span className="text-xs font-extrabold text-slate-900 block">
                    {wkLogs.length ? wkVal : "—"} {wkLogs.length ? (kpi.unit || "") : ""}
                  </span>
                  <span className="text-[9px] text-slate-400 font-medium block">({wkLogs.length} days)</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Chronological Audit Trail History Table */}
        <div className="space-y-2">
          <h4 className="text-xs font-black uppercase text-slate-700 tracking-wider">
            All Logged Entries ({logs.length})
          </h4>

          {loading ? (
            <div className="p-8 text-center text-xs text-slate-400">Loading history audit logs…</div>
          ) : logs.length === 0 ? (
            <div className="rounded-2xl border border-dashed border-slate-200 p-8 text-center text-xs text-slate-400 italic">
              No daily entries recorded yet. Use the form above to log your first number.
            </div>
          ) : (
            <div className="overflow-x-auto rounded-2xl border border-slate-200">
              <table className="w-full text-left text-xs border-collapse">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-200 text-[10px] font-black uppercase tracking-wider text-slate-500">
                    <th className="p-3">Date</th>
                    <th className="p-3">Logged Value</th>
                    <th className="p-3">Notes / Context</th>
                    <th className="p-3">Logged By</th>
                    <th className="p-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {logs.map(item => (
                    <tr key={item.id} className="hover:bg-slate-50/80 transition">
                      <td className="p-3 font-bold text-slate-900 whitespace-nowrap">📅 {item.date}</td>
                      <td className="p-3 font-black text-slate-950 whitespace-nowrap">
                        {item.value} <span className="font-normal text-slate-500">{kpi.unit || ""}</span>
                      </td>
                      <td className="p-3 text-slate-700 font-medium max-w-xs truncate">{item.notes || "—"}</td>
                      <td className="p-3 text-slate-500 whitespace-nowrap text-[11px]">{item.logged_by_name || "Member"}</td>
                      <td className="p-3 text-right whitespace-nowrap">
                        <button
                          onClick={() => handleDeleteLog(item)}
                          className="rounded-lg px-2 py-1 text-rose-600 hover:bg-rose-50 font-bold transition text-xs"
                          title="Delete entry"
                        >
                          ✕ Delete
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>

        {/* Footer */}
        <div className="flex justify-end pt-2">
          <button
            onClick={onClose}
            className="rounded-xl bg-slate-950 text-white px-5 py-2 text-xs font-black hover:bg-slate-800 transition shadow-xs"
          >
            Done &amp; Close
          </button>
        </div>
      </div>
    </div>
  );
}

function KpiList({ kpis, valueOf, canManage, onActual, onEdit, onDelete, dailyLogs = [], orgCtx, meId, onRefresh }){
  const [activeDailyModal, setActiveDailyModal] = useState(null);
  const today = todayKey();
  const myName = orgCtx?.profile?.full_name || orgCtx?.profile?.email || "Team Member";

  if (kpis.length === 0)
    return <p className="text-xs text-slate-400 italic py-2">No KPIs attached to this responsibility area yet. Click "+ Add KPI" above.</p>;

  return (
    <div className="space-y-3">
      {kpis.map(kpi => {
        const v = valueOf(kpi);
        const attain = kpiAttainment(kpi, v && v.actual);
        const tone = kpiTone(attain);
        const kpiLogs = dailyLogs.filter(l => l.kpi_id === kpi.id);
        const todayLog = kpiLogs.find(l => l.date === today);
        const aggMethod = kpi.aggregation || "sum";

        return (
          <div key={kpi.id} className={`flex flex-wrap items-center justify-between gap-3 rounded-2xl border p-4 transition shadow-2xs ${TONE_CLS[tone]}`}>
            <div className="min-w-[160px] flex-1 space-y-1.5">
              <div className="flex flex-wrap items-center gap-2">
                <span className="text-sm font-black text-slate-950">{kpi.name}</span>
                <span className="rounded-full bg-white/80 px-2 py-0.2 text-[9px] font-extrabold text-slate-700 border border-slate-200">
                  {aggMethod === "avg" ? "⌀ Average" : "∑ Cumulative"}
                </span>
              </div>

              <div className="flex flex-wrap items-center gap-2 text-[11px] text-slate-500 font-medium">
                <span className="rounded bg-white/70 px-1.5 py-0.5 border border-slate-200">
                  Target: {kpi.direction === "down" ? "≤" : "≥"} <b>{kpi.target} {kpi.unit || ""}</b>
                </span>
                <span>· Cadence: <b>{kpi.cadence === "quarterly" ? "Quarterly" : "Monthly"}</b></span>
                <span>· Logs: <b>{kpiLogs.length} days logged</b></span>
              </div>
            </div>

            {/* Quick Logging & Score Strip */}
            <div className="flex flex-wrap items-center gap-2.5">
              {/* Daily Log Button with Log Count */}
              <button
                onClick={() => setActiveDailyModal(kpi)}
                className="flex items-center gap-1.5 rounded-xl border border-amber-300 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 text-xs font-bold text-amber-950 transition shadow-2xs"
                title="View date-by-date daily breakdown & log entries"
              >
                <span>📅</span>
                <span>Daily Log ({kpiLogs.length})</span>
              </button>

              {/* Inline Month / Period Total */}
              <label className="flex items-center gap-1.5 text-xs font-bold text-slate-700">
                <span className="text-slate-500 text-[11px]">Month Total:</span>
                <input 
                  type="number" 
                  step="any" 
                  defaultValue={v && v.actual !== null && v.actual !== undefined ? v.actual : ""}
                  onBlur={e => { 
                    const raw = e.target.value;
                    const cur = v && v.actual !== null && v.actual !== undefined ? String(v.actual) : "";
                    if (raw !== cur) onActual(kpi, raw); 
                  }}
                  onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
                  placeholder="Total"
                  className="w-24 rounded-xl border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-bold text-slate-900 outline-none focus:ring-2 focus:ring-amber-400" 
                />
              </label>

              {/* Attainment Percentage Ring / Pill */}
              <div className="text-right min-w-[65px] bg-white/80 px-2.5 py-1 rounded-xl border border-slate-200">
                <span className={`text-xs font-black block ${tone === "emerald" ? "text-emerald-700" : tone === "rose" ? "text-rose-700" : "text-amber-700"}`}>
                  {attain === null ? "—" : attain + "%"}
                </span>
                <span className="text-[9px] font-bold text-slate-400 uppercase">Score</span>
              </div>

              {canManage && (
                <div className="flex shrink-0 items-center gap-1 ml-0.5">
                  <button 
                    onClick={() => onEdit({ id: kpi.id, kra_id: kpi.kra_id, name: kpi.name, unit: kpi.unit || "", target: kpi.target, direction: kpi.direction, cadence: kpi.cadence, aggregation: kpi.aggregation || "sum" })}
                    title="Edit KPI Settings" 
                    className="rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-slate-600 px-2 py-1 text-xs font-bold transition"
                  >
                    ✎
                  </button>
                  <button 
                    onClick={() => onDelete(kpi)} 
                    title="Delete KPI"
                    className="rounded-lg border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-600 px-2 py-1 text-xs font-bold transition"
                  >
                    ✕
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      })}

      {activeDailyModal && (
        <KpiDailyLogModal
          kpi={activeDailyModal}
          orgCtx={orgCtx}
          meId={meId}
          onUpdate={onRefresh}
          onClose={() => setActiveDailyModal(null)}
        />
      )}
    </div>
  );
}

function KpiEditor({ draft, kras, onSave, onCancel }){

  return (
    <div className="rounded-3xl border-2 border-amber-300 bg-amber-50/70 p-5 sm:p-6 space-y-4 shadow-sm">

        {d.id ? "Edit Key Performance Indicator (KPI)" : "Define New Key Performance Indicator (KPI)"}
      </h3>
      <input

/* ================================================================== */
/*  Rollup metrics (Phase 2)                                           */
/*  Everything here is derived from data the planner already records.  */
/*  Where the stored shape can't answer a question honestly, the       */
/*  metric is omitted rather than estimated.                           */
/* ================================================================== */
const PERIODS = [
  { id:"today", label:"Today",        days:1  },
  { id:"7",     label:"Last 7 days",  days:7  },
  { id:"30",    label:"Last 30 days", days:30 },
];

const lastNDayKeys = (n) => {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(shiftDay(todayKey(), -i));
  return out;
};

const mondaysInPeriod = (dayKeys) => [...new Set(dayKeys.map(mondayOf))];

// closure.score defaults to 0 AND 0 is a legitimate score, so "not scored" and
// "scored zero" are indistinguishable from the number alone. Treat a day as
// genuinely closed only when the person left some other trace of the ritual.
const dayWasClosed = (rec) => {
  if (!rec || !rec.closure) return false;
  const c = rec.closure;
  return (c.score || 0) > 0 || !!(c.ate || "").trim() || !!(c.family || "").trim();
};

function personMetrics(plan, dayKeys){
  let daysPlanned = 0, prioSet = 0, prioDone = 0, prioMoved = 0, prioDropped = 0, prioDelegated = 0;
  let scoreSum = 0, scoreDays = 0;
  const scoreSeries = [];

  dayKeys.forEach(k => {
    const rec = (plan.daily || {})[k];
    if (!rec) { scoreSeries.push(null); return; }
    if ((rec.outcome || "").trim()) daysPlanned++;
    (rec.priorities || []).forEach((p, i) => {
      if (!(p || "").trim()) return;
      prioSet++;
      switch ((rec.marks || [])[i] || "") {
        case "done":      prioDone++; break;
        case "moved":     prioMoved++; break;
        case "dropped":   prioDropped++; break;
        case "delegated": prioDelegated++; break;
      }
    });
    if (dayWasClosed(rec)) { scoreSum += (rec.closure.score || 0); scoreDays++; scoreSeries.push(rec.closure.score || 0); }
    else scoreSeries.push(null);
  });

  // Weekly non-negotiables across whatever weeks the period touches.
  const weeks = mondaysInPeriod(dayKeys);
  let nnHit = 0, nnPossible = 0;
  weeks.forEach(wk => {
    const w = (plan.weekly || {})[wk];
    ["focus","review","family"].forEach(k => {
      nnPossible++;
      if (w && w.nonneg && w.nonneg[k]) nnHit++;
    });
  });

  const { overdue, today } = collectDueItems(plan);
  const openDelegated = (plan.dailyBackup || [])
    .filter(b => ["DELEGATE","WAITING-FOR"].includes(b.taskType) && !b.done);
  const overdueDelegated = openDelegated.filter(b => b.due && b.due < todayKey());

  return {
    daysPlanned, daysInPeriod: dayKeys.length,
    prioSet, prioDone, prioMoved, prioDropped, prioDelegated,
    prioCompletion: prioSet ? Math.round((prioDone / prioSet) * 100) : null,
    avgScore: scoreDays ? (scoreSum / scoreDays) : null,
    scoreDays, scoreSeries,
    nnHit, nnPossible,
    nnRate: nnPossible ? Math.round((nnHit / nnPossible) * 100) : null,
    overdue: overdue.length, dueToday: today.length,
    openDelegated: openDelegated.length,
    overdueDelegated: overdueDelegated.length,
    openBackup: (plan.dailyBackup || []).filter(b => !b.done).length,
  };
}

// Tiny inline bar chart. Null entries render as a faint "no data" tick so a
// gap reads as "didn't close the day" rather than "scored zero".
function Sparkline({ series, width=104, height=26 }){
  if (!series.length) return null;
  const n = series.length;
  const bw = width / n;
  return (
    <svg width={width} height={height} role="img" aria-label="Daily score trend"
      className="overflow-visible">
      {series.map((v, i) => {
        const x = i * bw;
        if (v === null || v === undefined)
          return <rect key={i} x={x} y={height-2} width={Math.max(bw-1,1)} height={2} fill="#e2e8f0" />;
        const h = Math.max((v / 3) * height, 2);
        const tone = v >= 3 ? "#059669" : v === 2 ? "#fbbf24" : v === 1 ? "#f97316" : "#f43f5e";
        return <rect key={i} x={x} y={height-h} width={Math.max(bw-1,1)} height={h} fill={tone} rx="1" />;
      })}
    </svg>
  );
}

const Metric = ({ label, value, sub, tone }) => (
  <div className={"rounded-lg border p-3 "+(tone==="rose"?"border-rose-200 bg-rose-50":tone==="emerald"?"border-emerald-200 bg-emerald-50":"border-slate-200 bg-white")}>
    <div className={"mono text-xl font-bold "+(tone==="rose"?"text-rose-600":tone==="emerald"?"text-emerald-700":"text-slate-800")}>{value}</div>
    <div className="text-xs text-slate-500">{label}</div>
    {sub && <div className="mt-0.5 text-[11px] text-slate-400">{sub}</div>}
  </div>
);

const pct = (v) => v === null ? "—" : v + "%";
const avg = (v) => v === null ? "—" : v.toFixed(1);

/* ================================================================== */
/*  DASHBOARD — team rollup + per-person drill-down                    */
/* ================================================================== */
function PeopleView({ orgCtx, meId }){
  const [members, setMembers] = useState(null);
  const [planners, setPlanners] = useState(null); // [{userId, plan}]
  const [kpiData, setKpiData] = useState(null);   // {kpis, values} or null if unavailable
  const [period, setPeriod] = useState("7");
  const [deptFilter, setDeptFilter] = useState("ALL");
  const [sel, setSel] = useState(null);           // drilled-into membership row
  const [err, setErr] = useState("");
  const myRole = orgCtx?.membership?.role || "owner";
  const myRank = getRoleRank(myRole);
  const myDept = orgCtx?.membership?.department || "";
  const orgId = orgCtx?.org?.id || null;

  useEffect(() => {
    let cancelled = false;
    if (!orgId) { setMembers([]); setPlanners([]); return; }
    Promise.all([loadTeam(orgId), loadAllVisiblePlanners()])
      .then(([m, p]) => { if (!cancelled) { setMembers(m); setPlanners(p); } })
      .catch(e => { if (!cancelled) { setErr(e.message || "Couldn't load your team."); setMembers([]); setPlanners([]); } });
    // KPIs are a separate, optional concern
    loadAllVisibleKpis([monthPeriod(), quarterPeriod()])
      .then(k => { if (!cancelled) setKpiData(k); })
      .catch(() => { if (!cancelled) setKpiData(null); });
    return () => { cancelled = true; };
  }, [orgId]);

  // Average attainment across a person's KPIs for the CURRENT month/quarter.
  const kpiAttainFor = (userId) => {
    if (!kpiData) return null;
    const scores = kpiData.kpis
      .filter(k => k.user_id === userId)
      .map(k => {
        const v = kpiData.values.find(x => x.kpi_id === k.id && x.period === periodFor(k.cadence));
        return kpiAttainment(k, v && v.actual);
      })
      .filter(x => x !== null);
    return scores.length ? Math.round(scores.reduce((a,b)=>a+b,0) / scores.length) : null;
  };

  if (members === null || planners === null) return <Ghost>Loading your team…</Ghost>;

  // Strict role and department isolation
  const visible = filterVisibleTeamMembers(members || [], meId, myRole, myDept)
    .filter(m => deptFilter === "ALL" || (m.department || "General").toLowerCase() === deptFilter.toLowerCase());

  const days = lastNDayKeys(PERIODS.find(p => p.id === period).days);
  const planOf = (uid) => (planners.find(p => p.userId === uid) || {}).plan || null;

  const rows = visible.map(m => {
    const plan = planOf(m.user_id);
    return { member:m, plan, metrics: plan ? personMetrics(plan, days) : null,
             kpiAttain: kpiAttainFor(m.user_id) };
  });
  const kpiScores = rows.map(r => r.kpiAttain).filter(v => v !== null);
  const teamKpi = kpiScores.length ? Math.round(kpiScores.reduce((a,b)=>a+b,0)/kpiScores.length) : null;
  const anyKpis = !!(kpiData && kpiData.kpis.length);

  const withData = rows.filter(r => r.metrics);
  const agg = (pick) => {
    const vals = withData.map(r => pick(r.metrics)).filter(v => v !== null && v !== undefined);
    return vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
  };
  const total = (pick) => withData.reduce((a,r) => a + (pick(r.metrics) || 0), 0);

  const teamCompletion = agg(m => m.prioCompletion);
  const teamScore      = agg(m => m.avgScore);
  const teamOverdue    = total(m => m.overdue);
  const teamDelegated  = total(m => m.openDelegated);
  const teamPlanRate   = withData.length
    ? Math.round((total(m => m.daysPlanned) / (withData.length * days.length)) * 100) : null;

  const selPlan = sel ? planOf(sel.user_id) : null;

  return (
    <div>
      <Callout>
        {myRank >= 5
          ? "Executive Overview — team follow-through, standup adherence, and performance across departments."
          : "Department Dashboard — follow-through and priority execution for your department."}
      </Callout>
      {err && <p className="mb-3 rounded-md bg-rose-50 px-3 py-2 text-sm text-rose-600">{err}</p>}

      {/* Department Filter Pills Bar */}
      {myRank >= 4 && (
        <div className="mb-4 flex flex-wrap items-center gap-1.5 bg-white p-3 rounded-2xl border border-slate-200 shadow-2xs">
          <span className="text-xs font-black uppercase tracking-wider text-slate-400 mr-2">Department:</span>
          <button
            onClick={() => setDeptFilter("ALL")}
            className={`rounded-xl px-3 py-1 text-xs font-bold transition ${
              deptFilter === "ALL" ? "bg-slate-950 text-white shadow-2xs" : "bg-slate-100 text-slate-700 hover:bg-slate-200"
            }`}
          >
            All Departments
          </button>
          {DEPARTMENTS.map(d => (
            <button
              key={d}
              onClick={() => setDeptFilter(d)}
              className={`rounded-xl px-3 py-1 text-xs font-bold transition ${
                deptFilter === d ? "bg-slate-950 text-white shadow-2xs" : "bg-slate-100 text-slate-700 hover:bg-slate-200"
              }`}
            >
              {d}
            </button>
          ))}
        </div>
      )}

      <div className="mb-4 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-slate-200 bg-white p-2">
        <div className="flex flex-wrap items-center gap-1">
          {PERIODS.map(p => (
            <button key={p.id} onClick={()=>setPeriod(p.id)}
              className={"rounded-md px-3 py-1.5 text-xs sm:text-sm font-semibold transition "+
                (period===p.id ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-stone-100")}>
              {p.label}
            </button>
          ))}
          <span className="pl-2 text-xs text-slate-400 hidden sm:inline">{withData.length} of {visible.length} have planner data</span>
        </div>

        {myRank >= 4 && (
          <button 
            onClick={() => navigate("/settings/company")}
            className="flex items-center gap-1.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 px-3.5 py-1.5 text-xs font-bold transition shadow-2xs"
          >
            <span>➕</span>
            <span>Invite Team Member</span>
          </button>
        )}
      </div>

      <div className={"mb-5 grid grid-cols-2 gap-3 "+(anyKpis ? "md:grid-cols-6" : "md:grid-cols-5")}>
        <Metric label="Priorities completed" value={pct(teamCompletion)} sub="team average" />
        <Metric label="Days planned" value={pct(teamPlanRate)} sub="outcome set" />
        <Metric label="Avg day score" value={avg(teamScore)} sub="out of 3" />
        <Metric label="Overdue items" value={teamOverdue} tone={teamOverdue ? "rose" : "emerald"} sub="right now" />
        <Metric label="Waiting on others" value={teamDelegated} sub="open delegations" />
        {anyKpis && <Metric label="KPI attainment" value={pct(teamKpi)} sub="this month / quarter"
          tone={teamKpi === null ? undefined : teamKpi >= 100 ? "emerald" : teamKpi < 80 ? "rose" : undefined} />}
      </div>

      <div className="mb-2 flex items-baseline justify-between">
        <h2 className="font-semibold text-slate-700">By person</h2>
        <span className="text-xs text-slate-400">Click a row for the detail</span>
      </div>
      <div className="space-y-2">
        {rows.length === 0 && <Ghost>Nobody to show in this department.</Ghost>}
        {rows.map(({member:m, metrics:x, kpiAttain}) => (
          <button key={m.id} onClick={()=>setSel(sel && sel.id===m.id ? null : m)}
            className={"block w-full rounded-lg border p-3 text-left transition "+
              (sel && sel.id===m.id ? "border-amber-400 bg-amber-50" : "border-slate-200 bg-white hover:border-slate-300")}>
            <div className="flex flex-wrap items-center gap-x-4 gap-y-2">
              <div className="min-w-[8rem] flex-1">
                <div className="truncate font-medium text-slate-800">
                  {m.name}{m.user_id===meId && <span className="text-xs font-normal text-slate-400"> (you)</span>}
                </div>
                <div className="flex items-center gap-1.5 mt-0.5">
                  <span className="text-xs text-slate-500 font-bold">{ROLE_LABEL[m.role] || m.role}</span>
                  <span className="rounded-full bg-blue-50 px-2 py-0.2 text-[10px] font-bold text-blue-700 border border-blue-100">
                    📁 {m.department || "General"}
                  </span>
                </div>
              </div>
              {!x && <span className="text-xs text-slate-400">No planner data yet</span>}
              {x && <>
                <div className="text-center">
                  <div className="mono text-sm font-bold text-slate-800">{pct(x.prioCompletion)}</div>
                  <div className="text-[11px] text-slate-400">priorities</div>
                </div>
                <div className="text-center">
                  <div className="mono text-sm font-bold text-slate-800">{x.daysPlanned}<span className="text-slate-400">/{x.daysInPeriod}</span></div>
                  <div className="text-[11px] text-slate-400">days planned</div>
                </div>
                <div className="text-center">
                  <div className="mono text-sm font-bold text-slate-800">{avg(x.avgScore)}</div>
                  <div className="text-[11px] text-slate-400">avg score</div>
                </div>
                <div className="text-center">
                  <div className={"mono text-sm font-bold "+(x.overdue?"text-rose-600":"text-slate-800")}>{x.overdue}</div>
                  <div className="text-[11px] text-slate-400">overdue</div>
                </div>
                <div className="text-center">
                  <div className={"mono text-sm font-bold "+(x.overdueDelegated?"text-amber-600":"text-slate-800")}>{x.openDelegated}</div>
                  <div className="text-[11px] text-slate-400">waiting on</div>
                </div>
                {anyKpis && (
                  <div className="text-center">
                    <div className={"mono text-sm font-bold "+
                      (kpiAttain === null ? "text-slate-400"
                        : kpiAttain >= 100 ? "text-emerald-600"
                        : kpiAttain >= 80 ? "text-amber-600" : "text-rose-600")}>
                      {pct(kpiAttain)}
                    </div>
                    <div className="text-[11px] text-slate-400">KPIs</div>
                  </div>
                )}
                <div className="hidden sm:block"><Sparkline series={x.scoreSeries} /></div>
              </>}
            </div>
          </button>
        ))}
      </div>

      {sel && (
        <div className="mt-5">
          {!selPlan
            ? <Ghost>{sel.name} hasn't set up a planner yet, or you don't have access to it.</Ghost>
            : <PersonSnapshot person={sel} plan={selPlan}
                metrics={personMetrics(selPlan, days)}
                periodLabel={PERIODS.find(p=>p.id===period).label} />}
        </div>
      )}
    </div>
  );
}

  const stat = (label, value, tone="slate") => (
    <div className={"rounded-lg border p-3 "+(tone==="rose"?"border-rose-200 bg-rose-50":"border-slate-200 bg-white")}>
      <div className={"mono text-xl font-bold "+(tone==="rose"?"text-rose-600":"text-slate-800")}>{value}</div>
      <div className="text-xs text-slate-500">{label}</div>

        </div>
        <div className="mt-3">
          <div className="text-xs font-semibold uppercase tracking-wide text-amber-600">★ Today's main outcome</div>
          <p className="mt-1 text-sm text-slate-700">{day.outcome || <span className="text-slate-400">Not set for today.</span>}</p>
        </div>
        <div className="mt-3">
          <div className="text-xs font-semibold uppercase tracking-wide text-slate-500">Priorities</div>
          <div className="mt-1 space-y-1">
            {[0,1,2].map(i => {
              const t = (day.priorities||[])[i];
              if (!t) return null;
              const mark = PMARKS.find(m=>m.v===((day.marks||[])[i]||"")) || PMARKS[0];
              return (
                <div key={i} className="flex items-center gap-2 text-sm text-slate-700">
                  <span className={"mono w-4 text-center "+mark.cls}>{mark.label}</span>{t}
                </div>
              );
            })}
            {!(day.priorities||[]).some(Boolean) && <p className="text-sm text-slate-400">No priorities set for today.</p>}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
        {stat("Due today", today.length)}
        {stat("Overdue", overdue.length, overdue.length ? "rose" : "slate")}
        {stat("In backup", plan.dailyBackup.filter(b=>!b.done).length)}
        {stat("Waiting on others", delegated.length)}
      </div>

      {delegated.length > 0 && (
        <div className="rounded-lg border border-slate-200 bg-white p-4">
          <div className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500">Delegated / waiting-for</div>
          <div className="space-y-1">
            {delegated.map(b => (
              <div key={b.id} className="flex flex-wrap items-center gap-2 rounded-md bg-stone-50 px-2 py-1.5 text-sm text-slate-700">
                <span className="min-w-0 flex-1">{b.text}</span>
                {b.assignee && <span className="rounded bg-sky-50 px-1.5 py-0.5 text-xs text-sky-600">→ {b.assignee}</span>}
                {b.due && <span className="mono text-xs text-slate-400">📅 {b.due}</span>}
              </div>
            ))}
          </div>
        </div>
      )}

      {metrics && (
        <div className="rounded-lg border border-slate-200 bg-white p-4">
          <div className="mb-3 flex flex-wrap items-baseline justify-between gap-2">
            <div className="text-xs font-semibold uppercase tracking-wide text-slate-500">Trend · {periodLabel}</div>
            <Sparkline series={metrics.scoreSeries} width={160} height={30} />
          </div>

          <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
            {stat("Days planned", `${metrics.daysPlanned}/${metrics.daysInPeriod}`)}
            {stat("Priorities completed", pct(metrics.prioCompletion))}
            {stat("Avg day score", avg(metrics.avgScore))}
            {stat("Non-negotiables", pct(metrics.nnRate))}
          </div>

          {metrics.prioSet > 0 && (
            <div className="mt-4">
              <div className="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-500">
                What happened to {metrics.prioSet} {metrics.prioSet===1?"priority":"priorities"}
              </div>
              <div className="flex h-3 overflow-hidden rounded-full bg-stone-100">
                {[["done",metrics.prioDone,"bg-emerald-500"],
                  ["moved",metrics.prioMoved,"bg-amber-400"],
                  ["delegated",metrics.prioDelegated,"bg-sky-400"],
                  ["dropped",metrics.prioDropped,"bg-rose-400"]].map(([k,v,cls]) =>
                    v > 0 ? <div key={k} className={cls} style={{width:`${(v/metrics.prioSet)*100}%`}} title={`${v} ${k}`} /> : null)}
              </div>
              <div className="mt-1.5 flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-slate-500">
                <span><span className="mr-1 inline-block h-2 w-2 rounded-full bg-emerald-500 align-middle"/>Done {metrics.prioDone}</span>
                <span><span className="mr-1 inline-block h-2 w-2 rounded-full bg-amber-400 align-middle"/>Moved {metrics.prioMoved}</span>
                <span><span className="mr-1 inline-block h-2 w-2 rounded-full bg-sky-400 align-middle"/>Delegated {metrics.prioDelegated}</span>
                <span><span className="mr-1 inline-block h-2 w-2 rounded-full bg-rose-400 align-middle"/>Dropped {metrics.prioDropped}</span>
                <span className="text-slate-400">Unmarked {metrics.prioSet - metrics.prioDone - metrics.prioMoved - metrics.prioDelegated - metrics.prioDropped}</span>
              </div>
            </div>
          )}

          <p className="mt-3 text-[11px] text-slate-400">
            Avg score covers the {metrics.scoreDays} {metrics.scoreDays===1?"day":"days"} they actually closed out —
            days with no evening closure are left out rather than counted as zero.
          </p>
        </div>
      )}

      <p className="text-center text-xs text-slate-400">
        Read-only. Nobody but {person.name} can change this plan.
      </p>
    </div>
  );
}
