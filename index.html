              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Additional Notes / Questions (Optional)</label>
                <input 
                  type="text" 
                  value={notes} 
                  onChange={e => setNotes(e.target.value)} 
                  placeholder="e.g. We want to align weekly delegation for our 4 managers"
                  className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition"
                />
              </div>

              <div className="pt-2 flex flex-col sm:flex-row items-center gap-3">
                <button 
                  onClick={handleBookTraining} 
                  disabled={busy}
                  className="w-full sm:flex-1 py-3 rounded-xl bg-slate-950 text-white font-bold text-xs hover:bg-slate-800 transition shadow-md disabled:opacity-60 flex items-center justify-center gap-1.5"
                >
                  <span>{busy ? "Reserving Slot..." : "Confirm Google Meet Training Session →"}</span>
                </button>
                <button 
                  onClick={handleSkipTraining} 
                  className="w-full sm:w-auto py-3 px-4 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-900 transition"
                >
                  Skip for Now
                </button>
              </div>
            </div>

            {msg && <p className="text-xs font-medium text-amber-800 bg-amber-50 border border-amber-200 p-3 rounded-xl leading-relaxed">{msg}</p>}
          </div>
        )}

        {/* STEP 3: BOOKED STATE */}
        {(step === "booked" || (isBooked && step !== "profile")) && (
          <div className="space-y-4">
            <div className="rounded-2xl border border-emerald-200 bg-emerald-50/70 p-5 text-left space-y-3">
              <div className="flex items-center gap-2">
                <span className="h-2.5 w-2.5 rounded-full bg-emerald-600 animate-pulse"></span>
                <span className="text-xs font-bold text-emerald-950 uppercase tracking-wider">Session Scheduled</span>
              </div>
              <div className="text-sm font-bold text-slate-900">
                {org?.training_notes || "Executive Onboarding Strategy Call"}
              </div>
              <p className="text-xs text-slate-600 leading-relaxed">
                Your 1-on-1 session is booked. We will connect over Google Meet to review your company KRAs, calculate delegation velocity, and set up your team's weekly focus grid.
              </p>
              <div className="pt-2 flex flex-wrap gap-2">
                <a 
                  href={org?.training_meet_link || "https://meet.google.com"} 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="rounded-xl bg-emerald-600 px-4 py-2 text-xs font-bold text-white hover:bg-emerald-700 transition shadow-sm inline-flex items-center gap-1.5"
                >
                  <span>Open Google Meet</span>
                  <span>↗</span>
                </a>
                <button 
                  onClick={handleCancelOrReschedule} 
                  disabled={busy}
                  className="rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50 transition shadow-xs"
                >
                  Reschedule / Change Slot
                </button>
              </div>
            </div>
            <button onClick={onClose} className="w-full py-3 rounded-xl bg-slate-950 text-white font-bold text-xs hover:bg-slate-800 transition">
              Back to Cockpit →
            </button>
          </div>
        )}

      </div>
    </div>
  );
}

/*  Interactive 3-Step Quick-Start Trial Activation Banner            */
/* ================================================================== */
function QuickStartBanner({ data, patch, onGoToTab, onOpenTraining }) {
  const [dismissed, setDismissed] = useState(false);
  const ohv = Math.round((data.settings.income || 0) / (data.settings.hours || 1));
  const hasOhv = ohv > 0;
  const hasCaptures = (data.captures && data.captures.length > 0) || (data.dailyBackup && data.dailyBackup.length > 0);
  const hasThemes = Object.values(data.dayThemes || {}).some(t => !!t);

  const stepCount = [hasOhv, hasCaptures, hasThemes].filter(Boolean).length;

  if (dismissed || stepCount === 3) return null;

  const loadBlueprint = () => {
    if (window.confirm("Load Executive Blueprint sample data? This will pre-fill realistic high-leverage themes, tasks, and settings that you can explore and edit.")) {
      patch(d => {
        d.settings = { ...SAMPLE_EXECUTIVE_BLUEPRINT.settings };
        d.dayThemes = { ...SAMPLE_EXECUTIVE_BLUEPRINT.dayThemes };
        d.categories = [...SAMPLE_EXECUTIVE_BLUEPRINT.categories];
        d.captures = [...SAMPLE_EXECUTIVE_BLUEPRINT.captures];
        d.dailyBackup = [...SAMPLE_EXECUTIVE_BLUEPRINT.dailyBackup];
        d.recurringMonthly = [...SAMPLE_EXECUTIVE_BLUEPRINT.recurringMonthly];
        d.reference = [...SAMPLE_EXECUTIVE_BLUEPRINT.reference];
      });
    }
  };

  return (
    <div className="mb-6 rounded-3xl border border-blue-200 bg-gradient-to-r from-blue-50/80 via-indigo-50/50 to-white p-5 sm:p-6 text-slate-900 shadow-sm relative overflow-hidden">
      <div className="flex flex-wrap items-center justify-between gap-3 border-b border-blue-100 pb-3">
        <div className="flex items-center gap-2">
          <span className="flex h-6 w-6 items-center justify-center rounded-lg bg-blue-600 text-xs font-bold text-white shadow-xs">🚀</span>
          <span className="text-xs font-bold uppercase tracking-wider text-blue-950">Quick-Start Mastery Guide ({stepCount}/3 Completed)</span>
        </div>
        <div className="flex items-center gap-3">
          <button onClick={loadBlueprint} className="text-xs font-bold text-blue-700 hover:text-blue-900 underline flex items-center gap-1">
            <span>✨ Load Executive Sample Blueprint</span>
          </button>
          <button onClick={() => setDismissed(true)} className="text-slate-400 hover:text-slate-600 text-xs">✕</button>
        </div>
      </div>

      <div className="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div className={`rounded-2xl border p-3.5 transition ${hasOhv ? "border-emerald-200 bg-emerald-50/70" : "border-slate-200 bg-white"}`}>
          <div className="flex items-center justify-between">
            <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500">Step 1</span>
            {hasOhv ? <span className="text-emerald-700 font-bold text-xs">✓ Done</span> : <span className="text-slate-400 text-xs">Pending</span>}
          </div>
          <div className="text-xs font-bold text-slate-950 mt-1">Calculate Owner Hour Value</div>
          <p className="text-[11px] text-slate-600 mt-1 leading-relaxed">Set your income goal & hours to calculate hourly delegation baseline.</p>
          {!hasOhv && (
            <button onClick={() => onGoToTab("settings")} className="mt-2.5 rounded-lg bg-slate-950 px-2.5 py-1 text-[11px] font-bold text-white hover:bg-slate-800 transition">
              Calculate OHV →
            </button>
          )}
        </div>

        <div className={`rounded-2xl border p-3.5 transition ${hasThemes ? "border-emerald-200 bg-emerald-50/70" : "border-slate-200 bg-white"}`}>
          <div className="flex items-center justify-between">
            <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500">Step 2</span>
            {hasThemes ? <span className="text-emerald-700 font-bold text-xs">✓ Done</span> : <span className="text-slate-400 text-xs">Pending</span>}
          </div>
          <div className="text-xs font-bold text-slate-950 mt-1">Set Weekly Focus Themes</div>
          <p className="text-[11px] text-slate-600 mt-1 leading-relaxed">Assign strategic themes to each day (e.g. Sales, Team, Strategy).</p>
          {!hasThemes && (
            <button onClick={() => onGoToTab("weekly")} className="mt-2.5 rounded-lg bg-slate-950 px-2.5 py-1 text-[11px] font-bold text-white hover:bg-slate-800 transition">
              Configure Themes →
            </button>
          )}
        </div>

function GlobalQuickCaptureModal({ data, patch, ohv, orgCtx, meId, onClose }) {
  const [text, setText] = useState("");
  const [category, setCategory] = useState("");
  const [taskType, setTaskType] = useState(""); // Default to "" which means Inbox (Decide Later)
  const [due, setDue] = useState("");
  const [time, setTime] = useState("");
  const [assignee, setAssignee] = useState("");
  const [details, setDetails] = useState("");

  const team = getEffectiveTeam(data, orgCtx);

  const save = () => {
    const t = text.trim();
    if (!t) return;
    const payload = {
      id: uid(),
      text: t + (details ? ` — ${details}` : ""),
      tag: category || "",
      taskType: taskType || "",
      due: due || "",
      time: time || "",
      assignee: assignee || ""
    };

    // If delegating to a team member in an organization, create live delegated task & dispatch email
    if (taskType === "DELEGATE" && assignee && orgCtx?.org?.id) {
      const mem = team.find(m => m.name.toLowerCase() === assignee.toLowerCase() || (m.email && m.email.toLowerCase() === assignee.toLowerCase()));
      createDelegatedTask(orgCtx.org.id, meId, {
        assignee_id: mem?.user_id || null,
        assignee_email: mem?.email || "",
        assignee_name: mem?.name || assignee,
        title: t,
        details: details || "",
        due_date: due || todayKey()
      });
      if (mem?.email) {
        sendTransactionalEmail("task_delegated", mem.email, {
          task_title: t,
          delegator_name: orgCtx?.profile?.full_name || orgCtx?.profile?.email || "Founder / Leadership",
          company_name: orgCtx?.org?.name || "Workspace",
          due_date: due || todayKey(),
          notes: details || "",
          member_name: mem.name || mem.email
        });
      }
    }

    patch(d => {
      if (taskType && ["SCHEDULE", "DAILY", "WAITING", "WAITING-FOR", "PROJECT", "DELEGATE"].includes(taskType)) {
        d.dailyBackup = d.dailyBackup || [];
        d.dailyBackup.unshift(payload);
      } else if (taskType === "WEEKLY") {
        d.weeklySomeday = d.weeklySomeday || [];
        d.weeklySomeday.unshift(payload);
      } else if (taskType === "MONTHLY") {
        d.monthlyTray = d.monthlyTray || [];
        d.monthlyTray.unshift(payload);
      } else if (taskType === "MAYBE") {
        d.maybe = d.maybe || [];
        d.maybe.unshift({ id: uid(), added: new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short" }), item: t, category: category || "", revisit: "", decision: "" });
      } else if (taskType === "REFERENCE" || taskType === "AUTOMATE") {
        d.reference = d.reference || [];
        d.reference.unshift({ id: uid(), text: t, note: details });
      } else {
        // Default: Capture Inbox ("Decide Later")
        d.captures = d.captures || [];
        d.captures.unshift({ 
          id: uid(), 
          date: new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short" }), 
          item: t, 
          category: category || "", 
          taskType: taskType || "", 
          due: due || "",
          time: time || "",
          assignee: assignee || "",
          details: details || "", 
          status: "Open" 
        });
      }
    });
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm">
      <div className="w-full max-w-lg rounded-3xl border border-slate-200 bg-white p-5 sm:p-6 shadow-2xl space-y-4">
        <div className="flex items-center justify-between border-b border-slate-100 pb-3">
          <div className="flex items-center gap-2">
            <span className="text-xl">⚡</span>
            <div>
              <h3 className="font-extrabold text-base text-slate-950">Quick Capture</h3>
              <p className="text-xs text-slate-500">Dump it now — decide what to do with it later in Inbox</p>
            </div>
          </div>
          <button onClick={onClose} className="rounded-xl p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700 font-bold">✕</button>
        </div>

        <div className="space-y-3">
          <input
            autoFocus
            value={text}
            onChange={e => setText(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); save(); } }}
            placeholder="Kuch dimaag mein aaya? Type it here and hit Enter…"
            className="w-full rounded-2xl border-2 border-amber-300 bg-amber-50/60 p-3 text-sm font-bold text-slate-950 outline-none focus:border-amber-500 focus:bg-white transition"
          />

          {/* Quick Optional Category Chips (Click to toggle) */}
          <div className="flex flex-wrap items-center gap-1.5">
            <span className="text-[10px] font-black uppercase text-slate-400 mr-1">Optional Tag:</span>
            {["Deep Focus", "Meeting", "Finance", "Sales", "Ops & Admin", "Personal"].map(cat => (
              <button
                key={cat}
                type="button"
                onClick={() => setCategory(prev => prev === cat ? "" : cat)}
                className={`rounded-xl px-2.5 py-1 text-xs font-bold transition border ${
                  category === cat ? "bg-slate-950 text-white border-slate-950 shadow-xs" : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100"
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-2 gap-2">
            <div>
              <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Destination</label>
              <select
                value={taskType}
                onChange={e => setTaskType(e.target.value)}
                className="w-full rounded-xl border-2 border-slate-200 bg-slate-50 p-2 text-xs font-bold text-slate-800 outline-none focus:border-amber-400"
              >
                <option value="">📥 Inbox (Decide Later — Default)</option>
                {TASK_TYPES.map(x => (
                  <option key={x} value={x}>{(data.taskTypeLabels || DEFAULT_TASK_TYPE_LABELS)[x] || x}</option>
                ))}
              </select>
            </div>

            <div>
              <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Due Date (Optional)</label>
              <input
                type="date"
                value={due}
                onChange={e => setDue(e.target.value)}
                className="w-full rounded-xl border border-slate-200 bg-slate-50 p-2 text-xs font-bold text-slate-800 outline-none"
              />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <div>
              <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Time (Optional)</label>
              <input
                type="time"
                value={time}
                onChange={e => setTime(e.target.value)}
                className="w-full rounded-xl border border-slate-200 bg-slate-50 p-2 text-xs font-bold text-slate-800 outline-none"
              />
            </div>

            <div>
              <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Assignee (Optional)</label>
              <select
                value={assignee}
                onChange={e => setAssignee(e.target.value)}
                className="w-full rounded-xl border border-slate-200 bg-slate-50 p-2 text-xs font-bold text-slate-800 outline-none"
              >
                <option value="">Myself / Unassigned</option>
                {team.map(m => (
                  <option key={m.id} value={m.name}>{m.label}</option>
                ))}
              </select>
            </div>
          </div>

          <input
            value={details}
            onChange={e => setDetails(e.target.value)}
            placeholder="Context, link, or notes (optional)…"
            className="w-full rounded-xl border border-slate-200 bg-slate-50 p-2 text-xs text-slate-800 outline-none"
          />
        </div>

        <div className="flex items-center justify-between pt-2 border-t border-slate-100">
          <span className="text-[11px] text-slate-400 font-semibold">
            {taskType ? `Routing to ${taskType}` : "Saving to Capture Inbox"}
          </span>
          <div className="flex items-center gap-2">
            <button onClick={onClose} className="rounded-xl border border-slate-200 px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-50">
              Cancel
            </button>
            <button onClick={save} className="rounded-xl bg-slate-950 hover:bg-slate-800 text-white px-5 py-2 text-xs font-black shadow-md transition">
              ⚡ Capture
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function TaskDetailAndNotesModal({ task, onClose, onUpdateTask, onAddNote, meName, meEmail, isAssignee, isDelegator, orgCtx }) {

  const [newLink, setNewLink] = useState(task.link || "");

  const handlePostUpdate = async (e) => {
    e.preventDefault();
    if (!noteText.trim() && selectedStatus === task.status) return;
    setPosting(true);
    try {
      const textToPost = noteText.trim() || `Status updated to ${TASK_STATUS_CONFIG[selectedStatus]?.label || selectedStatus}`;
      await onAddNote(task.id, textToPost, meName, meEmail, selectedStatus);
      setNoteText("");
      say("✓ Update posted & synced live with team!");

      alert("Failed to post update: " + err.message);

      setPosting(false);
    }

    setSelectedStatus(newStatus);

  if (!toast) return null;
  return (
    <div className="fixed bottom-5 right-5 z-50 max-w-sm w-full animate-bounce-in shadow-2xl rounded-2xl border-2 border-amber-400 bg-slate-950 text-white p-4 space-y-2">
      <div className="flex items-start justify-between gap-2">
        <div className="flex items-center gap-2">
          <span className="text-lg">⚡</span>
          <span className="text-xs font-black text-amber-400 uppercase tracking-wider">{toast.title}</span>
        </div>
        <button onClick={onClose} className="text-slate-400 hover:text-white text-xs font-bold">✕</button>
      </div>
      <p className="text-xs text-slate-200 font-medium leading-relaxed">{toast.body}</p>
      {toast.task && (
        <button
          onClick={() => {
            onOpenTask(toast.task);
            onClose();
          }}
          className="w-full text-center rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs py-1.5 transition shadow-xs"
        >
          View Task &amp; Notes →
        </button>
      )}
    </div>
  );
}

function Planner({ session, orgCtx, orgError, onLeftOrg, onStartCompany }){
  const userId = session.user.id;
  const path = usePath();

  const role = orgCtx && orgCtx.membership ? orgCtx.membership.role : null;
  const isEmployee = role === "employee" || role === "member" || role === "assistant";
  const isManager = role === "manager";
  const isOwner = role === "owner" || !role;

  const defaultTab = isEmployee ? "standup" : "capture";

  const parsePlannerRoute = (p) => {
    const clean = (p || "").replace(/^\//, "");
    const parts = clean.split("/");
    const mainTab = parts[0] || defaultTab;
    const subTab = parts[1] || "";
    const validTabs = ["capture", "followup", "standup", "daily", "weekly", "monthly", "ideas", "maybe", "reference", "goals", "people", "team", "manual", "settings"];
    let t = defaultTab;
    if (validTabs.includes(mainTab)) t = mainTab;
    else if (mainTab === "guide" || mainTab === "docs" || mainTab === "help") t = "manual";
    return { tab: t, subTab };
  };

  const initialRoute = parsePlannerRoute(path);
  const [tab, setTabState] = useState(initialRoute.tab);
  const [settingsSubTab, setSettingsSubTab] = useState(initialRoute.subTab || "general");
  const [showMobileMoreDrawer, setShowMobileMoreDrawer] = useState(false);
  const [showQuickCaptureModal, setShowQuickCaptureModal] = useState(false);
  const [dbTasks, setDbTasks] = useState([]);
  const [inAppNotifications, setInAppNotifications] = useState([]);
  const [activeToast, setActiveToast] = useState(null);
  const [showNotificationsModal, setShowNotificationsModal] = useState(false);
  const [selectedTaskModal, setSelectedTaskModal] = useState(null);

  useEffect(() => {
    const { tab: newTab, subTab: newSubTab } = parsePlannerRoute(path);
    if (newTab !== tab) setTabState(newTab);
    if (newSubTab && newSubTab !== settingsSubTab) setSettingsSubTab(newSubTab);
  }, [path, isEmployee]);

  const setTab = (newTab) => {
    setTabState(newTab);
    navigate("/" + newTab);
  };

  const [data, setData] = useState(null);
  const [saving, setSaving] = useState(false);
  const [syncError, setSyncError] = useState(false);
  const [dailyDate, setDailyDate] = useState(todayKey());
  const [isAdmin, setIsAdmin] = useState(false);
  const [isCoach, setIsCoach] = useState(false);
  const notifiedRef = useRef(false);

  const [sub, setSub] = useState(null);
  const [subLoading, setSubLoading] = useState(true);
  const [showTrainingModal, setShowTrainingModal] = useState(false);
  const [trainingChecked, setTrainingChecked] = useState(false);

  // Real-Time Delegated Tasks Subscription via Supabase
  useEffect(() => {
    if (!orgCtx?.org?.id) return;
    loadDelegatedTasks(orgCtx.org.id).then(tasks => setDbTasks(tasks || [])).catch(() => {});

    const myEmail = (session?.user?.email || "").toLowerCase();

    const channel = sb
      .channel(`org_delegated_tasks_realtime_${orgCtx.org.id}`)
      .on(
        'postgres_changes',
        { event: '*', schema: 'public', table: 'delegated_tasks', filter: `org_id=eq.${orgCtx.org.id}` },
        (payload) => {
          const { eventType, new: newRow, old: oldRow } = payload;

          if (eventType === 'INSERT') {
            setDbTasks(prev => [newRow, ...prev.filter(t => t.id !== newRow.id)]);
            if (
              newRow.delegated_by !== userId &&
              (newRow.assignee_id === userId || (newRow.assignee_email && newRow.assignee_email.toLowerCase() === myEmail))
            ) {
              playNotificationChime();
              const toast = {
                id: uid(),
                title: `⚡ New Task Delegated to You`,
                body: `"${newRow.title}" from ${newRow.delegator_name || 'Leadership'}`,
                time: "Just now",
                task: newRow,
                created_at: new Date().toISOString()
              };
              setActiveToast(toast);
              setInAppNotifications(prev => [toast, ...prev]);
            }
          } else if (eventType === 'UPDATE') {
            setDbTasks(prev => prev.map(t => t.id === newRow.id ? newRow : t));
            setSelectedTaskModal(curr => curr && curr.id === newRow.id ? newRow : curr);

            if (newRow.delegated_by === userId || newRow.assignee_id === userId || (newRow.assignee_email && newRow.assignee_email.toLowerCase() === myEmail)) {
              const lastNote = (newRow.updates || [])[(newRow.updates || []).length - 1];
              if (lastNote && lastNote.author_email !== myEmail) {
                playNotificationChime();
                const toast = {
                  id: uid(),
                  title: `💬 New Note: ${newRow.title}`,
                  body: `${lastNote.author_name}: "${lastNote.text}"`,
                  time: "Just now",
                  task: newRow,
                  created_at: new Date().toISOString()
                };
                setActiveToast(toast);
                setInAppNotifications(prev => [toast, ...prev]);
              } else if (oldRow && oldRow.status !== newRow.status && newRow.delegated_by === userId) {
                playNotificationChime();
                const toast = {
                  id: uid(),
                  title: `📋 Status Update: ${newRow.title}`,
                  body: `Status is now ${TASK_STATUS_CONFIG[newRow.status]?.label || newRow.status}`,
                  time: "Just now",
                  task: newRow,
                  created_at: new Date().toISOString()
                };
                setActiveToast(toast);
                setInAppNotifications(prev => [toast, ...prev]);
              }
            }
          } else if (eventType === 'DELETE') {
            setDbTasks(prev => prev.filter(t => t.id !== oldRow.id));
            setSelectedTaskModal(curr => curr && curr.id === oldRow.id ? null : curr);
          }
        }
      )
      .subscribe();

    return () => {
      sb.removeChannel(channel);
    };
  }, [orgCtx?.org?.id, userId, session?.user?.email]);

  useEffect(() => {
    if (!activeToast) return;
    const t = setTimeout(() => setActiveToast(null), 6000);
    return () => clearTimeout(t);
  }, [activeToast]);

  useEffect(() => { 
    loadState(userId).then(loaded => {
      const d = loaded || structuredClone(SEED);
      const tz = d?.settings?.timezone || "Asia/Kolkata";
      const t = todayKey(tz);
      let dirty = false;

      // Automated Migration: Completely remove all holiday/festival items from task queues
      d.holidays = d.holidays || [];
      const cleanTaskArray = (arr) => {
        if (!Array.isArray(arr)) return [];
        return arr.filter(item => {
          if (isHolidayItem(item)) {
            dirty = true;
            if (!d.holidays.some(h => (h.due === item.due || h.date === item.due) && h.text === (item.text || item.item))) {
              d.holidays.push({ id: item.id || uid(), text: item.text || item.item, due: item.due || item.date || "", tag: "Holiday" });
            }
            return false; // Remove from task arrays
          }
          return true;
        });
      };

      d.dailyBackup = cleanTaskArray(d.dailyBackup);
      d.captures = cleanTaskArray(d.captures);
      d.weeklySomeday = cleanTaskArray(d.weeklySomeday);
      d.monthlyTray = cleanTaskArray(d.monthlyTray);

      // Ensure historical past-due tax deadlines are marked done
      if (Array.isArray(d.dailyBackup)) {
        d.dailyBackup.forEach(b => {
          if (b.due && b.taskType === "DAILY") {
            b.taskType = "DELEGATE";
            dirty = true;
          }
          if (b.tag === "Finance" && b.due && b.due < t && (b.text?.includes("Advance Tax") || b.text?.includes("TDS Return") || b.text?.includes("ITR") || b.text?.includes("Tax Audit")) && !b.done) {
            b.done = true;
            dirty = true;
          }
        });
      }

      setData(d);
      if (dirty) {
        saveState(userId, d).catch(() => {});
      }
    }).catch(() => setData(structuredClone(SEED))); 
  }, [userId]);
  useEffect(() => { amPlatformAdmin(userId).then(setIsAdmin); }, [userId]);
  useEffect(() => { amTrainingCoach(userId, session?.user?.email).then(setIsCoach); }, [userId, session?.user?.email]);

  // Global Shortcut for Quick Capture (c or Ctrl+K)
  useEffect(() => {
    const handleKeyDown = (e) => {
      if ((e.key === "c" || e.key === "C") && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) {
        e.preventDefault();
        setShowQuickCaptureModal(prev => !prev);
      }
      if ((e.ctrlKey || e.metaKey) && e.key === "k") {
        e.preventDefault();
        setShowQuickCaptureModal(prev => !prev);
      }
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, []);

  useEffect(() => {
    if (!orgCtx || !orgCtx.membership) {
      setSubLoading(false);
      return;
    }
    setSubLoading(true);
    loadBilling(orgCtx.membership.org_id)
      .then(b => setSub(b.sub))
      .catch(() => setSub(null))
      .finally(() => setSubLoading(false));
  }, [orgCtx && orgCtx.membership && orgCtx.membership.org_id]);

  useEffect(() => {
    if (!data) return;
    setSaving(true);
    const t = setTimeout(async () => {
      try { await saveState(userId, data); setSyncError(false); }
      catch { setSyncError(true); }
      finally { setSaving(false); }
    }, 600);
    return () => clearTimeout(t);
  }, [data, userId]);

  useEffect(() => {
    if (!data || notifiedRef.current) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    const { overdue, today } = collectDueItems(data);
    if (overdue.length + today.length > 0) {
      new Notification("FlowDirector", { body: `${overdue.length} overdue, ${today.length} due today.` });
    }
    notifiedRef.current = true;
  }, [data]);

  const isCompanyUser = orgCtx && orgCtx.membership;
  const isAuthorized = sub && (sub.status === "active" || sub.status === "trialing");

  // Post-Mandate Mandatory Profile & Executive Training Auto-Trigger
  useEffect(() => {
    if (orgCtx && isAuthorized && !trainingChecked) {
      setTrainingChecked(true);
      const isProfileDone = !!(orgCtx.profile && orgCtx.profile.profile_completed);
      const st = orgCtx.org?.training_status;
      if (!isProfileDone) {
        setShowTrainingModal(true);
      } else if ((!st || st === "unbooked") && !sessionStorage.getItem("fd_training_prompted")) {
        sessionStorage.setItem("fd_training_prompted", "1");
        setShowTrainingModal(true);
      }
    }
  }, [orgCtx && orgCtx.org && orgCtx.org.id, isAuthorized, trainingChecked, orgCtx?.profile?.profile_completed]);

  const patch = (fn) => setData(d => { const c = structuredClone(d); fn(c); return c; });

  if (isCompanyUser && subLoading) return <FullScreen>Verifying workspace subscription status…</FullScreen>;
  if (!data) return <FullScreen>Loading your system…</FullScreen>;

  if (isCompanyUser && !isAuthorized && !isAdmin && isOwner) {

          <Logo height={44} lightMode={true} className="mb-4 justify-center flex" />

            Authorization Required
          </div>
          <h2 className="mt-3 text-2xl font-bold text-slate-950">Activate Your Workspace</h2>
          <p className="mt-2 text-xs leading-relaxed text-slate-600 font-medium">
            To start using <b>{orgCtx.org?.name || "your workspace"}</b>, authorize your subscription payment mandate via Razorpay.
          </p>

          <div className="mt-6 rounded-2xl border border-amber-200 bg-amber-50 p-4 text-left">
            <div className="text-xs font-bold text-amber-900">15-Day Free Trial Mandate</div>
            <p className="mt-1 text-[11px] text-amber-800 leading-relaxed font-medium">
              Authorize your recurring mandate today. No charges will be incurred during your 15-day trial.
            </p>
          </div>

          <div className="mt-6 space-y-3">
            <button onClick={() => startCheckout(sub?.plan_code || "solo", "razorpay").catch(e => alert(e.message || "Couldn't start checkout."))}
              className="w-full rounded-xl bg-amber-400 py-3 text-xs font-bold text-slate-950 shadow-md shadow-amber-400/20 transition hover:bg-amber-300">
              Authorize via Razorpay →
            </button>
            <button onClick={() => sb.auth.signOut()}
              className="w-full rounded-xl border border-slate-200 bg-slate-50 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-100">
              Sign Out
            </button>
          </div>
        </div>
      </div>
    );
  }

  const ohv = Math.round((data.settings.income||0)/(data.settings.hours||1));
  const canSeeOthers = role === "owner" || role === "manager";
  const trainingBooked = orgCtx?.org?.training_status === "booked";

  // Role-Specific Navigation Architecture
  let TABS = [];
  if (isEmployee) {
    TABS = [
      ["standup", "My Focus & Tasks"],
      ["daily", "My Schedule"],
      ["weekly", "Weekly Plan"],
      ["ideas", "Ideas & Reference"],
      ["settings", "My Account"]
    ];
  } else if (isManager) {
    TABS = [
      ["capture", "Capture"],
      ["daily", "Daily"],
      ["weekly", "Weekly"],
      ["monthly", "Monthly"],
      ["followup", "Delegation & Radar"],
      ["goals", "Department Goals"],
      ["people", "My Team"],
      ["ideas", "Ideas & Reference"],
      ["settings", "Settings"]
    ];
  } else {
    // Owner / Solo Executive
    TABS = [
      ["capture", "Capture"],
      ["daily", "Daily"],
      ["weekly", "Weekly"],
      ["monthly", "Monthly"],
      ["followup", "Delegation & Follow-up"],
      ...(role ? [["goals", "Goals & KRAs"]] : []),
      ...(role ? [["people", "Team Dashboard"]] : []),
      ["ideas", "Ideas & Reference"],
      ["settings", "Settings"]
    ];
  }

  return (
    <div className="min-h-screen bg-[#fbf9fa] text-slate-900 selection:bg-amber-400 font-sans antialiased">
      {/* 1. Desktop Executive Header (Visible on Desktop >= md) */}
      <header className="sticky top-0 z-20 hidden md:block border-b border-slate-200 bg-white/95 text-slate-900 shadow-sm backdrop-blur-md">
        {/* Tier 1: Brand & Executive Status Bar */}
        <div className="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-2.5 sm:px-6">
          <Logo height={44} lightMode={true} onClick={() => setTab(isEmployee ? "standup" : "capture")} />

          <div className="flex items-center flex-wrap gap-2.5 sm:gap-3">
            {/* Quick Capture Desktop Button */}
            <button
              onClick={() => setShowQuickCaptureModal(true)}
              className="flex items-center gap-1.5 rounded-xl bg-slate-950 text-white hover:bg-slate-800 px-3 py-1.5 text-xs font-black shadow-sm transition"
              title="Press 'C' anywhere"
            >
              <span>⚡</span>
              <span>+ Quick Capture</span>
              <span className="rounded bg-slate-800 px-1 py-0.2 text-[10px] text-amber-400 font-mono">C</span>
            </button>

            {/* Company & Role Badge */}
            {orgCtx?.org && (
              <div className="hidden sm:flex items-center gap-1.5 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 shadow-2xs">
                <span className="text-sm">🏢</span>
                <span className="text-xs font-bold text-slate-900">{orgCtx.org.name}</span>
                <span className="text-[10px] uppercase font-extrabold px-1.5 py-0.5 rounded-md bg-amber-400 text-slate-950">
                  {ROLE_LABEL[role] || (isOwner ? "Founder" : role || "Member")}
                </span>
              </div>
            )}

            {/* 15-Day Free Trial Countdown Badge (For Owners) */}
            {isOwner && (
              <div className="hidden sm:flex items-center gap-1.5 rounded-xl border border-blue-200 bg-blue-50/80 px-3 py-1.5 shadow-xs">
                <span className="h-2 w-2 rounded-full bg-blue-600 animate-pulse"></span>
                <span className="text-xs font-bold text-blue-900">15-Day Trial Active</span>
              </div>
            )}

            {/* Google Meet 1:1 Training Call Button (For Owners & Managers) */}
            {orgCtx?.org && !isEmployee && (
              <button 
                onClick={() => setShowTrainingModal(true)}
                className={`flex items-center gap-1.5 rounded-xl px-3 py-1.5 text-xs font-bold transition shadow-xs ${
                  trainingBooked 
                    ? "bg-emerald-100/80 text-emerald-950 border border-emerald-300 hover:bg-emerald-200" 
                    : "bg-amber-400 text-slate-950 hover:bg-amber-300"

              >
                <span>{trainingBooked ? "📅" : "📹"}</span>
                <span>{trainingBooked ? "Google Meet Booked" : "Book 1:1 Training Call"}</span>
              </button>

            {/* User Guide & Manual Top Button */}
            <button 
              onClick={() => setTab("manual")}
              className={`flex items-center gap-1.5 rounded-xl px-3 py-1.5 text-xs font-bold transition shadow-xs ${
                tab === "manual" 
                  ? "bg-slate-950 text-white"

            >
              <span>📖</span>
              <span>User Guide</span>

              >
                <span>📹</span>
                <span>Coach Desk</span>
              </button>

            {!isEmployee && (

                <span className="mono text-[11px] font-mono font-bold uppercase tracking-wider text-amber-900">Hour Value</span>

              </div>
            )}

            {/* In-App Real-time Notification Bell */}
            <button

            >

              {inAppNotifications.length > 0 && (

              <button 
                onClick={() => sb.auth.signOut()} 
                className="rounded-lg bg-slate-950 px-2.5 py-1 text-xs font-bold text-white hover:bg-slate-800 transition-all duration-150 shadow-xs"
              >
                Sign out
              </button>
            </div>
          </div>
        </div>

        {/* Tier 2: Desktop Navigation Bar */}

              return (

                  <span>{label}</span>

        </div>
      </header>

      {/* 2. Mobile App Header Bar (< md) */}

      {/* Main Workspace Area (pb-28 on mobile for fixed bottom tab bar) */}

          data={data} 
          patch={patch}

          onOpenTraining={() => setShowTrainingModal(true)}

        {tab!=="daily" && tab!=="weekly" && tab!=="standup" && tab!=="manual" && <DueBanner data={data} />}

        {tab==="reference" && <ReferenceView data={data} patch={patch} />}

        {tab==="people" && <PeopleView orgCtx={orgCtx} meId={userId} />}
        {tab==="team" && <TeamView orgCtx={orgCtx} meId={userId} />}

        {tab==="settings" && <SettingsView data={data} patch={patch} setData={setData} userId={userId}
