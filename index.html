                               onOpenTraining={() => setShowTrainingModal(true)}
                               isAdmin={isAdmin}
                               initialSubTab={settingsSubTab} />}
      </main>

      {/* 3. Fixed Mobile Bottom Tab Bar with Center Floating '+' FAB (< md) */}
      <div className="fixed bottom-0 left-0 right-0 z-40 block md:hidden border-t border-slate-200 bg-white/95 backdrop-blur-lg shadow-lg">
        <div className="flex items-center justify-around px-2 py-1.5">
          {/* Primary Role Tab 1 */}
          <button
            onClick={() => setTab(isEmployee ? "standup" : "daily")}
            className={`flex flex-col items-center justify-center p-1.5 rounded-xl transition ${
              tab === (isEmployee ? "standup" : "daily") ? "text-amber-600 font-extrabold" : "text-slate-500 font-medium hover:text-slate-800"
            }`}
          >
            <span className="text-lg">{isEmployee ? "🎯" : "📅"}</span>
            <span className="text-[10px] font-bold">{isEmployee ? "Focus" : "Daily"}</span>
          </button>

          {/* Primary Role Tab 2 */}
          <button
            onClick={() => setTab(isEmployee ? "daily" : "weekly")}
            className={`flex flex-col items-center justify-center p-1.5 rounded-xl transition ${
              tab === (isEmployee ? "daily" : "weekly") ? "text-amber-600 font-extrabold" : "text-slate-500 font-medium hover:text-slate-800"
            }`}
          >
            <span className="text-lg">{isEmployee ? "📅" : "🗓️"}</span>
            <span className="text-[10px] font-bold">{isEmployee ? "Schedule" : "Weekly"}</span>
          </button>

          {/* Center Floating Action Button (FAB) for Quick Capture */}
          <button
            onClick={() => setShowQuickCaptureModal(true)}
            className="flex flex-col items-center justify-center -mt-5 h-12 w-12 rounded-full bg-slate-950 text-amber-400 shadow-xl shadow-slate-950/30 hover:scale-105 active:scale-95 transition-all border-2 border-amber-400"
            title="Quick Capture (+)"
          >
            <span className="text-2xl font-black leading-none mb-0.5">+</span>
          </button>

          {/* Primary Role Tab 3 */}
          <button
            onClick={() => setTab(isEmployee ? "weekly" : "followup")}
            className={`flex flex-col items-center justify-center p-1.5 rounded-xl transition ${
              tab === (isEmployee ? "weekly" : "followup") ? "text-amber-600 font-extrabold" : "text-slate-500 font-medium hover:text-slate-800"
            }`}
          >
            <span className="text-lg">{isEmployee ? "🗓️" : "👥"}</span>
            <span className="text-[10px] font-bold">{isEmployee ? "Weekly" : "Follow-up"}</span>
          </button>

          {/* More Menu Drawer */}
          <button
            onClick={() => setShowMobileMoreDrawer(true)}
            className={`flex flex-col items-center justify-center p-1.5 rounded-xl transition ${
              ["monthly", "goals", "people", "team", "ideas", "manual", "settings"].includes(tab)
                ? "text-amber-600 font-extrabold"
                : "text-slate-500 font-medium hover:text-slate-800"
            }`}
          >
            <span className="text-lg">☰</span>
            <span className="text-[10px] font-bold">More</span>
          </button>
        </div>
      </div>

      {/* 4. Slide-Up Mobile More Drawer Modal */}
      {showMobileMoreDrawer && (
        <div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/60 backdrop-blur-xs md:hidden" onClick={() => setShowMobileMoreDrawer(false)}>
          <div className="w-full max-h-[85vh] overflow-y-auto rounded-t-3xl border-t border-slate-200 bg-white p-5 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div className="flex items-center gap-2">
                <span className="text-lg">🧭</span>
                <span className="font-extrabold text-base text-slate-950">Workspace Navigation</span>
              </div>
              <button onClick={() => setShowMobileMoreDrawer(false)} className="rounded-xl p-1.5 text-slate-400 hover:bg-slate-100 text-sm font-bold">✕</button>
            </div>

            <div className="grid grid-cols-2 gap-2.5">
              {[
                { id: "capture", icon: "📥", label: "Capture Inbox", desc: "Dump & categorize thoughts" },
                { id: "monthly", icon: "📆", label: "Monthly Blueprint", desc: "Buffer days & fixed goals" },
                { id: "goals", icon: "🎯", label: "Goals & KRAs", desc: "Quarterly OKRs & KPIs" },
                { id: "people", icon: "🏢", label: "Team Dashboard", desc: "Direct reports & routines" },
                { id: "ideas", icon: "💡", label: "Ideas & Reference", desc: "Knowledge & somedays" },
                { id: "manual", icon: "📖", label: "User Guide", desc: "System training manual" },
                { id: "settings", icon: "⚙️", label: "Settings", desc: "Profile, company & billing" },
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => { setTab(item.id); setShowMobileMoreDrawer(false); }}
                  className={`flex flex-col items-start p-3 rounded-2xl border transition text-left ${
                    tab === item.id ? "border-amber-400 bg-amber-50/80 shadow-xs font-bold" : "border-slate-200 bg-slate-50/70 hover:bg-slate-100"
                  }`}
                >
                  <div className="text-xl mb-1">{item.icon}</div>
                  <div className="text-xs font-extrabold text-slate-900">{item.label}</div>
                  <div className="text-[10px] text-slate-500 leading-tight">{item.desc}</div>
                </button>
              ))}
            </div>

            <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
              <span className="text-slate-500 font-semibold truncate max-w-[200px]">{session.user.email}</span>
              <button onClick={() => sb.auth.signOut()} className="rounded-xl bg-slate-950 text-white px-3 py-1.5 font-bold shadow-xs">
                Sign Out
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 5. Global Quick Capture Modal */}
      {showQuickCaptureModal && (
        <GlobalQuickCaptureModal
          data={data}
          patch={patch}
          ohv={ohv}
          onClose={() => setShowQuickCaptureModal(false)}
        />
      )}

      {showTrainingModal && (
        <ExecutiveWelcomeOnboardingFlow 
          orgCtx={orgCtx} 
          session={session}
          onClose={() => setShowTrainingModal(false)}
          onUpdated={async () => {
            try {
              const freshCtx = await loadOrgContext(userId, session.user.email);
              if (onLeftOrg) onLeftOrg(); // clear
              onStartCompany(); // reload
            } catch (_) {}
          }}
        />
      )}

      {/* 6. Live Task Detail & Notes Modal */}
      {selectedTaskModal && (
        <TaskDetailAndNotesModal
          task={selectedTaskModal}
          onClose={() => setSelectedTaskModal(null)}
          onUpdateTask={async (taskId, patchObj) => {
            const updated = await updateDelegatedTask(taskId, patchObj);
            if (updated) {
              setDbTasks(prev => prev.map(t => t.id === taskId ? updated : t));
              setSelectedTaskModal(updated);
            }
          }}
          onAddNote={async (taskId, text, authorName, authorEmail, newStatus) => {
            const updated = await addDelegatedTaskUpdate(taskId, text, authorName, authorEmail, newStatus);
            if (updated) {
              setDbTasks(prev => prev.map(t => t.id === taskId ? updated : t));
              setSelectedTaskModal(updated);
            }
          }}
          meName={orgCtx?.profile?.full_name || orgCtx?.profile?.email || "Me"}
          meEmail={(session?.user?.email || "").toLowerCase()}
          isAssignee={
            selectedTaskModal.assignee_id === userId ||
            (selectedTaskModal.assignee_email && selectedTaskModal.assignee_email.toLowerCase() === (session?.user?.email || "").toLowerCase())
          }
          isDelegator={selectedTaskModal.delegated_by === userId}
          orgCtx={orgCtx}
        />
      )}

      {/* 7. In-App Notification Center Modal */}
      {showNotificationsModal && (
        <InAppNotificationCenterModal
          notifications={inAppNotifications}
          onOpenTask={t => setSelectedTaskModal(t)}
          onClearAll={() => setInAppNotifications([])}
          onClose={() => setShowNotificationsModal(false)}
        />
      )}

      {/* 8. Floating Real-time In-App Toast */}
      {activeToast && (
        <InAppToastAlert
          toast={activeToast}
          onOpenTask={t => setSelectedTaskModal(t)}
          onClose={() => setActiveToast(null)}
        />
      )}

      <footer className="mx-auto max-w-6xl px-4 pb-8 pt-2 text-center text-xs text-slate-400">
        Jo pehle likha, wahi bachega — what is written first, survives. · {saving ? "Syncing…" : syncError ? "Sync failed — check your connection." : "Synced to your account."}
      </footer>
    </div>
  );
}

/* ================================================================== */
/*  1 · CAPTURE                                                        */
/* ================================================================== */
function CaptureView({ data, patch, ohv, orgCtx, meId }){
  const [text, setText] = useState("");
  const [selectedCat, setSelectedCat] = useState("Deep Focus");
  const [selectedType, setSelectedType] = useState("SCHEDULE");
  const [filterCat, setFilterCat] = useState("ALL");
  const [searchQuery, setSearchQuery] = useState("");

  const team = getEffectiveTeam(data, orgCtx);

  const add = () => { 
    const t = text.trim(); 
    if (!t) return; 
    patch(d => {
      d.captures = d.captures || [];
      d.captures.unshift({
        id: uid(),
        date: new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short" }),
        item: t,
        category: selectedCat,
        taskType: selectedType,
        details: "",
        status: "Open"
      });
    });
    setText(""); 
  };

  const open = (data.captures || []).filter(c => c.status !== "Transferred" && c.status !== "Done");
  const closed = (data.captures || []).filter(c => c.status === "Transferred" || c.status === "Done");

  const filteredOpen = open.filter(c => {
    const matchesCat = filterCat === "ALL" || c.category === filterCat;
    const matchesSearch = !searchQuery || c.item.toLowerCase().includes(searchQuery.toLowerCase()) || (c.details || "").toLowerCase().includes(searchQuery.toLowerCase());
    return matchesCat && matchesSearch;
  });

  const setType = (id, v) => patch(d => { const c = d.captures.find(x => x.id === id); if (c) c.taskType = v; });
  const setDetails = (id, v) => patch(d => { const c = d.captures.find(x => x.id === id); if (c) c.details = v; });
  const setCatOf = (id, v) => patch(d => { const c = d.captures.find(x => x.id === id); if (c) c.category = v; });
  const setDue = (id, v) => patch(d => { const c = d.captures.find(x => x.id === id); if (c) c.due = v; });
  const setTime = (id, v) => patch(d => { const c = d.captures.find(x => x.id === id); if (c) c.time = v; });
  const setAssignee = (id, v) => patch(d => { const c = d.captures.find(x => x.id === id); if (c) c.assignee = v; });
  const remove = (id) => { if (!confirm("Delete this item? This can't be undone.")) return; patch(d => { d.captures = d.captures.filter(x => x.id !== id); }); };
  const markDone = (id) => patch(d => { const c = d.captures.find(x => x.id === id); if (c) c.status = c.status === "Done" ? "Open" : "Done"; });
  
  const transfer = (item) => { 
    if (!item.taskType) return;
    const payload = {
      id: uid(),
      text: item.item + (item.details ? ` — ${item.details}` : ""),
      tag: item.category,
      taskType: item.taskType,
      due: item.due || "",
      time: item.time || "",
      assignee: item.assignee || ""
    };

    // If delegating in an organization, create live delegated task & dispatch email
    if (item.taskType === "DELEGATE" && item.assignee && orgCtx?.org?.id) {
      const mem = team.find(m => m.name.toLowerCase() === item.assignee.toLowerCase() || (m.email && m.email.toLowerCase() === item.assignee.toLowerCase()));
      createDelegatedTask(orgCtx.org.id, meId, {
        assignee_id: mem?.user_id || null,
        assignee_email: mem?.email || "",
        assignee_name: mem?.name || item.assignee,
        title: item.item,
        details: item.details || "",
        due_date: item.due || todayKey()
      });
      if (mem?.email) {
        sendTransactionalEmail("task_delegated", mem.email, {
          task_title: item.item,
          delegator_name: orgCtx?.profile?.full_name || orgCtx?.profile?.email || "Founder / Leadership",
          company_name: orgCtx?.org?.name || "Workspace",
          due_date: item.due || todayKey(),
          notes: item.details || "",
          member_name: mem.name || mem.email
        });
      }
    }

    patch(d => { 
      const t = item.taskType; 
      let dest = "";
      if (["SCHEDULE", "DAILY", "WAITING", "WAITING-FOR", "PROJECT", "DELEGATE"].includes(t)) { 
        d.dailyBackup = d.dailyBackup || [];
        d.dailyBackup.unshift(payload); 
        dest = "Daily backup"; 
      }
      else if (t === "WEEKLY") { 
        d.weeklySomeday = d.weeklySomeday || [];
        d.weeklySomeday.unshift(payload); 
        dest = "Weekly someday"; 
      }
      else if (t === "MONTHLY") { 
        d.monthlyTray = d.monthlyTray || [];
        d.monthlyTray.unshift(payload); 
        dest = "Monthly tray"; 
      }
      else if (t === "MAYBE") { 
        d.maybe = d.maybe || [];
        d.maybe.unshift({ id: uid(), added: item.date, item: item.item, category: item.category, revisit: "", decision: "" }); 
        dest = "Maybe list"; 
      }
      else if (t === "REFERENCE" || t === "AUTOMATE") { 
        d.reference = d.reference || [];
        d.reference.unshift({ id: uid(), text: item.item, note: item.details }); 
        dest = "Reference"; 
      }
      else if (t === "DELETE") { 
        d.captures = d.captures.filter(x => x.id !== item.id); 
        return; 
      }
      const c = d.captures.find(x => x.id === item.id); 
      if (c) { c.status = "Transferred"; c.dest = dest; }
    });
  };

  return (
    <div className="space-y-5">
      <Callout>Dump everything here first — what is written first, survives. Decide later. Nothing moves to your schedule until you press Transfer.</Callout>

      {/* 1. Rapid Capture Desk */}
      <div className="rounded-3xl border-2 border-slate-200 bg-white p-4 sm:p-6 shadow-xs space-y-3.5">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2">
            <span className="text-xl">⚡</span>
            <span className="text-xs font-black uppercase tracking-wider text-slate-900">Rapid Capture Desk</span>
          </div>
          <span className="text-[11px] font-bold text-slate-400 hidden sm:inline">Press Enter to capture</span>
        </div>

        <div className="flex flex-col gap-2 sm:flex-row">
          <input 
            value={text} 
            onChange={e => setText(e.target.value)} 
            onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); add(); } }}
            placeholder="Kuch dimaag mein aaya? Type task, idea, or follow-up…"
            className="flex-1 rounded-2xl border-2 border-amber-300 bg-amber-50/60 px-4 py-3 text-sm font-bold text-slate-950 outline-none focus:border-amber-500 focus:bg-white transition" 
          />
          <button 
            onClick={add} 
            className="flex items-center justify-center gap-2 rounded-2xl bg-slate-950 px-6 py-3 text-sm font-black text-white hover:bg-slate-800 transition shadow-sm"
          >
            <span>+</span>
            <span>Capture</span>
          </button>
        </div>

        {/* Quick Category Chips */}
        <div className="flex flex-wrap items-center gap-1.5 pt-1">
          <span className="text-[11px] font-bold text-slate-400 mr-1">Category:</span>
          {["Deep Focus", "Meeting", "Finance", "Sales", "Ops & Admin", "Personal"].map(cat => (
            <button
              key={cat}
              onClick={() => setSelectedCat(cat)}
              className={`rounded-xl px-3 py-1 text-xs font-bold transition border ${
                selectedCat === cat 
                  ? "bg-slate-950 text-white border-slate-950 shadow-2xs" 
                  : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100"
              }`}
            >
              {cat}
            </button>
          ))}
        </div>
      </div>

      {/* 2. Inbox Header & Filter Controls */}
      <div className="flex flex-wrap items-center justify-between gap-3 pt-2">
        <div className="flex items-center gap-2">
          <h2 className="font-extrabold text-base text-slate-900 flex items-center gap-2">
            <span>📥</span>
            <span>Inbox</span>
            <span className="rounded-full bg-slate-100 text-slate-700 px-2.5 py-0.5 text-xs font-black">
              {open.length}
            </span>
          </h2>
        </div>

        {/* Category Filters & Search */}
        <div className="flex flex-wrap items-center gap-2">
          <div className="relative">
            <input
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              placeholder="Search inbox…"
              className="rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-800 outline-none w-36 sm:w-48 placeholder:text-slate-400"
            />
          </div>
          <select
            value={filterCat}
            onChange={e => setFilterCat(e.target.value)}
            className="rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-bold text-slate-700 outline-none"
          >
            <option value="ALL">All Categories</option>
            {["Deep Focus", "Meeting", "Finance", "Sales", "Ops & Admin", "Personal"].map(c => (
              <option key={c} value={c}>{c}</option>
            ))}
          </select>
        </div>
      </div>

      {/* 3. Responsive Inbox Task Cards */}
      <div className="space-y-3">
        {filteredOpen.length === 0 && (
          <div className="py-12 text-center rounded-3xl border border-dashed border-slate-200 bg-white p-8">
            <div className="text-3xl mb-2">🧘</div>
            <div className="text-sm font-black text-slate-800">Inbox is empty!</div>
            <p className="text-xs text-slate-500 mt-1">Dimaag bilkul saaf hai. Dump any new ideas or tasks above.</p>
          </div>
        )}

        {filteredOpen.map(c => (
          <div key={c.id} className="rounded-2xl border border-slate-200 bg-white p-4 shadow-xs space-y-3 transition hover:border-slate-300">
            <div className="flex items-start justify-between gap-3">
              <div className="min-w-0 flex-1 space-y-1">
                <div className="flex flex-wrap items-center gap-2">
                  <span className={`text-sm font-extrabold break-words ${c.status === "Done" ? "text-slate-400 line-through" : "text-slate-900"}`}>
                    {c.item}
                  </span>
                  {c.category && (
                    <span className="rounded-lg bg-slate-100 border border-slate-200 px-2 py-0.5 text-[10px] font-bold text-slate-700">
                      🏷️ {c.category}
                    </span>
                  )}
                  {ohv > 0 && ["Admin", "Ops & Admin"].includes(c.category) && (
                    <span className="rounded-lg bg-rose-50 border border-rose-200 px-2 py-0.5 text-[10px] font-bold text-rose-700">
                      delegate? (&lt; ₹{ohv}/h)
                    </span>
                  )}
                  {c.due && (
                    <span className="rounded-lg bg-blue-50 border border-blue-200 px-2 py-0.5 text-[10px] font-bold text-blue-900">
                      📅 {c.due}{c.time ? ` · ${c.time}` : ""}
                    </span>
                  )}
                  {c.assignee && (
                    <span className="rounded-lg bg-purple-50 border border-purple-200 px-2 py-0.5 text-[10px] font-bold text-purple-900">
                      → {c.assignee}
                    </span>
                  )}
                </div>
                <span className="mono text-[11px] text-slate-400 block">{c.date}</span>
              </div>

              <div className="flex items-center gap-1 shrink-0">
                <button 
                  onClick={() => markDone(c.id)} 
                  title="Mark done" 
                  className={`rounded-xl p-2 transition ${c.status === "Done" ? "bg-emerald-100 text-emerald-700 font-bold" : "text-slate-400 hover:bg-slate-100 hover:text-slate-700"}`}
                >
                  <Ic n="check"/>
                </button>
                <button 
                  onClick={() => remove(c.id)} 
                  title="Delete" 
                  className="rounded-xl p-2 text-slate-400 hover:bg-rose-50 hover:text-rose-600 transition"
                >
                  <Ic n="trash"/>
                </button>
              </div>
            </div>

            {/* Task Controls Row */}
            <div className="flex flex-wrap items-center gap-2 pt-1 border-t border-slate-100">
              <select 
                value={c.category || ""} 
                onChange={e => setCatOf(c.id, e.target.value)} 
                className="rounded-xl border border-slate-200 bg-slate-50 px-2.5 py-1.5 text-xs font-bold text-slate-700 outline-none"
              >
                <option value="">— Category —</option>
                {(data.categories || DEFAULT_CATEGORIES).map(x => <option key={x}>{x}</option>)}
              </select>

              <select 
                value={c.taskType || ""} 
                onChange={e => setType(c.id, e.target.value)} 
                className="rounded-xl border-2 border-amber-300 bg-amber-50 px-2.5 py-1.5 text-xs font-black text-amber-950 outline-none"
              >
                <option value="">— Destination —</option>
                {TASK_TYPES.map(x => (
                  <option key={x} value={x}>{(data.taskTypeLabels || DEFAULT_TASK_TYPE_LABELS)[x] || x}</option>
                ))}
              </select>

              <input 
                type="date" 
                value={c.due || ""} 
                onChange={e => setDue(c.id, e.target.value)} 
                title="Due Date"
                className="rounded-xl border border-slate-200 bg-slate-50 px-2 py-1.5 text-xs font-bold text-slate-700 outline-none" 
              />

              <input 
                type="time" 
                value={c.time || ""} 
                onChange={e => setTime(c.id, e.target.value)} 
                title="Time"
                className="rounded-xl border border-slate-200 bg-slate-50 px-2 py-1.5 text-xs font-bold text-slate-700 outline-none" 
              />

              {["DELEGATE", "WAITING-FOR"].includes(c.taskType) && (
                <select 
                  value={c.assignee || ""} 
                  onChange={e => setAssignee(c.id, e.target.value)} 
                  className="rounded-xl border border-sky-200 bg-sky-50 px-2.5 py-1.5 text-xs font-bold text-sky-950 outline-none"
                >
                  <option value="">— Assign to Team Member —</option>
                  {team.map(m => <option key={m.id} value={m.name}>{m.label}</option>)}
                </select>
              )}

              <input 
                value={c.details || ""} 
                onChange={e => setDetails(c.id, e.target.value)} 
                placeholder="Context or notes…"
                className="min-w-[120px] flex-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs text-slate-800 outline-none focus:bg-white" 
              />

              <button 
                onClick={() => transfer(c)} 
                disabled={!c.taskType}
                className={`flex items-center gap-1.5 rounded-xl px-4 py-1.5 text-xs font-black transition shadow-2xs ${
                  c.taskType ? "bg-amber-400 text-slate-950 hover:bg-amber-300" : "cursor-not-allowed bg-slate-100 text-slate-400"
                }`}
              >
                <span>⚡</span>
                <span>Transfer</span>
              </button>
            </div>

            {c.taskType && (
              <p className="flex items-center gap-1 text-[11px] font-medium text-slate-400">
                <Ic n="info"/> {TYPE_HELP[c.taskType]}
              </p>
            )}
          </div>
        ))}
      </div>

      {/* 4. Cleared / Completed History Drawer */}
      {closed.length > 0 && (
        <details className="mt-8 rounded-2xl border border-slate-200 bg-white p-4 shadow-2xs">
          <summary className="cursor-pointer text-xs font-black uppercase tracking-wider text-slate-500">
            Cleared &amp; Transferred ({closed.length})
          </summary>
          <div className="mt-3 space-y-1.5">
            {closed.map(c => (
              <div key={c.id} className="flex items-center justify-between rounded-xl border border-slate-100 bg-slate-50 px-3 py-2 text-xs text-slate-400">
                <span className="line-through">{c.item}</span>
                <div className="flex items-center gap-2">
                  {c.dest && <span className="rounded-lg bg-slate-200 px-2 py-0.5 text-[10px] font-bold text-slate-700">→ {c.dest}</span>}
                  {c.status === "Done" && !c.dest && (
                    <button onClick={() => markDone(c.id)} title="Undo done" className="text-slate-400 hover:text-amber-600 font-bold">↺</button>
                  )}
                  <button onClick={() => remove(c.id)} className="text-slate-400 hover:text-rose-600"><Ic n="x"/></button>
                </div>
              </div>
            ))}
          </div>
        </details>
      )}
    </div>
  );
}

/* ================================================================== */
/*  1b · FOLLOW-UP (delegated / waiting-for, across Daily backup)      */
/* ================================================================== */
function FollowUpView({ data, patch, orgCtx, meId, dbTasks = [], setDbTasks, onOpenTask }){
  const today = todayKey();
  const [subTab, setSubTab] = useState("delegated"); // "delegated" | "assigned_to_me" | "standups"
  const [statusFilter, setStatusFilter] = useState("ALL");
  const [deptFilter, setDeptFilter] = useState("ALL");
  const [newTaskText, setNewTaskText] = useState("");
  const [newAssignee, setNewAssignee] = useState("");
  const [newDepartment, setNewDepartment] = useState("Operations");
  const [newDue, setNewDue] = useState(today);
  const [newLink, setNewLink] = useState("");
  const [planners, setPlanners] = useState([]);
  const [teamMembers, setTeamMembers] = useState([]);
  const [notice, setNotice] = useState("");

  const say = (t) => { setNotice(t); setTimeout(() => setNotice(""), 4000); };
  const team = getEffectiveTeam(data, orgCtx);
  const myEmail = (orgCtx?.profile?.email || "").toLowerCase();
  const myName = orgCtx?.profile?.full_name || orgCtx?.profile?.email || "Founder";
  const myRole = orgCtx?.membership?.role || "owner";
  const myRank = getRoleRank(myRole);

  // Load team planners and members
  useEffect(() => {
    if (orgCtx?.org?.id) {
      Promise.all([loadTeam(orgCtx.org.id), loadAllVisiblePlanners()])
        .then(([m, p]) => {
          setTeamMembers(m || []);
          setPlanners(p || []);
        })
        .catch(() => {});
    }
  }, [orgCtx?.org?.id]);

  // Strict role and department isolation
  const visibleTeamMembers = filterVisibleTeamMembers(teamMembers, meId, myRole, orgCtx?.membership?.department);
  const filteredTeamMembers = deptFilter === "ALL" 
    ? visibleTeamMembers 
    : visibleTeamMembers.filter(m => (m.department || "General").toLowerCase() === deptFilter.toLowerCase());

  // Real-time Database Delegated Tasks assigned to team
  const orgTasks = dbTasks.length > 0 ? dbTasks : [];

  // Filter tasks delegated to others vs assigned to me
  const delegatedToTeam = orgTasks.filter(t => {
    if (t.assignee_id === meId || (t.assignee_email && t.assignee_email.toLowerCase() === myEmail)) {
      return false; // Assigned to me, show in "Assigned to Me" tab
    }
    return true;
  });

  const assignedToMe = orgTasks.filter(t => {
    return t.assignee_id === meId || (t.assignee_email && t.assignee_email.toLowerCase() === myEmail);
  });

  const handleQuickDelegate = async (e) => {
    e.preventDefault();
    if (!newTaskText.trim()) return;

    const memberObj = team.find(m => 
      (m.name && m.name.toLowerCase() === (newAssignee||"").toLowerCase()) || 
      (m.email && m.email.toLowerCase() === (newAssignee||"").toLowerCase())
    );

    if (orgCtx?.org?.id && newAssignee) {
      const created = await createDelegatedTask(
        orgCtx.org.id, 
        meId, 
        {
          assignee_id: memberObj?.user_id || null,
          assignee_email: memberObj?.email || "",
          assignee_name: memberObj?.name || newAssignee,
          department: memberObj?.department || newDepartment || "General",
          title: newTaskText.trim(),
          details: "",
          link: newLink.trim() || null,
          due_date: newDue || today,
          status: "pending"
        },
        myName,
        myEmail
      );

      if (created && setDbTasks) {
        setDbTasks(prev => [created, ...prev.filter(x => x.id !== created.id)]);
      }

      if (memberObj && memberObj.email) {
        sendTransactionalEmail("task_delegated", memberObj.email, {
          task_title: newTaskText.trim(),
          delegator_name: myName,
          company_name: orgCtx?.org?.name || "Workspace",
          due_date: newDue || today,
          link: newLink.trim() || "",
          notes: "Delegated from Follow-up Radar",
          member_name: memberObj.name || memberObj.email
        });
        say(`✓ Task assigned & instant email dispatched to ${memberObj.name || memberObj.email}!`);
      } else {
        say(`✓ Task assigned to ${newAssignee || "team"}!`);
      }
    } else {
      // Local fallback
      const task = {
        id: uid(),
        text: newTaskText.trim(),
        tag: "Delegation",
        taskType: "DELEGATE",
        due: newDue || today,
        time: "",
        assignee: newAssignee || "Team",
        link: newLink.trim() || null,
        done: false
      };
      patch(d => {
        d.dailyBackup = d.dailyBackup || [];
        d.dailyBackup.unshift(task);
      });
      say(`✓ Task created in Daily backup for ${newAssignee || "team"}!`);
    }

    setNewTaskText("");
    setNewLink("");
  };

  const handleStatusChange = async (taskId, newStatus) => {
    const updated = await addDelegatedTaskUpdate(taskId, `Status changed to ${TASK_STATUS_CONFIG[newStatus]?.label || newStatus}`, myName, myEmail, newStatus);
    if (updated && setDbTasks) {
      setDbTasks(prev => prev.map(t => t.id === taskId ? updated : t));
    }
    say(`✓ Task status changed to ${TASK_STATUS_CONFIG[newStatus]?.label || newStatus}`);
  };

  const handleNotifyAgain = (task) => {
    if (!task.assignee_email) {
      alert("No email registered for this assignee.");
      return;
    }
    sendTransactionalEmail("task_delegated", task.assignee_email, {
      task_title: task.title,
      delegator_name: myName,
      company_name: orgCtx?.org?.name || "Workspace",
      due_date: task.due_date || today,
      link: task.link || "",
      notes: "Follow-up reminder from leadership radar",
      member_name: task.assignee_name || task.assignee_email
    });
    say(`✓ Follow-up email notification sent to ${task.assignee_name || task.assignee_email}!`);
  };

  // Group active list
  const activeList = subTab === "delegated" ? delegatedToTeam : assignedToMe;
  const filteredList = activeList.filter(t => {
    if (statusFilter !== "ALL" && t.status !== statusFilter) return false;
    if (deptFilter !== "ALL") {
      const taskDept = (t.department || "").toLowerCase();
      const memberObj = teamMembers.find(m => (t.assignee_id && m.user_id === t.assignee_id) || (t.assignee_email && m.email && m.email.toLowerCase() === t.assignee_email.toLowerCase()));
      const memDept = (memberObj?.department || "General").toLowerCase();
      if (taskDept !== deptFilter.toLowerCase() && memDept !== deptFilter.toLowerCase()) return false;
    }
    return true;
  });

  return (
    <div className="space-y-6">
      {notice && (
        <div className="rounded-xl border border-emerald-300 bg-emerald-50 px-4 py-3 text-xs font-extrabold text-emerald-900 shadow-xs">
          {notice}
        </div>
      )}

      {/* Header Banner & Tab Switcher */}
      <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-xs flex flex-wrap items-center justify-between gap-4">
        <div className="space-y-1">
          <div className="flex items-center gap-2">
            <span className="rounded-full bg-indigo-100 text-indigo-900 px-3 py-0.5 text-[10px] font-black uppercase tracking-wider">
              📋 DELEGATION &amp; FOLLOW-UP RADAR
            </span>
            <span className="inline-flex items-center gap-1 rounded-full bg-emerald-100 text-emerald-900 px-2 py-0.5 text-[10px] font-black">
              <span className="h-1.5 w-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
              Live Real-Time Sync
            </span>
          </div>
          <h2 className="text-2xl font-black text-slate-950">
            Team Tasks &amp; Delegation Control
          </h2>
          <p className="text-xs text-slate-600">
            Assign tasks to employees, inspect live status updates &amp; progress notes, and monitor daily standups without refreshing.
          </p>
        </div>

        <div className="flex items-center gap-2 rounded-2xl bg-slate-100 p-1.5 border border-slate-200">
          <button
            onClick={() => setSubTab("delegated")}
            className={`px-4 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5 ${
              subTab === "delegated" ? "bg-slate-950 text-white shadow-xs" : "text-slate-600 hover:text-slate-950"
            }`}
          >
            <span>👥 Delegated to Team</span>
            <span className="rounded-full bg-slate-800 text-amber-400 px-1.5 py-0.2 text-[10px] font-bold">
              {delegatedToTeam.filter(t => t.status !== "completed").length}
            </span>
          </button>

          <button
            onClick={() => setSubTab("assigned_to_me")}
            className={`px-4 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5 ${
              subTab === "assigned_to_me" ? "bg-slate-950 text-white shadow-xs" : "text-slate-600 hover:text-slate-950"
            }`}
          >
            <span>📥 Assigned to Me</span>
            {assignedToMe.filter(t => t.status !== "completed").length > 0 && (
              <span className="rounded-full bg-amber-400 text-slate-950 px-1.5 py-0.2 text-[10px] font-bold">
                {assignedToMe.filter(t => t.status !== "completed").length}
              </span>
            )}
          </button>

          <button
            onClick={() => setSubTab("standups")}
            className={`px-4 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5 ${
              subTab === "standups" ? "bg-slate-950 text-white shadow-xs" : "text-slate-600 hover:text-slate-950"
            }`}
          >
            <span>🎯 Live Standups</span>
            <span className="text-[10px] font-bold text-slate-400">({filteredTeamMembers.length})</span>
          </button>
        </div>
      </div>

      {/* Department Filter Pills Bar */}
      {myRank >= 4 && (
        <div className="flex flex-wrap items-center gap-1.5 bg-white p-3 rounded-2xl border border-slate-200 shadow-2xs">
          <span className="text-xs font-black uppercase tracking-wider text-slate-400 mr-2">Department:</span>
          <button
            onClick={() => setDeptFilter("ALL")}
            className={`rounded-xl px-3 py-1 text-xs font-bold transition ${
              deptFilter === "ALL" ? "bg-slate-950 text-white shadow-2xs" : "bg-slate-100 text-slate-700 hover:bg-slate-200"
            }`}
          >
            All Departments
          </button>
          {DEPARTMENTS.map(d => (
            <button
              key={d}
              onClick={() => setDeptFilter(d)}
              className={`rounded-xl px-3 py-1 text-xs font-bold transition ${
                deptFilter === d ? "bg-slate-950 text-white shadow-2xs" : "bg-slate-100 text-slate-700 hover:bg-slate-200"
              }`}
            >
              {d}
            </button>
          ))}
        </div>
      )}

      {(subTab === "delegated" || subTab === "assigned_to_me") && (
        <div className="space-y-5">
          {/* Quick Delegate Input Bar */}
          {subTab === "delegated" && (
            <div className="rounded-3xl border-2 border-slate-200 bg-white p-4 sm:p-5 shadow-xs">
              <form onSubmit={handleQuickDelegate} className="flex flex-wrap items-center gap-2.5">
                <input 
                  value={newTaskText}
                  onChange={e => setNewTaskText(e.target.value)}
                  placeholder="+ Delegate a new deliverable or task to a team member..."
                  className="flex-1 min-w-[240px] rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-900 outline-none focus:border-blue-600 focus:bg-white"
                />
                <input 
                  value={newLink}
                  onChange={e => setNewLink(e.target.value)}
                  placeholder="Attach Google Doc / Loom / Figma link..."
                  className="w-56 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-900 outline-none focus:border-blue-600 focus:bg-white"
                />
                <select 
                  value={newAssignee} 
                  onChange={e => setNewAssignee(e.target.value)}
                  className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-bold text-slate-700 outline-none"
                >
                  <option value="">— Assign to Team Member —</option>
                  {team.map(m => <option key={m.id} value={m.name}>{m.label}</option>)}
                </select>
                <input 
                  type="date"
                  value={newDue}
                  onChange={e => setNewDue(e.target.value)}
                  className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-bold text-slate-700 outline-none"
                />
                <button type="submit" className="rounded-xl bg-slate-950 text-white px-4 py-2 text-xs font-black hover:bg-slate-800 transition shadow-xs">
                  ⚡ Delegate Task
                </button>
              </form>
            </div>
          )}

          {/* Status Filter Tabs */}
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-1.5">
              <button
                onClick={() => setStatusFilter("ALL")}
                className={`rounded-xl px-3 py-1.5 text-xs font-bold transition border ${
                  statusFilter === "ALL" ? "bg-slate-950 text-white border-slate-950" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"
                }`}
              >
                All ({activeList.length})
              </button>
              {Object.entries(TASK_STATUS_CONFIG).map(([stKey, stVal]) => {
                const count = activeList.filter(t => (t.status || "pending") === stKey).length;
                return (
                  <button
                    key={stKey}
                    onClick={() => setStatusFilter(stKey)}
                    className={`rounded-xl px-3 py-1.5 text-xs font-bold transition border flex items-center gap-1 ${
                      statusFilter === stKey ? "bg-slate-950 text-white border-slate-950" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"
                    }`}
                  >
                    <span>{stVal.icon}</span>
                    <span>{stVal.label}</span>
                    <span className="text-[10px] opacity-75">({count})</span>
                  </button>
                );
              })}
            </div>
            <span className="text-xs text-slate-500 font-medium">Click any task to view full notes &amp; attachments</span>
          </div>

          {/* Task Cards List */}
          {filteredList.length === 0 && (
            <div className="rounded-3xl border border-dashed border-slate-200 bg-white p-12 text-center space-y-2">
              <span className="text-3xl block">🎉</span>
              <h3 className="text-sm font-bold text-slate-800">No tasks in this view right now</h3>
              <p className="text-xs text-slate-500">Assign a new task using the bar above or adjust your filters.</p>
            </div>
          )}

          <div className="grid grid-cols-1 gap-3">
            {filteredList.map(task => {
              const cfg = TASK_STATUS_CONFIG[task.status] || TASK_STATUS_CONFIG.pending;
              const updates = Array.isArray(task.updates) ? task.updates : [];
              const latestNote = updates.length > 0 ? updates[updates.length - 1] : null;

              return (
                <div
                  key={task.id}
                  onClick={() => onOpenTask && onOpenTask(task)}
                  className="rounded-3xl border border-slate-200 bg-white p-4 sm:p-5 shadow-2xs hover:shadow-md hover:border-amber-300 transition cursor-pointer space-y-3"
                >
                  <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="min-w-0 flex-1 space-y-1.5">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className={`inline-flex items-center gap-1 rounded-full border px-2.5 py-0.5 text-xs font-black ${cfg.badge}`}>
                          <span>{cfg.icon}</span>
                          <span>{cfg.label}</span>
                        </span>
                        {task.department && (
                          <span className="rounded-full bg-blue-50 px-2 py-0.5 text-[10px] font-black text-blue-700 border border-blue-100">
                            📁 {task.department}
                          </span>
                        )}
                        <h3 className="text-sm sm:text-base font-extrabold text-slate-950 break-words">{task.title}</h3>
                        {task.link && (
                          <a
                            href={task.link}
                            target="_blank"
                            rel="noopener noreferrer"
                            onClick={e => e.stopPropagation()}
                            className="inline-flex items-center gap-1 rounded bg-blue-50 px-2 py-0.5 text-[11px] font-bold text-blue-700 hover:bg-blue-100 transition shadow-2xs"
                          >
                            <span>🔗 Doc Link ↗</span>
                          </a>
                        )}
                      </div>

                      <div className="flex flex-wrap items-center gap-3 text-xs text-slate-500">
                        <span>👤 Assignee: <strong className="text-slate-800">{task.assignee_name || task.assignee_email || "Team"}</strong></span>
                        {task.delegator_name && (
                          <span>· Delegated by: <strong className="text-slate-800">{task.delegator_name}</strong></span>
                        )}
                        {task.due_date && (
                          <span className={task.due_date < today && task.status !== "completed" ? "text-rose-600 font-bold" : ""}>
                            · 📅 Due: {task.due_date}
                          </span>
                        )}
                      </div>
                    </div>

                    {/* Quick Actions Strip */}
                    <div className="flex items-center gap-2" onClick={e => e.stopPropagation()}>
                      <button
                        onClick={() => onOpenTask && onOpenTask(task)}
                        className="rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 px-3 py-1.5 text-xs font-bold transition shadow-2xs flex items-center gap-1"
                      >
                        <span>💬</span>
                        <span>Notes ({updates.length})</span>
                      </button>

                      {subTab === "delegated" && task.assignee_email && (
                        <button
                          onClick={() => handleNotifyAgain(task)}
                          title="Resend email reminder"
                          className="rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 px-2.5 py-1.5 text-xs font-bold transition shadow-2xs"
                        >
                          ✉️ Remind
                        </button>
                      )}

                      <select
                        value={task.status || "pending"}
                        onChange={e => handleStatusChange(task.id, e.target.value)}
                        className="rounded-xl border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-bold text-slate-800 outline-none"
                      >
                        {Object.entries(TASK_STATUS_CONFIG).map(([k, v]) => (
                          <option key={k} value={k}>{v.icon} {v.label}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* Latest Note Snippet */}
                  {latestNote && (
                    <div className="rounded-2xl border border-slate-100 bg-slate-50/80 p-2.5 text-xs text-slate-700 flex items-center justify-between">
                      <div className="flex items-center gap-2 truncate">
                        <span className="font-extrabold text-slate-900">{latestNote.author_name}:</span>
                        <span className="truncate italic font-medium">"{latestNote.text}"</span>
                      </div>
                      <span className="text-[10px] text-slate-400 font-bold shrink-0 ml-2">
                        {latestNote.created_at ? new Date(latestNote.created_at).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : ""}
                      </span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* SubTab 3: Today's Live Standups of All Employees */}
      {subTab === "standups" && (
        <div className="space-y-4">
          <div className="rounded-2xl border border-amber-200 bg-amber-50/60 p-4 text-xs text-amber-900 font-medium">
            💡 Live view of what your team members have committed as their <b>Top 3 Deliverables for today</b>, linked to their assigned KRAs.
          </div>

          {filteredTeamMembers.length === 0 && (
            <div className="rounded-3xl border border-dashed border-slate-200 bg-white p-8 text-center space-y-2">
              <span className="text-3xl block">👥</span>
              <h4 className="text-sm font-bold text-slate-800">No team members found for this view</h4>
              <p className="text-xs text-slate-500">Adjust the department filter or invite team members in Settings &gt; Team.</p>
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {filteredTeamMembers.map(m => {
              const memberPlan = (planners.find(p => p.userId === m.user_id) || {}).plan || {};
              const memberStandup = memberPlan.standups?.[today] || {};
              const p1 = memberStandup.p1;
              const p2 = memberStandup.p2;
              const p3 = memberStandup.p3;
              const hasP = p1?.text || p2?.text || p3?.text;
              const completedCount = [p1, p2, p3].filter(p => p?.text && p.done).length;
              const totalCount = [p1, p2, p3].filter(p => p?.text).length;

              return (
                <div key={m.id} className="rounded-3xl border border-slate-200 bg-white p-5 shadow-xs space-y-3">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div>
                      <h4 className="text-sm font-black text-slate-900">{m.name || m.email}</h4>
                      <div className="flex items-center gap-1.5 mt-0.5">
                        <span className="text-[11px] font-bold text-slate-400">{ROLE_LABEL[m.role] || m.role}</span>
                        <span className="rounded-full bg-blue-50 px-2 py-0.2 text-[9px] font-black text-blue-700 border border-blue-100">

const pad2 = (n) => String(n).padStart(2,"0");
const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayKey = (tz = "Asia/Kolkata") => {
  try {
    const formatter = new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" });
    return formatter.format(new Date());
  } catch (e) {
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  }
};
const shiftDay = (k,n)=>{const d=new Date(k+"T00:00:00");d.setDate(d.getDate()+n);return dateKey(d);};
const prettyDate = (k)=>new Date(k+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
const PMARKS=[{v:"",label:"○",cls:"text-slate-400"},{v:"done",label:"✓",cls:"text-emerald-600"},{v:"moved",label:"→",cls:"text-amber-600"},{v:"delegated",label:"o",cls:"text-sky-600"},{v:"dropped",label:"✗",cls:"text-rose-500"}];

const isHolidayItem = (item) => {
  if (!item) return false;
  if (item.tag === "Holiday" || item.category === "Holiday") return true;
  if (item.taskType === "HOLIDAY") return true;
  const t = (typeof item.text === "string" ? item.text : typeof item.item === "string" ? item.item : "").toLowerCase();
  if (!t) return false;
  if (t.includes("national holiday") || t.includes("festival") || t.includes("gazetted holiday") || t.includes("public holiday")) return true;
  if (t.includes("republic day") || t.includes("independence day") || t.includes("gandhi jayanti")) return true;
  if (t.includes("shivratri") || t.includes("holi") || t.includes("eid") || t.includes("mahavir jayanti") || t.includes("good friday") || t.includes("buddha purnima") || t.includes("bakrid") || t.includes("muharram") || t.includes("janmashtami") || t.includes("milad") || t.includes("dussehra") || t.includes("vijayadashami") || t.includes("diwali") || t.includes("deepawali") || t.includes("govardhan") || t.includes("bhai dooj") || t.includes("guru nanak") || t.includes("christmas") || t.includes("new year's day")) return true;
  return false;
};

const getHolidayForDate = (dateStr, data) => {
  if (!dateStr) return null;
  const custom = (data?.holidays || []).find(h => (h.due === dateStr || h.date === dateStr));
  if (custom) return custom;
  const cat = INDIAN_HOLIDAYS_CATALOG.find(h => h.due === dateStr);
  return cat || null;
};

const dueStatus = (dateStr, tz = "Asia/Kolkata") => {
  if (!dateStr) return null;
  const t = todayKey(tz);
  if (dateStr < t) return "overdue";
  if (dateStr === t) return "today";
  return null;
};
const collectDueItems = (data) => {
  const overdue=[], today=[];
  const tz = data?.settings?.timezone || "Asia/Kolkata";
  const check=(it)=>{
    if (!it || isHolidayItem(it)) return; // Holidays are NEVER due tasks
    const text = it.item || it.text;
    const due = it.due;
    if (!due) return;
    const s = dueStatus(due, tz);
    if (s === "overdue") overdue.push(text);
    else if (s === "today") today.push(text);
  };
  (data.captures||[]).filter(c=>c.status!=="Transferred"&&c.status!=="Done").forEach(check);
  (data.dailyBackup||[]).filter(b=>!b.done).forEach(check);
  (data.weeklySomeday||[]).filter(b=>!b.done).forEach(check);
  (data.monthlyTray||[]).filter(b=>!b.done).forEach(check);
  return { overdue, today };
};
// Every item with a due date, indexed by that exact "YYYY-MM-DD" — shared by
// Daily/Weekly/Monthly so a due date set anywhere in Capture shows up
// everywhere, without ever writing into the freeform editable text cells.
// Full item identity (id/source/done), not just display text — so anywhere this
// is rendered (Daily/Weekly panels, the Daily slot chart) can edit or mark the
// underlying item done in place, not just show a read-only string.
const dueItemsByDate = (data) => {
  const map = {};
  const push=(dateStr,entry)=>{ 
    if(!dateStr || isHolidayItem(entry)) return; 
    if(!map[dateStr]) map[dateStr]=[]; 
    map[dateStr].push(entry); 
  };
  (data.captures||[]).filter(c=>c.status!=="Transferred"&&c.status!=="Done"&&!isHolidayItem(c)).forEach(c=>push(c.due,{id:c.id,text:c.item,tag:c.category,time:c.time,source:"captures"}));
  (data.dailyBackup||[]).filter(b=>!isHolidayItem(b)).forEach(b=>push(b.due,{id:b.id,text:b.text,tag:b.tag,taskType:b.taskType,due:b.due,time:b.time,assignee:b.assignee,done:!!b.done,source:"dailyBackup"}));
  (data.weeklySomeday||[]).filter(b=>!isHolidayItem(b)).forEach(b=>push(b.due,{id:b.id,text:b.text,tag:b.tag,taskType:b.taskType,due:b.due,time:b.time,assignee:b.assignee,done:!!b.done,source:"weeklySomeday"}));
  (data.monthlyTray||[]).filter(b=>!isHolidayItem(b)).forEach(b=>push(b.due,{id:b.id,text:b.text,tag:b.tag,taskType:b.taskType,due:b.due,time:b.time,assignee:b.assignee,done:!!b.done,source:"monthlyTray"}));
  Object.values(map).forEach(list=>list.sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")));
  return map;
};

const DOW_KEYS = ["sun","mon","tue","wed","thu","fri","sat"]; // Date#getDay() index
const dayOfWeekKey = (dateStr) => DOW_KEYS[new Date(dateStr+"T00:00:00").getDay()];
// DAILY_SLOTS/WEEK_SLOTS are hourly ranges starting 7 AM, so an item's HH:MM
// maps to slot index (hour - 7); anything outside 7 AM–the last slot has no match.
const slotIndexForTime = (time, slotCount) => {
  if (!time) return -1;
  const hour = parseInt(time.split(":")[0], 10);
  if (isNaN(hour)) return -1;
  const idx = hour - 7;
  return (idx >= 0 && idx < slotCount) ? idx : -1;
};
// Per-hour-slot items for one calendar day: that day's due items, DAILY routine
// items (every day), WEEKLY-recurring items whose day-of-week matches, and
// MONTHLY-recurring items whose day-of-month matches — each at their own time.
const dailySlotItems = (data, dateStr, dueMap) => {
  const slots = DAILY_SLOTS.map(()=>[]);
  const place=(entry)=>{ const idx=slotIndexForTime(entry.time, slots.length); if(idx>=0) slots[idx].push(entry); };
  // Items with an exact due date match carry full id/source/done, so the Daily
  // slot chart can edit or mark them done in place, not just display them.
  (dueMap[dateStr]||[]).forEach(place);
  data.dailyBackup.filter(b=>b.taskType==="DAILY"&&b.time).forEach(b=>place({text:b.text,tag:b.tag,time:b.time}));
  const dow = dayOfWeekKey(dateStr);
  data.weeklySomeday.filter(b=>b.taskType==="WEEKLY"&&b.due&&dayOfWeekKey(b.due)===dow).forEach(b=>place({text:b.text,tag:b.tag,time:b.time}));
  const dom = parseInt(dateStr.slice(8,10),10);
  (data.recurringMonthly||[]).filter(r=>r.day===dom).forEach(r=>place({text:r.text,tag:r.tag,time:r.time}));
  return slots;
};
// Same idea across a whole Mon–Sun week, keyed by "slotIdx|dayKey" for the grid.
const weeklySlotItems = (data, wk, dueMap) => {
  const map = {};
  const add = (slotIdx, dayKey, text, tag, id, source, done, time) => {
    if (slotIdx < 0) return;
    const k = `${slotIdx}|${dayKey}`;
    if (!map[k]) map[k] = [];
    map[k].push({ text, tag, id, source, done, time });
  };
  DAY_KEYS.forEach((dayKey, i) => {
    const dateStr = shiftDay(wk, i);
    const dow = dayOfWeekKey(dateStr);
    const dom = parseInt(dateStr.slice(8, 10), 10);
    
    // 1. Items due on this date with time
    (dueMap[dateStr] || []).forEach(it => add(slotIndexForTime(it.time, WEEK_SLOTS.length), dayKey, it.text, it.tag, it.id, it.source, it.done, it.time));
    
    // 2. Daily routine habits with time
    data.dailyBackup.filter(b => b.taskType === "DAILY" && b.time && !isHolidayItem(b)).forEach(b => add(slotIndexForTime(b.time, WEEK_SLOTS.length), dayKey, b.text, b.tag, b.id, "dailyBackup", false, b.time));
    
    // 3. Weekly recurring items matching day of week with time
    data.weeklySomeday.filter(b => b.taskType === "WEEKLY" && b.due && dayOfWeekKey(b.due) === dow && b.time).forEach(b => add(slotIndexForTime(b.time, WEEK_SLOTS.length), dayKey, b.text, b.tag, b.id, "weeklySomeday", false, b.time));
    
    // 4. Monthly recurring items matching day of month with time
    (data.recurringMonthly || []).filter(r => r.day === dom && r.time).forEach(r => add(slotIndexForTime(r.time, WEEK_SLOTS.length), dayKey, r.text, r.tag, r.id, "recurringMonthly", false, r.time));

    // 5. Daily cockpit scheduled focus blocks for this date
    const dailyBlocks = data.daily?.[dateStr]?.blocks || {};
    WEEK_SLOTS.forEach((s, sIdx) => {
      if (dailyBlocks[s] && dailyBlocks[s].trim()) {
        add(sIdx, dayKey, dailyBlocks[s], "Focus Block", `daily-block-${dateStr}-${sIdx}`, "dailyBlock", false, "");
      }
    });
  });
  return map;
};
// Which live array a due-map entry's `source` points at, and how to edit or
// remove it there. Shared by Daily/Weekly so both can make an overdue or
// due-today item actionable in place, not just print its name.
const SOURCE_ARRAY = { dailyBackup:"dailyBackup", weeklySomeday:"weeklySomeday", monthlyTray:"monthlyTray" };
const updateSourceItem = (patch, source, id, field, value) => {
  const arr = SOURCE_ARRAY[source]; if (!arr) return;
  patch(d => { const item = d[arr].find(x=>x.id===id); if (item) item[field]=value; });
};
const removeSourceItem = (patch, source, id) => {
  const arr = SOURCE_ARRAY[source]; if (!arr) return;
  if (!confirm("Delete this item? This can't be undone.")) return;
  patch(d => { d[arr] = d[arr].filter(x=>x.id!==id); });
};

// Every NOT-DONE item whose due date has already passed, across every source,
// with full identity (id/source/tag/time) so it's as actionable as "Due
// today" — not a dead-end list of names. Once marked done it drops out, same
// as the top summary banner: a finished task isn't overdue anymore.
const overdueEntries = (data) => {
  const map = dueItemsByDate(data);
  const t = todayKey(data?.settings?.timezone || "Asia/Kolkata");
  const out = [];
  Object.keys(map).filter(k=>k<t).sort().forEach(k => {
    map[k].forEach(it => { if (!it.done && !isHolidayItem(it)) out.push({ ...it, due:k }); });
  });
  return out;
};

// Shared render for an Overdue / Due-today chip list — click to toggle done
// when the item traces back to a live array, read-only badge otherwise (e.g.
// a capture still sitting in the inbox, which has no done flag of its own).
function DueChips({ items, patch, tone="rose", stack=false }){
  const dateCls = tone==="rose" ? "text-rose-500" : "text-sky-600";
  const openCls = tone==="rose" ? "border-rose-200 bg-white text-slate-700" : "border-sky-200 bg-white text-slate-700";
  return (
    <div className={stack ? "flex flex-col items-start gap-1" : "flex flex-wrap gap-2"}>
      {items.map((it,idx)=>{
        const toggleable = it.source && SOURCE_ARRAY[it.source];
        const Tag = toggleable ? "button" : "span";
        return (
          <Tag key={it.id||idx}
            onClick={toggleable ? ()=>updateSourceItem(patch, it.source, it.id, "done", !it.done) : undefined}
            title={toggleable ? (it.done?"Mark not done":"Mark done") : undefined}
            className={"rounded-full border px-3 py-1 text-xs "+(stack?"block max-w-full truncate text-left ":"")+(it.done
              ? "border-emerald-200 bg-emerald-50 text-emerald-700 line-through"
              : openCls)}>
            {it.due && tone==="rose" && <span className={"mono "+dateCls}>{it.due}{it.time?` ${it.time}`:""} · </span>}
            {it.time && tone!=="rose" && <span className={"mono "+dateCls}>{it.time} · </span>}
            {it.text}
            {it.tag && <span className="ml-1 text-slate-400">({it.tag})</span>}
          </Tag>
        );
      })}
    </div>
  );
}

function OverduePanel({ data, patch }){
  const items = overdueEntries(data);
  if (items.length===0) return null;
  return (
    <div className="mb-4 rounded-lg border border-rose-200 bg-rose-50 p-3">
      <div className="mb-1 text-xs font-semibold uppercase tracking-wide text-rose-700">⚠ Overdue ({items.length})</div>
      <DueChips items={items} patch={patch} />
    </div>
  );
}

function DueBanner({ data }){
  const { overdue, today } = collectDueItems(data);
  if (overdue.length===0 && today.length===0) return null;
  return (
    <div className="mb-4 rounded-lg border border-rose-200 bg-rose-50 px-4 py-2 text-sm text-rose-700">
      {overdue.length>0 && <div><strong>⚠ {overdue.length} overdue:</strong> {overdue.join(", ")}</div>}
      {today.length>0 && <div><strong>📅 {today.length} due today:</strong> {today.join(", ")}</div>}
    </div>
  );
}

  const [myGoals, setMyGoals] = useState(null);
  const [copiedStandup, setCopiedStandup] = useState(false);
  const [notice, setNotice] = useState("");
  const [taskViewFilter, setTaskViewFilter] = useState("open"); // "open" | "completed"

  const say = (t) => { setNotice(t); setTimeout(() => setNotice(""), 4000); };

  const refreshMyGoals = () => {
    loadGoals(meId, [monthPeriod()]).then(setMyGoals).catch(() => setMyGoals({ kras:[], kpis:[], values:[], dailyLogs:[] }));
  };

  useEffect(() => {
    refreshMyGoals();
  }, [meId]);

  // Standup state for today
  const standup = data.standups?.[today] || {
    p1: { text: "", kra: "", done: false },
    p2: { text: "", kra: "", done: false },
    p3: { text: "", kra: "", done: false },
    blocker: "",
    submittedAt: null
  };

  const updateStandup = (fn) => {
    patch(d => {
      d.standups = d.standups || {};
      const cur = d.standups[today] || {
        p1: { text: "", kra: "", done: false },
        p2: { text: "", kra: "", done: false },
        p3: { text: "", kra: "", done: false },
        blocker: "",
        submittedAt: null
      };
      fn(cur);
      cur.submittedAt = new Date().toISOString();
      d.standups[today] = cur;
    });
  };

  // Load active KRAs
  useEffect(() => {
    if (orgCtx?.org?.id) {
      loadKpis(orgCtx.org.id)
        .then(res => setKpis(res || []))
        .catch(() => setKpis([]));
    }
  }, [orgCtx?.org?.id]);

  const myName = orgCtx?.profile?.full_name || orgCtx?.profile?.email || "Me";
  const myEmail = (orgCtx?.profile?.email || "").toLowerCase();
  const myRole = orgCtx?.membership?.role || "Team Member";

  // Filter tasks assigned to this member from the database
  const myAssignedDbTasks = dbTasks.filter(t => 
    (
      (t.assignee_email && t.assignee_email.toLowerCase() === myEmail) ||
      (t.assignee_name && myName && t.assignee_name.toLowerCase().includes(myName.toLowerCase())) ||
      (t.assignee_id && t.assignee_id === meId)
    )
  );

  const openDbTasks = myAssignedDbTasks.filter(t => t.status !== "completed");
  const completedDbTasks = myAssignedDbTasks.filter(t => t.status === "completed");

  const handleAddCustomTask = async (e) => {
    e.preventDefault();
    if (!newCustomTask.trim()) return;

    if (orgCtx?.org?.id) {
      const created = await createDelegatedTask(
        orgCtx.org.id, 
        meId, 
        {
          assignee_id: meId,
          assignee_email: myEmail,
          assignee_name: myName,
          title: newCustomTask.trim(),
          due_date: today,
          status: "pending"
        },
        myName,
        myEmail
      );
      if (created && setDbTasks) {
        setDbTasks(prev => [created, ...prev]);
      }
      setNewCustomTask("");
      say("✓ Task added to your live focus queue!");
      return;
    }

    patch(d => {
      d.delegatedTasks = d.delegatedTasks || [];
      d.delegatedTasks.unshift({
        id: "dt_" + Date.now(),
        title: newCustomTask.trim(),
        delegatedBy: "Self / Leadership",

    const updated = await addDelegatedTaskUpdate(taskId, `Status changed to ${TASK_STATUS_CONFIG[newStatus]?.label || newStatus}`, myName, myEmail, newStatus);
    if (updated && setDbTasks) {
      setDbTasks(prev => prev.map(t => t.id === taskId ? updated : t));

function generateDayIcs(data, dk) {
  const day = data.daily?.[dk] || {};
  const [yr, mo, dy] = dk.split("-").map(Number);
  const pad = (n) => String(n).padStart(2, "0");
  const events = [];

  // 1. One Main Outcome
  if (day.outcome) {
    const startStr = `${yr}${pad(mo)}${pad(dy)}T090000`;
    const endStr = `${yr}${pad(mo)}${pad(dy)}T100000`;
    events.push([
      "BEGIN:VEVENT",
      `UID:fd-outcome-${dk}-${Date.now()}@flowdirector.co`,
      `DTSTAMP:${startStr}Z`,
      `DTSTART:${startStr}`,
      `DTEND:${endStr}`,
      `SUMMARY:★ MAIN OUTCOME: ${day.outcome}`,
      `DESCRIPTION:FlowDirector One Main Outcome for today.\\nStatus: ${day.marks?.[0] || "Planned"}`,
      "STATUS:CONFIRMED",
      "BEGIN:VALARM",
      "TRIGGER:-PT15M",
      "ACTION:DISPLAY",
      "DESCRIPTION:Reminder: Time to execute your Main Outcome (FlowDirector)",
      "END:VALARM",
      "END:VEVENT"
    ].join("\r\n"));
  }

  // 2. Top 3 Priorities
  (day.priorities || []).forEach((p, idx) => {
    if (!p) return;
    const startHour = 10 + idx;
    const startStr = `${yr}${pad(mo)}${pad(dy)}T${pad(startHour)}0000`;
    const endStr = `${yr}${pad(mo)}${pad(dy)}T${pad(startHour + 1)}0000`;
    events.push([
      "BEGIN:VEVENT",
      `UID:fd-prio-${dk}-${idx}-${Date.now()}@flowdirector.co`,
      `DTSTAMP:${startStr}Z`,
      `DTSTART:${startStr}`,
      `DTEND:${endStr}`,
      `SUMMARY:Priority ${idx + 1}: ${p}`,
      `DESCRIPTION:Daily Priority ${idx + 1} from FlowDirector.\\nMark: ${day.marks?.[idx] || "Planned"}`,
      "STATUS:CONFIRMED",
      "BEGIN:VALARM",
      "TRIGGER:-PT10M",
      "ACTION:DISPLAY",
      `DESCRIPTION:Upcoming: Priority ${idx + 1} - ${p}`,
      "END:VALARM",
      "END:VEVENT"
    ].join("\r\n"));
  });

  // 3. Hourly Blocks
  Object.entries(day.blocks || {}).forEach(([slotTime, text]) => {
    if (!text) return;
    const match = slotTime.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
    let h = match ? parseInt(match[1], 10) : 9;
    const m = match ? parseInt(match[2], 10) : 0;
    const ampm = match && match[3] ? match[3].toUpperCase() : "";
    if (ampm === "PM" && h < 12) h += 12;
    if (ampm === "AM" && h === 12) h = 0;

    const startStr = `${yr}${pad(mo)}${pad(dy)}T${pad(h)}${pad(m)}00`;
    const endStr = `${yr}${pad(mo)}${pad(dy)}T${pad((h + 1) % 24)}${pad(m)}00`;

    events.push([
      "BEGIN:VEVENT",
      `UID:fd-block-${dk}-${h}-${m}@flowdirector.co`,
      `DTSTAMP:${startStr}Z`,
      `DTSTART:${startStr}`,
      `DTEND:${endStr}`,
      `SUMMARY:Focus: ${text}`,
      `DESCRIPTION:Scheduled Time Block in FlowDirector`,
      "STATUS:CONFIRMED",
      "END:VEVENT"
    ].join("\r\n"));
  });

  // 4. Monthly Fixed Commitments & Buffer Day for today
  const mk = `${yr}-${pad(mo)}`;
  const monthObj = data.monthly?.[mk] || {};
  const monthlyText = monthObj.days?.[dy] || monthObj.days?.[String(dy)];
  if (monthlyText && String(monthlyText).trim()) {
    const startStr = `${yr}${pad(mo)}${pad(dy)}T093000`;
    const endStr = `${yr}${pad(mo)}${pad(dy)}T103000`;
    events.push([
      "BEGIN:VEVENT",
      `UID:fd-monthly-${dk}-${Date.now()}@flowdirector.co`,
      `DTSTAMP:${startStr}Z`,
      `DTSTART:${startStr}`,
      `DTEND:${endStr}`,
      `SUMMARY:📅 MONTHLY COMMITMENT: ${monthlyText}`,
      `DESCRIPTION:Monthly Fixed Commitment in FlowDirector`,
      "STATUS:CONFIRMED",
      "END:VEVENT"
    ].join("\r\n"));
  }

  if ((monthObj.buffers || []).includes(dy)) {
    const startStr = `${yr}${pad(mo)}${pad(dy)}T080000`;
    const endStr = `${yr}${pad(mo)}${pad(dy)}T180000`;
    events.push([
      "BEGIN:VEVENT",
      `UID:fd-buffer-${dk}-${Date.now()}@flowdirector.co`,
      `DTSTAMP:${startStr}Z`,
      `DTSTART:${startStr}`,
      `DTEND:${endStr}`,
      `SUMMARY:⭐ BUFFER DAY (Protected Zero-Meeting Focus)`,
      `DESCRIPTION:Reserved Buffer Day in FlowDirector`,
      "STATUS:CONFIRMED",
      "END:VEVENT"
    ].join("\r\n"));
  }

  // 5. Recurring Monthly items for today's day of month
  (data.recurringMonthly || []).filter(r => r.day === dy).forEach((r, idx) => {
    const timeStr = r.time || "10:00";
    const [hStr, mStr] = timeStr.split(":");
    const h = Number(hStr) || 10;
    const m = Number(mStr) || 0;
    const startStr = `${yr}${pad(mo)}${pad(dy)}T${pad(h)}${pad(m)}00`;
    const endStr = `${yr}${pad(mo)}${pad(dy)}T${pad(h + 1)}${pad(m)}00`;
    events.push([
      "BEGIN:VEVENT",
      `UID:fd-rec-day-${dk}-${idx}-${Date.now()}@flowdirector.co`,
      `DTSTAMP:${startStr}Z`,
      `DTSTART:${startStr}`,
      `DTEND:${endStr}`,
      `SUMMARY:🔁 ${r.tag ? `[${r.tag}] ` : ""}${r.text}`,
      `DESCRIPTION:Monthly Recurring Task in FlowDirector`,
      "STATUS:CONFIRMED",
      "END:VEVENT"
    ].join("\r\n"));
  });

  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//FlowDirector//Executive Cockpit Focus Blocks//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    ...events,
    "END:VCALENDAR"
  ].join("\r\n");
}

const mondayOf=(k)=>{const d=new Date(k+"T00:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return dateKey(d);};

const THEME_PRESETS = [
  "🎯 Deep Tech & Product",
  "👥 Team & Operations",
  "💼 Sales & Client Success",
  "📈 Finance & Strategy",
  "🌱 Review & Delegation",
  "🧹 Catch-up & Buffer"
];

const getBlockCategoryStyle = (text) => {
  const t = (text || "").toLowerCase();
  if (/meet|call|sync|1:1|standup|client|customer|interview|demo|zoom|google meet/i.test(t)) {
    return { bg: "bg-blue-50/90", border: "border-blue-300", text: "text-blue-950", tag: "👥 Meeting", badge: "bg-blue-100 text-blue-800" };
  }
  if (/tax|gst|tds|sales|revenue|invoice|finance|audit|books|cash|growth|accounting/i.test(t)) {
    return { bg: "bg-emerald-50/90", border: "border-emerald-300", text: "text-emerald-950", tag: "📈 Finance/Growth", badge: "bg-emerald-100 text-emerald-800" };
  }
  if (/family|workout|gym|run|dinner|lunch|personal|health|rest|meditat/i.test(t)) {
    return { bg: "bg-purple-50/90", border: "border-purple-300", text: "text-purple-950", tag: "💜 Personal", badge: "bg-purple-100 text-purple-800" };
  }
  if (/email|inbox|admin|doc|ops|setup|clean|organize|system|hiring/i.test(t)) {
    return { bg: "bg-slate-100/90", border: "border-slate-300", text: "text-slate-900", tag: "📋 Admin/Ops", badge: "bg-slate-200 text-slate-700" };
  }
  return { bg: "bg-amber-50/90", border: "border-amber-300", text: "text-amber-950", tag: "🎯 Deep Focus", badge: "bg-amber-100 text-amber-800" };
};

function WeeklyView({ data, patch, orgCtx }){
  const [wk, setWk] = useState(mondayOf(todayKey()));
  const [viewMode, setViewMode] = useState("5day");
  const [selectedMobileDay, setSelectedMobileDay] = useState(dayOfWeekKey(todayKey()) || "mon");
  const [editingSlot, setEditingSlot] = useState(null);
  const [showThemePicker, setShowThemePicker] = useState(null);
  const [showSomedayDrawer, setShowSomedayDrawer] = useState(true);

  const blankWeek = () => ({ grid: {}, nonneg: { focus: false, review: false, family: false }, somedayDone: {} });
  const week = data.weekly[wk] || blankWeek();
  const upd = (fn) => patch(d => { if (!d.weekly[wk]) d.weekly[wk] = blankWeek(); fn(d.weekly[wk]); });
  const setTheme = (day, v) => patch(d => { d.dayThemes[day] = v; });
  const removeSomeday = (id) => { if (!confirm("Delete this item? This can't be undone.")) return; patch(d => { d.weeklySomeday = d.weeklySomeday.filter(b => b.id !== id); }); };
  const toggleSomedayDone = (id) => upd(x => { if (!x.somedayDone) x.somedayDone = {}; x.somedayDone[id] = !x.somedayDone[id]; });
  const updateSomedayField = (id, field, value) => patch(d => { const b = d.weeklySomeday.find(x => x.id === id); if (b) b[field] = value; });
  
  const recurringWeekly = data.weeklySomeday.filter(b => b.taskType === "WEEKLY");
  const otherSomeday = data.weeklySomeday.filter(b => b.taskType !== "WEEKLY");
  
  const weekLabel = () => {
    const s = new Date(wk + "T00:00:00");
    const e = new Date(wk + "T00:00:00");
    e.setDate(e.getDate() + (viewMode === "5day" ? 4 : 6));
    const f = x => x.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
    return `${f(s)} – ${f(e)}`;
  };

  const activeDayKeys = viewMode === "5day" ? DAY_KEYS.slice(0, 5) : DAY_KEYS;
  const dueMap = dueItemsByDate(data);
  const dueByDay = activeDayKeys.map((dayKey, i) => ({ dayKey, date: shiftDay(wk, i), items: dueMap[shiftDay(wk, i)] || [] }));
  const hasWeekDue = dueByDay.some(d => d.items.length > 0);
  const slotMap = weeklySlotItems(data, wk, dueMap);

  const plannedBlockCount = Object.keys(week.grid || {}).filter(k => week.grid[k] && week.grid[k].trim()).length;

  const copyLastWeek = () => {
    const prevWk = shiftDay(wk, -7);
    const prevGrid = data.weekly[prevWk]?.grid || {};
    const keys = Object.keys(prevGrid).filter(k => prevGrid[k] && prevGrid[k].trim());
    if (keys.length === 0) {
      alert("No scheduled blocks found in previous week to copy.");
      return;
    }
    if (!confirm(`Copy ${keys.length} focus blocks from last week into this week?`)) return;
    upd(x => {
      keys.forEach(k => {
        if (!x.grid[k]) x.grid[k] = prevGrid[k];
      });
    });
    alert(`✓ Copied ${keys.length} weekly focus blocks!`);
  };

  const pushToDaily = () => {
    let pushed = 0;
    patch(d => {
      d.daily = d.daily || {};
      activeDayKeys.forEach((dayKey, idx) => {
        const colDate = shiftDay(wk, idx);
        d.daily[colDate] = d.daily[colDate] || { outcome: "", priorities: ["","",""], marks: ["","",""], blocks: {}, actual: {}, closure: { score: 0, ate: "", family: "" }, routineDone: {} };
        WEEK_SLOTS.forEach(slot => {
          const val = week.grid[`${slot}|${dayKey}`];
          if (val && val.trim()) {
            d.daily[colDate].blocks[slot] = val;
            pushed++;
          }
        });
      });
    });
    alert(`✓ Synced ${pushed} focus blocks into your Daily Cockpits for this week!`);
  };

  return (
    <div className="space-y-4">
      {/* 1. Header Navigation & Control Center */}
      <div className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border-2 border-slate-200 bg-white p-3.5 shadow-xs">
        <div className="flex items-center gap-2">
          <button onClick={() => setWk(shiftDay(wk, -7))} className="rounded-xl border border-slate-200 bg-slate-50 px-2.5 py-1.5 text-slate-700 hover:bg-slate-100 transition shadow-2xs font-bold">
            <Ic n="left"/>
          </button>
          <div>
            <div className="font-black text-sm sm:text-base text-slate-950 flex items-center gap-2">
              <span>🗓️</span>
              <span>Week of {weekLabel()}</span>
            </div>
            {wk !== mondayOf(todayKey()) && (
              <button onClick={() => setWk(mondayOf(todayKey()))} className="text-xs font-black text-amber-600 hover:underline flex items-center gap-1">
                <span>⚡</span> jump to this week
              </button>
            )}
          </div>

}

    patch(d => {

      d.dailyBackup = (d.dailyBackup || []).filter(b => !isHolidayItem(b));

            id: hol.id,
            text: hol.text,

            text: item.text,
            tag: item.tag,
            time: ""

      TAX_COMPLIANCE_CATALOG.quarterlyAnnual.forEach(item => {

          d.dailyBackup.push({
            id: uid(),
            text: item.text,
            due: item.due,
            time: "",
            tag: item.tag,
            taskType: item.taskType,

          qaAdded++;

        {activeTab === "holidays" && (
