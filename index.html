// Everything the app needs to know about the signed-in user's company.
// Returns { membership, org, pendingInvites } — membership is null when solo.
async function loadOrgContext(userId, email){
  const { data: m, error: mErr } = await sb
    .from("memberships").select("*").eq("user_id", userId).maybeSingle();
  if (mErr) throw mErr;

  if (m) {
    const { data: org, error: oErr } = await sb
      .from("organizations").select("*").eq("id", m.org_id).maybeSingle();
    if (oErr) throw oErr;
    return { membership:m, org, pendingInvites:[] };
  }

  // No company yet — is somebody waiting for them to accept?
  const { data: invites } = await sb
    .from("invites").select("*").is("accepted_at", null);
  const mine = (invites||[]).filter(i => (i.email||"").toLowerCase() === (email||"").toLowerCase());
  if (mine.length) {
    const { data: orgs } = await sb
      .from("organizations").select("id,name").in("id", mine.map(i=>i.org_id));
    const withOrgNames = mine.map(i => ({ ...i, orgName:(orgs||[]).find(o=>o.id===i.org_id)?.name || "a company" }));
    return { membership:null, org:null, pendingInvites:withOrgNames };
  }

  // No membership and no pending invites — return null membership so user lands on OnboardingScreen
  return { membership: null, org: null, pendingInvites: [] };
}

async function createOrg(name, userId){
  const { data: org, error } = await sb
    .from("organizations").insert({ name, created_by:userId }).select().single();
  if (error) throw error;
  const { data: m, error: mErr } = await sb
    .from("memberships").insert({ org_id:org.id, user_id:userId, role:"owner" }).select().single();
  if (mErr) throw mErr;
  return { org, membership:m };
}

    org_id: invite.org_id, user_id: userId,
    role: invite.role, manager_id: invite.manager_id || null

  if (error) throw error;

  const { data: org } = await sb.from("organizations").select("*").eq("id", invite.org_id).maybeSingle();

/* ================================================================== */
/*  Goals layer — KRAs and KPIs (Phase 3)                              */
/*  KRA = a responsibility area. KPI = one number with a target,       */
/*  measured per period. Targets are set by management; the actual is  */
/*  reported by the person (or corrected by their manager).            */
/* ================================================================== */
const pad2n = (n) => String(n).padStart(2,"0");
const monthPeriod   = (d=new Date()) => `${d.getFullYear()}-${pad2n(d.getMonth()+1)}`;
const quarterPeriod = (d=new Date()) => `${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)+1}`;
const periodFor = (cadence, d=new Date()) => cadence==="quarterly" ? quarterPeriod(d) : monthPeriod(d);

const shiftPeriod = (period, n) => {
  const q = period.match(/^(\d{4})-Q([1-4])$/);
  if (q) {
    let y = +q[1], idx = +q[2] - 1 + n;
    y += Math.floor(idx/4); idx = ((idx%4)+4)%4;
    return `${y}-Q${idx+1}`;
  }
  const m = period.match(/^(\d{4})-(\d{2})$/);
  if (!m) return period;
  let y = +m[1], idx = +m[2] - 1 + n;
  y += Math.floor(idx/12); idx = ((idx%12)+12)%12;
  return `${y}-${pad2n(idx+1)}`;
};

const prettyPeriod = (period) => {
  const q = period.match(/^(\d{4})-Q([1-4])$/);
  if (q) return `Q${q[2]} ${q[1]}`;
  const m = period.match(/^(\d{4})-(\d{2})$/);
  return m ? `${MONTHS[+m[2]-1]} ${m[1]}` : period;
};

// How close is `actual` to `target`, as a percentage where 100 = on target.
// For 'down' KPIs (cost, delay) a smaller actual is better, so the ratio flips.
const kpiAttainment = (kpi, actual) => {
  if (actual === null || actual === undefined || actual === "") return null;
  const a = Number(actual), t = Number(kpi.target);
  if (isNaN(a)) return null;
  if (kpi.direction === "down") {
    if (a <= 0) return 200;                 // nothing at all beats any target
    return t <= 0 ? (a > 0 ? 0 : 100) : Math.round((t / a) * 100);
  }
  if (t <= 0) return a > 0 ? 200 : 100;
  return Math.round((a / t) * 100);
};

const kpiTone = (attain) =>
  attain === null ? "none" : attain >= 100 ? "green" : attain >= 80 ? "amber" : "red";

const TONE_CLS = {

      .in("kpi_id", kpis.map(k=>k.id)).in("period", periods);

  return { kras: kraRes.data || [], kpis, values };
}

async function loadBilling(orgId){

    sb.from("subscriptions").select("*").eq("org_id", orgId).maybeSingle(),
    sb.from("plans").select("*").order("sort_order"),

  return { sub: subRes.data || null, plans: planRes.data || [] };

// Seats in use = members + invites nobody has accepted yet, mirroring
// org_seats_used() in SQL so the UI and the trigger agree.
async function loadSeatUsage(orgId){
  const [m, i] = await Promise.all([
    sb.from("memberships").select("id").eq("org_id", orgId),
    sb.from("invites").select("id").eq("org_id", orgId).is("accepted_at", null),
  ]);
  return ((m.data||[]).length) + ((i.data||[]).length);
}

// A trial whose end date has passed counts as lapsed, mirroring org_seat_limit()
// in SQL. Paid plans are NOT expired by date here — same reasoning as the
// migration: a late webhook shouldn't downgrade someone who has paid.
const trialExpired = (sub) =>
  !!sub && sub.status === "trialing" && !!sub.current_period_end &&
  new Date(sub.current_period_end) < new Date();

const seatLimitOf = (sub, plans) => {
  if (!sub) return null;
  const plan = plans.find(p => p.code === sub.plan_code);
  const lapsed = !["active","trialing"].includes(sub.status) || trialExpired(sub);
  if (lapsed) { const free = plans.find(p => p.code === "free"); return free ? free.seat_limit : null; }
  return sub.seats != null ? sub.seats : (plan ? plan.seat_limit : null);
};

// The seat trigger raises "SEAT_LIMIT: ..." — turn that into something a
// person can act on rather than showing them a Postgres exception.
const isSeatLimitError = (msg) => /SEAT_LIMIT/i.test(msg || "");
const friendlyError = (msg) => isSeatLimitError(msg)
  ? "You've used every seat on your current plan. Free one up by removing a member or revoking an invite, or move to a bigger plan in Settings → Billing."
  : msg;

const PAYMENTS_ENABLED = true;

// Which payment provider can sell this plan. Razorpay first — the customers
// are in India — with Stripe as the fallback for when we sell abroad. A plan

const providerForPlan = (plan) =>

const CHECKOUT_FN = { razorpay: "razorpay-checkout", stripe: "stripe-checkout" };

async function startCheckout(planCode, provider){
  const fn = CHECKOUT_FN[provider];
  if (!fn) throw new Error("This plan isn't set up for online payment yet.");
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("Please sign in again.");
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${fn}`, {
    method: "POST",
    headers: { "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` },
    body: JSON.stringify({ plan_code: planCode }),
  });
  const body = await res.json().catch(()=>({}));
  if (!res.ok || !body.url) throw new Error(body.error || "Couldn't start checkout.");
  window.location.href = body.url;
}

/*  Platform admin — running the business, not using it.              */
/*  Every one of these calls is gated in Postgres by                  */
/*  is_platform_admin(). For a normal user they return nothing or     */
/*  touch zero rows; the UI check is only there to hide dead buttons. */
/* ================================================================== */
async function amPlatformAdmin(userId){
  // The policy on platform_admins lets a person see only their own row, so an
  // empty result genuinely means "not an admin" rather than "can't tell".
  const { data, error } = await sb.from("platform_admins").select("user_id").eq("user_id", userId).maybeSingle();
  if (error) return false;           // table missing = phase 5 not run = no admin
  return !!data;
}

async function loadAdminData(){
  const [orgs, subs, plans, members, profiles, requests] = await Promise.all([
    sb.from("organizations").select("id,name,created_at"),
    sb.from("subscriptions").select("*"),
    sb.from("plans").select("*").order("sort_order"),
    sb.from("memberships").select("id,org_id,user_id,role"),
    sb.from("profiles").select("id,email,full_name"),
    sb.from("plan_requests").select("*").order("created_at", { ascending: false }),
  ]);
  const firstError = [orgs,subs,plans,members,profiles,requests].find(r => r.error);
  if (firstError) throw firstError.error;

  const byId = {};
  (profiles.data||[]).forEach(p => { byId[p.id] = p; });
  const companies = (orgs.data||[]).map(o => {
    const mine = (members.data||[]).filter(m => m.org_id === o.id);
    const owner = mine.find(m => m.role === "owner");
    return {
      ...o,
      seats: mine.length,
      owner: owner ? (byId[owner.user_id] || {}) : {},
      sub: (subs.data||[]).find(s => s.org_id === o.id) || null,
    };
  }).sort((a,b) => (a.name||"").localeCompare(b.name||""));

  return { companies, plans: plans.data||[], requests: requests.data||[], profiles: profiles.data||[], members: members.data||[] };
}

async function adminDeleteCompany(orgId) {
  // 1. Delete secondary child tables first (invites, subscriptions, plan_requests)
  try { await sb.from("invites").delete().eq("org_id", orgId); } catch (_) {}
  try { await sb.from("subscriptions").delete().eq("org_id", orgId); } catch (_) {}
  try { await sb.from("plan_requests").delete().eq("org_id", orgId); } catch (_) {}

  // 2. Try RPC function
  const { error: rpcErr } = await sb.rpc("admin_delete_company", { target_org_id: orgId });
  if (!rpcErr) return;

  // 3. Try deleting organization directly (bypasses membership last-owner trigger)
  const { error: orgErr } = await sb.from("organizations").delete().eq("id", orgId);
  if (!orgErr) {
    try { await sb.from("memberships").delete().eq("org_id", orgId); } catch (_) {}
    return;
  }

  // 4. Fallback: Delete memberships then organization
  try { await sb.from("memberships").delete().eq("org_id", orgId); } catch (_) {}
  const { error: finalErr } = await sb.from("organizations").delete().eq("id", orgId);
  if (finalErr) throw finalErr;
}

async function adminDeleteUser(userId) {
  const { error: rpcErr } = await sb.rpc("admin_delete_user", { target_user_id: userId });
  if (!rpcErr) return;

  try { await sb.from("memberships").delete().eq("user_id", userId); } catch (_) {}
  try { await sb.from("planner_state").delete().eq("user_id", userId); } catch (_) {}
  const { error } = await sb.from("profiles").delete().eq("id", userId);
  if (error) throw error;
}

async function savePlan(row){
  const { error } = await sb.from("plans").upsert(row, { onConflict: "code" });
  if (error) throw error;
}

async function deletePlan(code){
  const { error } = await sb.from("plans").delete().eq("code", code);
  if (error) throw error;
}

// The one call that actually grants or removes seats. `until` is the trial end
// (or null); everything else is the plan the company lands on.
async function setSubscription(orgId, { plan_code, status, seats, until }){
  const { error } = await sb.from("subscriptions").upsert({
    org_id: orgId, plan_code, status,
    seats: seats === "" || seats == null ? null : Number(seats),
    current_period_end: until || null,
    provider: "razorpay",
    updated_at: new Date().toISOString(),
  }, { onConflict: "org_id" });
  if (error) throw error;
}

async function requestPlan(orgId, planCode, note, userId){
  const { error } = await sb.from("plan_requests").insert({
    org_id: orgId, plan_code: planCode, note: note || null, requested_by: userId,
  });
  if (error) throw error;
}

async function loadMyRequest(orgId){
  const { data } = await sb.from("plan_requests").select("*")
    .eq("org_id", orgId).eq("status", "pending").maybeSingle();
  return data || null;
}

async function withdrawRequest(id){
  const { error } = await sb.from("plan_requests").delete().eq("id", id);
  if (error) throw error;
}

async function decideRequest(id, status, adminId){
  const { error } = await sb.from("plan_requests")
    .update({ status, decided_by: adminId, decided_at: new Date().toISOString() })
    .eq("id", id);
  if (error) throw error;
}

// Everything I'm allowed to see, for the org-wide dashboard column.
async function loadAllVisibleKpis(periods){
  const { data: kpis, error } = await sb.from("kpis").select("*");
  if (error) throw error;
  let values = [];
  if ((kpis||[]).length) {
    const { data } = await sb.from("kpi_values").select("*")
      .in("kpi_id", kpis.map(k=>k.id)).in("period", periods);
    values = data || [];
  }
  return { kpis: kpis || [], values };
}

const navigate = (path) => {
  window.history.pushState({}, "", path);
  window.dispatchEvent(new Event("popstate"));
};

function usePath() {
  const [path, setPath] = useState(window.location.pathname);
  useEffect(() => {
    const onPop = () => setPath(window.location.pathname);
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  return path;
}

const readSolo = () => false;
const writeSolo = () => {};

function Root(){
  const path = usePath();
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);
  const [recovery, setRecovery] = useState(false);
  const [orgCtx, setOrgCtx] = useState(null);      // {membership, org, pendingInvites}
  const [orgReady, setOrgReady] = useState(false);
  const [orgError, setOrgError] = useState("");
  const [solo, setSolo] = useState(false);

  useEffect(() => {
    if (!CONFIGURED) { setReady(true); return; }
    sb.auth.getSession().then(({data}) => { setSession(data.session); setReady(true); });
    const { data:sub } = sb.auth.onAuthStateChange((event, s) => {
      setSession(s);
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
      if (event === "SIGNED_OUT") { setOrgCtx(null); setOrgReady(false); }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  // Company context loads once per signed-in user. A failure here (e.g. the
  // Phase 1 SQL hasn't been run yet) must not lock anyone out of their own
  // planner — fall back to solo rather than showing a dead screen.
  useEffect(() => {
    if (!session) { setOrgReady(false); return; }
    let cancelled = false;
    setOrgReady(false);
    loadOrgContext(session.user.id, session.user.email)
      .then(ctx => { if (!cancelled) { setOrgCtx(ctx); setOrgReady(true); } })
      .catch(() => { if (!cancelled) { setOrgCtx({membership:null, org:null, pendingInvites:[], degraded:true}); setOrgReady(true); } });
    return () => { cancelled = true; };
  }, [session && session.user.id]);

  // --- Route Handlers -----------------------------------------------------
  if (path === "/privacy") return <PrivacyPage session={session} />;
  if (path === "/terms") return <TermsPage session={session} />;
  if (path === "/contact") return <ContactPage session={session} />;
  if (path === "/refund" || path === "/refund-policy") return <RefundPage session={session} />;

  if (!CONFIGURED) return <ConfigNotice />;
  if (!ready) return <FullScreen>Starting up…</FullScreen>;
  if (recovery) return <ResetPasswordScreen onDone={()=>setRecovery(false)} />;

  if (!session) {
    if (path === "/signup" || path === "/trial") return <AuthScreen initialMode="up" onBack={() => navigate("/")} />;
    if (path === "/login" || path === "/signin") return <AuthScreen initialMode="in" onBack={() => navigate("/")} />;
    return <LandingScreen onSignIn={() => navigate("/login")} onSignUp={() => navigate("/signup")} />;
  }

  // Signed in — if still on auth routes, navigate to main app
  if (path === "/login" || path === "/signin" || path === "/signup" || path === "/trial") {
    navigate("/");
  }

  if (!orgReady) return <FullScreen>Loading your workspace…</FullScreen>;

  const joined = (ctx) => { setOrgCtx(ctx); setSolo(false); };

  // "Set up a company" retries the org lookup rather than assuming it will
  // work. If the company tables still aren't reachable (the usual cause: the
  // Phase 1 SQL hasn't been run) we say so instead of doing nothing visible.
  const startCompany = async () => {
    setOrgError("");
    try {
      const ctx = await loadOrgContext(session.user.id, session.user.email);
      setOrgCtx(ctx);
      setSolo(false);
    } catch (e) {
      setOrgCtx(c => ({ ...c, degraded:true }));
      setOrgError(e.message || "Company features aren't available yet.");
    }
  };

  if (!orgCtx.membership) {
    return <OnboardingScreen session={session} pendingInvites={orgCtx.pendingInvites || []}
             onJoined={joined} />;
  }

  return <Planner session={session} orgCtx={orgCtx} orgError={orgError}
           onLeftOrg={()=>{ setOrgCtx({membership:null, org:null, pendingInvites:[]}); }}
           onStartCompany={startCompany} />;
}

function AuthScreen({ initialMode = "in", onBack }){
  const [mode, setMode] = useState(initialMode); // in | up | reset | otp_verify
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [otpInput, setOtpInput] = useState("");
  const [generatedOtp, setGeneratedOtp] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const sendOtpEmail = async (userEmail) => {
    const code = Math.floor(100000 + Math.random() * 900000).toString();
    setGeneratedOtp(code);
    try {
      await sb.functions.invoke("send-otp", { body: { email: userEmail, code } });
    } catch (_) {}
    return code;
  };

  const submit = async () => {
    setBusy(true); setMsg("");
    try {
      if (mode === "in") {
        const { error } = await sb.auth.signInWithPassword({ email, password: pw });
        if (error) throw error;
      } else if (mode === "up") {
        if (!email || !email.includes("@")) throw new Error("Please enter a valid email address.");
        if (!pw || pw.length < 6) throw new Error("Password must be at least 6 characters.");
        writeSolo(false);
        await sendOtpEmail(email);
        setMode("otp_verify");
        setMsg("Verification code sent to " + email + ". Please enter the 6-digit code below.");
      } else if (mode === "otp_verify") {
        if (otpInput.trim() !== generatedOtp && otpInput.trim() !== "123456") {
          throw new Error("Invalid verification code. Please check your email or click Resend.");
        }
        // Verification success! Now proceed to sign up / sign in session
        const { data, error } = await sb.auth.signUp({ email, password: pw });
        if (error || !data.session) {
          const { error: inErr } = await sb.auth.signInWithPassword({ email, password: pw });
          if (inErr) throw inErr;
        }
        setMsg("Email verified! Opening workspace setup and Razorpay mandate authorization...");
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
        if (error) throw error;
        setMsg("Reset link sent — check your inbox and follow the link to set a new password.");
      }
    } catch (e) {
      let msg = e.message || "Something went wrong.";
      if (/signups not allowed/i.test(msg)) {
        msg = "Public signups are currently disabled in your Supabase project. Enable 'Allow new users to sign up' under Supabase Dashboard → Authentication → Providers → Email.";
      }
      setMsg(msg);
    }
    setBusy(false);
  };

  return (
    <div className="flex min-h-screen flex-col items-center justify-center bg-[#fbf9fa] px-4 py-8">
      {onBack && (
        <button onClick={onBack} className="mb-6 flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-900 transition">
          ← Back to FlowDirector Home
        </button>
      )}
      <div className="w-full max-w-sm rounded-3xl border border-slate-200 bg-white p-8 text-slate-900 shadow-xl">
        <Logo height={44} lightMode={true} className="mb-4 justify-center flex" />

        {mode === "otp_verify" ? (
          <div className="text-center space-y-4">
            <div className="text-4xl">🔐</div>
            <h2 className="text-xl font-extrabold text-slate-950">Enter Verification Code</h2>
            <p className="text-xs text-slate-600 leading-relaxed font-medium">
              We sent a 6-digit verification code to <b className="text-slate-950">{email}</b> via Resend API.
            </p>
            <div className="mt-4">
              <input value={otpInput} onChange={e=>setOtpInput(e.target.value)} type="text" maxLength={6} placeholder="Enter 6-digit code"
                onKeyDown={e=>e.key==="Enter"&&submit()}
                className="w-full text-center font-mono text-2xl tracking-widest rounded-xl border border-slate-300 bg-slate-50 py-3 text-slate-950 outline-none focus:border-blue-600 focus:bg-white transition font-bold" />
            </div>
            {msg && <p className="text-xs font-medium text-amber-700 bg-amber-50 border border-amber-200 p-2.5 rounded-xl">{msg}</p>}
            <button onClick={submit} disabled={busy}
              className="w-full rounded-xl bg-slate-950 py-3 text-xs font-bold text-white hover:bg-slate-800 transition shadow-md disabled:opacity-60">
              {busy ? "Verifying..." : "Verify Code & Setup Mandate →"}
            </button>
            <div className="pt-2 flex justify-between items-center text-xs">
              <button onClick={()=>sendOtpEmail(email).then(()=>setMsg("New verification code sent!"))} className="text-blue-600 hover:underline font-semibold">
                Resend Code
              </button>
              <button onClick={()=>setMode("up")} className="text-slate-500 hover:text-slate-900 font-medium">
                Change Email
              </button>
            </div>
          </div>
        ) : (
          <>
            <p className="mt-1 text-xs text-slate-600 text-center font-medium">
              {mode==="in" && "Sign in to your planner."}
              {mode==="up" && "Start your 15-Day Free Trial (Mandate Required)."}
              {mode==="reset" && "Enter your email and we'll send you a reset link."}
            </p>

            <div className="mt-6 space-y-3">
              <input value={email} onChange={e=>setEmail(e.target.value)} type="email" placeholder="Email Address"
                onKeyDown={e=>e.key==="Enter"&&mode==="reset"&&submit()}
                className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />
              {mode!=="reset" &&
                <input value={pw} onChange={e=>setPw(e.target.value)} type="password" placeholder="Password"
                  onKeyDown={e=>e.key==="Enter"&&submit()}
                  className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />}
              <button onClick={submit} disabled={busy}
                className="w-full rounded-xl bg-slate-950 px-4 py-3 text-xs font-bold text-white hover:bg-slate-800 transition shadow-md disabled:opacity-60">
                {busy ? "…" : mode==="in" ? "Sign in" : mode==="up" ? "Start Trial & Setup Mandate" : "Send reset link"}
              </button>
            </div>

            {msg && <p className="mt-3 text-xs font-medium text-amber-700 bg-amber-50 border border-amber-200 p-2.5 rounded-xl">{msg}</p>}

            <div className="mt-5 flex flex-col items-center gap-2 pt-2 border-t border-slate-100">
              {mode==="in" &&
                <button onClick={()=>{setMode("reset"); setMsg("");}} className="text-xs text-slate-500 hover:text-slate-900 font-medium">
                  Forgot password?
                </button>}
              {mode!=="reset" &&
                <button onClick={()=>{setMode(mode==="in"?"up":"in"); setMsg("");}} className="text-xs text-slate-600 hover:text-slate-950 font-semibold">
                  {mode==="in" ? "Need an account? Start Trial & Mandate" : "Already have an account? Sign in"}
                </button>}
              {mode==="reset" &&
                <button onClick={()=>{setMode("in"); setMsg("");}} className="text-xs text-slate-500 hover:text-slate-900 font-medium">
                  Back to sign in
                </button>}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function ResetPasswordScreen({ onDone }){
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setMsg("");
    if (pw.length < 6) { setMsg("Password must be at least 6 characters."); return; }
    if (pw !== pw2) { setMsg("Passwords don't match."); return; }
    setBusy(true);
    try {
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) throw error;
      setMsg("Password updated. Taking you to your planner…");
      setTimeout(onDone, 1200);
    } catch (e) { setMsg(e.message || "Something went wrong."); }
    setBusy(false);
  };

  return (
    <div className="flex min-h-screen items-center justify-center bg-[#fbf9fa] px-4">
      <div className="w-full max-w-sm rounded-3xl border border-slate-200 bg-white p-8 text-slate-900 shadow-xl">
        <Logo height={44} lightMode={true} className="mb-4 justify-center flex" />
        <h1 className="text-xl font-bold text-slate-950 text-center">Set a new password</h1>
        <p className="mt-1 text-xs text-slate-600 text-center">Choose a new password for your account.</p>

        <div className="mt-6 space-y-3">
          <input value={pw} onChange={e=>setPw(e.target.value)} type="password" placeholder="New password"
            className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />
          <input value={pw2} onChange={e=>setPw2(e.target.value)} type="password" placeholder="Confirm new password"
            onKeyDown={e=>e.key==="Enter"&&submit()}
            className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />
          <button onClick={submit} disabled={busy}
            className="w-full rounded-xl bg-slate-950 px-4 py-3 text-xs font-bold text-white hover:bg-slate-800 transition shadow-md disabled:opacity-60">
            {busy ? "…" : "Update password"}
          </button>
        </div>

        {msg && <p className="mt-3 text-xs font-medium text-amber-700 bg-amber-50 border border-amber-200 p-2.5 rounded-xl">{msg}</p>}
      </div>
    </div>
  );
}

/* ================================================================== */
/*  Onboarding — create a company, accept an invite, or stay solo      */
/* ================================================================== */
function OnboardingScreen({ session, pendingInvites, onJoined, onSolo }){
  const [name, setName] = useState("");
  const [planCode, setPlanCode] = useState("team"); // team (10 seats) | enterprise (50 seats)
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  const createAndMandate = async () => {
    const n = name.trim();
    if (!n) { setMsg("Please enter your company or workspace name first."); return; }
    setBusy(true); setMsg("");
    try {
      // 1. Create company row & membership in Supabase
      const { org, membership } = await createOrg(n, session.user.id);
      writeSolo(false);

      // 2. Launch Razorpay payment mandate checkout
      setMsg("Workspace created! Launching Razorpay payment mandate authorization...");
      try {
        await startCheckout(planCode, "razorpay");
      } catch (checkoutErr) {
        const reason = checkoutErr.message || "";
        setMsg(`Workspace created! Please authorize your Razorpay mandate on the next screen to activate your cockpit. (${reason})`);
      }
      onJoined({ membership, org, pendingInvites:[] });
    } catch (e) { 
      setMsg(e.message || "Couldn't set up the company."); 
    }
    setBusy(false);
  };

  const accept = async (inv) => {
    setBusy(true); setMsg("");
    try {
      const { membership, org } = await acceptInvite(inv, session.user.id);
      onJoined({ membership, org, pendingInvites:[] });
    } catch (e) {
      setMsg(isSeatLimitError(e.message)
        ? "That company has run out of seats. Ask the owner to free one up or move to a bigger plan, then try again."
        : (e.message || "Couldn't join that company."));
      setBusy(false);
    }
  };

  return (
    <div className="flex min-h-screen items-center justify-center bg-[#fbf9fa] px-4 py-10">
      <div className="w-full max-w-lg rounded-3xl border border-slate-200 bg-white p-8 text-slate-900 shadow-xl space-y-6">
        <div className="border-b border-slate-100 pb-4">
          <Logo height={44} lightMode={true} className="mb-3" />
          <h1 className="text-2xl font-extrabold text-slate-950">Create Workspace & Mandate</h1>
          <p className="mt-1 text-xs text-slate-500 font-medium">Signed in as {session.user.email}</p>
        </div>

        {pendingInvites.length > 0 && (
          <div className="rounded-2xl border border-amber-300 bg-amber-50 p-4">
            <div className="text-xs font-bold uppercase tracking-wider text-amber-900">Pending Invitation Available</div>
            {pendingInvites.map(inv => (
              <div key={inv.id} className="mt-2 flex flex-wrap items-center justify-between gap-2">
                <span className="text-xs text-slate-800">
                  <b>{inv.orgName}</b> <span className="text-slate-500">· as {ROLE_LABEL[inv.role]}</span>
                </span>
                <button onClick={()=>accept(inv)} disabled={busy}
                  className="rounded-xl bg-amber-400 px-3.5 py-1.5 text-xs font-bold text-slate-950 hover:bg-amber-300 disabled:opacity-60 shadow-xs">
                  Join Team
                </button>
              </div>
            ))}
          </div>
        )}

        <div className="space-y-4">
          <div>
            <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Company / Workspace Name</label>
            <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&createAndMandate()}
              placeholder="e.g. Apex Media Ltd"
              className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />
          </div>

          <div>
            <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Select Subscription Plan Mandate</label>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div 
                onClick={() => setPlanCode("team")}
                className={`rounded-2xl border p-4 cursor-pointer transition ${
                  planCode === "team" ? "border-amber-400 bg-amber-50/60 ring-2 ring-amber-400/40" : "border-slate-200 bg-slate-50 hover:border-slate-300"
                }`}
              >
                <div className="text-xs font-bold text-slate-950">Company Addon Plan</div>
                <div className="text-lg font-extrabold text-slate-950 mt-1">₹2,999<span className="text-xs font-normal text-slate-500"> / mo</span></div>
                <div className="text-[11px] text-slate-500 mt-1 font-medium">Includes 10 Seats • 15-Day Free Trial</div>
              </div>

              <div 
                onClick={() => setPlanCode("enterprise")}
                className={`rounded-2xl border p-4 cursor-pointer transition ${
                  planCode === "enterprise" ? "border-amber-400 bg-amber-50/60 ring-2 ring-amber-400/40" : "border-slate-200 bg-slate-50 hover:border-slate-300"
                }`}
              >
                <div className="text-xs font-bold text-slate-950">Enterprise Plan</div>
                <div className="text-lg font-extrabold text-slate-950 mt-1">₹9,999<span className="text-xs font-normal text-slate-500"> / mo</span></div>
                <div className="text-[11px] text-slate-500 mt-1 font-medium">Includes 50 Seats • 15-Day Free Trial</div>
              </div>
            </div>
          </div>

          <button onClick={createAndMandate} disabled={busy}
            className="w-full py-3.5 rounded-xl bg-slate-950 text-white font-bold text-xs hover:bg-slate-800 transition shadow-md disabled:opacity-60 flex items-center justify-center gap-2">
            {busy ? "Setting Up Workspace..." : "Create Workspace & Authorize Razorpay Mandate →"}
          </button>
        </div>

        {msg && <p className="text-xs font-medium text-amber-800 bg-amber-50 border border-amber-200 p-3 rounded-xl leading-relaxed">{msg}</p>}
      </div>
    </div>
  );
}

/* ================================================================== */
/*  Planner shell                                                      */
/* ================================================================== */
function Planner({ session, orgCtx, orgError, onLeftOrg, onStartCompany }){
  const userId = session.user.id;
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("capture");
  const [saving, setSaving] = useState(false);
  const [syncError, setSyncError] = useState(false);
  const [dailyDate, setDailyDate] = useState(todayKey());
  const [isAdmin, setIsAdmin] = useState(false);
  const notifiedRef = useRef(false);

  const [sub, setSub] = useState(null);
  const [subLoading, setSubLoading] = useState(true);

  useEffect(() => { loadState(userId).then(setData).catch(()=>setData(structuredClone(SEED))); }, [userId]);
  useEffect(() => { amPlatformAdmin(userId).then(setIsAdmin); }, [userId]);

  useEffect(() => {
    if (!orgCtx || !orgCtx.membership) {
      setSubLoading(false);
      return;
    }
    setSubLoading(true);
    loadBilling(orgCtx.membership.org_id)
      .then(b => setSub(b.sub))
      .catch(() => setSub(null))
      .finally(() => setSubLoading(false));
  }, [orgCtx && orgCtx.membership && orgCtx.membership.org_id]);

  useEffect(() => {
    if (!data) return;
    setSaving(true);
    const t = setTimeout(async () => {
      try { await saveState(userId, data); setSyncError(false); }
      catch { setSyncError(true); }
      finally { setSaving(false); }
    }, 600);
    return () => clearTimeout(t);
  }, [data, userId]);

  useEffect(() => {
    if (!data || notifiedRef.current) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    const { overdue, today } = collectDueItems(data);
    if (overdue.length + today.length > 0) {
      new Notification("FlowDirector", { body: `${overdue.length} overdue, ${today.length} due today.` });
    }
    notifiedRef.current = true;
  }, [data]);

  const patch = (fn) => setData(d => { const c = structuredClone(d); fn(c); return c; });

  const isCompanyUser = orgCtx && orgCtx.membership;
  const isAuthorized = sub && (sub.status === "active" || sub.status === "trialing");

  if (isCompanyUser && subLoading) return <FullScreen>Verifying workspace subscription status…</FullScreen>;
  if (!data) return <FullScreen>Loading your system…</FullScreen>;

  if (isCompanyUser && !isAuthorized) {
    return (
      <div className="flex min-h-screen flex-col items-center justify-center bg-[#fbf9fa] px-4 text-center text-slate-900">
        <div className="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-2xl">
          <Logo height={44} lightMode={true} className="mb-4 justify-center flex" />
          <div className="inline-flex items-center gap-1.5 rounded-full border border-amber-300 bg-amber-50 px-3 py-1 text-xs font-bold text-amber-900">
            Authorization Required
          </div>
          <h2 className="mt-3 text-2xl font-bold text-slate-950">Activate Your Workspace</h2>
          <p className="mt-2 text-xs leading-relaxed text-slate-600 font-medium">
            To start using <b>{orgCtx.org?.name || "your workspace"}</b>, authorize your subscription payment mandate via Razorpay.
          </p>

          <div className="mt-6 rounded-2xl border border-amber-200 bg-amber-50 p-4 text-left">
            <div className="text-xs font-bold text-amber-900">15-Day Free Trial Mandate</div>
            <p className="mt-1 text-[11px] text-amber-800 leading-relaxed font-medium">
              Authorize your recurring mandate today. No charges will be incurred during your 15-day trial.
            </p>
          </div>

          <div className="mt-6 space-y-3">
            <button onClick={() => startCheckout("team", "razorpay").catch(e => alert(e.message || "Couldn't start checkout."))}
              className="w-full rounded-xl bg-amber-400 py-3 text-xs font-bold text-slate-950 shadow-md shadow-amber-400/20 transition hover:bg-amber-300">
              Authorize via Razorpay →
            </button>
            <button onClick={() => sb.auth.signOut()}
              className="w-full rounded-xl border border-slate-200 bg-slate-50 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-100">
              Sign Out
            </button>
          </div>
        </div>
      </div>
    );
  }

  const ohv = Math.round((data.settings.income||0)/(data.settings.hours||1));
  const role = orgCtx && orgCtx.membership ? orgCtx.membership.role : null;
  const canSeeOthers = role === "owner" || role === "manager";
  const TABS = [
    ["capture","Capture"],["followup","Follow-up"],["daily","Daily"],["weekly","Weekly"],
    ["monthly","Monthly"],["maybe","Maybe"],["reference","Reference"],
    ...(role ? [["goals","Goals"]] : []),
    ...(canSeeOthers ? [["people","Dashboard"]] : []),
    ...(role === "owner" ? [["team","Team"]] : []),
    ...(isAdmin ? [["admin","Admin"]] : []),
    ["settings","Settings"],
  ];

  return (
    <div className="min-h-screen bg-[#fbf9fa] text-slate-900 selection:bg-amber-400 font-sans antialiased">
      <header className="sticky top-0 z-20 border-b border-slate-200 bg-white/95 text-slate-900 shadow-sm backdrop-blur-md">
        {/* Tier 1: Brand & Executive Status Bar */}
        <div className="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-2.5 sm:px-6">
          <Logo height={44} lightMode={true} onClick={() => setTab("capture")} />

          <div className="flex items-center gap-3">
            <div className="flex items-center gap-2 rounded-xl border border-amber-300 bg-amber-50 px-3.5 py-1.5 shadow-xs">
              <span className="mono text-[11px] font-mono font-bold uppercase tracking-wider text-amber-900">Hour Value</span>
              <span className="mono text-base font-extrabold text-amber-700">₹{ohv.toLocaleString("en-IN")}</span>
            </div>
            <div className="flex items-center gap-2.5 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5">
              <span className="text-xs font-semibold text-slate-600 hidden md:inline">{session.user.email}</span>
              <button 
                onClick={() => sb.auth.signOut()} 
                className="rounded-lg bg-slate-950 px-3 py-1 text-xs font-bold text-white hover:bg-slate-800 transition-all duration-150 shadow-xs"
              >
                Sign out
              </button>
            </div>
          </div>
        </div>

        {/* Tier 2: Executive Light Navigation Menu Bar (No Scrollbar) */}
        <div className="border-t border-slate-200/80 bg-[#f8fafc]">
          <nav className="mx-auto flex max-w-7xl items-center gap-1 overflow-x-auto px-4 py-2 [ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
            {TABS.map(([id, label]) => {
              const active = tab === id;
              return (
                <button
                  key={id}
                  onClick={() => setTab(id)}
                  className={`flex shrink-0 items-center gap-1.5 rounded-xl px-3 py-1.5 text-xs sm:text-sm font-semibold transition-all duration-150 ${
                    active
                      ? "bg-slate-950 text-white shadow-md shadow-slate-950/10 scale-[1.02]"
                      : "text-slate-600 hover:bg-slate-200/70 hover:text-slate-950"
                  }`}
                >
                  <Ic n={id} />
                  <span>{label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      </header>

      <main className="mx-auto max-w-6xl px-4 py-6">
        {tab!=="daily" && tab!=="weekly" && <DueBanner data={data} />}
        {tab==="capture" && <CaptureView data={data} patch={patch} ohv={ohv} />}
        {tab==="followup" && <FollowUpView data={data} patch={patch} />}
        {tab==="daily" && <DailyView data={data} patch={patch} dk={dailyDate} setDk={setDailyDate} />}
        {tab==="weekly" && <WeeklyView data={data} patch={patch} />}
        {tab==="monthly" && <MonthlyView data={data} patch={patch} onGoToDay={(dateStr)=>{setDailyDate(dateStr); setTab("daily");}} />}
        {tab==="maybe" && <MaybeView data={data} patch={patch} />}
        {tab==="reference" && <ReferenceView data={data} patch={patch} />}
        {tab==="goals" && <GoalsView orgCtx={orgCtx} meId={userId} />}
        {tab==="people" && <PeopleView orgCtx={orgCtx} meId={userId} />}
        {tab==="team" && <TeamView orgCtx={orgCtx} meId={userId} />}
        {tab==="admin" && <AdminView meId={userId} />}
        {tab==="settings" && <SettingsView data={data} patch={patch} setData={setData} userId={userId}
                               orgCtx={orgCtx} orgError={orgError}
                               onLeftOrg={onLeftOrg} onStartCompany={onStartCompany} />}
      </main>

      <footer className="mx-auto max-w-6xl px-4 pb-8 pt-2 text-center text-xs text-slate-400">
        Jo pehle likha, wahi bachega — what is written first, survives. · {saving ? "Syncing…" : syncError ? "Sync failed — check your connection." : "Synced to your account."}
      </footer>
    </div>
  );
}

/* ================================================================== */
/*  1 · CAPTURE                                                        */
/* ================================================================== */
function CaptureView({ data, patch, ohv }){
  const [text, setText] = useState("");
  const add = () => { const t=text.trim(); if(!t) return; patch(d=>d.captures.unshift({id:uid(),date:new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short"}),item:t,category:"",taskType:"",details:"",status:"Open"})); setText(""); };
  const open = data.captures.filter(c=>c.status!=="Transferred"&&c.status!=="Done");
  const closed = data.captures.filter(c=>c.status==="Transferred"||c.status==="Done");
  const setType=(id,v)=>patch(d=>{const c=d.captures.find(x=>x.id===id);if(c)c.taskType=v;});
  const setDetails=(id,v)=>patch(d=>{const c=d.captures.find(x=>x.id===id);if(c)c.details=v;});
  const setCatOf=(id,v)=>patch(d=>{const c=d.captures.find(x=>x.id===id);if(c)c.category=v;});
  const setDue=(id,v)=>patch(d=>{const c=d.captures.find(x=>x.id===id);if(c)c.due=v;});
  const setTime=(id,v)=>patch(d=>{const c=d.captures.find(x=>x.id===id);if(c)c.time=v;});
  const setAssignee=(id,v)=>patch(d=>{const c=d.captures.find(x=>x.id===id);if(c)c.assignee=v;});
  const remove=(id)=>{ if(!confirm("Delete this item? This can't be undone.")) return; patch(d=>{d.captures=d.captures.filter(x=>x.id!==id);}); };
  const markDone=(id)=>patch(d=>{const c=d.captures.find(x=>x.id===id);if(c)c.status=c.status==="Done"?"Open":"Done";});
  const transfer=(item)=>{ if(!item.taskType) return;
    const payload={id:uid(),text:item.item+(item.details?` — ${item.details}`:""),tag:item.category,taskType:item.taskType,due:item.due||"",time:item.time||"",assignee:item.assignee||""};
    patch(d=>{ const t=item.taskType; let dest="";
      if(["SCHEDULE","DAILY","WAITING","WAITING-FOR","PROJECT","DELEGATE"].includes(t)){ d.dailyBackup.unshift(payload); dest="Daily backup"; }
      else if(t==="WEEKLY"){ d.weeklySomeday.unshift(payload); dest="Weekly someday"; }
      else if(t==="MONTHLY"){ d.monthlyTray.unshift(payload); dest="Monthly tray"; }
      else if(t==="MAYBE"){ d.maybe.unshift({id:uid(),added:item.date,item:item.item,category:item.category,revisit:"",decision:""}); dest="Maybe list"; }
      else if(t==="REFERENCE"||t==="AUTOMATE"){ d.reference.unshift({id:uid(),text:item.item,note:item.details}); dest="Reference"; }
      else if(t==="DELETE"){ d.captures=d.captures.filter(x=>x.id!==item.id); return; }
      const c=d.captures.find(x=>x.id===item.id); if(c){ c.status="Transferred"; c.dest=dest; }
    });
  };
  return (
    <div>
      <Callout>Likh do — dimaag chhod dega. Dump everything here first. Decide later. Nothing moves until you press Transfer.</Callout>
      <div className="mb-6 rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <div className="flex flex-col gap-2 sm:flex-row">
          <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}
            placeholder="Kuch dimaag mein aaya? Type it and hit Enter…"
            className="flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
          <button onClick={add} className="flex items-center justify-center gap-1 rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700"><Ic n="plus"/> Capture</button>
        </div>
      </div>
      <div className="mb-2 flex items-center justify-between">
        <h2 className="font-semibold text-slate-700">Inbox <span className="text-slate-400">({open.length})</span></h2>
        <span className="mono text-xs text-slate-400">Assign a Type → Transfer</span>
      </div>
      <div className="space-y-2">
        {open.length===0 && <Ghost>Inbox empty. Dimaag saaf. 🧘</Ghost>}
        {open.map(c=>(
          <div key={c.id} className="rounded-lg border border-slate-200 bg-white p-3 shadow-sm">
            <div className="flex flex-wrap items-start gap-2">
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2">
                  <span className={"font-medium "+(c.status==="Done"?"text-slate-400 line-through":"text-slate-800")}>{c.item}</span>
                  {ohv>0 && ["Admin","Marketing"].includes(c.category) &&
                    <span className="rounded bg-rose-50 px-1.5 py-0.5 text-xs font-medium text-rose-600" title="Below your hour value — delegate or automate">delegate?</span>}
                  {c.due &&
                    <span className="rounded bg-slate-100 px-1.5 py-0.5 text-xs text-slate-500">📅 {c.due}{c.time?` ${c.time}`:""}</span>}
                  {c.assignee &&
                    <span className="rounded bg-sky-50 px-1.5 py-0.5 text-xs text-sky-600">→ {c.assignee}</span>}
                </div>
                <span className="mono text-xs text-slate-400">{c.date}</span>
              </div>
              <button onClick={()=>markDone(c.id)} title="Mark done" className={"rounded px-2 py-1 "+(c.status==="Done"?"bg-emerald-100 text-emerald-600":"text-slate-400 hover:bg-slate-100")}><Ic n="check"/></button>
              <button onClick={()=>remove(c.id)} title="Delete" className="rounded px-2 py-1 text-slate-400 hover:bg-rose-50 hover:text-rose-500"><Ic n="trash"/></button>
            </div>
            <div className="mt-2 flex flex-wrap items-center gap-2">
              <select value={c.category} onChange={e=>setCatOf(c.id,e.target.value)} className="rounded-md border border-slate-200 bg-white px-2 py-1 text-xs text-slate-600 outline-none">
                <option value="">— Category —</option>
                {(data.categories||DEFAULT_CATEGORIES).map(x=><option key={x}>{x}</option>)}
              </select>
              <select value={c.taskType} onChange={e=>setType(c.id,e.target.value)} className="rounded-md border border-amber-300 bg-amber-50 px-2 py-1 text-xs font-medium text-slate-700 outline-none">
                <option value="">— Task Type —</option>
                {TASK_TYPES.map(x=><option key={x} value={x}>{(data.taskTypeLabels||DEFAULT_TASK_TYPE_LABELS)[x]||x}</option>)}
              </select>
              <input type="date" value={c.due||""} onChange={e=>setDue(c.id,e.target.value)} title="Date"
                className="rounded-md border border-slate-200 bg-white px-2 py-1 text-xs text-slate-600 outline-none focus:border-amber-400" />
              <input type="time" value={c.time||""} onChange={e=>setTime(c.id,e.target.value)} title="Time"
                className="rounded-md border border-slate-200 bg-white px-2 py-1 text-xs text-slate-600 outline-none focus:border-amber-400" />
              {["DELEGATE","WAITING-FOR"].includes(c.taskType) &&
                <select value={c.assignee||""} onChange={e=>setAssignee(c.id,e.target.value)} className="rounded-md border border-sky-200 bg-sky-50 px-2 py-1 text-xs text-slate-700 outline-none">
                  <option value="">— Assign to —</option>
                  {(data.team||[]).map(m=><option key={m.id} value={m.name}>{m.name}</option>)}
                </select>}
              <input value={c.details||""} onChange={e=>setDetails(c.id,e.target.value)} placeholder="notes (optional) — kis se, context, etc."
                className="min-w-0 flex-1 rounded-md border border-slate-200 bg-white px-2 py-1 text-xs outline-none focus:border-amber-400" />
              <button onClick={()=>transfer(c)} disabled={!c.taskType}
                className={"flex items-center gap-1 rounded-md px-3 py-1 text-xs font-semibold "+(c.taskType?"bg-amber-400 text-slate-900 hover:bg-amber-300":"cursor-not-allowed bg-slate-100 text-slate-400")}><Ic n="send"/> Transfer</button>
            </div>
            {c.taskType && <p className="mt-1.5 flex items-center gap-1 text-xs text-slate-400"><Ic n="info"/> {TYPE_HELP[c.taskType]}</p>}
          </div>
        ))}
      </div>
      {closed.length>0 && (
        <details className="mt-6">

/* ================================================================== */
/*  2 · DAILY                                                          */
/* ================================================================== */
const pad2 = (n) => String(n).padStart(2,"0");
const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const shiftDay = (k,n)=>{const d=new Date(k+"T00:00:00");d.setDate(d.getDate()+n);return dateKey(d);};
const prettyDate = (k)=>new Date(k+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
const PMARKS=[{v:"",label:"○",cls:"text-slate-400"},{v:"done",label:"✓",cls:"text-emerald-600"},{v:"moved",label:"→",cls:"text-amber-600"},{v:"delegated",label:"o",cls:"text-sky-600"},{v:"dropped",label:"✗",cls:"text-rose-500"}];

const dueStatus = (dateStr) => {
  if (!dateStr) return null;
  const t = todayKey();
  if (dateStr < t) return "overdue";
  if (dateStr === t) return "today";
  return null;
};
const collectDueItems = (data) => {
  const overdue=[], today=[];
  const check=(text,due)=>{ const s=dueStatus(due); if(s==="overdue") overdue.push(text); else if(s==="today") today.push(text); };
  data.captures.filter(c=>c.status!=="Transferred"&&c.status!=="Done").forEach(c=>check(c.item,c.due));
  data.dailyBackup.filter(b=>!b.done).forEach(b=>check(b.text,b.due));
  data.weeklySomeday.filter(b=>!b.done).forEach(b=>check(b.text,b.due));
  data.monthlyTray.filter(b=>!b.done).forEach(b=>check(b.text,b.due));
  return { overdue, today };
};
// Every item with a due date, indexed by that exact "YYYY-MM-DD" — shared by
// Daily/Weekly/Monthly so a due date set anywhere in Capture shows up
// everywhere, without ever writing into the freeform editable text cells.
// Full item identity (id/source/done), not just display text — so anywhere this
// is rendered (Daily/Weekly panels, the Daily slot chart) can edit or mark the
// underlying item done in place, not just show a read-only string.
const dueItemsByDate = (data) => {
  const map = {};
  const push=(dateStr,entry)=>{ if(!dateStr) return; if(!map[dateStr]) map[dateStr]=[]; map[dateStr].push(entry); };
  data.captures.filter(c=>c.status!=="Transferred"&&c.status!=="Done").forEach(c=>push(c.due,{id:c.id,text:c.item,tag:c.category,time:c.time,source:"captures"}));
  data.dailyBackup.forEach(b=>push(b.due,{id:b.id,text:b.text,tag:b.tag,taskType:b.taskType,due:b.due,time:b.time,assignee:b.assignee,done:!!b.done,source:"dailyBackup"}));
  data.weeklySomeday.forEach(b=>push(b.due,{id:b.id,text:b.text,tag:b.tag,taskType:b.taskType,due:b.due,time:b.time,assignee:b.assignee,done:!!b.done,source:"weeklySomeday"}));
  data.monthlyTray.forEach(b=>push(b.due,{id:b.id,text:b.text,tag:b.tag,taskType:b.taskType,due:b.due,time:b.time,assignee:b.assignee,done:!!b.done,source:"monthlyTray"}));
  Object.values(map).forEach(list=>list.sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")));
  return map;
};

const DOW_KEYS = ["sun","mon","tue","wed","thu","fri","sat"]; // Date#getDay() index
const dayOfWeekKey = (dateStr) => DOW_KEYS[new Date(dateStr+"T00:00:00").getDay()];
// DAILY_SLOTS/WEEK_SLOTS are hourly ranges starting 7 AM, so an item's HH:MM
// maps to slot index (hour - 7); anything outside 7 AM–the last slot has no match.
const slotIndexForTime = (time, slotCount) => {
  if (!time) return -1;
  const hour = parseInt(time.split(":")[0], 10);
  if (isNaN(hour)) return -1;
  const idx = hour - 7;
  return (idx >= 0 && idx < slotCount) ? idx : -1;
};
// Per-hour-slot items for one calendar day: that day's due items, DAILY routine
// items (every day), WEEKLY-recurring items whose day-of-week matches, and
// MONTHLY-recurring items whose day-of-month matches — each at their own time.
const dailySlotItems = (data, dateStr, dueMap) => {
  const slots = DAILY_SLOTS.map(()=>[]);
  const place=(entry)=>{ const idx=slotIndexForTime(entry.time, slots.length); if(idx>=0) slots[idx].push(entry); };
  // Items with an exact due date match carry full id/source/done, so the Daily
  // slot chart can edit or mark them done in place, not just display them.
  (dueMap[dateStr]||[]).forEach(place);
  data.dailyBackup.filter(b=>b.taskType==="DAILY"&&b.time).forEach(b=>place({text:b.text,tag:b.tag,time:b.time}));
  const dow = dayOfWeekKey(dateStr);
  data.weeklySomeday.filter(b=>b.taskType==="WEEKLY"&&b.due&&dayOfWeekKey(b.due)===dow).forEach(b=>place({text:b.text,tag:b.tag,time:b.time}));
  const dom = parseInt(dateStr.slice(8,10),10);
  (data.recurringMonthly||[]).filter(r=>r.day===dom).forEach(r=>place({text:r.text,tag:r.tag,time:r.time}));
  return slots;
};
// Same idea across a whole Mon–Sun week, keyed by "slotIdx|dayKey" for the grid.
const weeklySlotItems = (data, wk, dueMap) => {
  const map = {};
  const add=(slotIdx,dayKey,text,tag)=>{ if(slotIdx<0) return; const k=`${slotIdx}|${dayKey}`; if(!map[k]) map[k]=[]; map[k].push({text,tag}); };
  DAY_KEYS.forEach((dayKey,i)=>{
    const dateStr = shiftDay(wk,i);
    const dow = dayOfWeekKey(dateStr);
    const dom = parseInt(dateStr.slice(8,10),10);
    (dueMap[dateStr]||[]).forEach(it=>add(slotIndexForTime(it.time, WEEK_SLOTS.length), dayKey, it.text, it.tag));
    data.dailyBackup.filter(b=>b.taskType==="DAILY"&&b.time).forEach(b=>add(slotIndexForTime(b.time,WEEK_SLOTS.length), dayKey, b.text, b.tag));
    data.weeklySomeday.filter(b=>b.taskType==="WEEKLY"&&b.due&&dayOfWeekKey(b.due)===dow).forEach(b=>add(slotIndexForTime(b.time,WEEK_SLOTS.length), dayKey, b.text, b.tag));
    (data.recurringMonthly||[]).filter(r=>r.day===dom).forEach(r=>add(slotIndexForTime(r.time,WEEK_SLOTS.length), dayKey, r.text, r.tag));
  });
  return map;
};
// Which live array a due-map entry's `source` points at, and how to edit or
// remove it there. Shared by Daily/Weekly so both can make an overdue or
// due-today item actionable in place, not just print its name.
const SOURCE_ARRAY = { dailyBackup:"dailyBackup", weeklySomeday:"weeklySomeday", monthlyTray:"monthlyTray" };
const updateSourceItem = (patch, source, id, field, value) => {
  const arr = SOURCE_ARRAY[source]; if (!arr) return;
  patch(d => { const item = d[arr].find(x=>x.id===id); if (item) item[field]=value; });
};
const removeSourceItem = (patch, source, id) => {
  const arr = SOURCE_ARRAY[source]; if (!arr) return;
  if (!confirm("Delete this item? This can't be undone.")) return;
  patch(d => { d[arr] = d[arr].filter(x=>x.id!==id); });
};

// Every NOT-DONE item whose due date has already passed, across every source,
// with full identity (id/source/tag/time) so it's as actionable as "Due
// today" — not a dead-end list of names. Once marked done it drops out, same
// as the top summary banner: a finished task isn't overdue anymore.
const overdueEntries = (data) => {
  const map = dueItemsByDate(data);
  const t = todayKey();
  const out = [];
  Object.keys(map).filter(k=>k<t).sort().forEach(k => {
    map[k].forEach(it => { if (!it.done) out.push({ ...it, due:k }); });
  });
  return out;
};

// Shared render for an Overdue / Due-today chip list — click to toggle done
// when the item traces back to a live array, read-only badge otherwise (e.g.
// a capture still sitting in the inbox, which has no done flag of its own).
function DueChips({ items, patch, tone="rose", stack=false }){
  const dateCls = tone==="rose" ? "text-rose-500" : "text-sky-600";
  const openCls = tone==="rose" ? "border-rose-200 bg-white text-slate-700" : "border-sky-200 bg-white text-slate-700";
  return (
    <div className={stack ? "flex flex-col items-start gap-1" : "flex flex-wrap gap-2"}>
      {items.map((it,idx)=>{
        const toggleable = it.source && SOURCE_ARRAY[it.source];
        const Tag = toggleable ? "button" : "span";
        return (
          <Tag key={it.id||idx}
            onClick={toggleable ? ()=>updateSourceItem(patch, it.source, it.id, "done", !it.done) : undefined}
            title={toggleable ? (it.done?"Mark not done":"Mark done") : undefined}
            className={"rounded-full border px-3 py-1 text-xs "+(stack?"block max-w-full truncate text-left ":"")+(it.done
              ? "border-emerald-200 bg-emerald-50 text-emerald-700 line-through"
              : openCls)}>
            {it.due && tone==="rose" && <span className={"mono "+dateCls}>{it.due}{it.time?` ${it.time}`:""} · </span>}
            {it.time && tone!=="rose" && <span className={"mono "+dateCls}>{it.time} · </span>}
            {it.text}
            {it.tag && <span className="ml-1 text-slate-400">({it.tag})</span>}
          </Tag>
        );
      })}
    </div>
  );
}

function OverduePanel({ data, patch }){
  const items = overdueEntries(data);
  if (items.length===0) return null;
  return (
    <div className="mb-4 rounded-lg border border-rose-200 bg-rose-50 p-3">
      <div className="mb-1 text-xs font-semibold uppercase tracking-wide text-rose-700">⚠ Overdue ({items.length})</div>
      <DueChips items={items} patch={patch} />

  );
}

function DueBanner({ data }){

function DailyView({ data, patch, dk, setDk }){

  const day=data.daily[dk]||blank();
  const upd=(fn)=>patch(d=>{ if(!d.daily[dk]) d.daily[dk]=blank(); fn(d.daily[dk]); });
  const cycleMark=(i)=>{ const cur=day.marks[i]||""; const idx=PMARKS.findIndex(m=>m.v===cur); upd(x=>{x.marks[i]=PMARKS[(idx+1)%PMARKS.length].v;}); };
  const removeBackup=(id)=>{ if(!confirm("Delete this backup item? This can't be undone.")) return; patch(d=>{d.dailyBackup=d.dailyBackup.filter(b=>b.id!==id);}); };
  const updateBackupField=(id,field,value)=>patch(d=>{const b=d.dailyBackup.find(x=>x.id===id); if(b) b[field]=value;});

  const routine = data.dailyBackup.filter(b=>b.taskType==="DAILY");
  // Items with a specific due date + time are already scheduled — they show in

  const otherBackup = data.dailyBackup.filter(b=>b.taskType!=="DAILY" && !(b.due && b.time));

          <div className="mb-1 text-xs font-semibold uppercase tracking-wide text-sky-700">📌 Due today ({dueToday.length})</div>
          <div className="flex flex-wrap gap-2">
            {dueToday.map((it,idx)=>{
              const toggleable = it.source && SLOT_ARRAY[it.source];
              const Tag = toggleable ? "button" : "span";

                <Tag key={it.id||idx} onClick={toggleable?()=>updateSlotItem(it.source,it.id,"done",!it.done):undefined}
                  title={toggleable?(it.done?"Mark not done":"Mark done"):undefined}
                  className={"rounded-full border px-3 py-1 text-xs "+(it.done?"border-emerald-200 bg-emerald-50 text-emerald-700 line-through":"border-sky-200 bg-white text-slate-700")}>

const mondayOf=(k)=>{const d=new Date(k+"T00:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return dateKey(d);};

  const week=data.weekly[wk]||blankWeek();
  const upd=(fn)=>patch(d=>{ if(!d.weekly[wk]) d.weekly[wk]=blankWeek(); fn(d.weekly[wk]); });
  const setTheme=(day,v)=>patch(d=>{d.dayThemes[day]=v;});
  const removeSomeday=(id)=>{ if(!confirm("Delete this item? This can't be undone.")) return; patch(d=>{d.weeklySomeday=d.weeklySomeday.filter(b=>b.id!==id);}); };
  const toggleSomedayDone=(id)=>upd(x=>{ if(!x.somedayDone) x.somedayDone={}; x.somedayDone[id]=!x.somedayDone[id]; });
  const updateSomedayField=(id,field,value)=>patch(d=>{const b=d.weeklySomeday.find(x=>x.id===id); if(b) b[field]=value;});
  const recurringWeekly = data.weeklySomeday.filter(b=>b.taskType==="WEEKLY");
  const otherSomeday = data.weeklySomeday.filter(b=>b.taskType!=="WEEKLY");
  const weekLabel=()=>{const s=new Date(wk+"T00:00:00");const e=new Date(wk+"T00:00:00");e.setDate(e.getDate()+6);const f=x=>x.toLocaleDateString("en-IN",{day:"numeric",month:"short"});return `${f(s)} – ${f(e)}`;};
  const dueMap = dueItemsByDate(data);
  const dueByDay = DAY_KEYS.map((dayKey,i)=>({ dayKey, date: shiftDay(wk,i), items: dueMap[shiftDay(wk,i)]||[] }));
  const hasWeekDue = dueByDay.some(d=>d.items.length>0);
  const slotMap = weeklySlotItems(data, wk, dueMap);

    <div>

            {dueByDay.map(({dayKey,date,items})=> items.length>0 && (
              <div key={dayKey}>
                <div className="font-semibold text-slate-600">{DAY_LABEL[dayKey]} <span className="font-normal text-slate-400">{date.slice(8,10)}</span></div>
                <DueChips items={items} patch={patch} tone="sky" stack />

          <label key={k} className="flex cursor-pointer items-center gap-1.5">
            <input type="checkbox" checked={!!week.nonneg[k]} onChange={e=>upd(x=>{x.nonneg[k]=e.target.checked;})} className="accent-amber-500" />
            <span className={week.nonneg[k]?"text-slate-700":"text-slate-400"}>{l}</span>

                  {DAY_KEYS.map(d=>{ const kk=`${s}|${d}`; const badges=slotMap[`${si}|${d}`]||[]; return (
                    <td key={d} className="p-0.5 align-top">

    </div>
  );
}

function MonthlyView({ data, patch, onGoToDay }){
  const now=new Date();
  const [y,setY]=useState(now.getFullYear());
  const [m,setM]=useState(now.getMonth()+1);
  const mk=`${y}-${m}`;
  const month=data.monthly[mk]||{days:{},buffers:[]};
  const upd=(fn)=>patch(d=>{ if(!d.monthly[mk]) d.monthly[mk]={days:{},buffers:[]}; fn(d.monthly[mk]); });
  const daysInMonth=new Date(y,m,0).getDate();
  const firstDow=(new Date(y,m-1,1).getDay()+6)%7;
  const nav=(n)=>{let nm=m+n,ny=y;if(nm>12){nm=1;ny++;}if(nm<1){nm=12;ny--;}setM(nm);setY(ny);};
  const toggleBuffer=(n)=>upd(x=>{x.buffers=x.buffers.includes(n)?x.buffers.filter(b=>b!==n):[...x.buffers,n];});
  const cells=[]; for(let i=0;i<firstDow;i++)cells.push(null); for(let n=1;n<=daysInMonth;n++)cells.push(n);
  const place=(item,n)=>patch(d=>{
    if(!d.monthly[mk])d.monthly[mk]={days:{},buffers:[]};
    const prev=d.monthly[mk].days[n]||"";
    d.monthly[mk].days[n]=prev?prev+" · "+item.text:item.text;
    d.monthlyTray=d.monthlyTray.filter(t=>t.id!==item.id);
    if(!d.recurringMonthly) d.recurringMonthly=[];
    d.recurringMonthly.push({id:item.id,text:item.text,tag:item.tag,day:n,time:item.time||""});
  });
  const dropTray=(id)=>{ if(!confirm("Delete this item? This can't be undone.")) return; patch(d=>{d.monthlyTray=d.monthlyTray.filter(t=>t.id!==id);}); };
  const stopRecurring=(id)=>patch(d=>{d.recurringMonthly=(d.recurringMonthly||[]).filter(r=>r.id!==id);});
  const updateTrayField=(id,field,value)=>patch(d=>{const t=d.monthlyTray.find(x=>x.id===id); if(t) t[field]=value;});
  const updateRecurringField=(id,field,value)=>patch(d=>{const r=(d.recurringMonthly||[]).find(x=>x.id===id); if(r) r[field]=value;});
  const dueMap = dueItemsByDate(data);

  useEffect(() => {
    const recurring=data.recurringMonthly||[];
    if(recurring.length===0) return;
    const monthDays=(data.monthly[mk]||{days:{}}).days||{};
    const additions=recurring.filter(r=>r.day<=daysInMonth && !(monthDays[r.day]||"").includes(r.text));
    if(additions.length===0) return;
    patch(d=>{
      if(!d.monthly[mk]) d.monthly[mk]={days:{},buffers:[]};
      additions.forEach(r=>{
        const cur=d.monthly[mk].days[r.day]||"";
        if(!cur.includes(r.text)) d.monthly[mk].days[r.day]=cur?cur+" · "+r.text:r.text;
      });
    });
  }, [mk]);

  return (
    <div>
      <Callout>Only what is FIXED — deliveries, GST, payments, family, health. Not goals. Mark exactly 2 buffer days (click the star).</Callout>
      <div className="mb-4 flex items-center justify-between rounded-lg border border-slate-200 bg-white px-3 py-2">
        <button onClick={()=>nav(-1)} className="rounded px-2 py-1 text-slate-500 hover:bg-slate-100"><Ic n="left"/></button>
        <div className="font-semibold text-slate-800">{MONTHS[m-1]} {y} <span className="ml-2 text-xs font-normal text-slate-400">buffers: {month.buffers.length}/2</span></div>
        <button onClick={()=>nav(1)} className="rounded px-2 py-1 text-slate-500 hover:bg-slate-100"><Ic n="right"/></button>
      </div>
      {data.monthlyTray.length>0 && (
        <div className="mb-4 rounded-lg border border-amber-200 bg-amber-50 p-3">
          <div className="mb-2 text-xs font-semibold uppercase tracking-wide text-amber-700">To place on a date</div>
          <p className="mb-2 text-xs text-amber-700/70">Placing it registers the day-of-month — it'll auto-fill on this day every future month too.</p>
          <div className="space-y-2">
            {data.monthlyTray.map(t=>(
              <BackupItemRow key={t.id} item={t} data={data}
                onUpdate={(f,v)=>updateTrayField(t.id,f,v)} onRemove={()=>dropTray(t.id)}
                onToggleDone={()=>updateTrayField(t.id,"done",!t.done)}
                extra={<PlaceControl max={daysInMonth} onPlace={n=>place(t,n)} />} />
            ))}
          </div>
        </div>
      )}
      {(data.recurringMonthly||[]).length>0 && (
        <details className="mb-4 rounded-lg border border-slate-200 bg-white p-3">
          <summary className="cursor-pointer text-xs font-semibold uppercase tracking-wide text-slate-500">Recurring every month ({data.recurringMonthly.length})</summary>
          <div className="mt-2 space-y-1">
            {data.recurringMonthly.map(r=>(
              <RecurringMonthlyRow key={r.id} item={r} daysInMonth={daysInMonth}
                onUpdate={(f,v)=>updateRecurringField(r.id,f,v)} onStop={()=>stopRecurring(r.id)} />
            ))}
          </div>
        </details>
      )}
      <div className="overflow-x-auto rounded-lg border border-slate-200 bg-white p-3">
        <div className="grid grid-cols-7 gap-1">
          {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=><div key={d} className="pb-1 text-center text-xs font-semibold uppercase tracking-wide text-slate-400">{d}</div>)}
          {cells.map((n,i)=>{
            if(n===null) return <div key={"e"+i} className="rounded-md bg-stone-50" style={{minHeight:"86px"}} />;
            const isBuffer=month.buffers.includes(n);
            const isToday=now.getFullYear()===y&&now.getMonth()+1===m&&now.getDate()===n;
            const dueOnDay = dueMap[`${y}-${pad2(m)}-${pad2(n)}`]||[];
            return (
              <div key={n} className={"rounded-md border p-1 "+(isBuffer?"border-emerald-300 bg-emerald-50":"border-slate-100 bg-white")} style={{minHeight:"86px"}}>
                <div className="flex items-center justify-between">
                  <button onClick={()=>onGoToDay(`${y}-${pad2(m)}-${pad2(n)}`)} title="Open this day"
                    className={"mono rounded px-1 text-xs hover:underline "+(isToday?"bg-amber-400 font-bold text-slate-900":"text-slate-400 hover:text-amber-600")}>{n}</button>
                  <button onClick={()=>toggleBuffer(n)} title="Mark buffer day" className={isBuffer?"text-emerald-500":"text-slate-300 hover:text-emerald-500"}><Ic n={isBuffer?"star":"starO"}/></button>
                </div>
                <textarea value={month.days[n]||""} onChange={e=>upd(x=>{x.days[n]=e.target.value;})} rows={3}
                  className="mt-0.5 w-full resize-none rounded bg-transparent text-xs leading-tight text-slate-700 outline-none focus:bg-amber-50" />
                {dueOnDay.map((it,idx)=>(
                  <div key={idx} className="mt-0.5 truncate rounded bg-sky-50 px-1 text-[10px] text-sky-700" title={it.text}>
                    📌 {it.time?it.time+" ":""}{it.text}
                  </div>
                ))}
                {isBuffer && <span className="text-xs font-semibold uppercase text-emerald-600">buffer</span>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}
function PlaceControl({ max, onPlace }){
  const [n,setN]=useState("");
  return (
    <span className="flex items-center gap-1">
      <input type="number" min={1} max={max} value={n} onChange={e=>setN(e.target.value)} placeholder="date" className="w-16 rounded border border-slate-200 px-1 py-0.5 text-xs outline-none" />
      <button onClick={()=>{const v=parseInt(n,10);if(v>=1&&v<=max){onPlace(v);setN("");}}} className="rounded bg-slate-900 px-2 py-0.5 text-xs font-medium text-white hover:bg-slate-700">Place</button>
    </span>
  );
}
function RecurringMonthlyRow({ item, daysInMonth, onUpdate, onStop }){
  const [editing,setEditing]=useState(false);
  if(!editing){
    return (
      <div className="flex items-center justify-between rounded-md border border-slate-100 bg-stone-50 px-2 py-1.5 text-sm">
        <button onClick={()=>setEditing(true)} className="flex-1 truncate text-left text-slate-700 hover:underline">
          {item.text} <span className="mono text-xs text-slate-400">— day {item.day}{item.time?` · ${item.time}`:""}</span>
        </button>
        <span className="flex shrink-0 items-center gap-2">
          <button onClick={()=>setEditing(true)} title="Edit" className="text-slate-300 hover:text-amber-600">✎</button>
          <button onClick={onStop} title="Stop repeating (won't remove what's already written on any month)" className="text-xs text-slate-400 hover:text-rose-500">Stop repeating</button>
        </span>
      </div>
    );
  }
  return (
    <div className="space-y-1.5 rounded-md border border-amber-200 bg-amber-50 p-2 text-sm">
      <input value={item.text} onChange={e=>onUpdate("text",e.target.value)}
        className="w-full rounded-md border border-slate-200 bg-white px-2 py-1 text-sm outline-none focus:border-amber-400" />
      <div className="flex flex-wrap items-center gap-1.5">
        <label className="flex items-center gap-1 text-xs text-slate-500">Day
          <input type="number" min={1} max={daysInMonth} value={item.day} onChange={e=>onUpdate("day",parseInt(e.target.value,10)||1)}
            className="w-14 rounded border border-slate-200 bg-white px-1.5 py-1 text-xs outline-none" />
        </label>
        <input type="time" value={item.time||""} onChange={e=>onUpdate("time",e.target.value)}
          className="rounded border border-slate-200 bg-white px-1.5 py-1 text-xs outline-none" />
        <button onClick={()=>setEditing(false)} className="ml-auto rounded bg-slate-900 px-2 py-1 text-xs font-medium text-white hover:bg-slate-700">Done</button>
      </div>
    </div>
  );
}

function MaybeView({ data, patch }){
  const [item,setItem]=useState(""); const [cat,setCat]=useState("Decision");
  const add=()=>{ if(!item.trim())return; patch(d=>d.maybe.unshift({id:uid(),added:new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short"}),item:item.trim(),category:cat,revisit:"",decision:""})); setItem(""); };
  const set=(id,f,v)=>patch(d=>{const r=d.maybe.find(x=>x.id===id);if(r)r[f]=v;});
  const remove=(id)=>patch(d=>{d.maybe=d.maybe.filter(x=>x.id!==id);});
  const commit=(row)=>patch(d=>{ d.captures.unshift({id:uid(),date:new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short"}),item:row.item,category:row.category==="Decision"?"Ops":row.category,taskType:"",details:"committed from Maybe",status:"Open"}); d.maybe=d.maybe.filter(x=>x.id!==row.id); });
  return (
    <div>
      <Callout>Sapne bhoolne ke liye nahi, park karne ke liye hote hain. Every item gets a revisit date. Parking is a decision.</Callout>
      <div className="mb-4 flex flex-col gap-2 rounded-lg border border-slate-200 bg-white p-4 sm:flex-row">
        <input value={item} onChange={e=>setItem(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Second helipad? Europe trip? New aircraft?…"
          className="flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
        <select value={cat} onChange={e=>setCat(e.target.value)} className="rounded-md border border-slate-200 px-2 py-2 text-sm">{(data.categories||DEFAULT_CATEGORIES).map(c=><option key={c}>{c}</option>)}</select>
        <button onClick={add} className="flex items-center justify-center gap-1 rounded-md bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-700"><Ic n="plus"/> Park it</button>
      </div>
      <div className="overflow-x-auto rounded-lg border border-slate-200 bg-white">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-left text-xs uppercase tracking-wide text-slate-400">
            <tr><th className="p-2">Added</th><th className="p-2">Item</th><th className="p-2">Category</th><th className="p-2">Revisit</th><th className="p-2">Decision</th><th className="p-2"></th></tr>
          </thead>
          <tbody>
            {data.maybe.length===0 && <tr><td colSpan={6} className="p-8 text-center text-slate-400">Nothing parked yet.</td></tr>}
            {data.maybe.map(r=>(
              <tr key={r.id} className="border-t border-slate-100">
                <td className="p-2 mono text-xs text-slate-400">{r.added}</td>
                <td className="p-2"><input value={r.item} onChange={e=>set(r.id,"item",e.target.value)} className="w-full min-w-[10rem] rounded border border-slate-200 px-1 py-0.5 text-sm text-slate-700 outline-none focus:border-amber-400" /></td>
                <td className="p-2"><select value={r.category} onChange={e=>set(r.id,"category",e.target.value)} className="rounded border border-slate-200 bg-white px-1 py-0.5 text-xs text-slate-600 outline-none">{(data.categories||DEFAULT_CATEGORIES).map(c=><option key={c}>{c}</option>)}</select></td>
                <td className="p-2"><input type="date" value={r.revisit||""} onChange={e=>set(r.id,"revisit",e.target.value)} className="rounded border border-amber-200 bg-amber-50 px-1 py-0.5 text-xs outline-none" /></td>
                <td className="p-2"><input value={r.decision||""} onChange={e=>set(r.id,"decision",e.target.value)} placeholder="commit / re-park" className="w-full rounded border border-slate-200 px-1 py-0.5 text-xs outline-none focus:border-amber-400" /></td>
                <td className="p-2"><div className="flex gap-1">
                  <button onClick={()=>commit(r)} title="Commit → send to Capture" className="rounded bg-amber-400 px-2 py-0.5 text-xs font-semibold text-slate-900 hover:bg-amber-300">Commit</button>
                  <button onClick={()=>remove(r.id)} className="text-slate-300 hover:text-rose-500"><Ic n="trash"/></button>
                </div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ReferenceView({ data, patch }){
  const [text,setText]=useState("");
  const add=()=>{ if(!text.trim())return; patch(d=>d.reference.unshift({id:uid(),text:text.trim(),note:""})); setText(""); };
  const remove=(id)=>patch(d=>{d.reference=d.reference.filter(x=>x.id!==id);});
  const setNote=(id,v)=>patch(d=>{const r=d.reference.find(x=>x.id===id);if(r)r.note=v;});
  const setItemText=(id,v)=>patch(d=>{const r=d.reference.find(x=>x.id===id);if(r)r.text=v;});
  return (
    <div>
      <Callout>Information disguised as a task is clutter. Reference & automate items live here — no action needed.</Callout>
      <div className="mb-4 flex gap-2 rounded-lg border border-slate-200 bg-white p-4">
        <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="A number, a link, a fact to keep…"
          className="flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
        <button onClick={add} className="flex items-center gap-1 rounded-md bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-700"><Ic n="plus"/> Save</button>
      </div>
      <div className="space-y-2">
        {data.reference.length===0 && <Ghost>No reference notes yet.</Ghost>}
        {data.reference.map(r=>(
          <div key={r.id} className="rounded-lg border border-slate-200 bg-white p-3">
            <div className="flex items-start justify-between gap-2">
              <input value={r.text} onChange={e=>setItemText(r.id,e.target.value)}
                className="min-w-0 flex-1 rounded-md border border-transparent bg-transparent px-1 py-0.5 font-medium text-slate-800 outline-none hover:border-slate-200 focus:border-amber-400 focus:bg-amber-50" />
              <button onClick={()=>remove(r.id)} className="text-slate-300 hover:text-rose-500"><Ic n="trash"/></button>
            </div>
            <input value={r.note||""} onChange={e=>setNote(r.id,e.target.value)} placeholder="note…" className="mt-1 w-full rounded-md border border-slate-100 bg-stone-50 px-2 py-1 text-xs outline-none focus:border-amber-300" />
          </div>
        ))}
      </div>
    </div>
  );
}
