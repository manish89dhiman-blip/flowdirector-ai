/*  TEAM — owner-only member and invite management                     */
/* ================================================================== */
function TeamView({ orgCtx, meId }){
  const [members, setMembers] = useState(null);
  const [invites, setInvites] = useState([]);
  const [email, setEmail] = useState("");
  const [role, setRole] = useState("employee");
  const [department, setDepartment] = useState("Operations");
  const [managerId, setManagerId] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [deptFilter, setDeptFilter] = useState("ALL");
  const orgId = orgCtx?.org?.id || null;
  const myRole = orgCtx?.membership?.role || "owner";
  const myRank = getRoleRank(myRole);

  const refresh = () => {
    if (!orgId) { setMembers([]); setInvites([]); return Promise.resolve(); }
    return Promise.all([loadTeam(orgId), loadPendingInvites(orgId)])
      .then(([m,i]) => { setMembers(m); setInvites(i); })
      .catch(e => { setMsg(e.message || "Couldn't load the team."); setMembers([]); });
  };

  useEffect(() => { refresh(); }, [orgId]);

  const invite = async () => {
    const e = email.trim();
    if (!e) { setMsg("Enter an email address."); return; }
    setBusy(true); setMsg("");
    try {
      const row = await sendInvite(orgId, e, role, department || "General", managerId || null, meId);
      setEmail(""); setManagerId("");
      setMsg(await inviteNote(row.id, e, { ...row, orgName: orgCtx?.org?.name }));
      await refresh();
    } catch (err) {
      setMsg(/duplicate|unique/i.test(err.message||"")
        ? "There's already an invite for that email in this company."
        : friendlyError(err.message) || "Couldn't create the invite.");
    }
    setBusy(false);
  };

  // One sentence covering all outcomes: emailed or direct link
  const inviteNote = async (inviteId, addr, invObj = null) => {
    try {
      const r = await emailInvite(inviteId, invObj);
      if (r.sent) return `✉️ Invitation email dispatched to ${addr}! Direct joining link is also ready below.`;
      return `Invite created for ${addr}. You can also copy the direct link below to share directly.`;
    } catch (err) {
      return `Invite created for ${addr}. You can copy the direct invite link below to pass it along.`;
    }
  };

  const resend = async (i) => {
    setMsg("Sending invitation email…");
    setMsg(await inviteNote(i.id, i.email, { ...i, orgName: orgCtx?.org?.name }));
  };

  const copyLink = async (inv) => {
    const url = inv && inv.email
      ? `${window.location.origin}/signup?email=${encodeURIComponent(inv.email)}&invite=${inv.id}`
      : `${window.location.origin}/signup`;
    try { 
      await navigator.clipboard.writeText(url); 
      setMsg(`Copied direct invite link for ${inv?.email || 'team member'}! Send them that link to join.`); 
    }
    catch { 
      setMsg(`Direct invite link: ${url}`); 
    }
  };

  const change = async (m, patchObj) => {
    setMsg("");
    try { await updateMembership(m.id, patchObj); await refresh(); }
    catch (err) { setMsg(friendlyError(err.message) || "Couldn't update that member."); }
  };

  const remove = async (m) => {
    if (!confirm(`Remove ${m.name} from this company? Their own planner data stays with their account — they just lose company access.`)) return;
    setMsg("");
    try { await removeMember(m.id); await refresh(); }
    catch (err) { setMsg(err.message || "Couldn't remove that member."); }
  };

  if (members === null) return <Ghost>Loading your team…</Ghost>;

  // Strict role and department filtering
  const visibleMembers = filterVisibleTeamMembers(members, meId, myRole, orgCtx?.membership?.department);
  const managers = visibleMembers.filter(m => getRoleRank(m.role) >= 3);

  const displayedMembers = deptFilter === "ALL" 
    ? visibleMembers 
    : visibleMembers.filter(m => (m.department || "General").toLowerCase() === deptFilter.toLowerCase());

  const displayedInvites = invites.filter(inv => {
    const invRank = getRoleRank(inv.role);
    if (myRank >= 5) return true;
    if (myRank >= 3 && invRank < 3) {
      return !orgCtx?.membership?.department || orgCtx.membership.department.toLowerCase() === (inv.department || "General").toLowerCase();
    }
    return false;
  });

  return (
    <div className="space-y-6">
      <Callout>
        {myRank >= 5 
          ? "Executive Control: Owners & CEOs oversee all departments, leaders, and employees."
          : "Department Scoped: You manage members, deliverables, and standups for your department."}
      </Callout>
      {msg && <p className="rounded-xl border border-amber-200 bg-amber-50 px-4 py-2.5 text-xs font-bold text-amber-900">{msg}</p>}

      {/* Invite Box (Only for Owner, CEO, Director, Manager) */}
      {myRank >= 3 && (
        <div className="rounded-3xl border border-slate-200 bg-white p-5 sm:p-6 shadow-xs space-y-4">
          <div>
            <h3 className="font-extrabold text-slate-900 text-base flex items-center gap-2">
              <span>✉️</span>
              <span>Invite Team Member</span>
            </h3>
            <p className="text-xs text-slate-500 mt-0.5">
              Assign their role and department. They join instantly by accepting the email invitation.
            </p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
            <input 
              value={email} 
              onChange={e=>setEmail(e.target.value)} 
              onKeyDown={e=>e.key==="Enter"&&invite()}
              type="email" 
              placeholder="member@company.com"
              className="rounded-xl border border-amber-300 bg-amber-50/50 px-3 py-2 text-xs font-bold text-slate-900 outline-none focus:bg-white" 
            />

            <select 
              value={role} 
              onChange={e=>setRole(e.target.value)}
              className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-bold text-slate-800 outline-none"
            >
              {myRank >= 5 && <option value="owner">Founder / Co-Owner</option>}
              {myRank >= 5 && <option value="ceo">Chief Executive Officer (CEO)</option>}
              {myRank >= 4 && <option value="director">Director / VP</option>}
              {myRank >= 4 && <option value="manager">Department Manager</option>}
              <option value="sub_manager">Sub-Manager / Team Lead</option>
              <option value="employee">Employee / Specialist</option>
              <option value="assistant">Executive Assistant</option>
            </select>

            <select 
              value={department} 
              onChange={e=>setDepartment(e.target.value)}
              className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-bold text-slate-800 outline-none"
            >
              {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
            </select>

            {getRoleRank(role) < 3 && managers.length > 0 ? (
              <select 
                value={managerId} 
                onChange={e=>setManagerId(e.target.value)}
                className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-bold text-slate-800 outline-none"
              >
                <option value="">— Direct Manager —</option>
                {managers.map(m => <option key={m.user_id} value={m.user_id}>{m.name}</option>)}
              </select>
            ) : (
              <button 
                onClick={invite} 
                disabled={busy}
                className="rounded-xl bg-slate-950 hover:bg-slate-800 text-white px-4 py-2 text-xs font-black shadow-xs disabled:opacity-60 flex items-center justify-center gap-1.5"
              >
                <span>🚀</span>
                <span>{busy ? "Sending…" : "Send Invite"}</span>
              </button>
            )}
          </div>

          {getRoleRank(role) < 3 && managers.length > 0 && (
            <div className="flex justify-end">
              <button 
                onClick={invite} 
                disabled={busy}
                className="rounded-xl bg-slate-950 hover:bg-slate-800 text-white px-5 py-2 text-xs font-black shadow-xs disabled:opacity-60 flex items-center gap-1.5"
              >
                <span>🚀</span>
                <span>{busy ? "Sending…" : "Send Invite"}</span>
              </button>
            </div>
          )}

          <p className="text-[11px] text-slate-400 font-medium">{ROLE_HELP[role] || ""}</p>
        </div>
      )}

      {/* Pending Invites */}
      {displayedInvites.length > 0 && (
        <div className="rounded-3xl border border-slate-200 bg-white p-5 shadow-xs space-y-3">
          <h3 className="font-extrabold text-slate-900 text-sm flex items-center gap-2">
            <span>⏳</span>
            <span>Pending Invites ({displayedInvites.length})</span>
          </h3>
          <div className="space-y-2">
            {displayedInvites.map(i => (
              <div key={i.id} className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-100 bg-slate-50/70 p-3 text-xs">
                <div className="space-y-0.5">
                  <span className="font-extrabold text-slate-900">{i.email}</span>
                  <div className="flex items-center gap-2">
                    <span className="rounded-full bg-white px-2.5 py-0.5 text-[10px] font-black text-slate-700 border border-slate-200">
                      {ROLE_LABEL[i.role] || i.role}
                    </span>
                    <span className="rounded-full bg-blue-50 px-2 py-0.5 text-[10px] font-bold text-blue-700 border border-blue-100">
                      📁 {i.department || "General"}
                    </span>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button 
                    onClick={()=>resend(i)}
                    className="rounded-xl bg-white border border-slate-200 px-3 py-1.5 font-bold text-slate-700 hover:bg-slate-100"
                  >
                    ✉️ Resend
                  </button>
                  <button 
                    onClick={()=>copyLink(i)}
                    className="rounded-xl bg-blue-50 text-blue-700 border border-blue-200 px-3 py-1.5 font-black hover:bg-blue-100"
                  >
                    🔗 Copy Link
                  </button>
                  {myRank >= 4 && (
                    <button 
                      onClick={async ()=>{ await revokeInvite(i.id); refresh(); }}
                      className="rounded-xl bg-rose-50 text-rose-600 border border-rose-200 px-3 py-1.5 font-bold hover:bg-rose-100"
                    >
                      Revoke
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Active Team Members List with Department Switcher */}
      <div className="rounded-3xl border border-slate-200 bg-white p-5 sm:p-6 shadow-xs space-y-4">
        <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3">
          <div>
            <h3 className="font-extrabold text-slate-900 text-base flex items-center gap-2">
              <span>👥</span>
              <span>Team Roster ({displayedMembers.length})</span>
            </h3>
            <p className="text-xs text-slate-500">Active organization members and their department assignments.</p>
          </div>

          {/* Department Filter Pills */}
          {myRank >= 4 && (
            <div className="flex flex-wrap items-center gap-1">
              <button
                onClick={() => setDeptFilter("ALL")}
                className={`rounded-xl px-2.5 py-1 text-xs font-bold transition ${
                  deptFilter === "ALL" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                }`}
              >
                All Departments
              </button>
              {DEPARTMENTS.map(d => (
                <button
                  key={d}
                  onClick={() => setDeptFilter(d)}
                  className={`rounded-xl px-2.5 py-1 text-xs font-bold transition ${
                    deptFilter === d ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                  }`}
                >
                  {d}
                </button>
              ))}
            </div>
          )}
        </div>

        <div className="space-y-2.5">
          {displayedMembers.map(m => (
            <div key={m.id} className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-100 bg-slate-50/60 p-3.5 text-xs">
              <div className="space-y-1 min-w-[200px]">
                <div className="flex items-center gap-2">
                  <span className="font-black text-slate-900 text-sm">{m.name}</span>
                  {m.user_id === meId && (
                    <span className="rounded-full bg-amber-100 text-amber-950 px-2 py-0.5 text-[10px] font-black uppercase">You</span>
                  )}
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-slate-500 font-medium">{m.email}</span>
                  <span className="rounded-full bg-blue-100 text-blue-900 px-2 py-0.5 text-[10px] font-black">
                    📁 {m.department || "General"}
                  </span>
                  <span className="rounded-full bg-slate-200 text-slate-800 px-2 py-0.5 text-[10px] font-black">
                    {ROLE_LABEL[m.role] || m.role}
                  </span>
                </div>
              </div>

              {/* Edit Controls (Only for Owner/CEO or higher ranks editing subordinate) */}
              {myRank >= 4 && m.user_id !== meId && (
                <div className="flex items-center gap-2">
                  <select 
                    value={m.role} 
                    onChange={e=>change(m, { role: e.target.value })}
                    className="rounded-xl border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-bold text-slate-800 outline-none"
                  >
                    {myRank >= 5 && <option value="owner">Founder / Owner</option>}
                    {myRank >= 5 && <option value="ceo">CEO</option>}
                    <option value="director">Director / VP</option>
                    <option value="manager">Department Manager</option>
                    <option value="sub_manager">Sub-Manager / Lead</option>
                    <option value="employee">Employee / Specialist</option>
                    <option value="assistant">Executive Assistant</option>
                  </select>

                  <select 
                    value={m.department || "General"} 
                    onChange={e=>change(m, { department: e.target.value })}
                    className="rounded-xl border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-bold text-slate-800 outline-none"
                  >
                    {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
                  </select>

                  <button 
                    onClick={()=>remove(m)} 
                    title="Remove from organization"
                    className="rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 p-2 font-bold transition border border-rose-100"
                  >
                    <Ic n="trash"/>
                  </button>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function TeamSection({ data, patch, inCompany }){

  const remove=(id)=>patch(d=>{d.team=(d.team||[]).filter(x=>x.id!==id);});
  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <h3 className="mb-3 font-semibold text-slate-700">Delegation labels</h3>
      <p className="mb-3 text-xs text-slate-400">
        Names you can assign DELEGATE / WAITING-FOR captures to, so they group by person in the Follow-up tab.
        {inCompany
          ? " These are just labels on your own list — separate from real company members with logins, which you manage in the Team tab."
          : " These are labels only — nobody gets a login from this."}
      </p>
      <div className="flex gap-2">
        <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Name (e.g. Nitin Singh)"
          className="flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
        <button onClick={add} className="flex items-center gap-1 rounded-md bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-700"><Ic n="plus"/> Add</button>
      </div>
      <div className="mt-3 flex flex-wrap gap-2">
        {(data.team||[]).length===0 && <span className="text-xs text-slate-400">No team members yet.</span>}
        {(data.team||[]).map(m=>(
          <span key={m.id} className="flex items-center gap-1.5 rounded-full border border-slate-200 bg-stone-50 px-3 py-1 text-xs text-slate-700">
            {m.name}
            <button onClick={()=>remove(m.id)} className="text-slate-400 hover:text-rose-500"><Ic n="x"/></button>
          </span>
        ))}
      </div>
    </div>
  );
}

function NotificationSection(){
  const supported = typeof Notification !== "undefined";
  const [perm, setPerm] = useState(supported ? Notification.permission : "unsupported");
  const enable = async () => { if(!supported) return; setPerm(await Notification.requestPermission()); };
  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <h3 className="mb-3 font-semibold text-slate-700">Reminders</h3>
      <p className="mb-3 text-xs text-slate-400">Get a browser notification for overdue / due-today items when you open the app. Only fires while this tab is open — it won't wake your phone or work in the background.</p>
      {!supported && <p className="text-xs text-rose-500">Notifications aren't supported in this browser.</p>}
      {supported && perm==="granted" && <p className="text-xs text-emerald-600">Enabled.</p>}
      {supported && perm==="denied" && <p className="text-xs text-rose-500">Blocked — enable notifications for this site in your browser's settings.</p>}
      {supported && perm==="default" &&
        <button onClick={enable} className="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50">Enable desktop reminders</button>}
    </div>
  );
}

            </span>
            <div className="text-xs font-mono font-bold text-slate-900 mt-2">{invoiceNo}</div>

            <div className="text-slate-500 font-mono">GST Status: Unregistered (Exempt)</div>

          <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-1">
            <div className="font-mono font-bold uppercase tracking-wider text-blue-600">Billed Customer</div>
            <div className="text-sm font-extrabold text-slate-950">{orgName}</div>
            <div className="text-slate-600 font-medium">{userEmail}</div>
            <div className="text-slate-500 font-mono">Payment Mode: Razorpay Mandate</div>
            <div className="text-slate-500 font-mono">Seats Allocated: {sub && sub.seats ? sub.seats : used} Seats</div>

        {/* Line Items Table */}

                <th className="p-3 border border-slate-200">SAC Code</th>
                <th className="p-3 border border-slate-200">GST Rate</th>

              <tr className="border border-slate-200">
                <td className="p-3 font-bold text-slate-950">
                  {planName} Subscription
                  <div className="text-[11px] font-normal text-slate-500">Includes {sub && sub.seats ? sub.seats : used} Executive Seats</div>
                </td>
                <td className="p-3 font-mono text-slate-600">998313</td>
                <td className="p-3 font-bold text-emerald-700">0% (Exempt)</td>
                <td className="p-3 font-mono font-bold text-slate-950 text-right">₹{basePrice.toLocaleString("en-IN")}</td>
              </tr>

          </table>
        </div>

        {/* Totals Summary */}
        <div className="flex justify-end my-6">
          <div className="w-full sm:w-64 space-y-2 text-xs">
            <div className="flex justify-between text-slate-600">
              <span>Subtotal:</span>
              <span className="font-mono font-bold">₹{basePrice.toLocaleString("en-IN")}</span>
            </div>
            <div className="flex justify-between text-slate-600">
              <span>CGST (0%):</span>
              <span className="font-mono">₹0.00</span>
            </div>
            <div className="flex justify-between text-slate-600">
              <span>SGST (0%):</span>
              <span className="font-mono">₹0.00</span>
            </div>
            <div className="flex justify-between text-sm font-extrabold text-slate-950 pt-2 border-t border-slate-200">
              <span>Total Amount Paid:</span>
              <span className="font-mono text-blue-600">₹{basePrice.toLocaleString("en-IN")}</span>
            </div>

        </div>

        {/* Actions */}
        <div className="flex flex-wrap items-center justify-between border-t border-slate-200 pt-6 gap-3">
          <button onClick={handlePrint} className="inline-flex items-center gap-2 rounded-xl bg-slate-950 px-5 py-2.5 text-xs font-bold text-white hover:bg-slate-800 transition shadow-md">
            🖨️ Print / Save PDF Receipt
          </button>
          <button onClick={onClose} className="rounded-xl border border-slate-300 bg-white px-5 py-2.5 text-xs font-bold text-slate-700 hover:bg-slate-50 transition">
            Close Window
          </button>
        </div>
      </div>
    </div>
  );
}

function BillingSection({ orgCtx, userId }){
  const [state, setState] = useState(null);   // {sub, plans}
  const [used, setUsed] = useState(null);
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState("");
  const [unavailable, setUnavailable] = useState(false);
  const [pendingReq, setPendingReq] = useState(null);
  const [showExtra, setShowExtra] = useState(false);
  const [extraCount, setExtraCount] = useState(1);
  const [showInvoice, setShowInvoice] = useState(false);
  const membership = orgCtx && orgCtx.membership;
  const isOwner = membership && membership.role === "owner";

  const reloadRequest = (orgId) => loadMyRequest(orgId).then(setPendingReq).catch(()=>{});

  const reloadBillingData = async () => {
    if (!membership) return;
    const [b, u] = await Promise.all([loadBilling(membership.org_id), loadSeatUsage(membership.org_id)]);
    setState(b); setUsed(u);
  };

  useEffect(() => {
    if (!membership) return;
    let cancelled = false;
    Promise.all([loadBilling(membership.org_id), loadSeatUsage(membership.org_id)])
      .then(([b, u]) => { if (!cancelled) { setState(b); setUsed(u); } })
      .catch(() => { if (!cancelled) setUnavailable(true); });
    reloadRequest(membership.org_id);
    return () => { cancelled = true; };
  }, [membership && membership.org_id]);

  if (!membership) return null;

  if (unavailable) {
    return (
      <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <h3 className="mb-2 font-bold text-slate-900">Subscription & Billing</h3>
        <p className="text-xs text-slate-500">
          Billing service is initializing. Contact support if you need immediate custom provisioning.
        </p>
      </div>
    );
  }
  if (!state || used === null) return <div className="rounded-2xl border border-slate-200 bg-white p-6 text-xs text-slate-500 font-medium">Loading subscription details…</div>;

  const usedData = typeof used === "object" && used !== null ? used : { totalUsed: used || 0, activeCount: used || 0, pendingCount: 0, members: [], invites: [] };
  const usedCount = usedData.totalUsed;
  const activeCount = usedData.activeCount;
  const pendingCount = usedData.pendingCount;
  const pendingInvites = usedData.invites || [];
  const limit = seatLimitOf(sub, plans);
  const full = limit != null && usedCount >= limit;
  const availableSeats = limit != null ? Math.max(0, limit - usedCount) : null;
  const expiredTrial = trialExpired(sub);
  const lapsed = sub && (!["active","trialing"].includes(sub.status) || expiredTrial);

  const handleRevokeInvite = async (inviteId, email) => {
    if (!confirm(`Revoke invitation for ${email}? This will free up 1 seat immediately.`)) return;
    setMsg("");
    try {
      await revokeInvite(inviteId);
      setMsg(`✓ Revoked invitation for ${email}. 1 seat has been freed up!`);
      await reloadBillingData();
    } catch (e) {
      setMsg(e.message || "Couldn't revoke invite.");
    }
  };

  const buyExtraSeats = async () => {
    setMsg(""); setBusy("extra");
    const currentLimit = limit || 1;
    const newTotalSeats = currentLimit + Number(extraCount);
    try {
      const { data, error } = await sb.functions.invoke("razorpay-addon", {
        body: { extra_seats: Number(extraCount), price_per_seat: 399 }
      });
      await setSubscription(membership.org_id, {
        plan_code: sub ? sub.plan_code : "starter",
        status: sub ? sub.status : "active",
        seats: newTotalSeats,
        until: sub ? sub.current_period_end : null,
      });
      const proratedText = data && data.prorated_charge_inr ? ` (₹${data.prorated_charge_inr} prorated charge processed for remaining ${data.days_remaining} days)` : "";
      setMsg(`Added +${extraCount} extra seat${extraCount > 1 ? "s" : ""}! Workspace capacity is now ${newTotalSeats} seats${proratedText}.`);
      setShowExtra(false);
      await reloadBillingData();
    } catch (e) { setMsg(e.message || "Couldn't add extra seats."); }
    setBusy("");
  };

  const handleSelfServicePlanChange = async (targetPlan) => {
    setMsg(""); setBusy(targetPlan.code);
    try {
      // Check if downgrading seat limit below current used seats
      if (targetPlan.seat_limit != null && usedCount > targetPlan.seat_limit) {
        throw new Error(`Cannot downgrade to ${targetPlan.name} (${targetPlan.seat_limit} seats) because your workspace currently uses ${usedCount} seats (${activeCount} active + ${pendingCount} pending invites). Please remove extra members or revoke invites first.`);
      }

      const isUpgrade = !plan || (targetPlan.seat_limit == null ? true : (limit != null && targetPlan.seat_limit > limit));
      const provider = providerForPlan(targetPlan);

      // Attempt online checkout if Razorpay plan ID is available
      if (provider) {
        try {
          await startCheckout(targetPlan.code, provider);
          return;
        } catch (checkoutErr) {
          // If online checkout fallback, perform direct self-service plan change
        }
      }

      // Perform instant self-service subscription plan change
      const newSeatCapacity = targetPlan.seat_limit != null ? Math.max(targetPlan.seat_limit, usedCount) : null;
      await setSubscription(membership.org_id, {
        plan_code: targetPlan.code,
        status: "active",
        seats: newSeatCapacity,
        until: sub ? sub.current_period_end : null,
      });

      setMsg(isUpgrade 
        ? `🎉 Upgraded to ${targetPlan.name}! Capacity updated to ${targetPlan.seat_limit != null ? targetPlan.seat_limit + ' seats' : 'unlimited seats'}. Billing updated.`
        : `✅ Downgraded to ${targetPlan.name}. Subscription rate updated for your next billing cycle.`
      );
      await reloadBillingData();
    } catch (e) {
      setMsg(e.message || "Couldn't complete plan change.");
    }
    setBusy("");
  };

  const withdraw = async () => {
    try { await withdrawRequest(pendingReq.id); setPendingReq(null); setMsg("Request withdrawn."); }
    catch (e) { setMsg(e.message || "Couldn't withdraw that."); }
  };

  return (
    <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm space-y-6">
      {showInvoice && (
        <InvoiceModal orgCtx={orgCtx} plan={plan} sub={sub} used={usedCount} onClose={() => setShowInvoice(false)} />
      )}

      <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-5">
        <div>
          <div className="text-xs font-mono font-bold uppercase tracking-wider text-blue-600">Self-Service Billing</div>
          <h3 className="text-2xl font-bold text-slate-950 mt-1">Plan &amp; Seat Subscription</h3>
        </div>
        <div className="flex items-center gap-3">
          <button onClick={() => setShowInvoice(true)}
            className="inline-flex items-center gap-1.5 rounded-full border border-slate-300 bg-white px-3.5 py-1 text-xs font-bold text-slate-700 hover:bg-slate-50 transition shadow-2xs">
            🧾 View / Print Receipt
          </button>
          {lapsed ? (
            <span className="rounded-full border border-rose-200 bg-rose-50 px-3.5 py-1 text-xs font-bold text-rose-700">
              {expiredTrial ? "Trial Ended" : "Payment Action Needed"}
            </span>
          ) : (
            <span className="rounded-full border border-emerald-200 bg-emerald-50 px-3.5 py-1 text-xs font-bold text-emerald-800 flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-emerald-500"></span> Active Subscription
            </span>
          )}
        </div>
      </div>

      {/* Current Active Plan Overview Card */}
      <div className="bg-slate-50 border-2 border-slate-200 rounded-3xl p-5 sm:p-6 space-y-5">
        <div className="flex flex-wrap items-start justify-between gap-4">
          <div>
            <div className="text-[11px] font-mono font-bold uppercase tracking-wider text-slate-500">Current Subscription</div>
            <div className="text-2xl font-black text-slate-950 mt-0.5">{plan ? plan.name : sub && sub.plan_code}</div>
            <div className="text-xs text-slate-600 mt-1 font-semibold">
              {plan && plan.price_display ? plan.price_display : ""}
              {sub && sub.current_period_end ? ` · Renews ${String(sub.current_period_end).slice(0,10)}` : ""}
            </div>
            <div className="mt-2 inline-flex items-center gap-1.5 rounded-full bg-slate-200/80 px-3 py-1 text-xs font-bold text-slate-800">
              🛡️ {limit != null ? `${limit} Total Seats Allocated` : "Unlimited Seats"}
            </div>
          </div>

          <div className="flex items-center gap-3">
            <div className="bg-white border-2 border-slate-200 rounded-2xl px-5 py-3 text-right shadow-xs min-w-[140px]">
              <div className="text-2xl font-black text-slate-950">
                {usedCount} <span className="text-sm font-bold text-slate-400">/ {limit != null ? limit : "∞"}</span>
              </div>
              <div className="text-[11px] font-bold text-slate-500 mt-0.5">
                {availableSeats === 0 ? (
                  <span className="text-rose-600">● 0 Seats Left (Full)</span>
                ) : limit != null ? (
                  <span className="text-emerald-700">● {availableSeats} Seat{availableSeats > 1 ? "s" : ""} Available</span>
                ) : (
                  <span className="text-emerald-700">● Unlimited Capacity</span>
                )}
              </div>
            </div>

            {isOwner && limit != null && (
              <button 
                onClick={() => setShowExtra(!showExtra)}
                className="rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 px-4 py-3 text-xs font-black transition shadow-sm flex items-center gap-1.5"
              >
                <span>⚡</span>
                <span>{showExtra ? "Close Adjuster" : "+ Adjust Seats"}</span>
              </button>
            )}
          </div>
        </div>

        {/* Visual Multi-Segment Seat Allocation Bar */}
        {limit != null && (
          <div className="space-y-2 pt-2 border-t border-slate-200/80">
            <div className="flex items-center justify-between text-xs font-bold">
              <span className="text-slate-700">Workspace Seat Allocation</span>
              <span className="text-slate-500 font-mono">{Math.min(100, Math.round((usedCount / limit) * 100))}% In Use</span>
            </div>

            <div className="w-full h-3.5 rounded-full bg-slate-200/80 overflow-hidden flex shadow-inner p-0.5">
              {/* Active Members Segment (Emerald) */}
              {activeCount > 0 && (
                <div 
                  style={{ width: `${Math.min(100, (activeCount / limit) * 100)}%` }} 
                  className="bg-emerald-500 h-full rounded-full transition-all"
                  title={`${activeCount} Active Member(s)`}
                />
              )}
              {/* Pending Invites Segment (Amber) */}
              {pendingCount > 0 && (
                <div 
                  style={{ width: `${Math.min(100, (pendingCount / limit) * 100)}%` }} 
                  className="bg-amber-400 h-full rounded-full transition-all ml-0.5"
                  title={`${pendingCount} Pending Invite(s) reserving seats`}
                />
              )}
            </div>

            {/* Clear Legend Pills */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
              <div className="rounded-xl border border-emerald-200 bg-emerald-50/80 p-2.5 flex items-center gap-2.5">
                <span className="h-3 w-3 rounded-full bg-emerald-500 shrink-0"></span>
                <div>
                  <div className="text-xs font-black text-emerald-950">{activeCount} Active Member{activeCount === 1 ? "" : "s"}</div>
                  <div className="text-[10px] text-emerald-800 font-medium">Joined &amp; using workspace</div>
                </div>
              </div>

              <div className="rounded-xl border border-amber-200 bg-amber-50/80 p-2.5 flex items-center gap-2.5">
                <span className="h-3 w-3 rounded-full bg-amber-400 shrink-0"></span>
                <div>
                  <div className="text-xs font-black text-amber-950">{pendingCount} Pending Invite{pendingCount === 1 ? "" : "s"}</div>
                  <div className="text-[10px] text-amber-800 font-medium">Reserved for invited emails</div>
                </div>
              </div>

              <div className="rounded-xl border border-slate-200 bg-white p-2.5 flex items-center gap-2.5">
                <span className="h-3 w-3 rounded-full bg-slate-300 shrink-0"></span>
                <div>
                  <div className="text-xs font-black text-slate-950">{availableSeats} Seat{availableSeats === 1 ? "" : "s"} Left</div>
                  <div className="text-[10px] text-slate-500 font-medium">Ready to invite team</div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Detailed Seat Occupancy Breakdown & Quick Revoke */}
        {pendingCount > 0 && (
          <div className="rounded-2xl border border-amber-200 bg-amber-50/60 p-4 space-y-2.5 text-xs">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <span className="font-extrabold text-amber-950 uppercase tracking-wider text-[11px] flex items-center gap-1.5">
                <span>✉️</span>
                <span>Pending Invites Reserving Your Seats ({pendingCount})</span>
              </span>
              <span className="text-[11px] text-amber-800 font-medium">
                Pending invitations hold seats until accepted or revoked
              </span>
            </div>

            <div className="divide-y divide-amber-200/60 bg-white rounded-xl border border-amber-200 overflow-hidden">
              {pendingInvites.map(inv => (
                <div key={inv.id} className="p-3 flex items-center justify-between flex-wrap gap-2">
                  <div>
                    <span className="font-bold text-slate-900">{inv.email}</span>
                    <span className="ml-2 rounded-full bg-amber-100 px-2 py-0.5 text-[10px] font-bold text-amber-900 border border-amber-200 uppercase">
                      {inv.role}
                    </span>
                    <div className="text-[10px] text-slate-400 font-mono mt-0.5">
                      Invited on {new Date(inv.created_at).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })}
                    </div>
                  </div>

                  <button
                    onClick={() => handleRevokeInvite(inv.id, inv.email)}
                    className="rounded-xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 px-3 py-1.5 text-xs font-bold transition shadow-2xs"
                  >
                    ✕ Revoke Invite to Free 1 Seat
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Self-Service Add/Remove Seats Control */}
      {showExtra && isOwner && (
        <div className="rounded-2xl border border-amber-300 bg-amber-50 p-5 space-y-3">
          <div className="text-xs font-bold uppercase tracking-wider text-amber-900">Self-Service Seat Quantity Adjuster</div>
          <p className="text-xs text-amber-800 leading-relaxed font-medium">
            Add or reduce team seats dynamically. Seat additions process prorated charges via Razorpay immediately; seat reductions take effect on your next cycle.
          </p>
          <div className="flex flex-wrap items-center gap-3 pt-2">
            <label className="text-xs font-bold text-slate-800">Extra Seats to Add:
              <select value={extraCount} onChange={e=>setExtraCount(Number(e.target.value))}
                className="ml-2 rounded-xl border border-slate-300 bg-white px-3 py-1.5 text-xs font-bold text-slate-950 outline-none">
                {[1,2,3,4,5,10,15,20,25,50].map(n => <option key={n} value={n}>+{n} Seat{n > 1 ? "s" : ""} (₹{n * 399}/mo)</option>)}
              </select>
            </label>
            <button onClick={buyExtraSeats} disabled={busy === "extra"}
              className="rounded-xl bg-slate-950 px-5 py-2 text-xs font-bold text-white hover:bg-slate-800 transition shadow-md disabled:opacity-60">
              {busy === "extra" ? "Updating Mandate…" : `Confirm & Add +${extraCount} Seat${extraCount > 1 ? "s" : ""}`}
            </button>
          </div>
        </div>
      )}

      {msg && (
        <div className="rounded-2xl border border-blue-200 bg-blue-50 p-4 text-xs font-bold text-blue-900 leading-relaxed">
          {msg}
        </div>
      )}

      {/* Self-Service Plan Upgrade & Downgrade Options */}
      {isOwner ? (
        <div className="space-y-4">
          <div>
            <h4 className="text-sm font-bold text-slate-950 uppercase tracking-wide">Self-Service Plan Switcher (Upgrade / Downgrade)</h4>
            <p className="text-xs text-slate-500">Switch your subscription plan tier instantly. Select any plan below to upgrade or downgrade.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {plans.map(p => {
              const isCurrent = sub && p.code === sub.plan_code;
              const isUpgrade = !plan || (p.seat_limit == null ? true : (limit != null && p.seat_limit > limit));
              const isBusy = busy === p.code;

              return (
                <div key={p.code} className={`rounded-2xl border p-5 transition flex flex-col justify-between ${
                  isCurrent 
                    ? "border-amber-400 bg-amber-50/50 shadow-md" 
                    : "border-slate-200 bg-white hover:border-slate-300"
                }`}>
                  <div>
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-slate-950 text-base">{p.name}</span>
                      {isCurrent && (
                        <span className="bg-amber-400 text-slate-950 text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full">
                          CURRENT PLAN
                        </span>
                      )}
                    </div>
                    <div className="text-xl font-extrabold text-slate-950 mt-2">{p.price_display}</div>
                    <div className="text-xs text-slate-500 mt-1 font-medium">
                      {p.seat_limit == null ? "Unlimited team seats" : `Includes up to ${p.seat_limit} seat${p.seat_limit===1?"":"s"}`}
                    </div>
                  </div>

                  <div className="mt-6 pt-4 border-t border-slate-100">
                    {isCurrent ? (
                      <div className="text-xs font-bold text-amber-900 bg-amber-100 border border-amber-200 rounded-xl px-3 py-2 text-center">
                        ✓ Your Active Plan
                      </div>
                    ) : (
                      <button
                        onClick={() => handleSelfServicePlanChange(p)}
                        disabled={!!busy}
                        className={`w-full py-2.5 rounded-xl text-xs font-bold transition shadow-xs flex items-center justify-center gap-1.5 ${
                          isUpgrade
                            ? "bg-slate-950 text-white hover:bg-slate-800"
                            : "bg-white border border-slate-300 text-slate-800 hover:bg-slate-50"
                        }`}
                      >
                        {isBusy ? "Processing Plan Change…" : isUpgrade ? `⚡ Self-Service Upgrade to ${p.name}` : `⬇️ Self-Service Downgrade to ${p.name}`}
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {pendingReq && (
            <p className="rounded-xl border border-sky-200 bg-sky-50 p-4 text-xs text-sky-900 font-medium">
              Requested <b>{(plans.find(p=>p.code===pendingReq.plan_code)||{}).name || pendingReq.plan_code}</b> —
              custom setup pending.
              <button onClick={withdraw} className="ml-2 underline font-bold hover:no-underline">Withdraw Request</button>
            </p>
          )}
        </div>
      ) : (
        <p className="text-xs text-slate-500 italic">Only company owners can modify plan tier subscriptions or seat allocations.</p>
      )}
    </div>
  );
}

/*  Admin — the platform operator's view. Billing only: which         */
/*  companies exist, what they're on, and what they've asked for.     */
/*  No access to anyone's planner, by design.                         */
/* ================================================================== */
const STATUS_OPTIONS = ["active","trialing","past_due","canceled"];
const blankPlan = () => ({ code:"", name:"", seat_limit:"", price_display:"", sort_order:0 });

function AdminView({ meId }){
  const [d, setD] = useState(null);
  const [msg, setMsg] = useState("");
  const [tab, setTab] = useState("overview");   // overview | companies | users | requests | plans
  const [err, setErr] = useState("");

  const refresh = () => loadAdminData().then(setD)
    .catch(e => { setErr(e.message || "Couldn't load admin data."); setD({companies:[],plans:[],requests:[]}); });
  useEffect(() => { refresh(); }, []);

  if (err) return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <h3 className="mb-2 font-semibold text-slate-700">Admin</h3>
      <p className="text-xs text-slate-500">
        Couldn't load: {err}. If this mentions a missing table, run
        <b> supabase-phase5-admin.sql</b> in Supabase → SQL Editor.
      </p>
    </div>
  );
  if (!d) return <Ghost>Loading admin…</Ghost>;

  const pending = d.requests.filter(r => r.status === "pending");
  const say = (t) => { setMsg(t); setTimeout(()=>setMsg(""), 6000); };

  const approve = async (r) => {
    const plan = d.plans.find(p => p.code === r.plan_code);
    try {
      await setSubscription(r.org_id, {
        plan_code: r.plan_code, status: "active",
        seats: plan ? plan.seat_limit : null, until: null,
      });
      await decideRequest(r.id, "approved", meId);
      say(`Approved — that company is now on ${plan ? plan.name : r.plan_code}.`);
      refresh();
    } catch (e) { say("Couldn't approve: " + (e.message||"")); }
  };

  const decline = async (r) => {
    try { await decideRequest(r.id, "declined", meId); say("Request declined."); refresh(); }
    catch (e) { say("Couldn't decline: " + (e.message||"")); }
  };

  // Executive Metric Calculations
  const totalCompanies = d.companies.length;
  const totalUsers = (d.profiles || []).length;
  const activeSubs = d.companies.filter(c => c.sub?.status === "active" && c.sub?.plan_code);
  const trialSubs = d.companies.filter(c => c.sub?.status === "trialing" && c.sub?.plan_code);
  
  // Build pricing lookup from plans table
  const planPriceMap = {};
  (d.plans || []).forEach(p => {
    let price = 0;
    const match = (p.price_display || "").match(/\d+/);
    if (match) price = parseInt(match[0], 10);
    else if (p.code === "solo") price = 399;
    else if (p.code === "starter") price = 999;
    planPriceMap[p.code] = price;
  });

  // Calculate actual paid MRR only from post-trial active paid subscriptions
  let mrr = 0;
  activeSubs.forEach(c => {
    const code = c.sub?.plan_code;
    mrr += (planPriceMap[code] || 0);
  });

  // Calculate potential pipeline from 15-day free trials
  let trialPipeline = 0;
  trialSubs.forEach(c => {
    const code = c.sub?.plan_code;
    trialPipeline += (planPriceMap[code] || 0);
  });

  const arr = mrr * 12;
  const conversionRate = totalCompanies > 0 ? Math.round((activeSubs.length / totalCompanies) * 100) : 0;

  const exportBusinessCsv = () => {
    const headers = ["Company Name", "Owner Email", "Plan Code", "Status", "Seats", "Created At"];
    const rows = d.companies.map(c => [
      `"${(c.name||"").replace(/"/g,'""')}"`,
      `"${(c.owner?.email||"").replace(/"/g,'""')}"`,
      `"${c.sub?.plan_code || "none"}"`,
      `"${c.sub?.status || "inactive"}"`,
      c.seats || 1,
      `"${c.created_at || ""}"`
    ]);
    const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r=>r.join(","))].join("\n");
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `FlowDirector_Business_Report_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const TabBtn = ({id, children}) => (
    <button onClick={()=>setTab(id)}
      className={"rounded-xl px-4 py-2 text-xs font-bold transition "+(tab===id
        ? "bg-slate-950 text-white shadow-md" : "border border-slate-200 bg-white text-slate-700 hover:bg-slate-50")}>
      {children}
    </button>
  );

  return (
    <div className="space-y-6">
      {/* Executive Revenue & Growth KPI Cards */}
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-xs">
          <div className="text-xs font-bold uppercase tracking-wider text-slate-500">Live Paid MRR</div>
          <div className="text-2xl font-extrabold text-slate-950 mt-1">₹{mrr.toLocaleString("en-IN")}</div>
          <div className="text-[11px] font-medium text-slate-500 mt-1">
            ARR: ₹{arr.toLocaleString("en-IN")}/yr {trialPipeline > 0 ? `· Pipeline: ₹${trialPipeline.toLocaleString("en-IN")}/mo` : ""}
          </div>
        </div>

        <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-xs">
          <div className="text-xs font-bold uppercase tracking-wider text-slate-500">Active Paid Mandates</div>
          <div className="text-2xl font-extrabold text-slate-950 mt-1">{activeSubs.length} <span className="text-xs font-normal text-slate-500">/ {totalCompanies} workspaces</span></div>
          <div className="text-[11px] font-medium text-amber-700 mt-1">{trialSubs.length} in 15-day free trial</div>
        </div>

        <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-xs">
          <div className="text-xs font-bold uppercase tracking-wider text-slate-500">Total Registered Users</div>
          <div className="text-2xl font-extrabold text-slate-950 mt-1">{totalUsers}</div>
          <div className="text-[11px] font-medium text-blue-600 mt-1">Across all workspace seats</div>
        </div>

        <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-xs">
          <div className="text-xs font-bold uppercase tracking-wider text-slate-500">Mandate Conversion Rate</div>
          <div className="text-2xl font-extrabold text-slate-950 mt-1">{conversionRate}%</div>
          <div className="text-[11px] font-medium text-emerald-600 mt-1">Free Trial to Active Paid</div>
        </div>
      </div>

      {msg && <p className="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-xs font-bold text-emerald-900 leading-relaxed">{msg}</p>}

      <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-3">
        <div className="flex flex-wrap gap-2">
          <TabBtn id="overview">📊 Overview & Revenue</TabBtn>
          <TabBtn id="companies">🏢 Companies ({d.companies.length})</TabBtn>
          <TabBtn id="users">👥 Users ({(d.profiles||[]).length})</TabBtn>
          <TabBtn id="training">📹 Training & Coaches</TabBtn>
          <TabBtn id="requests">📩 Plan Requests{pending.length ? ` (${pending.length})` : ""}</TabBtn>
          <TabBtn id="plans">💳 Pricing Plans ({d.plans.length})</TabBtn>
        </div>

        <button onClick={exportBusinessCsv}
          className="rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-bold text-slate-800 hover:bg-slate-50 transition flex items-center gap-1.5 shadow-2xs">
          📊 Export Revenue CSV Report
        </button>
      </div>

      {tab === "overview" && (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-xs">
              <h3 className="text-sm font-bold uppercase tracking-wider text-slate-950 mb-3">Subscription Distribution</h3>
              <div className="space-y-4">
                {d.plans.map(p => {
                  const count = d.companies.filter(c => c.sub?.plan_code === p.code).length;
                  const pct = totalCompanies > 0 ? Math.round((count / totalCompanies) * 100) : 0;
                  return (
                    <div key={p.code} className="space-y-1">
                      <div className="flex items-center justify-between text-xs font-medium">
                        <span className="text-slate-700 font-semibold">{p.name} ({p.price_display || p.code})</span>
                        <span className="font-extrabold text-slate-950">{count} Workspace{count === 1 ? "" : "s"} ({pct}%)</span>
                      </div>
                      <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div className="bg-blue-600 h-full transition-all duration-300" style={{ width: `${pct}%` }}></div>
                      </div>
                    </div>
                  );
                })}

                <div className="space-y-1 pt-2 border-t border-slate-100">
                  <div className="flex items-center justify-between text-xs font-medium">
                    <span className="text-slate-700 font-semibold">15-Day Free Trial Mandates Active</span>
                    <span className="font-extrabold text-amber-700">{trialSubs.length} Workspace{trialSubs.length === 1 ? "" : "s"}</span>
                  </div>
                  <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div className="bg-amber-400 h-full transition-all duration-300" style={{ width: `${totalCompanies > 0 ? Math.round((trialSubs.length / totalCompanies) * 100) : 0}%` }}></div>
                  </div>
                </div>
              </div>
            </div>

            <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-xs">
              <h3 className="text-sm font-bold uppercase tracking-wider text-slate-950 mb-3">Recent Activity & Workspaces</h3>
              <div className="space-y-2.5">
                {d.companies.slice(0, 5).map(c => (
                  <div key={c.id} className="flex items-center justify-between text-xs py-2 border-b border-slate-100 last:border-0">
                    <div>
                      <span className="font-bold text-slate-950">{c.name}</span>
                      <span className="text-slate-500 ml-1">· {c.owner?.email || "Unknown owner"}</span>
                      {c.phone && <span className="text-slate-400 ml-1">({c.phone})</span>}
                    </div>
                    <span className={`px-2 py-0.5 rounded-md font-bold text-[10px] uppercase tracking-wider ${
                      c.sub?.status === "active" ? "bg-emerald-100 text-emerald-900" : c.sub?.status === "trialing" ? "bg-blue-100 text-blue-900" : "bg-amber-100 text-amber-900"
                    }`}>
                      {c.sub?.status || "no mandate"}
                    </span>
                  </div>
                ))}
                {d.companies.length === 0 && <p className="text-xs text-slate-400">No recent activity logged.</p>}
              </div>
            </div>
          </div>
        </div>
      )}

      {tab === "users" && (
        <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-xs">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-bold text-base text-slate-900">Registered Executive Accounts ({(d.profiles||[]).length})</h3>
          </div>
          {(d.profiles||[]).length === 0 && <p className="text-sm text-slate-400">No users found.</p>}
          <div className="space-y-3">
            {(d.profiles||[]).map(p => {
              const mem = (d.members||[]).find(m => m.user_id === p.id);
              const comp = mem ? d.companies.find(c => c.id === mem.org_id) : null;
              return (
                <div key={p.id} className="rounded-xl border border-slate-200 bg-stone-50/70 p-4 text-xs space-y-2">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2">
                      <span className="font-extrabold text-sm text-slate-950">{p.full_name || p.email || "No Name"}</span>
                      <span className={`rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide ${
                        p.email_verified 
                          ? "bg-emerald-100 text-emerald-800 border border-emerald-300" 
                          : "bg-amber-100 text-amber-800 border border-amber-300"
                      }`}>
                        {p.email_verified ? "✓ Email Verified" : "⚠ Unverified Email"}
                      </span>
                      {p.profile_completed && (
                        <span className="rounded-full bg-blue-100 px-2 py-0.5 text-[10px] font-bold text-blue-800 border border-blue-200">
                          Profile Complete
                        </span>
                      )}
                    </div>
                    <button onClick={async () => {
                      if (window.confirm(`Permanently delete user ${p.email || p.id}? This cannot be undone.`)) {
                        try {
                          await adminDeleteUser(p.id);
                          say(`Deleted user ${p.email || p.id}`);
                          refresh();
                        } catch (e) { say("Couldn't delete user: " + (e.message || "")); }
                      }
                    }} className="rounded-lg border border-rose-300 bg-white px-2.5 py-1 font-bold text-rose-700 hover:bg-rose-50 transition shadow-2xs">
                      🗑 Delete User
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 text-slate-600 pt-1 border-t border-slate-200/60">
                    <div><b>Email:</b> {p.email}</div>
                    <div><b>Mobile / WhatsApp:</b> {p.phone || "—"}</div>
                    <div><b>Role / Title:</b> {p.role_title || "Founder / CEO"}</div>
                    <div><b>Industry:</b> {p.industry || "—"}</div>
                  </div>

                  <div className="flex flex-wrap items-center justify-between text-[11px] text-slate-500 pt-1">
                    <div>
                      <b>Workspace:</b> {comp ? `${comp.name} (${mem.role})` : "Solo Workspace"}
                    </div>
                    <div>
                      <b>Signed Up:</b> {p.created_at ? new Date(p.created_at).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "—"}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {tab === "requests" && (
        <div className="rounded-lg border border-slate-200 bg-white p-4">
          <h3 className="mb-3 font-semibold text-slate-700">Plan requests</h3>
          {pending.length === 0 && <p className="text-sm text-slate-400">Nothing waiting.</p>}
          <div className="space-y-2">
            {pending.map(r => {
              const c = d.companies.find(x => x.id === r.org_id);
              const plan = d.plans.find(p => p.code === r.plan_code);
              return (
                <div key={r.id} className="rounded-md border border-amber-200 bg-amber-50 p-3">
                  <div className="text-sm font-medium text-slate-800">
                    {c ? c.name : r.org_id} wants {plan ? plan.name : r.plan_code}
                  </div>
                  <div className="text-xs text-slate-500">
                    {c && c.owner.email ? c.owner.email + " · " : ""}
                    {c ? `${c.seats} people` : ""} · asked {String(r.created_at).slice(0,10)}
                  </div>
                  {r.note && <p className="mt-1 text-xs italic text-slate-600">"{r.note}"</p>}
                  <div className="mt-2 flex gap-2">
                    <button onClick={()=>approve(r)}
                      className="rounded-md bg-slate-900 px-3 py-1.5 text-xs text-white hover:bg-slate-700">Approve</button>
                    <button onClick={()=>decline(r)}
                      className="rounded-md border border-slate-300 px-3 py-1.5 text-xs text-slate-600 hover:bg-white">Decline</button>
                  </div>
                </div>
              );
            })}
          </div>
          {d.requests.filter(r=>r.status!=="pending").length > 0 && (
            <div className="mt-4 border-t border-slate-100 pt-3">
              <div className="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-400">Decided</div>
              {d.requests.filter(r=>r.status!=="pending").slice(0,10).map(r => {
                const c = d.companies.find(x => x.id === r.org_id);
                return <div key={r.id} className="text-xs text-slate-500">
                  {c ? c.name : r.org_id} → {r.plan_code} · {r.status} · {String(r.decided_at||"").slice(0,10)}
                </div>;
              })}
            </div>
          )}
        </div>
      )}

      {tab === "companies" && (
        <div className="space-y-3">
          {d.companies.map(c => <AdminCompanyRow key={c.id} c={c} plans={d.plans} onSaved={(t)=>{say(t); refresh();}} />)}
          {d.companies.length === 0 && <p className="text-sm text-slate-400">No companies yet.</p>}
        </div>
      )}

      {tab === "training" && <AdminTrainingOperations onNotice={(t)=>{say(t); refresh();}} />}

      {tab === "plans" && <AdminPlans plans={d.plans} onSaved={(t)=>{say(t); refresh();}} />}
    </div>
  );
}

/* ================================================================== */
/*  Admin Training Operations & Schedule Control Center                */
/* ================================================================== */
function AdminTrainingOperations({ onNotice }){
  const [subTab, setSubTab] = useState("coaches"); // coaches | sessions | config
  const [coaches, setCoaches] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [config, setConfig] = useState({ slots: [], days: [], default_meet_link: "" });
  const [loading, setLoading] = useState(true);
  const [draftCoach, setDraftCoach] = useState(null); // coach being added/edited
  const [newSlotInput, setNewSlotInput] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [coachFilter, setCoachFilter] = useState("all");
  const [busy, setBusy] = useState(false);

  const refresh = async () => {
    setLoading(true);
    try {
      const [cList, sList, cfg] = await Promise.all([
        loadCoaches(),
        loadTrainingSessions(),
        loadTrainingConfig()
      ]);
      setCoaches(cList);
      setSessions(sList);
      setConfig(cfg);
    } catch (e) {
      if (onNotice) onNotice("Failed to load training operations: " + (e.message || ""));
    }
    setLoading(false);
  };

  useEffect(() => { refresh(); }, []);

  const handleSaveCoach = async () => {
    if (!draftCoach.name.trim() || !draftCoach.email.trim() || !draftCoach.google_meet_link.trim()) {
      return alert("Name, Email, and Google Meet link are required.");
    }
    setBusy(true);
    try {
      await saveCoach({
        id: draftCoach.id || undefined,
        name: draftCoach.name.trim(),
        email: draftCoach.email.trim().toLowerCase(),
        phone: draftCoach.phone || null,
        google_meet_link: draftCoach.google_meet_link.trim(),
        max_daily_sessions: Number(draftCoach.max_daily_sessions) || 6,
        is_active: draftCoach.is_active ?? true
      });
      if (onNotice) onNotice(`Saved coach ${draftCoach.name}.`);
      setDraftCoach(null);
      refresh();
    } catch (e) {
      if (onNotice) onNotice("Couldn't save coach: " + (e.message || ""));
    }
    setBusy(false);
  };

  const handleToggleCoachActive = async (c) => {
    try {
      await saveCoach({ id: c.id, is_active: !c.is_active });
      if (onNotice) onNotice(`${c.name} is now ${!c.is_active ? "Active (Auto-Assign ON)" : "Paused"}.`);
      refresh();
    } catch (e) {
      if (onNotice) onNotice("Failed: " + e.message);
    }
  };

  const handleDeleteCoach = async (c) => {
    if (!confirm(`Delete coach ${c.name}? Their previous sessions will be preserved.`)) return;
    try {
      await deleteCoach(c.id);
      if (onNotice) onNotice(`Deleted coach ${c.name}.`);
      refresh();
    } catch (e) {
      if (onNotice) onNotice("Couldn't delete coach: " + e.message);
    }
  };

  const handleReassignSession = async (sessionId, newCoachId) => {
    const targetCoach = coaches.find(c => c.id === newCoachId);
    try {
      await updateTrainingSession(sessionId, {
        coach_id: newCoachId || null,
        meet_link: targetCoach ? targetCoach.google_meet_link : "https://meet.google.com/new"
      });
      if (onNotice) onNotice(`Session reassigned to ${targetCoach ? targetCoach.name : "Unassigned"}.`);
      refresh();
    } catch (e) {
      if (onNotice) onNotice("Couldn't reassign session: " + e.message);
    }
  };

  const handleSendAdminReminder = async (s) => {
    try {
      let targetEmail = "";
      const { data: mem } = await sb.from("memberships").select("user_id").eq("org_id", s.org_id).limit(1).maybeSingle();
      if (mem && mem.user_id) {
        const { data: prof } = await sb.from("profiles").select("email, full_name").eq("id", mem.user_id).maybeSingle();
        if (prof && prof.email) targetEmail = prof.email;
      }
      if (!targetEmail) {
        throw new Error("Could not locate registered founder email for this company.");
      }
      const coach = s.coach || coaches.find(c => c.id === s.coach_id) || { name: "Executive Onboarding Team" };
      await sendTransactionalEmail("training_reminder", targetEmail, {
        scheduled_time: `${s.scheduled_date} at ${s.scheduled_slot}`,
        meet_link: s.meet_link,
        coach_name: coach.name,
        founder_name: s.org?.name || "Leader",
        topic: s.topic
      });
      if (onNotice) onNotice(`Pre-call 1-hour reminder email dispatched to ${targetEmail}!`);
    } catch (e) {
      if (onNotice) onNotice("Couldn't dispatch reminder: " + (e.message || ""));
    }
  };

  const handleUpdateSessionStatus = async (sessionId, status) => {
    try {
      await updateTrainingSession(sessionId, { status });
      if (onNotice) onNotice(`Session marked as ${status}.`);
      refresh();
    } catch (e) {
      if (onNotice) onNotice("Failed: " + e.message);
    }
  };

  const handleAddSlot = async () => {
    if (!newSlotInput.trim()) return;
    const updatedSlots = [...(config.slots || []), newSlotInput.trim()];
    const newConfig = { ...config, slots: updatedSlots };
    setConfig(newConfig);
    setNewSlotInput("");
    await saveTrainingConfig(newConfig);
    if (onNotice) onNotice("New time slot added!");
  };

  const handleRemoveSlot = async (idx) => {
    const updatedSlots = config.slots.filter((_, i) => i !== idx);
    const newConfig = { ...config, slots: updatedSlots };
    setConfig(newConfig);
    await saveTrainingConfig(newConfig);
    if (onNotice) onNotice("Time slot removed.");
  };

  const handleToggleDay = async (day) => {
    const currentDays = config.days || [];
    const updatedDays = currentDays.includes(day)
      ? currentDays.filter(d => d !== day)
      : [...currentDays, day];
    const newConfig = { ...config, days: updatedDays };
    setConfig(newConfig);
    await saveTrainingConfig(newConfig);
    if (onNotice) onNotice("Working days updated.");
  };

  if (loading) return <Ghost>Loading training operations data...</Ghost>;

  const filteredSessions = sessions.filter(s => {
    if (statusFilter !== "all" && s.status !== statusFilter) return false;
    if (coachFilter !== "all" && s.coach_id !== coachFilter) return false;
    return true;
  });

  return (
    <div className="space-y-6">
      {/* Sub tabs */}
      <div className="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs">
        <div className="flex items-center gap-2">
          <button onClick={() => setSubTab("coaches")}
            className={`rounded-xl px-4 py-2 text-xs font-bold transition ${subTab==="coaches" ? "bg-slate-950 text-white shadow-xs" : "border border-slate-200 text-slate-700 hover:bg-slate-50"}`}>
            👥 Coaches Roster ({coaches.length})
          </button>
          <button onClick={() => setSubTab("sessions")}
            className={`rounded-xl px-4 py-2 text-xs font-bold transition ${subTab==="sessions" ? "bg-slate-950 text-white shadow-xs" : "border border-slate-200 text-slate-700 hover:bg-slate-50"}`}>
            📋 Scheduled Sessions Ledger ({sessions.length})
          </button>
          <button onClick={() => setSubTab("config")}

              ))}

          </div>

          {/* Working Days */}
          <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-xs space-y-4">
            <h3 className="font-extrabold text-sm text-slate-950 uppercase tracking-wider">Active Booking Days</h3>
            <p className="text-xs text-slate-500">Select the days of the week on which coaching calls can be booked.</p>

            <div className="grid grid-cols-2 gap-2 pt-2">
              {["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"].map(day => {
                const isActive = (config.days || []).includes(day);
                return (
                  <button 
                    key={day}
                    onClick={() => handleToggleDay(day)}
                    className={`p-3 rounded-xl text-xs font-bold border transition flex items-center justify-between ${

                    }`}
                  >
                    <span>{day}</span>
                    <span>{isActive ? "✓" : "+"}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminCompanyRow({ c, plans, onSaved }){
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const sub = c.sub || {};
  const [planCode, setPlanCode] = useState(sub.plan_code || "starter");
  const [status, setStatus] = useState(sub.status || "trialing");
  const [seats, setSeats] = useState(sub.seats == null ? "" : String(sub.seats));
  const [until, setUntil] = useState(sub.current_period_end ? String(sub.current_period_end).slice(0,10) : "");
  const limit = seatLimitOf(c.sub, plans);
  const expired = trialExpired(c.sub);

  const save = async () => {
    setBusy(true);
    try {
      await setSubscription(c.id, { plan_code:planCode, status, seats, until });
      onSaved(`${c.name} is now on ${planCode} (${status}).`);
      setOpen(false);
    } catch (e) { onSaved("Couldn't save: " + (e.message||"")); }
    setBusy(false);
  };

  const startTrial = (days) => {
    const d = new Date(); d.setDate(d.getDate() + days);
    setStatus("trialing"); setUntil(dateKey(d));
  };

  return (
    <div className="rounded-2xl border border-slate-200 bg-white p-4 shadow-xs space-y-3">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <div className="flex items-center gap-2">
            <span className="font-bold text-sm text-slate-950">{c.name}</span>
            <span className={`rounded-full border px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider ${
              expired ? "border-rose-200 bg-rose-50 text-rose-700"
              : sub.status === "active" ? "border-emerald-200 bg-emerald-50 text-emerald-700"
              : sub.status === "trialing" ? "border-sky-200 bg-sky-50 text-sky-700"
              : "border-slate-200 bg-slate-50 text-slate-600"
            }`}>
              {sub.plan_code || "no mandate"}{sub.status ? " · " + (expired ? "trial ended" : sub.status) : ""}
            </span>
            {c.training_status === "booked" && (
              <span className="rounded-full bg-emerald-100 border border-emerald-300 px-2 py-0.5 text-[10px] font-bold text-emerald-950">
                📅 Google Meet Booked
              </span>
            )}
          </div>

          <div className="mt-1 text-xs text-slate-500 flex flex-wrap items-center gap-2">
            <span>Owner: <b>{c.owner?.full_name || c.owner?.email || "Unknown"}</b> ({c.owner?.email})</span>
            {c.phone && <span>· 📱 {c.phone}</span>}
            <span>· 👥 {c.seats} {c.seats===1?"person":"people"} {limit != null ? `(limit: ${limit})` : "· unlimited"}</span>
            {c.industry && <span>· 🏭 {c.industry}</span>}
          </div>

          {c.training_status === "booked" && c.training_notes && (
            <div className="mt-2 rounded-lg bg-emerald-50 border border-emerald-200 p-2 text-[11px] text-emerald-950">
              <b>Training Note:</b> {c.training_notes}
            </div>
          )}
        </div>

        <div className="flex items-center gap-2">
          <button onClick={()=>setOpen(!open)}
            className="rounded-xl border border-slate-300 bg-white px-3 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-50 transition shadow-2xs">
            {open ? "Close" : "✏️ Edit Plan / Status"}
          </button>
          <button onClick={async () => {
            if (window.confirm(`Permanently delete company "${c.name}" and all its memberships? This cannot be undone.`)) {
              try {
                await adminDeleteCompany(c.id);
                onSaved(`Deleted company "${c.name}".`);
              } catch (e) { onSaved("Couldn't delete company: " + (e.message || "")); }
            }
          }} className="rounded-xl border border-rose-300 bg-white px-3 py-1.5 text-xs font-bold text-rose-700 hover:bg-rose-50 transition shadow-2xs">
            🗑 Delete
          </button>
        </div>
      </div>

      {open && (
        <div className="mt-3 border-t border-slate-100 pt-3 bg-slate-50 p-4 rounded-xl">
          <div className="grid gap-3 sm:grid-cols-2 md:grid-cols-4">
            <label className="text-xs text-slate-500 font-semibold">Plan
              <select value={planCode} onChange={e=>setPlanCode(e.target.value)}
                className="mt-1 block w-full rounded-xl border border-slate-200 bg-white px-2.5 py-2 text-xs font-bold">
                {plans.map(p => <option key={p.code} value={p.code}>{p.name} ({p.code})</option>)}
              </select>
            </label>
            <label className="text-xs text-slate-500 font-semibold">Subscription Status
              <select value={status} onChange={e=>setStatus(e.target.value)}
                className="mt-1 block w-full rounded-xl border border-slate-200 bg-white px-2.5 py-2 text-xs font-bold">
                {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </label>
            <label className="text-xs text-slate-500 font-semibold">Seat Limit <span className="text-slate-400 font-normal">(blank = default)</span>
              <input value={seats} onChange={e=>setSeats(e.target.value)} type="number" min="1" placeholder="—"
                className="mt-1 block w-full rounded-xl border border-slate-200 bg-white px-2.5 py-2 text-xs" />
            </label>
            <label className="text-xs text-slate-500 font-semibold">Trial Expiry Date
              <input value={until} onChange={e=>setUntil(e.target.value)} type="date"
                className="mt-1 block w-full rounded-xl border border-slate-200 bg-white px-2.5 py-2 text-xs" />
            </label>
          </div>
          <div className="mt-3 flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-200">
            <div className="flex items-center gap-1.5">
              <span className="text-xs text-slate-500 font-semibold">Quick Extension:</span>
              {[15, 30, 90].map(dys => (
                <button key={dys} onClick={()=>startTrial(dys)}
                  className="rounded-lg border border-sky-200 bg-sky-50 px-2 py-1 text-xs font-bold text-sky-700 hover:bg-sky-100">
                  +{dys} days
                </button>
              ))}
            </div>
            <button onClick={save} disabled={busy}
              className="rounded-xl bg-slate-950 px-4 py-2 text-xs font-bold text-white hover:bg-slate-800 disabled:opacity-60 shadow-xs">
              {busy ? "Saving..." : "Save Subscription Changes"}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminPlans({ plans, onSaved }){
  const [draft, setDraft] = useState(null);      // the plan being edited/created
  const [busy, setBusy] = useState(false);

  const save = async () => {
    if (!draft.code.trim()) return onSaved("A plan needs a code (short, lowercase, no spaces).");
    if (!draft.name.trim()) return onSaved("A plan needs a name.");
    setBusy(true);
    try {
      await savePlan({
        code: draft.code.trim().toLowerCase(),
        name: draft.name.trim(),
        seat_limit: draft.seat_limit === "" ? null : Number(draft.seat_limit),
        price_display: draft.price_display || null,
        price_display_yearly: draft.price_display_yearly || null,
        razorpay_plan_id: draft.razorpay_plan_id || null,
        razorpay_plan_id_yearly: draft.razorpay_plan_id_yearly || null,
        trial_days: draft.trial_days === "" ? 0 : Number(draft.trial_days),
        sort_order: Number(draft.sort_order) || 0,
      });
      onSaved(`Saved ${draft.name}.`); setDraft(null);
    } catch (e) { onSaved("Couldn't save: " + (e.message||"")); }
    setBusy(false);
  };

  const remove = async (p) => {
    if (!confirm(`Delete the ${p.name} plan? Companies already on it keep working — the row just stops being offered.`)) return;
    try { await deletePlan(p.code); onSaved(`Deleted ${p.name}.`); }
    catch (e) { onSaved("Couldn't delete (a company is probably on it): " + (e.message||"")); }
  };

  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <div className="mb-3 flex items-center justify-between">
        <h3 className="font-semibold text-slate-700">Plans</h3>

          className="rounded-md bg-slate-900 px-3 py-1.5 text-xs text-white hover:bg-slate-700">New plan</button>
      </div>

      <div className="space-y-2">
        {plans.map(p => (
          <div key={p.code} className="flex flex-wrap items-center justify-between gap-2 rounded-md border border-slate-100 bg-stone-50 px-3 py-2">
            <div>
              <span className="font-medium text-slate-800">{p.name}</span>

                {p.seat_limit == null ? "Unlimited seats" : `Up to ${p.seat_limit} seat${p.seat_limit===1?"":"s"}`}
                {p.trial_days != null ? ` · ${p.trial_days}-Day Trial Mandate` : " · 15-Day Trial Mandate"}
                {p.price_display ? " · Monthly: " + p.price_display : ""}
                {p.price_display_yearly ? " · Yearly: " + p.price_display_yearly : ""}
                {p.razorpay_plan_id ? ` · RZP: ${p.razorpay_plan_id}` : " · (No RZP Monthly ID)"}
                {p.razorpay_plan_id_yearly ? ` · RZP Yearly: ${p.razorpay_plan_id_yearly}` : ""}
              </div>
            </div>
            <div className="flex gap-2">

              <button onClick={()=>remove(p)} className="text-xs text-slate-400 hover:text-rose-500">Delete</button>
            </div>
          </div>
        ))}
      </div>

      {draft && (
        <div className="mt-4 rounded-lg border border-amber-200 bg-amber-50 p-4">
          <div className="mb-2 text-xs font-semibold uppercase tracking-wide text-amber-700">
            {plans.some(p=>p.code===draft.code) ? "Edit Plan" : "Create New Plan"}
          </div>
          <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            <label className="text-xs text-slate-500">Code (Unique Key)
              <input value={draft.code} onChange={e=>setDraft({...draft, code:e.target.value})}
                placeholder="team" disabled={plans.some(p=>p.code===draft.code)}
                className="mono mt-0.5 block w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm disabled:opacity-60" />
            </label>
            <label className="text-xs text-slate-500">Plan Name
              <input value={draft.name} onChange={e=>setDraft({...draft, name:e.target.value})} placeholder="Team Plan"
                className="mt-0.5 block w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm" />
            </label>
            <label className="text-xs text-slate-500">Seat Limit <span className="text-slate-400">(blank = unlimited)</span>
              <input value={draft.seat_limit} onChange={e=>setDraft({...draft, seat_limit:e.target.value})}
                type="number" min="1" placeholder="Unlimited"
