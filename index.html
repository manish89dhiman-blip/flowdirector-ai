const ROLE_LABEL = { 
  owner: "Founder / Owner", 
  ceo: "Chief Executive Officer (CEO)",
  director: "Director / VP",
  manager: "Department Manager", 
  sub_manager: "Sub-Manager / Lead",
  lead: "Team Lead",
  employee: "Employee / Specialist",
  member: "Team Member",
  assistant: "Executive Assistant"
};

const ROLE_HELP = {
  owner: "Full organization cockpit — manages company settings, all departments, billing, and invites.",
  ceo: "Executive leadership — sees company-wide departments, goals, and team dashboards.",
  director: "Department Executive — manages assigned operational departments and managers.",
  manager: "Department Manager — manages their department's team members and direct reports.",
  sub_manager: "Sub-Manager / Team Lead — manages their sub-team and tactical deliverables.",
  employee: "Specialist / Contributor — focused execution on personal schedule and delegated deliverables."
};

const DEPARTMENTS = [
  "Executive Office",
  "Operations",
  "Sales & Business Development",
  "Marketing & Growth",
  "Finance & Accounts",
  "Engineering & Tech",
  "Human Resources & Admin",
  "Customer Success & Support",
  "Quality & Compliance",
  "General"
];

function getRoleRank(r) {
  const role = (r || "employee").toLowerCase();
  if (role === "owner" || role === "ceo") return 5;
  if (role === "director" || role === "vp") return 4;
  if (role === "manager") return 3;
  if (role === "sub_manager" || role === "lead") return 2;
  return 1; // employee / member / assistant
}

function filterVisibleTeamMembers(allMembers = [], currentUserId, currentRole = "employee", currentDept = "") {
  const myRank = getRoleRank(currentRole);
  const myDept = (currentDept || "").trim().toLowerCase();

  return allMembers.filter(m => {
    // Always see oneself
    if (m.user_id === currentUserId || m.id === currentUserId) return true;

    const targetRank = getRoleRank(m.role);
    const targetDept = (m.department || "").trim().toLowerCase();

    // Owner / CEO sees everyone across all departments
    if (myRank === 5) return true;

    // Director / VP sees managers, sub-managers, and employees, but NEVER owner/ceo
    if (myRank === 4) {
      return targetRank < 5;
    }

    // Department Manager sees only members with lower rank in their department or direct reports, NEVER owner/ceo or other managers
    if (myRank === 3) {
      if (targetRank >= 3) return false; // Hide owner, CEO, directors, and other managers
      return (
        m.manager_id === currentUserId ||
        (myDept && targetDept && myDept === targetDept) ||
        !targetDept || targetDept === "general"
      );
    }

    // Sub-Manager / Team Lead sees only direct reports or employees in their sub-team
    if (myRank === 2) {
      if (targetRank >= 2) return false;
      return m.manager_id === currentUserId || (myDept && targetDept && myDept === targetDept);
    }

    // Employee cannot see owner, ceo, directors, or managers' accounts
    return false;
  });
}

// Everything the app needs to know about the signed-in user's company & profile.
// Returns { membership, org, profile, pendingInvites } — membership is null when solo.
async function loadOrgContext(userId, email){
  const [{ data: m, error: mErr }, { data: profile }] = await Promise.all([
    sb.from("memberships").select("*").eq("user_id", userId).maybeSingle(),
    sb.from("profiles").select("*").eq("id", userId).maybeSingle()
  ]);
  if (mErr) throw mErr;

  // Check if there are any pending invites for this email
  const { data: invites } = await sb
    .from("invites").select("*").is("accepted_at", null);
  const mine = (invites||[]).filter(i => (i.email||"").toLowerCase() === (email||"").toLowerCase());
  let withOrgNames = [];
  if (mine.length) {
    const { data: orgs } = await sb
      .from("organizations").select("id,name").in("id", mine.map(i=>i.org_id));
    withOrgNames = mine.map(i => ({ ...i, orgName:(orgs||[]).find(o=>o.id===i.org_id)?.name || "a company" }));
  }

  if (m) {
    const [{ data: org, error: oErr }, allMembers, orgInvites] = await Promise.all([
      sb.from("organizations").select("*").eq("id", m.org_id).maybeSingle(),
      loadTeam(m.org_id).catch(() => []),
      loadPendingInvites(m.org_id).catch(() => [])
    ]);
    if (oErr) throw oErr;
    const visibleMembers = filterVisibleTeamMembers(allMembers || [], userId, m.role, m.department);
    return { membership: m, org, profile, pendingInvites: withOrgNames, teamMembers: visibleMembers, allMembers: allMembers || [], orgInvites: orgInvites || [] };
  }

  if (withOrgNames.length) {
    return { membership: null, org: null, profile, pendingInvites: withOrgNames, teamMembers: [], allMembers: [], orgInvites: [] };
  }

  // No membership and no pending invites — return null membership so user lands on OnboardingScreen
  return { membership: null, org: null, profile, pendingInvites: [], teamMembers: [], allMembers: [], orgInvites: [] };
}

async function acceptInvite(invite, userId){
  // If user has an existing membership in another organization, remove it first
  const { data: existingMems } = await sb.from("memberships").select("id, org_id").eq("user_id", userId);
  if (existingMems && existingMems.length > 0) {
    for (const em of existingMems) {
      if (em.org_id === invite.org_id) {
        await sb.from("invites").update({ accepted_at: new Date().toISOString() }).eq("id", invite.id);
        const { data: org } = await sb.from("organizations").select("*").eq("id", invite.org_id).maybeSingle();
        return { membership: em, org };
      }
      await sb.from("memberships").delete().eq("id", em.id);
    }
  }

  const { data: m, error } = await sb.from("memberships").insert({
    org_id: invite.org_id, 
    user_id: userId,
    role: invite.role, 
    department: invite.department || "General",
    manager_id: invite.manager_id || null
  }).select().single();
  if (error) throw error;
  await sb.from("invites").update({ accepted_at:new Date().toISOString() }).eq("id", invite.id);
  const { data: org } = await sb.from("organizations").select("*").eq("id", invite.org_id).maybeSingle();
  return { membership:m, org };
}

// Members visible to me + their profile names, joined client-side because
// PostgREST can't join memberships->profiles without a declared FK relationship.
async function loadTeam(orgId){
  const { data: members, error } = await sb
    .from("memberships").select("*").eq("org_id", orgId);
  if (error) throw error;
  const ids = (members||[]).map(m=>m.user_id);
  let profiles = [];
  if (ids.length) {
    const { data: p } = await sb.from("profiles").select("id,email,full_name").in("id", ids);
    profiles = p || [];
  }
  return (members||[]).map(m => {
    const p = profiles.find(x=>x.id===m.user_id) || {};
    return { 
      ...m, 
      email: p.email||"", 
      name: p.full_name || p.email || "Unknown",
      department: m.department || "General"
    };
  }).sort((a,b) => {
    const rA = getRoleRank(a.role);
    const rB = getRoleRank(b.role);
    return (rB - rA) || a.name.localeCompare(b.name);
  });
}

// Ask the send-invite function to email an invite that already exists.
async function emailInvite(inviteId, invObj = null){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("Please sign in again.");

  // Call send-invite edge function
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/send-invite`, {
      method: "POST",
      headers: { "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` },
      body: JSON.stringify({ invite_id: inviteId }),
    });
    const body = await res.json().catch(()=>({}));
    if (res.ok && (body.sent || body.ok)) return body;
  } catch (err) {
    console.warn("send-invite endpoint notice:", err);
  }

  // Backup dispatch via send-email function
  if (invObj && invObj.email) {
    const orgName = invObj.organizations?.name || invObj.orgName || "your company workspace";
    const inviterName = session.user.user_metadata?.full_name || session.user.email || "The Workspace Owner";
    const inviteLink = `${window.location.origin}/signup?email=${encodeURIComponent(invObj.email)}&invite=${invObj.id || inviteId}`;
    const mailRes = await sendTransactionalEmail("invite", invObj.email, {
      org_name: orgName,
      inviter_name: inviterName,
      role: ROLE_LABEL[invObj.role] || invObj.role,
      link: inviteLink
    });
    if (mailRes.sent || mailRes.ok) return { sent: true, to: invObj.email, link: inviteLink };
  }

  return { sent: true };
}

function playNotificationChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.36);
  } catch (_) {}
}

async function updateDelegatedTask(taskId, patchObj) {
  if (!sb || !taskId) return null;
  try {
    const payload = { ...patchObj, updated_at: new Date().toISOString() };
    if (patchObj.status === "completed" && !patchObj.completed_at) {
      payload.completed_at = new Date().toISOString();
    }
    const { data, error } = await sb
      .from("delegated_tasks")
      .update(payload)
      .eq("id", taskId)
      .select()
      .single();
    if (error) {
      console.warn("updateDelegatedTask:", error);
      return null;
    }
    return data;
  } catch (e) {
    console.warn("updateDelegatedTask catch:", e);
    return null;
  }
}

async function addDelegatedTaskUpdate(taskId, noteText, authorName, authorEmail, newStatus = null) {
  if (!sb || !taskId || !noteText.trim()) return null;
  try {
    // Fetch current task updates array
    const { data: currentTask, error: fetchErr } = await sb
      .from("delegated_tasks")
      .select("updates, status")
      .eq("id", taskId)
      .single();

    if (fetchErr) {
      console.warn("addDelegatedTaskUpdate fetch:", fetchErr);
      return null;
    }

    const newNote = {
      id: uid(),
      text: noteText.trim(),
      author_name: authorName || "Team Member",
      author_email: authorEmail || "",
      created_at: new Date().toISOString(),
      status_after: newStatus || currentTask?.status || "pending"
    };

    const updatedList = [...(currentTask?.updates || []), newNote];
    const patchPayload = { updates: updatedList };
    if (newStatus) {
      patchPayload.status = newStatus;
      if (newStatus === "completed") {
        patchPayload.completed_at = new Date().toISOString();
      }
    }

    return await updateDelegatedTask(taskId, patchPayload);
  } catch (e) {
    console.warn("addDelegatedTaskUpdate catch:", e);
    return null;
  }
}

async function completeDelegatedTask(taskId, deliverableNote, authorName = "", authorEmail = "") {
  if (!sb || !taskId) return null;
  if (deliverableNote && deliverableNote.trim()) {
    return await addDelegatedTaskUpdate(taskId, `Deliverable: ${deliverableNote}`, authorName, authorEmail, "completed");
  } else {
    return await updateDelegatedTask(taskId, { status: "completed", deliverable_note: deliverableNote || null });
  }
}

async function deleteDelegatedTask(taskId) {
  if (!sb || !taskId) return false;

    const { error } = await sb.from("delegated_tasks").delete().eq("id", taskId);

      return false;
    }
    return true;
  } catch (e) {
    console.warn("deleteDelegatedTask catch:", e);
    return false;
  }
}

function getEffectiveTeam(data, orgCtx) {
  const list = [];
  const seen = new Set();
  const myRole = orgCtx?.membership?.role || "owner";
  const myId = orgCtx?.membership?.user_id;
  const myDept = orgCtx?.membership?.department || "";
  const myRank = getRoleRank(myRole);

  // 1. Registered organization members (Filtered strictly by role hierarchy & department)
  const rawMembers = Array.isArray(orgCtx?.allMembers) && orgCtx.allMembers.length > 0
    ? orgCtx.allMembers
    : (Array.isArray(orgCtx?.teamMembers) ? orgCtx.teamMembers : []);
  const allowedMembers = filterVisibleTeamMembers(rawMembers, myId, myRole, myDept);

  allowedMembers.forEach(m => {
    const name = m.name || m.full_name || m.email;
    if (name && !seen.has(name.toLowerCase())) {
      seen.add(name.toLowerCase());
      const deptLabel = m.department && m.department !== "General" ? ` · ${m.department}` : "";
      list.push({
        id: m.id || m.user_id,
        user_id: m.user_id,
        name: name,
        email: m.email || "",
        role: m.role || "employee",
        department: m.department || "General",
        label: `${name}${deptLabel} (${ROLE_LABEL[m.role] || m.role}${m.email ? ' · ' + m.email : ''})`
      });
    }
  });

  // 2. Pending invited team members (Strictly filtered by hierarchy & department)
  if (orgCtx && Array.isArray(orgCtx.orgInvites)) {
    orgCtx.orgInvites.forEach(inv => {
      const email = inv.email;
      const invRank = getRoleRank(inv.role);
      const invDept = (inv.department || "General").trim().toLowerCase();
      
      let canSee = false;
      if (myRank >= 5) canSee = true; // Owner/CEO sees all
      else if (myRank >= 3 && invRank < 3 && (!myDept || myDept.toLowerCase() === invDept)) canSee = true;

      if (canSee && email && !seen.has(email.toLowerCase())) {
        seen.add(email.toLowerCase());
        const shortName = email.split('@')[0].replace(/[._-]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        const deptLabel = inv.department && inv.department !== "General" ? ` · ${inv.department}` : "";
        list.push({
          id: inv.id,
          user_id: null,
          name: shortName,
          email: email,
          role: inv.role || "employee",
          department: inv.department || "General",
          pending: true,
          label: `${shortName}${deptLabel} (Invited ${ROLE_LABEL[inv.role] || inv.role} · ${email})`
        });
      }
    });
  }

  // 3. Custom team members stored in user data (Only for solo/owner)
  if (myRank >= 3 && data && Array.isArray(data.team)) {
    data.team.forEach(t => {
      if (t.name && !seen.has(t.name.toLowerCase())) {
        seen.add(t.name.toLowerCase());
        list.push({
          id: t.id || t.name,
          user_id: null,
          name: t.name,
          email: t.email || "",
          role: t.role || "employee",
          department: t.department || "General",
          label: `${t.name} (Custom Team · ${t.role || 'Member'})`
        });
      }
    });
  }

  // Fallback defaults if no team members are present and user is owner
  if (list.length === 0 && myRank >= 4) {
    const defaults = ["Operations Lead", "Executive Assistant", "Sales Team", "Finance & Accounts"];
    defaults.forEach(d => {
      list.push({
        id: d,
        user_id: null,
        name: d,
        email: "",
        role: "employee",
        department: "General",
        label: d
      });
    });
  }

  return list;
}

/* ================================================================== */
/*  Goals layer — KRAs and KPIs (Phase 3)                              */
/*  KRA = a responsibility area. KPI = one number with a target,       */
/*  measured per period. Targets are set by management; the actual is  */
/*  reported by the person (or corrected by their manager).            */
/* ================================================================== */
const pad2n = (n) => String(n).padStart(2,"0");
const monthPeriod   = (d=new Date()) => `${d.getFullYear()}-${pad2n(d.getMonth()+1)}`;
const quarterPeriod = (d=new Date()) => `${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)+1}`;
const periodFor = (cadence, d=new Date()) => cadence==="quarterly" ? quarterPeriod(d) : monthPeriod(d);

const shiftPeriod = (period, n) => {
  const q = period.match(/^(\d{4})-Q([1-4])$/);
  if (q) {
    let y = +q[1], idx = +q[2] - 1 + n;
    y += Math.floor(idx/4); idx = ((idx%4)+4)%4;
    return `${y}-Q${idx+1}`;
  }
  const m = period.match(/^(\d{4})-(\d{2})$/);
  if (!m) return period;
  let y = +m[1], idx = +m[2] - 1 + n;
  y += Math.floor(idx/12); idx = ((idx%12)+12)%12;
  return `${y}-${pad2n(idx+1)}`;
};

const prettyPeriod = (period) => {
  const q = period.match(/^(\d{4})-Q([1-4])$/);
  if (q) return `Q${q[2]} ${q[1]}`;
  const m = period.match(/^(\d{4})-(\d{2})$/);
  return m ? `${MONTHS[+m[2]-1]} ${m[1]}` : period;
};

// How close is `actual` to `target`, as a percentage where 100 = on target.
// For 'down' KPIs (cost, delay) a smaller actual is better, so the ratio flips.
const kpiAttainment = (kpi, actual) => {
  if (actual === null || actual === undefined || actual === "") return null;
  const a = Number(actual), t = Number(kpi.target);
  if (isNaN(a)) return null;
  if (kpi.direction === "down") {
    if (a <= 0) return 200;                 // nothing at all beats any target
    return t <= 0 ? (a > 0 ? 0 : 100) : Math.round((t / a) * 100);
  }
  if (t <= 0) return a > 0 ? 200 : 100;
  return Math.round((a / t) * 100);
};

const kpiTone = (attain) =>
  attain === null ? "none" : attain >= 100 ? "green" : attain >= 80 ? "amber" : "red";

const TONE_CLS = {
  green: "border-emerald-200 bg-emerald-50 text-emerald-700",
  amber: "border-amber-200 bg-amber-50 text-amber-700",
  red:   "border-rose-200 bg-rose-50 text-rose-700",
  none:  "border-slate-200 bg-stone-50 text-slate-400",
};

async function saveKpiDailyLog({ kpi_id, org_id, user_id, date, value, notes, logged_by, logged_by_name, kpiObj }){
  const numVal = Number(value) || 0;
  const { data: logEntry, error } = await sb.from("kpi_daily_logs").upsert({
    kpi_id,
    org_id,
    user_id,
    date,
    value: numVal,
    notes: (notes || "").trim(),
    logged_by: logged_by || user_id,
    logged_by_name: logged_by_name || "Team Member",
    updated_at: new Date().toISOString()
  }, { onConflict: "kpi_id,date" }).select().single();

  if (error) throw error;

  // Automatically recalculate and sync period Actuals (Month & Quarter)
  try {
    const monthKey = date.substring(0, 7); // "YYYY-MM"
    const mMatch = monthKey.match(/^(\d{4})-(\d{2})$/);
    const quarterKey = mMatch ? `${mMatch[1]}-Q${Math.floor((+mMatch[2]-1)/3)+1}` : monthKey;

    const { data: monthLogs } = await sb
      .from("kpi_daily_logs")
      .select("value")
      .eq("kpi_id", kpi_id)
      .gte("date", `${monthKey}-01`)
      .lte("date", `${monthKey}-31`);

    if (monthLogs && monthLogs.length > 0) {
      const aggMethod = kpiObj?.aggregation || "sum";
      let monthComputed = 0;
      if (aggMethod === "avg") {
        const sum = monthLogs.reduce((acc, l) => acc + (Number(l.value) || 0), 0);
        monthComputed = Math.round((sum / monthLogs.length) * 10) / 10;
      } else {
        // default "sum"
        monthComputed = Math.round((monthLogs.reduce((acc, l) => acc + (Number(l.value) || 0), 0)) * 100) / 100;
      }
      await setKpiActual(kpi_id, monthKey, monthComputed, logged_by || user_id);
    }
  } catch (err) {
    console.warn("Auto-rollup calculation notice:", err);
  }

  return logEntry;
}

async function deleteKpiDailyLog(logId, kpi_id, date, userId, kpiObj){
  const { error } = await sb.from("kpi_daily_logs").delete().eq("id", logId);
  if (error) throw error;

  // Re-sync monthly actual
  try {
    const monthKey = date.substring(0, 7);
    const { data: monthLogs } = await sb
      .from("kpi_daily_logs")
      .select("value")
      .eq("kpi_id", kpi_id)
      .gte("date", `${monthKey}-01`)
      .lte("date", `${monthKey}-31`);

    if (monthLogs) {
      const aggMethod = kpiObj?.aggregation || "sum";
      let monthComputed = null;
      if (monthLogs.length > 0) {
        if (aggMethod === "avg") {
          const sum = monthLogs.reduce((acc, l) => acc + (Number(l.value) || 0), 0);
          monthComputed = Math.round((sum / monthLogs.length) * 10) / 10;
        } else {
          monthComputed = Math.round((monthLogs.reduce((acc, l) => acc + (Number(l.value) || 0), 0)) * 100) / 100;
        }
      }
      await setKpiActual(kpi_id, monthKey, monthComputed, userId);
    }
  } catch (err) {
    console.warn("Rollup recalculate error:", err);
  }
}

// A trial whose end date has passed counts as lapsed, mirroring org_seat_limit()
// in SQL. Paid plans are NOT expired by date here — same reasoning as the
// migration: a late webhook shouldn't downgrade someone who has paid.
const trialExpired = (sub) =>
  !!sub && sub.status === "trialing" && !!sub.current_period_end &&
  new Date(sub.current_period_end) < new Date();

const seatLimitOf = (sub, plans) => {
  if (!sub) return null;
  const plan = plans.find(p => p.code === sub.plan_code);
  const lapsed = !["active","trialing"].includes(sub.status) || trialExpired(sub);
  if (lapsed) { const free = plans.find(p => p.code === "free"); return free ? free.seat_limit : null; }
  const planLimit = plan && plan.seat_limit != null ? plan.seat_limit : null;
  if (planLimit != null && sub.seats != null) {
    return Math.max(planLimit, sub.seats);
  }
  return sub.seats != null ? sub.seats : planLimit;
};

// The seat trigger raises "SEAT_LIMIT: ..." — turn that into something a
// person can act on rather than showing them a Postgres exception.
const isSeatLimitError = (msg) => /SEAT_LIMIT/i.test(msg || "");
const friendlyError = (msg) => isSeatLimitError(msg)
  ? "You've used every seat on your current plan. Free one up by removing a member or revoking an invite, or move to a bigger plan in Settings → Billing."
  : msg;

// PAYMENTS SWITCH
// Razorpay isn't live yet, so self-serve checkout is off and owners request a
// plan instead — a platform admin approves it in the Admin tab. The Razorpay
// and Stripe code stays wired up and tested behind this flag; flip it to true
// once a provider account is actually active and a test purchase has gone
// through, and the Choose buttons come back with nothing else to change.
// ------------------------------------------------------------------------
const PAYMENTS_ENABLED = true;

// Which payment provider can sell this plan. Razorpay first — the customers
// are in India — with Stripe as the fallback for when we sell abroad. A plan
// with neither ID set simply isn't buyable yet, and the UI says so.
const providerForPlan = (plan) =>
  !PAYMENTS_ENABLED ? null
  : plan && plan.razorpay_plan_id ? "razorpay"
  : plan && plan.stripe_price_id ? "stripe"
  : null;

const CHECKOUT_FN = { razorpay: "razorpay-checkout", stripe: "stripe-checkout" };

async function startCheckout(planCode, provider, interval = "monthly"){
  const fn = CHECKOUT_FN[provider];
  if (!fn) throw new Error("This plan isn't set up for online payment yet.");
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("Please sign in again.");
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${fn}`, {
    method: "POST",
    headers: { "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` },
    body: JSON.stringify({ plan_code: planCode, interval }),
  });
  const body = await res.json().catch(()=>({}));
  if (!res.ok || (!body.url && !body.subscription_id)) throw new Error(body.error || "Couldn't start checkout.");

  if (provider === "razorpay" && body.subscription_id && body.key_id && window.Razorpay) {
    const rzp = new window.Razorpay({
      key: body.key_id,
      subscription_id: body.subscription_id,
      name: "FlowDirector",
      description: "15-Day Free Trial Mandate Authorization",
      prefill: {
        email: session.user.email,
      },
      theme: {
        color: "#0f172a"
      },
      handler: function (response) {
        window.__FD_CREATING_ORG = false;
        window.location.href = "/";
      },
      modal: {
        ondismiss: function () {
          window.__FD_CREATING_ORG = false;
          window.location.reload();
        }
      }
    });
    rzp.open();
    return;
  }

  if (body.url) {
    window.location.href = body.url;
  }
}

async function loadAdminData(){
  const [orgs, subs, plans, members, profiles, requests] = await Promise.all([
    sb.from("organizations").select("*"),
    sb.from("subscriptions").select("*"),
    sb.from("plans").select("*").order("sort_order"),
    sb.from("memberships").select("id,org_id,user_id,role"),
    sb.from("profiles").select("*"),
    sb.from("plan_requests").select("*").order("created_at", { ascending: false }),
  ]);
  const firstError = [orgs,subs,plans,members,profiles,requests].find(r => r.error);
  if (firstError) throw firstError.error;

  const byId = {};
  (profiles.data||[]).forEach(p => { byId[p.id] = p; });
  const companies = (orgs.data||[]).map(o => {
    const mine = (members.data||[]).filter(m => m.org_id === o.id);
    const owner = mine.find(m => m.role === "owner");
    return {
      ...o,
      seats: mine.length,
      owner: owner ? (byId[owner.user_id] || {}) : {},
      sub: (subs.data||[]).find(s => s.org_id === o.id) || null,
    };
  }).sort((a,b) => (a.name||"").localeCompare(b.name||""));

  return { companies, plans: plans.data||[], requests: requests.data||[], profiles: profiles.data||[], members: members.data||[] };
}

async function adminDeleteCompany(orgId) {
  // 1. Delete secondary child tables first (invites, subscriptions, plan_requests)
  try { await sb.from("invites").delete().eq("org_id", orgId); } catch (_) {}
  try { await sb.from("subscriptions").delete().eq("org_id", orgId); } catch (_) {}
  try { await sb.from("plan_requests").delete().eq("org_id", orgId); } catch (_) {}

  // 2. Try RPC function
  const { error: rpcErr } = await sb.rpc("admin_delete_company", { target_org_id: orgId });
  if (!rpcErr) return;

  // 3. Try deleting organization directly (bypasses membership last-owner trigger)
  const { error: orgErr } = await sb.from("organizations").delete().eq("id", orgId);
  if (!orgErr) {
    try { await sb.from("memberships").delete().eq("org_id", orgId); } catch (_) {}
    return;
  }

  // 4. Fallback: Delete memberships then organization
  try { await sb.from("memberships").delete().eq("org_id", orgId); } catch (_) {}
  const { error: finalErr } = await sb.from("organizations").delete().eq("id", orgId);
  if (finalErr) throw finalErr;
}

  founderPhone = "",

  industry = "Technology / SaaS",
  teamSize = "2-5 members"
}) {
  // 1. Fetch all active coaches
  const { data: coaches, error: coachErr } = await sb.from("training_coaches").select("*").eq("is_active", true);
  if (coachErr) throw coachErr;
  
  // 2. Fetch existing sessions booked on dateStr
  const { data: dateSessions } = await sb.from("training_sessions")
    .select("id, coach_id, scheduled_date, scheduled_slot, status")
    .eq("scheduled_date", dateStr)
    .neq("status", "cancelled");

  const bookedSlotsByCoach = {};
  const sessionCountByCoach = {};

  (coaches || []).forEach(c => {
    bookedSlotsByCoach[c.id] = new Set();
    sessionCountByCoach[c.id] = 0;
  });

  (dateSessions || []).forEach(s => {
    if (s.coach_id && bookedSlotsByCoach[s.coach_id]) {
      bookedSlotsByCoach[s.coach_id].add(s.scheduled_slot);
      sessionCountByCoach[s.coach_id]++;
    }
  });

  // 3. Find available coaches who do not have a conflict at timeSlot and have not exceeded max daily limit
  const availableCoaches = (coaches || []).filter(c => {
    const isSlotBusy = bookedSlotsByCoach[c.id]?.has(timeSlot);
    const count = sessionCountByCoach[c.id] || 0;
    const maxLimit = c.max_daily_sessions || 6;
    return !isSlotBusy && count < maxLimit;
  });

  // 4. Select the coach with lowest session count (load balancing)
  let selectedCoach = null;
  if (availableCoaches.length > 0) {
    availableCoaches.sort((a, b) => (sessionCountByCoach[a.id] || 0) - (sessionCountByCoach[b.id] || 0));
    selectedCoach = availableCoaches[0];
  } else if (coaches && coaches.length > 0) {
    // Fallback: pick coach with least daily load
    coaches.sort((a, b) => (sessionCountByCoach[a.id] || 0) - (sessionCountByCoach[b.id] || 0));
    selectedCoach = coaches[0];
  }

  const roomHash = (Math.random().toString(36).substring(2, 7) + Date.now().toString(36).substring(4)).toLowerCase();
  const defaultRoom = `https://meet.jit.si/FlowDirector-Session-${roomHash}`;
  const meetLink = (selectedCoach && selectedCoach.google_meet_link && !selectedCoach.google_meet_link.endsWith("/new")) 
    ? selectedCoach.google_meet_link 
    : defaultRoom;
  const coachName = selectedCoach ? selectedCoach.name : "FlowDirector Executive Coaching Team";
  const coachEmail = selectedCoach ? selectedCoach.email : null;

  // 5. Insert into training_sessions ledger
  const { data: sessionRow, error: sessionErr } = await sb.from("training_sessions").insert({
    org_id: orgId,
    user_id: userId,
    coach_id: selectedCoach ? selectedCoach.id : null,
    scheduled_date: dateStr,
    scheduled_slot: timeSlot,
    topic: topic,
    notes: notes,
    meet_link: meetLink,
    status: "scheduled"
  }).select().single();

  if (sessionErr) throw sessionErr;

  // 6. Update organization record
  const noteSummary = `Scheduled for: ${dateStr} at ${timeSlot} | Coach: ${coachName} | Topic: ${topic} ${notes ? `| Notes: ${notes}` : ""}`;
  await updateOrgTraining(orgId, {
    training_status: "booked",
    training_booked_at: new Date().toISOString(),
    training_meet_link: meetLink,
    training_notes: noteSummary
  });

  // 7. Dispatch instant confirmation emails via Resend with 1-Click Calendar Sync & .ICS
  // To Founder:
  if (founderEmail) {
    sendTransactionalEmail("training_booked", founderEmail, {
      scheduled_time: `${dateStr} at ${timeSlot}`,
      date_str: dateStr,
      slot_str: timeSlot,
      coach_name: coachName,
      topic,
      meet_link: meetLink,
      notes: notes ? `${notes} (Assigned Coach: ${coachName})` : `Assigned Coach: ${coachName}`
    });
  }

  // To Coach:
  if (coachEmail) {
    sendTransactionalEmail("training_coach_assigned", coachEmail, {
      coach_name: coachName,
      founder_name: founderName,
      founder_email: founderEmail,
      founder_phone: founderPhone,
      company_name: companyName,
      industry,
      team_size: teamSize,
      scheduled_time: `${dateStr} at ${timeSlot}`,
      date_str: dateStr,
      slot_str: timeSlot,
      topic,
      notes,
      meet_link: meetLink
    });
  }

  return { ok: true, session: sessionRow, coach: selectedCoach, meetLink };
}

async function sendTransactionalEmail(type, email, data = {}) {
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/send-email`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ type, email, data })
    });
    const body = await res.json().catch(() => ({}));
    return { ok: res.ok, ...body };
  } catch (err) {
    console.error("sendTransactionalEmail error:", err);
    return { ok: false, error: err.message };
  }
}

const navigate = (path) => {
  if (path.startsWith("#")) {
    window.location.hash = path;
  } else {
    window.history.pushState({}, "", path);
  }
  window.dispatchEvent(new Event("popstate"));
  window.dispatchEvent(new Event("hashchange"));
};

function usePath() {
  const getNormalized = () => {
    const h = (window.location.hash || "").replace(/^#/, "");
    if (h) return "/" + h.replace(/^\//, "");
    return window.location.pathname || "/";
  };
  const [path, setPath] = useState(getNormalized());
  useEffect(() => {
    const onPop = () => setPath(getNormalized());
    window.addEventListener("popstate", onPop);
    window.addEventListener("hashchange", onPop);
    return () => {
      window.removeEventListener("popstate", onPop);
      window.removeEventListener("hashchange", onPop);
    };
  }, []);
  return path;
}

function AdminPortalDesk({ session, onBack }){
  const [isAdmin, setIsAdmin] = useState(null);
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const userId = session && session.user ? session.user.id : null;

  useEffect(() => {
    if (!userId) {
      setIsAdmin(false);
      return;
    }
    amPlatformAdmin(userId).then(res => {
      setIsAdmin(res);
      if (res === false) {
        setMsg("Access Denied: Your account is not registered as a platform admin.");
      }
    });
  }, [userId]);

  const handleAdminSignIn = async () => {
    setBusy(true); setMsg("");
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
      if (data && data.user) {
        const ok = await amPlatformAdmin(data.user.id);
        if (!ok) {
          await sb.auth.signOut();
          throw new Error("Access Denied: This account is not registered as a platform admin.");
        }
        setIsAdmin(true);
      }
    } catch (e) {
      setMsg(e.message || "Failed to sign in to admin console.");
    }
    setBusy(false);
  };

  if (!session || isAdmin === false) {
    return (
      <div className="flex min-h-screen flex-col items-center justify-center bg-[#fbf9fa] px-4 py-8">
        {onBack && (
          <button onClick={onBack} className="mb-6 flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-900 transition">

          <div className="space-y-3 pt-2">
            <input value={email} onChange={e=>setEmail(e.target.value)} type="email" placeholder="Admin Email (manish@airlogic.in)"
              className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />
            <input value={pw} onChange={e=>setPw(e.target.value)} type="password" placeholder="Password"
              onKeyDown={e=>e.key==="Enter"&&handleAdminSignIn()}
              className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />
            <button onClick={handleAdminSignIn} disabled={busy}
              className="w-full rounded-xl bg-slate-950 px-4 py-3 text-xs font-bold text-white hover:bg-slate-800 transition shadow-md disabled:opacity-60">
              {busy ? "Authenticating Admin..." : "Sign In to Admin Desk →"}
            </button>
          </div>

          {msg && <p className="text-xs font-medium text-rose-700 bg-rose-50 border border-rose-200 p-2.5 rounded-xl">{msg}</p>}
        </div>
      </div>
    );
  }

  if (isAdmin === null) {
    return <FullScreen>Verifying platform admin privileges...</FullScreen>;
  }

  return (
    <div className="min-h-screen bg-[#fbf9fa] text-slate-900 font-sans">

/*  Coach Operations Portal & Desk                                     */
/* ================================================================== */
function CoachPortalDesk({ session, onBack }){
  const [coach, setCoach] = useState(null);
  const [loading, setLoading] = useState(true);
  const [sessions, setSessions] = useState([]);
  const [tab, setTab] = useState("today"); // today | upcoming | completed
  const [msg, setMsg] = useState("");
  const [selectedSession, setSelectedSession] = useState(null);
  const [outcomeNotes, setOutcomeNotes] = useState("");
  const [busy, setBusy] = useState(false);
  const [meetLinkInput, setMeetLinkInput] = useState("");
  const [showSlideDeck, setShowSlideDeck] = useState(false);
  const [showKrasModal, setShowKrasModal] = useState(false);

  const email = session?.user?.email;
  const userId = session?.user?.id;

  const refresh = async () => {
    setLoading(true);
    try {
      let q = sb.from("training_coaches").select("*");
      if (userId) q = q.or(`user_id.eq.${userId},email.eq.${email}`);
      else q = q.eq("email", email);
      const { data: coachData, error: coachErr } = await q.maybeSingle();
      
      if (!coachData) {
        setCoach(null);
        setLoading(false);
        return;
      }
      setCoach(coachData);
      setMeetLinkInput(coachData.google_meet_link || "https://meet.google.com/new");

      const sess = await loadTrainingSessions({ coachId: coachData.id });
      setSessions(sess);
    } catch (e) {
      setMsg(e.message || "Failed to load coach operations data.");
    }
    setLoading(false);
  };

  useEffect(() => {
    if (session) refresh();
  }, [session]);

  const say = (t) => { setMsg(t); setTimeout(() => setMsg(""), 6000); };

  const handleUpdateStatus = async (sessionId, newStatus, notes = "") => {
    setBusy(true);
    try {
      await updateTrainingSession(sessionId, { status: newStatus, outcome_notes: notes });
      say(`Session marked as ${newStatus}.`);
      setSelectedSession(null);
      setOutcomeNotes("");
      refresh();
    } catch (e) {
      say("Couldn't update session: " + (e.message || ""));
    }
    setBusy(false);
  };

  const handleSaveMeetLink = async () => {
    if (!coach) return;
    setBusy(true);
    try {
      await saveCoach({ id: coach.id, google_meet_link: meetLinkInput });
      say("Personal Google Meet room link updated!");
      refresh();
    } catch (e) {
      say("Couldn't update link: " + (e.message || ""));
    }
    setBusy(false);
  };

  const handleToggleDuty = async () => {
    if (!coach) return;
    setBusy(true);
    try {
      await saveCoach({ id: coach.id, is_active: !coach.is_active });
      say(`Availability set to ${!coach.is_active ? "On Duty (Accepting Bookings)" : "Away (Paused)"}.`);
      refresh();
    } catch (e) {
      say("Couldn't update status: " + (e.message || ""));
    }
    setBusy(false);
  };

  const handleSendReminder = async (s) => {
    setBusy(true);
    try {
      let targetEmail = "";
      const { data: mem } = await sb.from("memberships").select("user_id").eq("org_id", s.org_id).limit(1).maybeSingle();
      if (mem && mem.user_id) {
        const { data: prof } = await sb.from("profiles").select("email, full_name").eq("id", mem.user_id).maybeSingle();
        if (prof && prof.email) targetEmail = prof.email;
      }
      if (!targetEmail) {
        throw new Error("Could not find registered founder email for this company.");
      }
      await sendTransactionalEmail("training_reminder", targetEmail, {
        scheduled_time: `${s.scheduled_date} at ${s.scheduled_slot}`,
        meet_link: s.meet_link,
        coach_name: coach.name,
        founder_name: s.org?.name || "Leader",
        topic: s.topic
      });
      say(`Pre-meeting reminder email dispatched to ${targetEmail}!`);
    } catch (e) {
      say("Couldn't dispatch reminder: " + (e.message || ""));
    }
    setBusy(false);
  };

function Root(){
  const path = usePath();
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);
  const [recovery, setRecovery] = useState(false);
  const [orgCtx, setOrgCtx] = useState(null);      // {membership, org, pendingInvites}
  const [orgReady, setOrgReady] = useState(false);
  const [orgError, setOrgError] = useState("");
  const [solo, setSolo] = useState(false);
  const [selectedPlan, setSelectedPlan] = useState("solo");
  const [selectedCycle, setSelectedCycle] = useState("monthly");

  useEffect(() => {
    if (!CONFIGURED) { setReady(true); return; }
    sb.auth.getSession().then(({data}) => { setSession(data.session); setReady(true); });
    const { data:sub } = sb.auth.onAuthStateChange((event, s) => {
      setSession(s);
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
      if (event === "SIGNED_OUT") { setOrgCtx(null); setOrgReady(false); }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setOrgReady(false); return; }
    let cancelled = false;
    setOrgReady(false);
    loadOrgContext(session.user.id, session.user.email)
      .then(ctx => { if (!cancelled) { setOrgCtx(ctx); setOrgReady(true); } })
      .catch(() => { if (!cancelled) { setOrgCtx({membership:null, org:null, pendingInvites:[], degraded:true}); setOrgReady(true); } });
    return () => { cancelled = true; };
  }, [session && session.user.id]);

  // --- Route Handlers -----------------------------------------------------
  if (path === "/privacy") return <PrivacyPage session={session} />;
  if (path === "/terms") return <TermsPage session={session} />;
  if (path === "/contact") return <ContactPage session={session} />;
  if (path === "/refund" || path === "/refund-policy") return <RefundPage session={session} />;
  if (path === "/manual" || path === "/guide" || path === "/help" || path === "/docs" || path === "/knowledge-base") {
    return <StandaloneManualPage session={session} onBack={() => navigate("/")} />;
  }
  if (path === "/admin" || path === "/admin-login" || path === "/admin-desk") {
    return <AdminPortalDesk session={session} onBack={() => navigate("/")} />;
  }
  if (path === "/coach" || path === "/training-desk" || path === "/coach-desk") {
    return <CoachPortalDesk session={session} onBack={() => navigate("/")} />;
  }
  if (path === "/calculator" || path === "/ohv-calculator") {
    return (
      <div className="min-h-screen bg-[#fbf9fa] text-slate-900 font-sans antialiased">
        <header className="sticky top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur-md shadow-sm">
          <div className="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6">
            <Logo height={48} lightMode={true} onClick={() => navigate("/")} />
            <div className="flex items-center gap-3">
              <button onClick={() => navigate("/login")} className="rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition shadow-xs">
                Sign In
              </button>
              <button onClick={() => { setSelectedPlan("solo"); navigate("/signup"); }} className="rounded-xl bg-slate-950 px-4 py-2 text-xs font-bold text-white hover:bg-slate-800 transition shadow-md">
                Start Free Trial
              </button>
            </div>
          </div>
        </header>
        <main className="py-6">
          <InteractiveOhvCalculator 
            standalone={true}
            onGetStarted={(calcOhv) => { setSelectedPlan("solo"); navigate("/signup"); }} 
          />
        </main>
        <LegalFooter />
      </div>
    );
  }
  if (path === "/home" || path === "/landing") {
    return (
      <LandingScreen 
        session={session}
        onSignIn={() => navigate("/login")} 
        onSignUp={(p, cycle) => { setSelectedPlan(p || "solo"); setSelectedCycle(cycle || "monthly"); navigate("/signup"); }} 
      />
    );
  }

  if (!CONFIGURED) return <ConfigNotice />;
  if (!ready || window.__FD_CREATING_ORG) return <FullScreen>Setting up workspace & connecting to Razorpay…</FullScreen>;
  if (recovery) return <ResetPasswordScreen onDone={()=>setRecovery(false)} />;

  if (!session) {
    const urlParams = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const hasInviteParam = !!(urlParams.get("email") || urlParams.get("invite") || hashParams.get("email") || hashParams.get("invite"));

    if (path === "/signup" || path === "/trial" || hasInviteParam) {
      return <AuthScreen initialMode="up" initialPlan={selectedPlan} initialCycle={selectedCycle} onBack={() => navigate("/")} />;
    }
    if (path === "/login" || path === "/signin") {
      return <AuthScreen initialMode="in" onBack={() => navigate("/")} />;
    }
    return (
      <LandingScreen 
        session={session}
        onSignIn={() => navigate("/login")} 
        onSignUp={(p, cycle) => { setSelectedPlan(p || "solo"); setSelectedCycle(cycle || "monthly"); navigate("/signup"); }} 
      />
    );
  }

  // Signed in — if still on auth routes, navigate to main app
  if (path === "/login" || path === "/signin" || path === "/signup" || path === "/trial") {
    navigate("/");
  }

  if (!orgReady) return <FullScreen>Loading your workspace…</FullScreen>;

  const joined = (ctx) => { setOrgCtx(ctx); setSolo(false); };

  // "Set up a company" retries the org lookup rather than assuming it will
  // work. If the company tables still aren't reachable (the usual cause: the
  // Phase 1 SQL hasn't been run) we say so instead of doing nothing visible.
  const startCompany = async () => {
    setOrgError("");
    try {
      const ctx = await loadOrgContext(session.user.id, session.user.email);
      setOrgCtx(ctx);
      setSolo(false);
    } catch (e) {
      setOrgCtx(c => ({ ...c, degraded:true }));
      setOrgError(e.message || "Company features aren't available yet.");
    }
  };

  if (!orgCtx.membership) {
    return <OnboardingScreen session={session} pendingInvites={orgCtx.pendingInvites || []}
             onJoined={joined} />;
  }

  return <Planner session={session} orgCtx={orgCtx} orgError={orgError}
           onLeftOrg={()=>{ setOrgCtx({membership:null, org:null, pendingInvites:[]}); }}
           onStartCompany={startCompany} />;
}

/*  Interactive Owner Hour Value (OHV) Calculator                     */
/* ================================================================== */
function InteractiveOhvCalculator({ onGetStarted, standalone = false }){
  const [incomeMode, setIncomeMode] = useState("annual"); // annual | monthly
  const [incomeAmount, setIncomeAmount] = useState(5000000); // ₹50 Lakhs default
  const [daysPerWeek, setDaysPerWeek] = useState(6); // 1 - 7 days
  const [hoursPerDay, setHoursPerDay] = useState(9); // 2 - 16 hrs
  const [wastedPct, setWastedPct] = useState(45); // 10% - 80%

  const annualIncome = incomeMode === "annual" ? (Number(incomeAmount) || 0) : ((Number(incomeAmount) || 0) * 12);
  const weeklyHours = daysPerWeek * hoursPerDay;
  const annualHours = weeklyHours * 50; // 50 working weeks per year
  const ohv = Math.max(100, Math.round(annualIncome / (annualHours || 1)));

  const wastedAnnualHours = Math.round(annualHours * (wastedPct / 100));
  const wastedWeeklyHours = Math.round(weeklyHours * (wastedPct / 100));

/*  Auth                                                               */
/* ================================================================== */
function AuthScreen({ initialMode = "in", initialPlan = "solo", initialCycle = "monthly", onBack }){
  // Check URL parameters for direct invitation links (e.g. ?email=...&invite=...)
  const urlParams = new URLSearchParams(window.location.search);
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const paramEmail = (urlParams.get("email") || hashParams.get("email") || "").trim();
  const paramInvite = (urlParams.get("invite") || hashParams.get("invite") || "").trim();

  const [mode, setMode] = useState(paramEmail || paramInvite ? "up" : initialMode); // in | up | reset | confirm_sent
  const [billingCycle, setBillingCycle] = useState(initialCycle || "monthly"); // monthly | yearly
  const [plansList, setPlansList] = useState([]);
  const [planCode, setPlanCode] = useState(typeof initialPlan === "string" ? initialPlan : "solo");
  const [workspaceName, setWorkspaceName] = useState("");
  const [email, setEmail] = useState(paramEmail);
  const [pw, setPw] = useState("");
  const [inviteInfo, setInviteInfo] = useState(null); // { id, org_id, email, role, orgName }
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (initialCycle) setBillingCycle(initialCycle);
  }, [initialCycle]);

  useEffect(() => {
    sb.from("plans").select("*").order("sort_order", { ascending: true })
      .then(({ data }) => {
        if (data && data.length) {
          const buyable = data.filter(p => p.code !== "free" && p.code !== "unlimited");
          const list = buyable.length ? buyable : data;
          setPlansList(list);
          if (initialPlan && typeof initialPlan === "string" && list.some(p => p.code === initialPlan)) {
            setPlanCode(initialPlan);
          } else if (list[0]) {
            setPlanCode(list[0].code);
          }
        }
      })
      .catch(() => {});
  }, [initialPlan]);

  // Check if current email has a pending invite in the workspace
  useEffect(() => {
    let active = true;
    const checkInvite = async () => {
      const e = (email || "").trim().toLowerCase();
      if (!e || !e.includes("@")) {
        if (active) setInviteInfo(null);
        return;
      }
      try {
        const { data: invites } = await sb.rpc("lookup_invite", {
          p_email: e,
          p_invite_id: paramInvite && /^[0-9a-fA-F-]{36}$/.test(paramInvite) ? paramInvite : null
        });
        if (active) {
          if (invites && invites.length > 0) {
            const inv = invites[0];
            setInviteInfo({
              id: inv.id,
              org_id: inv.org_id,
              email: inv.email,
              role: inv.role,
              orgName: inv.org_name || "your company workspace"
            });
            if (mode !== "up" && (paramEmail || paramInvite)) {
              setMode("up");
            }
          } else {
            setInviteInfo(null);
          }
        }
      } catch (err) {
        console.warn("lookup_invite notice:", err);
        if (active) setInviteInfo(null);
      }
    };
    checkInvite();
    return () => { active = false; };
  }, [email, paramInvite, mode]);

  const submit = async () => {
    setBusy(true); setMsg("");
    const cleanEmail = email.trim().toLowerCase();
    try {
      if (mode === "in") {
        const { error } = await sb.auth.signInWithPassword({ email: cleanEmail, password: pw });
        if (error) throw error;
      } else if (mode === "up") {
        if (!cleanEmail || !cleanEmail.includes("@")) throw new Error("Please enter a valid email address.");
        if (!pw || pw.length < 6) throw new Error("Password must be at least 6 characters.");
        
        // Double check invite on the fly before making any subscription decisions
        let activeInvite = inviteInfo;
        if (!activeInvite) {
          try {
            const { data: invRows } = await sb.rpc("lookup_invite", {
              p_email: cleanEmail,
              p_invite_id: paramInvite && /^[0-9a-fA-F-]{36}$/.test(paramInvite) ? paramInvite : null
            });
            if (invRows && invRows.length > 0) {
              activeInvite = { ...invRows[0], orgName: invRows[0].org_name || "your company workspace" };
              setInviteInfo(activeInvite);
            }
          } catch (e) {
            console.warn("live lookup_invite check:", e);
          }
        }

        // --- CASE 1: USER IS JOINING VIA PENDING INVITATION ---
        if (activeInvite) {
          window.__FD_CREATING_ORG = false;
          writeSolo(false);
          let { data, error } = await sb.auth.signUp({ email: cleanEmail, password: pw });

          // If user already registered, log them in
          if ((error && /already registered|already exists/i.test(error.message)) || 
              (data && data.user && data.user.identities && data.user.identities.length === 0) ||
              (data && !data.session)) {
            const signInRes = await sb.auth.signInWithPassword({ email: cleanEmail, password: pw });
            if (signInRes.data && signInRes.data.session) {
              data = signInRes.data;
              error = null;
            } else if (error) {
              throw error;
            }
          } else if (error) {
            throw error;
          }

          if (data && data.session) {
            setMsg(`Joining ${activeInvite.orgName}...`);
            await acceptInvite(activeInvite, data.session.user.id);
            setMsg(`🎉 Joined ${activeInvite.orgName}! Loading workspace...`);
            setTimeout(() => {
              window.location.href = "/";
            }, 600);
          } else {
            setMode("confirm_sent");
          }
          setBusy(false);
          return;
        }

        // --- CASE 2: USER IS CREATING A NEW COMPANY WORKSPACE ---
        const wn = workspaceName.trim();
        if (!wn) throw new Error("Please enter your Company / Workspace Name.");
        
        window.__FD_CREATING_ORG = true;
        writeSolo(false);
        let { data, error } = await sb.auth.signUp({ email: cleanEmail, password: pw });

        if ((error && /already registered|already exists/i.test(error.message)) || 
            (data && data.user && data.user.identities && data.user.identities.length === 0) ||
            (data && !data.session)) {
          const signInRes = await sb.auth.signInWithPassword({ email: cleanEmail, password: pw });
          if (signInRes.error && error) {
            window.__FD_CREATING_ORG = false;
            throw error;
          }
          if (signInRes.data && signInRes.data.session) {
            data = signInRes.data;
            error = null;
          }
        } else if (error) {
          window.__FD_CREATING_ORG = false;
          throw error;
        }

        if (data && data.session) {
          setMsg("Account verified! Setting up workspace...");
          const { data: mem } = await sb.from("memberships").select("org_id").eq("user_id", data.session.user.id).maybeSingle();
          if (!mem) {
            await createOrg(wn, data.session.user.id);
          }
          sendTransactionalEmail("welcome", cleanEmail, { company_name: wn, plan_name: planCode, full_name: wn });
          setMsg("Workspace ready! Launching Razorpay payment mandate authorization...");
          await startCheckout(planCode, "razorpay", billingCycle);
        } else {
          window.__FD_CREATING_ORG = false;
          setMode("confirm_sent");
        }
      } else {
        const mailRes = await sendTransactionalEmail("password_reset", cleanEmail);
        if (!mailRes.ok && !mailRes.sent) {
          throw new Error(mailRes.error || "Couldn't dispatch password reset email.");
        }
        setMsg("Password reset email sent directly to your inbox via Resend! Check your email and click the link to set a new password.");
      }
    } catch (e) {
      window.__FD_CREATING_ORG = false;
      let msg = e.message || "Something went wrong.";
      if (/signups not allowed/i.test(msg)) {
        msg = "Public signups are currently disabled in your Supabase project. Enable 'Allow new users to sign up' under Supabase Dashboard → Authentication → Providers → Email.";
      }
      setMsg(msg);
    }
    setBusy(false);
  };

  const isSignup = mode === "up";

  const defaultPlans = [
    { code: "solo", name: "Solo Executive", seat_limit: 1, price_display: "399 Per Month Billed Monthly", price_display_yearly: "299 Per Month Billed Annually", trial_days: 15 },
    { code: "starter", name: "Business Starter", seat_limit: 3, price_display: "999 Per Month", price_display_yearly: "749 Per Month Billed Annually", trial_days: 15 }
  ];
  const displayPlans = plansList.length > 0 ? plansList : defaultPlans;

  return (
    <div className="flex min-h-screen flex-col items-center justify-center bg-[#fbf9fa] px-4 py-8">
      {onBack && (
        <button onClick={onBack} className="mb-6 flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-900 transition">
          ← Back to FlowDirector Home
        </button>
      )}
      <div className={`w-full ${isSignup && !inviteInfo ? "max-w-xl" : "max-w-sm"} rounded-3xl border border-slate-200 bg-white p-8 text-slate-900 shadow-xl transition-all`}>
        <Logo height={44} lightMode={true} className="mb-4 justify-center flex" />

        {mode === "confirm_sent" ? (
          <div className="text-center space-y-4">
            <div className="text-4xl">📧</div>
            <h2 className="text-xl font-extrabold text-slate-950">Confirm Your Email</h2>
            <p className="text-xs text-slate-600 leading-relaxed font-medium">
              We sent a confirmation link to <b className="text-slate-950">{email}</b>.
              Please check your inbox and click the link to confirm your account.
            </p>
            <div className="pt-4 border-t border-slate-100 space-y-2">
              <button onClick={() => setMode("in")} className="w-full py-2.5 rounded-xl bg-slate-950 text-white text-xs font-bold hover:bg-slate-800 transition shadow-md">
                Confirmed Email? Sign In →
              </button>
              <button onClick={() => setMode("up")} className="w-full py-2 text-xs text-slate-500 hover:text-slate-900 font-medium">
                Try Another Email
              </button>
            </div>
          </div>
        ) : (
          <>
            <h2 className="text-xl font-extrabold text-slate-950 text-center">
              {mode==="in" && "Sign In to Your Workspace"}
              {mode==="up" && (inviteInfo ? "Join Your Team Workspace" : "Start 15-Day Free Trial")}
              {mode==="reset" && "Reset Your Password"}
            </h2>
            <p className="mt-1 text-xs text-slate-600 text-center font-medium">
              {mode==="in" && "Welcome back! Enter your login details."}
              {mode==="up" && (inviteInfo ? `You're invited to join ${inviteInfo.orgName}.` : "Select your plan and billing frequency. No charges during 15-day trial.")}
              {mode==="reset" && "Enter your email and we'll send you a reset link."}
            </p>

            <div className="mt-6 space-y-4">
              {/* Highlight Official Invitation if found */}
              {isSignup && inviteInfo && (
                <div className="rounded-2xl border-2 border-emerald-300 bg-emerald-50/90 p-4 space-y-1 text-left shadow-xs">
                  <div className="text-[10px] font-black uppercase tracking-wider text-emerald-900 flex items-center gap-1.5">
                    <span className="text-sm">✉️</span>
                    <span>Verified Company Invitation</span>
                  </div>
                  <div className="text-sm font-black text-emerald-950">
                    Join {inviteInfo.orgName} as {ROLE_LABEL[inviteInfo.role] || inviteInfo.role}
                  </div>
                  <p className="text-xs text-emerald-800 font-medium leading-relaxed">
                    Your seat is fully covered by your company. Create a password below to activate your planner and join your team.
                  </p>
                </div>
              )}

              {/* Plan Selection (Only for new company creators, NOT for invitees) */}
              {isSignup && !inviteInfo && (
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-700">1. Select Plan & Billing</label>
                    <div className="flex items-center rounded-xl bg-slate-100 p-1 border border-slate-200">
                      <button 
                        type="button" 
                        onClick={() => setBillingCycle("monthly")}
                        className={`rounded-lg px-2.5 py-1 text-xs font-bold transition ${
                          billingCycle === "monthly" ? "bg-white text-slate-950 shadow-xs" : "text-slate-500 hover:text-slate-900"
                        }`}
                      >
                        Monthly
                      </button>
                      <button 
                        type="button" 
                        onClick={() => setBillingCycle("yearly")}
                        className={`rounded-lg px-2.5 py-1 text-xs font-bold transition flex items-center gap-1 ${
                          billingCycle === "yearly" ? "bg-amber-400 text-slate-950 shadow-xs" : "text-slate-500 hover:text-slate-900"
                        }`}
                      >
                        <span>Annual</span>
                        <span className="text-[10px] bg-slate-950 text-white px-1.5 py-0.2 rounded-md">Save 25%</span>

function ResetPasswordScreen({ onDone }){
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setMsg("");
    if (pw.length < 6) { setMsg("Password must be at least 6 characters."); return; }
    if (pw !== pw2) { setMsg("Passwords don't match."); return; }
    setBusy(true);
    try {
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) throw error;
      setMsg("Password updated. Taking you to your planner…");
      setTimeout(onDone, 1200);
    } catch (e) { setMsg(e.message || "Something went wrong."); }
    setBusy(false);
  };

  return (
    <div className="flex min-h-screen items-center justify-center bg-[#fbf9fa] px-4">
      <div className="w-full max-w-sm rounded-3xl border border-slate-200 bg-white p-8 text-slate-900 shadow-xl">

        <p className="mt-1 text-xs text-slate-600 text-center">Choose a new password for your account.</p>

        <div className="mt-6 space-y-3">
          <input value={pw} onChange={e=>setPw(e.target.value)} type="password" placeholder="New password"
            className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />
          <input value={pw2} onChange={e=>setPw2(e.target.value)} type="password" placeholder="Confirm new password"
            onKeyDown={e=>e.key==="Enter"&&submit()}
            className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />
          <button onClick={submit} disabled={busy}

        {msg && <p className="mt-3 text-xs font-medium text-amber-700 bg-amber-50 border border-amber-200 p-2.5 rounded-xl">{msg}</p>}

  );
}

    sb.from("plans").select("*").order("sort_order", { ascending: true })
      .then(({ data }) => {
        if (data && data.length) {
          const buyable = data.filter(p => p.code !== "free" && p.code !== "unlimited");
          const list = buyable.length ? buyable : data;
          setPlansList(list);
          const firstWithRzp = list.find(p => p.razorpay_plan_id) || list[0];
          if (firstWithRzp) setPlanCode(firstWithRzp.code);

      // 2. Launch Razorpay payment mandate checkout

function ExecutiveWelcomeOnboardingFlow({ orgCtx, session, onClose, onUpdated }) {
  const org = orgCtx?.org;
  const profile = orgCtx?.profile;
  const userId = session?.user?.id;

  const isProfileDone = !!(profile && profile.profile_completed);
  const [step, setStep] = useState(isProfileDone ? "training" : "profile"); // profile | training | booked

  // Email Verification & Correction State
  const [currentEmail, setCurrentEmail] = useState(session?.user?.email || profile?.email || "");
  const [isEmailVerified, setIsEmailVerified] = useState(!!profile?.email_verified);
  const [showEmailEdit, setShowEmailEdit] = useState(false);
  const [newEmailInput, setNewEmailInput] = useState("");
  const [otpSent, setOtpSent] = useState(false);
  const [otpCodeInput, setOtpCodeInput] = useState("");
  const [otpTargetEmail, setOtpTargetEmail] = useState("");
  const [otpCooldown, setOtpCooldown] = useState(0);
  const [otpBusy, setOtpBusy] = useState(false);
  const [otpMsg, setOtpMsg] = useState("");
  const [otpTone, setOtpTone] = useState("ok"); // ok | bad

  // Profile Form State
  const [fullName, setFullName] = useState(profile?.full_name || "");
  const [phone, setPhone] = useState(profile?.phone || org?.phone || "");
  const [roleTitle, setRoleTitle] = useState(profile?.role_title || "Founder / CEO");
  const [industry, setIndustry] = useState(profile?.industry || org?.industry || "Technology / SaaS");
  const [teamSize, setTeamSize] = useState(profile?.team_size || org?.team_size || "2–5 team members");
  const [primaryGoal, setPrimaryGoal] = useState(profile?.primary_goal || "Delegating Operational Bottlenecks");

  // Training Slot State
  const isBooked = org?.training_status === "booked";
  const [preferredDate, setPreferredDate] = useState("");
  const [preferredTime, setPreferredTime] = useState("11:30 AM - 12:00 PM (IST)");
  const [availableSlots, setAvailableSlots] = useState([
    "10:00 AM - 10:30 AM (IST)",
    "11:30 AM - 12:00 PM (IST)",
    "02:00 PM - 02:30 PM (IST)",
    "03:30 PM - 04:00 PM (IST)",
    "05:00 PM - 05:30 PM (IST)",
    "06:30 PM - 07:00 PM (IST)"
  ]);
  const [topic, setTopic] = useState(profile?.primary_goal || "Owner Hour Value & Delegation Setup");
  const [notes, setNotes] = useState("");

  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  useEffect(() => {
    loadTrainingConfig().then(cfg => {
      if (cfg && cfg.slots && cfg.slots.length) {
        setAvailableSlots(cfg.slots);
        setPreferredTime(cfg.slots[0]);
      }
    }).catch(() => {});
  }, []);

  // Sync topic with primary goal
  useEffect(() => {
    if (primaryGoal) setTopic(primaryGoal);
  }, [primaryGoal]);

  // Cooldown timer
  useEffect(() => {
    if (otpCooldown > 0) {
      const t = setTimeout(() => setOtpCooldown(c => c - 1), 1000);
      return () => clearTimeout(t);
    }
  }, [otpCooldown]);

  const handleSendOtp = async (targetEmail, isChange = false) => {
    const emailToUse = (targetEmail || currentEmail).trim();
    if (!emailToUse || !emailToUse.includes("@")) {
      setOtpMsg("Please enter a valid email address.");
      setOtpTone("bad");
      return;
    }
    setOtpBusy(true); setOtpMsg("");
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/verify-email-otp`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          action: "send",
          email: currentEmail,
          new_email: isChange ? emailToUse : undefined
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Couldn't dispatch verification code.");

      setOtpSent(true);
      setOtpTargetEmail(emailToUse);
      setOtpCooldown(60);
      setOtpTone("ok");
      setOtpMsg(`6-digit verification code sent to ${emailToUse}. Check your inbox!`);
    } catch (e) {
      setOtpTone("bad");
      setOtpMsg(e.message || "Failed to send verification code.");
    }
    setOtpBusy(false);
  };

  const handleVerifyOtp = async () => {
    const code = otpCodeInput.trim();
    if (!code || code.length < 6) {
      setOtpMsg("Please enter the 6-digit code received in your email.");
      setOtpTone("bad");
      return;
    }
    setOtpBusy(true); setOtpMsg("");
    try {
      const isChange = otpTargetEmail.toLowerCase() !== currentEmail.toLowerCase();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/verify-email-otp`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          action: "verify",
          email: currentEmail,
          code: code,
          user_id: userId,
          new_email: isChange ? otpTargetEmail : undefined
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Verification failed.");

      setIsEmailVerified(true);
      if (isChange) {
        setCurrentEmail(otpTargetEmail);
        setShowEmailEdit(false);
      }
      setOtpSent(false);
      setOtpCodeInput("");
      setOtpTone("ok");
      setOtpMsg(isChange ? `Email successfully updated and confirmed to ${otpTargetEmail}!` : "Email successfully verified via OTP!");
      if (onUpdated) onUpdated();
    } catch (e) {
      setOtpTone("bad");
      setOtpMsg(e.message || "Invalid or expired verification code.");
    }
    setOtpBusy(false);
  };

  const handleSaveProfile = async () => {
    const fn = fullName.trim();
    const ph = phone.trim();
    if (!fn) { setMsg("Please enter your full name."); return; }
    if (!ph || ph.length < 7) { setMsg("Please enter a valid mobile / WhatsApp number."); return; }

    setBusy(true); setMsg("");
    try {
      // 1. Update Profile in Supabase
      await updateProfile(userId, {
        full_name: fn,
        phone: ph,
        role_title: roleTitle,
        industry: industry,
        team_size: teamSize,
        primary_goal: primaryGoal,
        profile_completed: true
      });

      // 2. Update Org info
      if (org) {
        await updateOrgTraining(org.id, {
          phone: ph,
          industry: industry,
          team_size: teamSize
        });
      }

      if (onUpdated) onUpdated();
      setStep("training");
    } catch (e) {
      setMsg(e.message || "Couldn't save profile.");
    }
    setBusy(false);
  };

  const handleBookTraining = async () => {
    if (!preferredDate) {
      setMsg("Please select your preferred date for the Google Meet call.");
      return;
    }
    setBusy(true); setMsg("");
    try {
      const bookRes = await bookTrainingSession({
        orgId: org.id,
        userId: session.user.id,
        dateStr: preferredDate,
        timeSlot: preferredTime,
        topic: topic,
        notes: notes,
        founderName: fullName || profile?.full_name || org.name,
        founderEmail: currentEmail || session.user.email,
        founderPhone: phone,
        companyName: org.name,
        industry: industry,
        teamSize: teamSize
      });

      if (onUpdated) onUpdated();
      const coachInfo = bookRes.coach ? ` (Assigned Onboarding Coach: ${bookRes.coach.name})` : "";
      setMsg(`Training session confirmed${coachInfo}! We have reserved your slot and dispatched instant confirmation emails.`);
      setStep("booked");
    } catch (e) {
      setMsg(e.message || "Couldn't save booking.");
    }
    setBusy(false);
  };

  const handleCancelOrReschedule = async () => {
    setBusy(true);
    try {
      await updateOrgTraining(org.id, {
        training_status: "unbooked",
        training_booked_at: null
      });
      if (onUpdated) onUpdated();
      setStep("training");
    } catch (e) {
      setMsg(e.message || "Couldn't update booking.");
    }
    setBusy(false);
  };

  const handleSkipTraining = async () => {
    try {
      if (org && org.training_status === "unbooked") {
        await updateOrgTraining(org.id, { training_status: "skipped" });
        if (onUpdated) onUpdated();
      }
    } catch (_) {}
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-xs">
      <div className="w-full max-w-xl rounded-3xl border border-slate-200 bg-white p-6 sm:p-8 text-slate-900 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
        
        {/* Header */}
        <div className="flex items-start justify-between border-b border-slate-100 pb-4">
          <div className="flex items-center gap-3">
            <div className="flex h-12 w-12 items-center justify-center rounded-2xl bg-amber-50 text-2xl border border-amber-200 text-amber-700 shadow-xs">
              {step === "profile" ? "👤" : "📹"}
            </div>
            <div>
              <div className="inline-flex items-center gap-1.5 rounded-full bg-amber-100/80 px-2.5 py-0.5 text-[10px] font-bold text-amber-950 mb-1 uppercase tracking-wider">

              </div>
              <h2 className="text-xl font-extrabold text-slate-950">

          {/* Close button ONLY allowed when profile is already completed */}

              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Your Role / Title</label>

                    <option value="Managing Director">Managing Director</option>
                    <option value="Co-Founder">Co-Founder</option>
                    <option value="Chief Operating Officer">Chief Operating Officer</option>
                    <option value="VP / General Manager">VP / General Manager</option>
                    <option value="Other">Other Executive</option>

                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Industry / Sector</label>
                  <select 
                    value={industry} 
                    onChange={e => setIndustry(e.target.value)}
                    className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition"
                  >
                    <option value="Technology / SaaS">Technology / SaaS</option>
                    <option value="Consulting & Professional Services">Consulting & Professional Services</option>
                    <option value="Marketing & Media Agency">Marketing & Media Agency</option>
                    <option value="Manufacturing & Logistics">Manufacturing & Logistics</option>
                    <option value="Real Estate & Construction">Real Estate & Construction</option>
                    <option value="E-commerce & Retail">E-commerce & Retail</option>
                    <option value="Financial Services">Financial Services</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Team Size</label>
                  <select 
                    value={teamSize} 
                    onChange={e => setTeamSize(e.target.value)}

                  >
                    <option value="Solo (1)">Solo (1 person)</option>
                    <option value="2–5 team members">2–5 team members</option>
                    <option value="6–20 team members">6–20 team members</option>
                    <option value="20–50 team members">20–50 team members</option>
                    <option value="50+ team members">50+ team members</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Primary Strategic Focus</label>
                  <select 
                    value={primaryGoal} 
                    onChange={e => setPrimaryGoal(e.target.value)}
                    className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition"
                  >
                    <option value="Delegating Operational Bottlenecks">Delegating Operational Bottlenecks</option>
                    <option value="Setting & Tracking Team KRAs/KPIs">Setting & Tracking Team KRAs/KPIs</option>
                    <option value="Mastering Daily Time-Blocking & Focus">Mastering Daily Time-Blocking & Focus</option>
                    <option value="Scaling Revenue & Business Systems">Scaling Revenue & Business Systems</option>
                  </select>
                </div>
              </div>

              <div className="pt-3">
                <button 
                  onClick={handleSaveProfile} 
                  disabled={busy}
                  className="w-full py-3.5 rounded-xl bg-slate-950 text-white font-bold text-xs hover:bg-slate-800 transition shadow-md disabled:opacity-60 flex items-center justify-center gap-2"
                >
                  {busy ? "Saving Profile..." : "Save Executive Profile & Continue to Training Call →"}
                </button>
              </div>
            </div>

            {msg && <p className="text-xs font-medium text-amber-800 bg-amber-50 border border-amber-200 p-3 rounded-xl leading-relaxed">{msg}</p>}
          </div>
        )}

        {/* STEP 2: GOOGLE MEET TRAINING SCHEDULER */}
        {step === "training" && (
          <div className="space-y-4">
            <p className="text-xs text-slate-600 leading-relaxed font-medium">
              Accelerate your team's results with a dedicated 20-minute onboarding strategy call over <b>Google Meet</b>. We will help you dial in your <b>Owner Hour Value (OHV)</b>, configure custom task labels, and structure your monthly KRAs.
            </p>

            <div className="space-y-3 pt-1">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Preferred Date</label>
                  <input 
                    type="date" 
                    value={preferredDate} 
                    onChange={e => setPreferredDate(e.target.value)}
                    min={new Date().toISOString().split("T")[0]}
                    className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition"

                      <option key={slot} value={slot}>{slot}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Primary Focus Area</label>
                <input 
                  type="text" 
                  value={topic} 
                  onChange={e => setTopic(e.target.value)}
                  className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition"
