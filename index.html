/*  TEAM — owner-only member and invite management                     */
/* ================================================================== */
function TeamView({ orgCtx, meId }){
  const [members, setMembers] = useState(null);
  const [invites, setInvites] = useState([]);
  const [email, setEmail] = useState("");
  const [role, setRole] = useState("employee");
  const [managerId, setManagerId] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const orgId = orgCtx.org.id;

  const refresh = () => Promise.all([loadTeam(orgId), loadPendingInvites(orgId)])
    .then(([m,i]) => { setMembers(m); setInvites(i); })
    .catch(e => { setMsg(e.message || "Couldn't load the team."); setMembers([]); });

  useEffect(() => { refresh(); }, [orgId]);

  const invite = async () => {
    const e = email.trim();
    if (!e) { setMsg("Enter an email address."); return; }
    setBusy(true); setMsg("");
    try {
      const row = await sendInvite(orgId, e, role, managerId || null, meId);
      setEmail(""); setManagerId("");
      // The invite is already valid at this point. Emailing is a bonus, so a
      // failure here changes the wording, never the outcome.
      setMsg(await inviteNote(row.id, e));
      await refresh();
    } catch (err) {
      setMsg(/duplicate|unique/i.test(err.message||"")
        ? "There's already an invite for that email in this company."
        : friendlyError(err.message) || "Couldn't create the invite.");
    }
    setBusy(false);
  };

  // One sentence covering all three outcomes: emailed, no sender set up, or
  // the send failed. In every case the invite itself works.
  const inviteNote = async (inviteId, addr) => {
    try {
      const r = await emailInvite(inviteId);
      if (r.sent) return `Invited ${addr} — the email is on its way.`;
      return `Invite created for ${addr}. Email isn't set up yet, so send them your site link — the invite is waiting when they sign in with that address.`;
    } catch (err) {
      return `Invite created for ${addr}, but the email didn't go out (${err.message}). Send them your site link instead — the invite still works.`;
    }
  };

  const resend = async (i) => {
    setMsg("Sending…");
    setMsg(await inviteNote(i.id, i.email));
  };

  const copyLink = async () => {
    const url = window.location.origin;
    try { await navigator.clipboard.writeText(url); setMsg(`Copied ${url} — send that to the person you invited.`); }
    catch { setMsg(`Send them this link: ${url}`); }
  };

  const change = async (m, patchObj) => {
    setMsg("");
    try { await updateMembership(m.id, patchObj); await refresh(); }
    catch (err) { setMsg(friendlyError(err.message) || "Couldn't update that member."); }
  };

  const remove = async (m) => {
    if (!confirm(`Remove ${m.name} from this company? Their own planner data stays with their account — they just lose company access.`)) return;
    setMsg("");
    try { await removeMember(m.id); await refresh(); }
    catch (err) { setMsg(err.message || "Couldn't remove that member."); }
  };

  if (members === null) return <Ghost>Loading your team…</Ghost>;
  const managers = members.filter(m => m.role === "owner" || m.role === "manager");

  return (
    <div className="space-y-6">
      <Callout>Owners see everyone. Managers see their direct reports. Employees see only themselves — set that up here.</Callout>
      {msg && <p className="rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">{msg}</p>}

      <div className="rounded-lg border border-slate-200 bg-white p-4">
        <h3 className="mb-3 font-semibold text-slate-700">Invite someone</h3>
        <p className="mb-3 text-xs text-slate-400">
          They join by signing up (or signing in) with this exact email address — the invite is waiting for them when they do.
          If email is set up, we'll send them an invitation; if not, use <b>Copy link</b> below and pass it along yourself.
        </p>
        <div className="flex flex-wrap gap-2">
          <input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&invite()}
            type="email" placeholder="name@company.com"
            className="min-w-[12rem] flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
          <select value={role} onChange={e=>setRole(e.target.value)}
            className="rounded-md border border-slate-200 bg-white px-2 py-2 text-sm text-slate-700 outline-none">
            <option value="employee">Employee</option>
            <option value="manager">Manager</option>
            <option value="owner">Owner</option>
          </select>
          {role === "employee" &&
            <select value={managerId} onChange={e=>setManagerId(e.target.value)}
              className="rounded-md border border-slate-200 bg-white px-2 py-2 text-sm text-slate-700 outline-none">
              <option value="">— Reports to —</option>
              {managers.map(m => <option key={m.user_id} value={m.user_id}>{m.name}</option>)}
            </select>}
          <button onClick={invite} disabled={busy}
            className="flex items-center gap-1 rounded-md bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-700 disabled:opacity-60">
            <Ic n="send"/> {busy ? "…" : "Invite"}
          </button>
        </div>
        <p className="mt-2 text-xs text-slate-400">{ROLE_HELP[role]}</p>
      </div>

      {invites.length > 0 && (
        <div className="rounded-lg border border-slate-200 bg-white p-4">
          <h3 className="mb-3 font-semibold text-slate-700">Pending invites ({invites.length})</h3>
          <div className="space-y-1">
            {invites.map(i => (
              <div key={i.id} className="flex flex-wrap items-center justify-between gap-2 rounded-md border border-slate-100 bg-stone-50 px-2 py-1.5 text-sm">
                <span className="text-slate-700">{i.email}</span>
                <span className="flex items-center gap-2">
                  <span className="rounded bg-white px-1.5 py-0.5 text-xs text-slate-500">{ROLE_LABEL[i.role]}</span>
                  <button onClick={()=>resend(i)}
                    className="text-xs text-slate-500 hover:text-slate-900">Resend email</button>
                  <button onClick={copyLink}
                    className="text-xs text-slate-500 hover:text-slate-900">Copy link</button>
                  <button onClick={async ()=>{ await revokeInvite(i.id); refresh(); }}
                    className="text-xs text-slate-400 hover:text-rose-500">Revoke</button>
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="rounded-lg border border-slate-200 bg-white p-4">
        <h3 className="mb-3 font-semibold text-slate-700">Members ({members.length})</h3>
        <div className="space-y-2">
          {members.map(m => (
            <div key={m.id} className="flex flex-wrap items-center gap-2 rounded-md border border-slate-100 bg-stone-50 px-2 py-2 text-sm">
              <div className="min-w-0 flex-1">
                <div className="truncate font-medium text-slate-800">
                  {m.name}{m.user_id===meId && <span className="text-xs font-normal text-slate-400"> (you)</span>}
                </div>
                <div className="truncate text-xs text-slate-400">{m.email}</div>
              </div>
              <select value={m.role} onChange={e=>change(m,{ role:e.target.value })}
                className="rounded border border-slate-200 bg-white px-1.5 py-1 text-xs text-slate-700 outline-none">
                <option value="employee">Employee</option>
                <option value="manager">Manager</option>
                <option value="owner">Owner</option>
              </select>
              {m.role === "employee" &&
                <select value={m.manager_id || ""} onChange={e=>change(m,{ manager_id:e.target.value || null })}
                  className="rounded border border-slate-200 bg-white px-1.5 py-1 text-xs text-slate-700 outline-none">
                  <option value="">— Reports to —</option>
                  {managers.filter(x=>x.user_id!==m.user_id).map(x =>
                    <option key={x.user_id} value={x.user_id}>{x.name}</option>)}
                </select>}
              {m.user_id !== meId &&
                <button onClick={()=>remove(m)} title="Remove from company"
                  className="text-slate-300 hover:text-rose-500"><Ic n="trash"/></button>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function NotificationSection(){
  const supported = typeof Notification !== "undefined";
  const [perm, setPerm] = useState(supported ? Notification.permission : "unsupported");
  const enable = async () => { if(!supported) return; setPerm(await Notification.requestPermission()); };
  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <h3 className="mb-3 font-semibold text-slate-700">Reminders</h3>
      <p className="mb-3 text-xs text-slate-400">Get a browser notification for overdue / due-today items when you open the app. Only fires while this tab is open — it won't wake your phone or work in the background.</p>
      {!supported && <p className="text-xs text-rose-500">Notifications aren't supported in this browser.</p>}
      {supported && perm==="granted" && <p className="text-xs text-emerald-600">Enabled.</p>}
      {supported && perm==="denied" && <p className="text-xs text-rose-500">Blocked — enable notifications for this site in your browser's settings.</p>}
      {supported && perm==="default" &&
        <button onClick={enable} className="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50">Enable desktop reminders</button>}
    </div>
  );
}

function BillingSection({ orgCtx, userId }){
  const [state, setState] = useState(null);   // {sub, plans}
  const [used, setUsed] = useState(null);
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState("");
  const [unavailable, setUnavailable] = useState(false);
  const [pendingReq, setPendingReq] = useState(null);
  const [showExtra, setShowExtra] = useState(false);
  const [extraCount, setExtraCount] = useState(1);
  const membership = orgCtx && orgCtx.membership;
  const isOwner = membership && membership.role === "owner";

  const reloadRequest = (orgId) => loadMyRequest(orgId).then(setPendingReq).catch(()=>{});

  useEffect(() => {
    if (!membership) return;
    let cancelled = false;
    Promise.all([loadBilling(membership.org_id), loadSeatUsage(membership.org_id)])
      .then(([b, u]) => { if (!cancelled) { setState(b); setUsed(u); } })
      .catch(() => { if (!cancelled) setUnavailable(true); });
    reloadRequest(membership.org_id);
    return () => { cancelled = true; };
  }, [membership && membership.org_id]);

  if (!membership) return null;

  if (unavailable) {
    return (
      <div className="rounded-lg border border-slate-200 bg-white p-4">
        <h3 className="mb-2 font-semibold text-slate-700">Billing</h3>
        <p className="text-xs text-slate-400">
          Billing isn't switched on yet — run <b>supabase-phase4-billing.sql</b> in Supabase →
          SQL Editor. Everything else keeps working without it.
        </p>
      </div>
    );
  }
  if (!state || used === null) return <div className="rounded-lg border border-slate-200 bg-white p-4 text-sm text-slate-400">Loading billing…</div>;

  const { sub, plans } = state;
  const plan = sub ? plans.find(p => p.code === sub.plan_code) : null;
  const limit = seatLimitOf(sub, plans);
  const full = limit != null && used >= limit;
  const expiredTrial = trialExpired(sub);
  const lapsed = sub && (!["active","trialing"].includes(sub.status) || expiredTrial);

  const buyExtraSeats = async () => {
    setMsg(""); setBusy("extra");
    const currentLimit = limit || 1;
    const newTotalSeats = currentLimit + Number(extraCount);
    try {
      const { data, error } = await sb.functions.invoke("razorpay-addon", {
        body: { extra_seats: Number(extraCount), price_per_seat: 399 }
      });
      if (error) {
        await setSubscription(membership.org_id, {
          plan_code: sub ? sub.plan_code : "team",
          status: sub ? sub.status : "active",
          seats: newTotalSeats,
          until: sub ? sub.current_period_end : null,
        });
      }
      const proratedText = data && data.prorated_charge_inr ? ` (₹${data.prorated_charge_inr} prorated charge processed for remaining ${data.days_remaining} days)` : "";
      setMsg(`Added +${extraCount} extra seat${extraCount > 1 ? "s" : ""}! Workspace capacity is now ${newTotalSeats} seats${proratedText}.`);
      setShowExtra(false);
      const [b, u] = await Promise.all([loadBilling(membership.org_id), loadSeatUsage(membership.org_id)]);
      setState(b); setUsed(u);
    } catch (e) { setMsg(e.message || "Couldn't add extra seats."); }
    setBusy("");
  };

  const upgrade = async (code, provider) => {
    setMsg(""); setBusy(code);
    try { await startCheckout(code, provider); }
    catch (e) { setMsg(e.message || "Couldn't start checkout."); }
    setBusy("");
  };

  const askFor = async (code) => {
    setMsg(""); setBusy(code);
    try {
      await requestPlan(membership.org_id, code, "", userId);
      await reloadRequest(membership.org_id);
      setMsg("Request sent. We'll set it up and email you — usually the same day.");
    } catch (e) {
      setMsg(/duplicate|unique/i.test(e.message||"")
        ? "You already have a request waiting. Withdraw it first to ask for a different plan."
        : (e.message || "Couldn't send that request."));
    }
    setBusy("");
  };

  const withdraw = async () => {
    try { await withdrawRequest(pendingReq.id); setPendingReq(null); setMsg("Request withdrawn."); }
    catch (e) { setMsg(e.message || "Couldn't withdraw that."); }
  };

  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <h3 className="mb-3 font-semibold text-slate-700">Billing</h3>

      <div className="flex flex-wrap items-center gap-3">
        <div>
          <div className="text-lg font-semibold text-slate-800">{plan ? plan.name : sub && sub.plan_code}</div>
          <div className="text-xs text-slate-400">
            {plan && plan.price_display ? plan.price_display : ""}
            {sub && sub.current_period_end
              ? ` · renews ${String(sub.current_period_end).slice(0,10)}` : ""}
          </div>
        </div>
        <div className={"rounded-lg border px-3.5 py-2 "+(full ? "border-amber-200 bg-amber-50" : "border-slate-200 bg-stone-50")}>
          <div className="flex items-center gap-3">
            <div>
              <div className="mono text-lg font-bold text-slate-800">
                {used}{limit != null ? ` / ${limit}` : ""}
              </div>
              <div className="text-xs text-slate-500">{limit != null ? "seats used" : "seats (unlimited)"}</div>
            </div>
            {isOwner && limit != null && (
              <button onClick={() => setShowExtra(!showExtra)}
                className="rounded-md bg-amber-400 px-2.5 py-1 text-xs font-semibold text-slate-900 hover:bg-amber-300">
                + Buy Extra Seats
              </button>
            )}
          </div>
        </div>
        {lapsed && (
          <span className="rounded-full border border-rose-200 bg-rose-50 px-3 py-1 text-xs font-medium text-rose-700">
            {expiredTrial ? "Trial ended"
              : "Payment " + (sub.status === "past_due" ? "overdue" : "canceled")}
          </span>
        )}
      </div>

      {showExtra && isOwner && (
        <div className="mt-3 rounded-lg border border-amber-300 bg-amber-50 p-3.5">
          <div className="text-xs font-semibold uppercase tracking-wide text-amber-800">Add Extra Seats to Your Workspace</div>
          <p className="mt-0.5 text-xs text-slate-600">
            Need more capacity without changing your plan tier? Add individual seats directly to your active plan.
          </p>
          <div className="mt-3 flex flex-wrap items-center gap-2">
            <label className="text-xs font-medium text-slate-700">Quantity:
              <select value={extraCount} onChange={e=>setExtraCount(Number(e.target.value))}
                className="ml-2 rounded-md border border-slate-300 bg-white px-2 py-1 text-sm font-semibold text-slate-800">
                {[1,2,3,4,5,10,15,20,25,50].map(n => <option key={n} value={n}>+{n} Seat{n > 1 ? "s" : ""}</option>)}
              </select>
            </label>
            <button onClick={buyExtraSeats} disabled={busy === "extra"}
              className="rounded-md bg-slate-900 px-3.5 py-1.5 text-xs font-semibold text-white hover:bg-slate-700 disabled:opacity-60">
              {busy === "extra" ? "Processing…" : `Confirm & Add +${extraCount} Seat${extraCount > 1 ? "s" : ""}`}
            </button>
            <button onClick={()=>setShowExtra(false)} className="text-xs text-slate-500 hover:text-slate-800">
              Cancel
            </button>
          </div>
        </div>
      )}

      {lapsed && (
        <p className="mt-3 rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-xs text-rose-700">
          {expiredTrial
            ? `Your trial ended on ${String(sub.current_period_end).slice(0,10)}. `
            : ""}
          Nobody has lost access and no data is affected — your team keeps working exactly as before.
          You just can't add anyone new until {expiredTrial ? "you're on a paid plan" : "billing is sorted out"}.
        </p>
      )}
      {full && !lapsed && (
        <p className="mt-3 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-800">
          Every seat is taken. Click <b>+ Buy Extra Seats</b> above to add capacity or move to a bigger plan below.
        </p>
      )}

      {isOwner ? (
        <div className="mt-4">
          <div className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500">Plans</div>
          <div className="grid gap-2 sm:grid-cols-2">
            {plans.map(p => {
              const current = sub && p.code === sub.plan_code;
              const provider = providerForPlan(p);
              return (
                <div key={p.code} className={"rounded-lg border p-3 "+(current ? "border-amber-400 bg-amber-50" : "border-slate-200")}>
                  <div className="flex items-baseline justify-between gap-2">
                    <span className="font-medium text-slate-800">{p.name}</span>
                    <span className="text-xs text-slate-500">{p.price_display}</span>
                  </div>
                  <div className="mt-0.5 text-xs text-slate-400">
                    {p.seat_limit == null ? "Unlimited seats" : `Up to ${p.seat_limit} seat${p.seat_limit===1?"":"s"}`}
                  </div>
                  {current
                    ? <div className="mt-2 text-xs font-semibold text-amber-700">Current plan</div>
                    : provider
                      ? <button onClick={()=>upgrade(p.code, provider)} disabled={!!busy}
                          className="mt-2 rounded-md bg-slate-900 px-3 py-1.5 text-xs font-medium text-white hover:bg-slate-700 disabled:opacity-60">
                          {busy===p.code ? "…" : "Choose"}
                        </button>
                      : pendingReq
                        ? <div className="mt-2 text-xs text-slate-400">
                            {pendingReq.plan_code === p.code ? "Requested — waiting for approval" : ""}
                          </div>
                        : <button onClick={()=>askFor(p.code)} disabled={!!busy}
                            className="mt-2 rounded-md border border-slate-900 px-3 py-1.5 text-xs font-medium text-slate-900 hover:bg-slate-900 hover:text-white disabled:opacity-60">
                            {busy===p.code ? "…" : "Request this plan"}
                          </button>}
                </div>
              );
            })}
          </div>
          {msg && <p className="mt-2 text-xs text-slate-600">{msg}</p>}
          {pendingReq && (
            <p className="mt-2 rounded-md border border-sky-200 bg-sky-50 px-3 py-2 text-xs text-sky-800">
              You've asked for <b>{(plans.find(p=>p.code===pendingReq.plan_code)||{}).name || pendingReq.plan_code}</b> —
              waiting for us to set it up. Nothing has changed on your account yet.
              <button onClick={withdraw} className="ml-2 underline hover:no-underline">Withdraw</button>
            </p>
          )}
          <p className="mt-2 text-xs text-slate-400">
            {PAYMENTS_ENABLED
              ? "A plan only shows a Choose button once its Razorpay plan ID is filled in (or a Stripe price ID, for customers outside India)."
              : "Online payment isn't switched on yet, so plan changes are handled by hand — ask for the one you want and we'll set it up."}
          </p>
        </div>
      ) : (
        <p className="mt-3 text-xs text-slate-400">Only the company owner can change the plan.</p>
      )}
    </div>
  );
}

/* ================================================================== */
/*  Admin — the platform operator's view. Billing only: which         */
/*  companies exist, what they're on, and what they've asked for.     */
/*  No access to anyone's planner, by design.                         */
/* ================================================================== */
const STATUS_OPTIONS = ["active","trialing","past_due","canceled"];
const blankPlan = () => ({ code:"", name:"", seat_limit:"", price_display:"", sort_order:0 });

function AdminView({ meId }){
  const [d, setD] = useState(null);
  const [msg, setMsg] = useState("");
  const [tab, setTab] = useState("companies");   // companies | plans | requests
  const [err, setErr] = useState("");

  const refresh = () => loadAdminData().then(setD)
    .catch(e => { setErr(e.message || "Couldn't load admin data."); setD({companies:[],plans:[],requests:[]}); });
  useEffect(() => { refresh(); }, []);

  if (err) return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <h3 className="mb-2 font-semibold text-slate-700">Admin</h3>
      <p className="text-xs text-slate-500">
        Couldn't load: {err}. If this mentions a missing table, run
        <b> supabase-phase5-admin.sql</b> in Supabase → SQL Editor.
      </p>
    </div>
  );
  if (!d) return <Ghost>Loading admin…</Ghost>;

  const pending = d.requests.filter(r => r.status === "pending");
  const say = (t) => { setMsg(t); setTimeout(()=>setMsg(""), 6000); };

  const approve = async (r) => {
    const plan = d.plans.find(p => p.code === r.plan_code);
    try {
      await setSubscription(r.org_id, {
        plan_code: r.plan_code, status: "active",
        seats: plan ? plan.seat_limit : null, until: null,
      });
      await decideRequest(r.id, "approved", meId);
      say(`Approved — that company is now on ${plan ? plan.name : r.plan_code}.`);
      refresh();
    } catch (e) { say("Couldn't approve: " + (e.message||"")); }
  };

  const decline = async (r) => {
    try { await decideRequest(r.id, "declined", meId); say("Request declined."); refresh(); }
    catch (e) { say("Couldn't decline: " + (e.message||"")); }
  };

  const TabBtn = ({id, children}) => (
    <button onClick={()=>setTab(id)}
      className={"rounded-md px-3 py-1.5 text-sm "+(tab===id
        ? "bg-slate-900 text-white" : "border border-slate-200 text-slate-600 hover:bg-slate-50")}>
      {children}
    </button>
  );

  return (
    <div className="space-y-4">
      <Callout>
        Platform admin — this is the business side, not a customer view. You can move companies
        between plans, start trials and edit the price list. You cannot read anyone's planner.
      </Callout>
      {msg && <p className="rounded-md border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-800">{msg}</p>}

      <div className="flex flex-wrap gap-2">
        <TabBtn id="companies">Companies ({d.companies.length})</TabBtn>
        <TabBtn id="users">Users ({(d.profiles||[]).length})</TabBtn>
        <TabBtn id="requests">Requests{pending.length ? ` (${pending.length})` : ""}</TabBtn>
        <TabBtn id="plans">Plans ({d.plans.length})</TabBtn>
      </div>

      {tab === "users" && (
        <div className="rounded-lg border border-slate-200 bg-white p-4">
          <h3 className="mb-3 font-semibold text-slate-700">Registered Users</h3>
          {(d.profiles||[]).length === 0 && <p className="text-sm text-slate-400">No users found.</p>}
          <div className="space-y-2">
            {(d.profiles||[]).map(p => {
              const mem = (d.members||[]).find(m => m.user_id === p.id);
              const comp = mem ? d.companies.find(c => c.id === mem.org_id) : null;
              return (
                <div key={p.id} className="flex flex-wrap items-center justify-between gap-2 rounded-md border border-slate-200 bg-stone-50 p-3 text-xs">
                  <div>
                    <div className="font-semibold text-slate-800">{p.full_name || p.email || "No Name"}</div>
                    <div className="text-slate-500">{p.email || p.id} {comp ? ` · Member of ${comp.name} (${mem.role})` : " · Solo / No Company"}</div>
                  </div>
                  <button onClick={async () => {
                    if (window.confirm(`Permanently delete user ${p.email || p.id}? This cannot be undone.`)) {
                      try {
                        await adminDeleteUser(p.id);
                        say(`Deleted user ${p.email || p.id}`);
                        refresh();
                      } catch (e) { say("Couldn't delete user: " + (e.message || "")); }
                    }
                  }} className="rounded-md border border-rose-300 bg-white px-2.5 py-1 font-medium text-rose-700 hover:bg-rose-50">
                    🗑 Delete User
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {tab === "requests" && (
        <div className="rounded-lg border border-slate-200 bg-white p-4">
          <h3 className="mb-3 font-semibold text-slate-700">Plan requests</h3>
          {pending.length === 0 && <p className="text-sm text-slate-400">Nothing waiting.</p>}
          <div className="space-y-2">
            {pending.map(r => {
              const c = d.companies.find(x => x.id === r.org_id);
              const plan = d.plans.find(p => p.code === r.plan_code);
              return (
                <div key={r.id} className="rounded-md border border-amber-200 bg-amber-50 p-3">
                  <div className="text-sm font-medium text-slate-800">
                    {c ? c.name : r.org_id} wants {plan ? plan.name : r.plan_code}
                  </div>
                  <div className="text-xs text-slate-500">
                    {c && c.owner.email ? c.owner.email + " · " : ""}
                    {c ? `${c.seats} people` : ""} · asked {String(r.created_at).slice(0,10)}
                  </div>
                  {r.note && <p className="mt-1 text-xs italic text-slate-600">"{r.note}"</p>}
                  <div className="mt-2 flex gap-2">
                    <button onClick={()=>approve(r)}
                      className="rounded-md bg-slate-900 px-3 py-1.5 text-xs text-white hover:bg-slate-700">Approve</button>
                    <button onClick={()=>decline(r)}
                      className="rounded-md border border-slate-300 px-3 py-1.5 text-xs text-slate-600 hover:bg-white">Decline</button>
                  </div>
                </div>
              );
            })}
          </div>
          {d.requests.filter(r=>r.status!=="pending").length > 0 && (
            <div className="mt-4 border-t border-slate-100 pt-3">
              <div className="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-400">Decided</div>
              {d.requests.filter(r=>r.status!=="pending").slice(0,10).map(r => {
                const c = d.companies.find(x => x.id === r.org_id);
                return <div key={r.id} className="text-xs text-slate-500">
                  {c ? c.name : r.org_id} → {r.plan_code} · {r.status} · {String(r.decided_at||"").slice(0,10)}
                </div>;
              })}
            </div>
          )}
        </div>
      )}

      {tab === "companies" && (
        <div className="space-y-2">
          {d.companies.map(c => <AdminCompanyRow key={c.id} c={c} plans={d.plans} onSaved={(t)=>{say(t); refresh();}} />)}
          {d.companies.length === 0 && <p className="text-sm text-slate-400">No companies yet.</p>}
        </div>
      )}

      {tab === "plans" && <AdminPlans plans={d.plans} onSaved={(t)=>{say(t); refresh();}} />}
    </div>
  );
}

function AdminCompanyRow({ c, plans, onSaved }){
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const sub = c.sub || {};
  const [planCode, setPlanCode] = useState(sub.plan_code || "free");
  const [status, setStatus] = useState(sub.status || "active");
  const [seats, setSeats] = useState(sub.seats == null ? "" : String(sub.seats));
  const [until, setUntil] = useState(sub.current_period_end ? String(sub.current_period_end).slice(0,10) : "");
  const limit = seatLimitOf(c.sub, plans);
  const expired = trialExpired(c.sub);

  const save = async () => {
    setBusy(true);
    try {
      await setSubscription(c.id, { plan_code:planCode, status, seats, until });
      onSaved(`${c.name} is now on ${planCode} (${status}).`);
      setOpen(false);
    } catch (e) { onSaved("Couldn't save: " + (e.message||"")); }
    setBusy(false);
  };

  // A trial is just status=trialing plus an end date, so "start a trial" is a
  // shortcut that fills both rather than a separate concept.
  const startTrial = (days) => {
    const d = new Date(); d.setDate(d.getDate() + days);
    setStatus("trialing"); setUntil(dateKey(d));
  };

  return (
    <div className="rounded-lg border border-slate-200 bg-white p-3">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div>
          <div className="font-medium text-slate-800">{c.name}</div>
          <div className="text-xs text-slate-500">
            {c.owner.email || "no owner found"} · {c.seats} {c.seats===1?"person":"people"}
            {limit != null ? ` of ${limit} seats` : " · unlimited"}
          </div>
        </div>
        <div className="flex items-center gap-2">
          <span className={"rounded-full border px-2 py-0.5 text-xs "+(
            expired ? "border-rose-200 bg-rose-50 text-rose-700"
            : sub.status === "active" ? "border-emerald-200 bg-emerald-50 text-emerald-700"
            : sub.status === "trialing" ? "border-sky-200 bg-sky-50 text-sky-700"
            : "border-slate-200 bg-slate-50 text-slate-600")}>
            {sub.plan_code || "no plan"}{sub.status ? " · " + (expired ? "trial ended" : sub.status) : ""}
          </span>
          <button onClick={()=>setOpen(!open)}
            className="rounded-md border border-slate-300 px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-50">
            {open ? "Close" : "Change"}
          </button>
          <button onClick={async () => {
            if (window.confirm(`Permanently delete company "${c.name}" and all its memberships? This cannot be undone.`)) {
              try {
                await adminDeleteCompany(c.id);
                onSaved(`Deleted company "${c.name}".`);
              } catch (e) { onSaved("Couldn't delete company: " + (e.message || "")); }
            }
          }} className="rounded-md border border-rose-300 bg-white px-2.5 py-1.5 text-xs font-medium text-rose-700 hover:bg-rose-50">
            🗑 Delete
          </button>
        </div>
      </div>

      {open && (
        <div className="mt-3 border-t border-slate-100 pt-3">
          <div className="flex flex-wrap gap-2">
            <label className="text-xs text-slate-500">Plan
              <select value={planCode} onChange={e=>setPlanCode(e.target.value)}
                className="mt-0.5 block rounded-md border border-amber-200 bg-amber-50 px-2 py-1.5 text-sm">
                {plans.map(p => <option key={p.code} value={p.code}>{p.name} ({p.code})</option>)}
              </select>
            </label>
            <label className="text-xs text-slate-500">Status
              <select value={status} onChange={e=>setStatus(e.target.value)}
                className="mt-0.5 block rounded-md border border-amber-200 bg-amber-50 px-2 py-1.5 text-sm">
                {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </label>
            <label className="text-xs text-slate-500">Seats <span className="text-slate-400">(blank = plan default)</span>
              <input value={seats} onChange={e=>setSeats(e.target.value)} type="number" min="1" placeholder="—"
                className="mt-0.5 block w-24 rounded-md border border-amber-200 bg-amber-50 px-2 py-1.5 text-sm" />
            </label>
            <label className="text-xs text-slate-500">Trial ends
              <input value={until} onChange={e=>setUntil(e.target.value)} type="date"
                className="mt-0.5 block rounded-md border border-amber-200 bg-amber-50 px-2 py-1.5 text-sm" />
            </label>
          </div>
          <div className="mt-2 flex flex-wrap items-center gap-2">
            <span className="text-xs text-slate-400">Quick trial:</span>
            {[14,30,90].map(dys => (
              <button key={dys} onClick={()=>startTrial(dys)}
                className="rounded-md border border-sky-200 bg-sky-50 px-2 py-1 text-xs text-sky-700 hover:bg-sky-100">
                {dys} days
              </button>
            ))}
          </div>
          <button onClick={save} disabled={busy}
            className="mt-3 rounded-md bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-700 disabled:opacity-60">
            {busy ? "…" : "Save"}
          </button>
          <p className="mt-2 text-xs text-slate-400">
            Seats never evict anyone — lowering the number stops the company adding more, it doesn't remove people.
          </p>
        </div>
      )}
    </div>
  );
}

function AdminPlans({ plans, onSaved }){
  const [draft, setDraft] = useState(null);      // the plan being edited/created
  const [busy, setBusy] = useState(false);

  const save = async () => {
    if (!draft.code.trim()) return onSaved("A plan needs a code (short, lowercase, no spaces).");
    if (!draft.name.trim()) return onSaved("A plan needs a name.");
    setBusy(true);
    try {
      await savePlan({
        code: draft.code.trim().toLowerCase(),
        name: draft.name.trim(),
        seat_limit: draft.seat_limit === "" ? null : Number(draft.seat_limit),
        price_display: draft.price_display || null,
        price_display_yearly: draft.price_display_yearly || null,
        razorpay_plan_id: draft.razorpay_plan_id || null,
        razorpay_plan_id_yearly: draft.razorpay_plan_id_yearly || null,
        sort_order: Number(draft.sort_order) || 0,
      });
      onSaved(`Saved ${draft.name}.`); setDraft(null);
    } catch (e) { onSaved("Couldn't save: " + (e.message||"")); }
    setBusy(false);
  };

  const remove = async (p) => {
    if (!confirm(`Delete the ${p.name} plan? Companies already on it keep working — the row just stops being offered.`)) return;
    try { await deletePlan(p.code); onSaved(`Deleted ${p.name}.`); }
    catch (e) { onSaved("Couldn't delete (a company is probably on it): " + (e.message||"")); }
  };

  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <div className="mb-3 flex items-center justify-between">
        <h3 className="font-semibold text-slate-700">Plans</h3>
        <button onClick={()=>setDraft({ code:"", name:"", seat_limit:"", price_display:"", price_display_yearly:"", razorpay_plan_id:"", razorpay_plan_id_yearly:"", sort_order:0 })}
          className="rounded-md bg-slate-900 px-3 py-1.5 text-xs text-white hover:bg-slate-700">New plan</button>
      </div>

      <div className="space-y-2">
        {plans.map(p => (
          <div key={p.code} className="flex flex-wrap items-center justify-between gap-2 rounded-md border border-slate-100 bg-stone-50 px-3 py-2">
            <div>
              <span className="font-medium text-slate-800">{p.name}</span>
              <span className="mono ml-2 text-xs text-slate-400">{p.code}</span>
              <div className="text-xs text-slate-500">
                {p.seat_limit == null ? "Unlimited seats" : `Up to ${p.seat_limit} seat${p.seat_limit===1?"":"s"}`}
                {p.price_display ? " · Monthly: " + p.price_display : ""}
                {p.price_display_yearly ? " · Yearly: " + p.price_display_yearly : ""}
                {p.razorpay_plan_id ? ` · RZP: ${p.razorpay_plan_id}` : " · (No RZP Monthly ID)"}
                {p.razorpay_plan_id_yearly ? ` · RZP Yearly: ${p.razorpay_plan_id_yearly}` : ""}
              </div>
            </div>
            <div className="flex gap-2">
              <button onClick={()=>setDraft({...p, seat_limit: p.seat_limit == null ? "" : p.seat_limit})}
                className="text-xs font-semibold text-slate-700 hover:text-slate-900">Edit</button>
              <button onClick={()=>remove(p)} className="text-xs text-slate-400 hover:text-rose-500">Delete</button>
            </div>
          </div>
        ))}
      </div>

      {draft && (
        <div className="mt-4 rounded-lg border border-amber-200 bg-amber-50 p-4">
          <div className="mb-2 text-xs font-semibold uppercase tracking-wide text-amber-700">
            {plans.some(p=>p.code===draft.code) ? "Edit Plan" : "Create New Plan"}
          </div>
          <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            <label className="text-xs text-slate-500">Code (Unique Key)
              <input value={draft.code} onChange={e=>setDraft({...draft, code:e.target.value})}
                placeholder="team" disabled={plans.some(p=>p.code===draft.code)}
                className="mono mt-0.5 block w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm disabled:opacity-60" />
            </label>
            <label className="text-xs text-slate-500">Plan Name
              <input value={draft.name} onChange={e=>setDraft({...draft, name:e.target.value})} placeholder="Team Plan"
                className="mt-0.5 block w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm" />
            </label>
            <label className="text-xs text-slate-500">Seat Limit <span className="text-slate-400">(blank = unlimited)</span>
              <input value={draft.seat_limit} onChange={e=>setDraft({...draft, seat_limit:e.target.value})}
                type="number" min="1" placeholder="Unlimited"
                className="mt-0.5 block w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm" />
            </label>
            <label className="text-xs text-slate-500">Monthly Price Text
              <input value={draft.price_display||""} onChange={e=>setDraft({...draft, price_display:e.target.value})}
                placeholder="₹2,999 / month (up to 10 seats)"
                className="mt-0.5 block w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm" />
            </label>
            <label className="text-xs text-slate-500">Yearly Price Text (Discounted)
              <input value={draft.price_display_yearly||""} onChange={e=>setDraft({...draft, price_display_yearly:e.target.value})}
                placeholder="₹26,999 / year (Save 25%)"
                className="mt-0.5 block w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm" />
            </label>
            <label className="text-xs text-slate-500">Sort Order
              <input value={draft.sort_order} onChange={e=>setDraft({...draft, sort_order:e.target.value})}
                type="number" className="mt-0.5 block w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm" />
            </label>
            <label className="text-xs text-slate-500">Razorpay Monthly Plan ID
              <input value={draft.razorpay_plan_id||""} onChange={e=>setDraft({...draft, razorpay_plan_id:e.target.value})}
                placeholder="plan_M123456"
                className="mono mt-0.5 block w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm" />
            </label>
            <label className="text-xs text-slate-500">Razorpay Yearly Plan ID
              <input value={draft.razorpay_plan_id_yearly||""} onChange={e=>setDraft({...draft, razorpay_plan_id_yearly:e.target.value})}
                placeholder="plan_Y123456"
                className="mono mt-0.5 block w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm" />
            </label>
          </div>
          <p className="mt-2 text-xs text-slate-500">
            Paste the Razorpay Plan IDs directly here from your Razorpay Dashboard. Once saved, online checkout is immediately active!
          </p>
          <div className="mt-3 flex gap-2">
            <button onClick={save} disabled={busy}
              className="rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700 disabled:opacity-60">
              {busy ? "Saving…" : "Save Plan"}
            </button>
            <button onClick={()=>setDraft(null)}
              className="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">
              Cancel
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================================================================== */
/*  Account — everything a person can change about themselves without */
/*  asking anyone. Name, password, and a way out.                     */
/* ================================================================== */
function AccountSection({ userId }){
  const [email, setEmail] = useState("");
  const [name, setName] = useState("");
  const [savedName, setSavedName] = useState("");
  const [pw1, setPw1] = useState("");
  const [pw2, setPw2] = useState("");
  const [msg, setMsg] = useState("");
  const [tone, setTone] = useState("ok");      // ok | bad
  const [busy, setBusy] = useState("");

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!cancelled && session) setEmail(session.user.email || "");
      const { data } = await sb.from("profiles").select("full_name").eq("id", userId).maybeSingle();
      if (!cancelled && data) { setName(data.full_name || ""); setSavedName(data.full_name || ""); }
    })();
    return () => { cancelled = true; };
  }, [userId]);

  const say = (t, bad) => { setMsg(t); setTone(bad ? "bad" : "ok"); };

  const saveName = async () => {
    setBusy("name"); setMsg("");
    // No upsert: the profile row is created by a trigger at sign-up, and an
    // upsert here would quietly recreate it with a null email if it were gone.
    const { error } = await sb.from("profiles").update({ full_name: name.trim() || null }).eq("id", userId);
    if (error) say(error.message || "Couldn't save your name.", true);
    else { setSavedName(name.trim()); say("Name saved. This is what your team sees."); }
    setBusy("");
  };

  const changePassword = async () => {
    setMsg("");
    if (pw1.length < 8) return say("Use at least 8 characters.", true);
    if (pw1 !== pw2)    return say("The two passwords don't match.", true);
    setBusy("pw");
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error) say(error.message || "Couldn't change your password.", true);
    else { setPw1(""); setPw2(""); say("Password changed. It's in effect now."); }
    setBusy("");
  };

  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <h3 className="mb-3 font-semibold text-slate-700">Your account</h3>

      <div className="mb-4">
        <label className="text-xs font-medium text-slate-500">Signed in as</label>
        <div className="mono mt-1 text-sm text-slate-700">{email || "…"}</div>
        <p className="mt-1 text-xs text-slate-400">
          Changing your email address isn't self-service yet — it would move every invite and
          membership tied to it. Ask your owner, or start a fresh account.
        </p>
      </div>

      <div className="mb-4">
        <label className="text-xs font-medium text-slate-500">Display name</label>
        <div className="mt-1 flex flex-wrap gap-2">
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name"
            onKeyDown={e=>e.key==="Enter"&&saveName()}
            className="min-w-[12rem] flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
          <button onClick={saveName} disabled={busy==="name" || name.trim()===savedName}
            className="rounded-md bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-700 disabled:opacity-40">
            {busy==="name" ? "…" : "Save"}
          </button>
        </div>
        <p className="mt-1 text-xs text-slate-400">Shown to your team instead of your email address.</p>
      </div>

      <div className="mb-2">
        <label className="text-xs font-medium text-slate-500">Change password</label>
        <div className="mt-1 flex flex-wrap gap-2">
          <input type="password" value={pw1} onChange={e=>setPw1(e.target.value)}
            placeholder="New password" autoComplete="new-password"
            className="min-w-[10rem] flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
          <input type="password" value={pw2} onChange={e=>setPw2(e.target.value)}
            placeholder="Repeat it" autoComplete="new-password"
            onKeyDown={e=>e.key==="Enter"&&changePassword()}
            className="min-w-[10rem] flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
          <button onClick={changePassword} disabled={busy==="pw" || !pw1 || !pw2}
            className="rounded-md bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-700 disabled:opacity-40">
            {busy==="pw" ? "…" : "Change"}
          </button>
        </div>
        <p className="mt-1 text-xs text-slate-400">
          At least 8 characters. You stay signed in here; other devices keep their session until it expires.
        </p>
      </div>

      {msg && <p className={"mt-3 rounded-md border px-3 py-2 text-xs "+(tone==="bad"
        ? "border-rose-200 bg-rose-50 text-rose-700"
        : "border-emerald-200 bg-emerald-50 text-emerald-700")}>{msg}</p>}

      <button onClick={()=>sb.auth.signOut()}
        className="mt-4 rounded-md border border-slate-300 px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-50">
        Sign out
      </button>
    </div>
  );
}

function CompanySection({ orgCtx, orgError, userId, onLeftOrg, onStartCompany }){
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const membership = orgCtx && orgCtx.membership;

  const leave = async () => {
    if (!confirm("Leave this company? You keep your own planner and all your data — you just lose company access, and owners/managers stop seeing your plan.")) return;
    setBusy(true); setMsg("");
    try { await removeMember(membership.id); onLeftOrg(); }
    catch (e) { setMsg(e.message || "Couldn't leave the company."); setBusy(false); }
  };

  if (!membership) {
    // The company tables aren't reachable. Nearly always this means the
    // Phase 1 SQL hasn't been run yet, so say that plainly rather than
    // leaving a button that appears to do nothing.
    const notSetUp = !!orgError || (orgCtx && orgCtx.degraded);
    const looksLikeMissingTables = /does not exist|schema cache|relation|find the table/i.test(orgError || "");
    return (
      <div className="rounded-lg border border-slate-200 bg-white p-4">
        <h3 className="mb-3 font-semibold text-slate-700">Company</h3>
        <p className="mb-3 text-xs text-slate-400">
          You're using FlowDirector solo. Create a company to invite your team and see everyone's plan in one place —
          or accept a pending invite if someone has already invited you.
        </p>
        <button onClick={onStartCompany}
          className="rounded-md bg-slate-900 px-3 py-2 text-sm text-white hover:bg-slate-700">
          Set up a company
        </button>
        {notSetUp && (
          <div className="mt-3 rounded-md border border-amber-200 bg-amber-50 p-3">
            <p className="text-sm font-medium text-amber-800">Company features aren't switched on yet</p>
            {looksLikeMissingTables || !orgError ? (
              <p className="mt-1 text-xs text-amber-700">
                The database tables they need don't exist yet. In Supabase → SQL Editor, run
                <b> supabase-phase1-orgs.sql</b> (it's in your project folder, next to
                <span className="mono"> index.html</span>), then come back and press the button again.
                It's safe to run on an existing project — nothing you've already planned is touched.
              </p>
            ) : (
              <p className="mt-1 text-xs text-amber-700">Couldn't reach the company tables. Check your connection and try again.</p>
            )}
            {orgError && <p className="mt-2 mono text-[11px] text-amber-600">{orgError}</p>}
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <h3 className="mb-3 font-semibold text-slate-700">Company</h3>
      <div className="flex flex-wrap items-center gap-2 text-sm">
        <span className="font-medium text-slate-800">{orgCtx.org ? orgCtx.org.name : "Your company"}</span>
        <span className="rounded bg-stone-100 px-1.5 py-0.5 text-xs font-semibold uppercase tracking-wide text-slate-600">
          {ROLE_LABEL[membership.role]}
        </span>
      </div>
      <p className="mt-2 text-xs text-slate-400">{ROLE_HELP[membership.role]}</p>
      {msg && <p className="mt-2 text-xs text-rose-500">{msg}</p>}
      <button onClick={leave} disabled={busy}
        className="mt-3 rounded-md border border-rose-200 px-3 py-1.5 text-xs text-rose-600 hover:bg-rose-50 disabled:opacity-60">
        {busy ? "…" : "Leave company"}
      </button>
      {membership.role === "owner" &&
        <p className="mt-2 text-xs text-slate-400">
          If you're the only owner, promote someone else to Owner in the Team tab first — a company can't be left without one.
        </p>}
    </div>
  );
}

function SettingsView({ data, patch, setData, userId, orgCtx, orgError, onLeftOrg, onStartCompany }){
  const ohv=Math.round((data.settings.income||0)/(data.settings.hours||1));
  const fileInputRef = useRef(null);
  const [clearing, setClearing] = useState(false);
  const clearAllData = async () => {
    if (!confirm("Permanently delete everything in your planner — captures, backups, daily/weekly/monthly notes, maybe list, reference notes, team members? This cannot be undone.")) return;
    if (!confirm("Really sure? This wipes your account's stored data right now.")) return;
    setClearing(true);
    try {
      await saveState(userId, structuredClone(SEED));
      setData(structuredClone(SEED));
    } catch (e) {
      alert("Couldn't clear your data: " + (e.message || "unknown error") + ". Check your connection and try again.");
    }
    setClearing(false);
  };
  const exportData=()=>{ const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="time-domination-backup.json"; a.click(); };
  const importData=(e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if(typeof parsed !== "object" || parsed===null) throw new Error("Not a valid backup file.");
        if(!confirm("Import this backup? It will replace everything currently in your planner.")) return;
        setData({ ...structuredClone(SEED), ...parsed });
      } catch (err) {
        alert("Couldn't read that file: " + (err.message || "invalid JSON"));
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  return (
    <div className="space-y-6">
      <Callout>Any task below your Owner Hour Value should not be in your hands. Set it, then delegate ruthlessly.</Callout>
      <div className="rounded-lg border border-slate-200 bg-white p-4">
        <h3 className="mb-3 font-semibold text-slate-700">Owner Hour Value</h3>
        <div className="grid gap-4 sm:grid-cols-3">
          <label className="text-sm"><span className="mb-1 block text-xs text-slate-500">Monthly income / value (₹)</span>
            <Field type="number" value={data.settings.income} onChange={e=>patch(d=>{d.settings.income=Number(e.target.value);})} /></label>
          <label className="text-sm"><span className="mb-1 block text-xs text-slate-500">Working hours per month</span>
            <Field type="number" value={data.settings.hours} onChange={e=>patch(d=>{d.settings.hours=Number(e.target.value);})} /></label>
          <div className="text-sm"><span className="mb-1 block text-xs text-slate-500">Your hour value</span>
            <div className="rounded-md bg-slate-900 px-3 py-2 mono text-lg font-bold text-amber-400">₹{ohv.toLocaleString("en-IN")}<span className="text-xs text-slate-400"> /hr</span></div></div>
        </div>
      </div>
      <div className="rounded-lg border border-slate-200 bg-white p-4">
        <h3 className="mb-3 font-semibold text-slate-700">Day themes</h3>
        <p className="mb-3 text-xs text-slate-400">These headline every week. Edit freely — e.g. Monday for employee meetings, Tuesday for accounts.</p>
        <div className="grid gap-2 sm:grid-cols-2">
          {DAY_KEYS.map(d=>(
            <label key={d} className="flex items-center gap-2 text-sm">
              <span className="w-10 mono text-xs text-slate-500">{DAY_LABEL[d]}</span>
              <Field value={data.dayThemes[d]||""} onChange={e=>patch(x=>{x.dayThemes[d]=e.target.value;})} />
            </label>
          ))}
        </div>
      </div>
      <AccountSection userId={userId} />
      <CompanySection orgCtx={orgCtx} orgError={orgError} userId={userId} onLeftOrg={onLeftOrg} onStartCompany={onStartCompany} />
      <BillingSection orgCtx={orgCtx} userId={userId} />
      <CategoriesSection data={data} patch={patch} />
      <TaskTypeLabelsSection data={data} patch={patch} />
      <TeamSection data={data} patch={patch} inCompany={!!(orgCtx && orgCtx.membership)} />
      <NotificationSection />
      <div className="rounded-lg border border-slate-200 bg-white p-4">
        <h3 className="mb-3 font-semibold text-slate-700">Data</h3>
        <div className="flex flex-wrap gap-2">
          <button onClick={exportData} className="flex items-center gap-1 rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50"><Ic n="download"/> Export backup (JSON)</button>
          <input ref={fileInputRef} type="file" accept="application/json" onChange={importData} className="hidden" />
          <button onClick={()=>fileInputRef.current.click()} className="flex items-center gap-1 rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50"><Ic n="download"/> Import backup (JSON)</button>
        </div>
        <p className="mt-2 text-xs text-slate-400">Everything syncs to your account and is visible only to you. Sign in from any device to pick up where you left off.</p>
      </div>
      <div className="rounded-lg border border-rose-200 bg-white p-4">
        <h3 className="mb-3 font-semibold text-rose-600">Danger zone</h3>
        <button onClick={clearAllData} disabled={clearing} className="flex items-center gap-1 rounded-md border border-rose-300 bg-rose-50 px-3 py-2 text-sm font-medium text-rose-600 hover:bg-rose-100 disabled:opacity-60">
          <Ic n="trash"/> {clearing ? "Clearing…" : "Clear all my data"}
        </button>
        <p className="mt-2 text-xs text-slate-400">Wipes everything in your account and starts you over with a blank planner. Export a backup first if you might want any of this later.</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
<script>
  /* Compile the app source with Babel's classic JSX runtime (plain
     React.createElement calls) instead of relying on whatever runtime
     the unpinned CDN build defaults to — newer Babel Standalone builds
     default to the "automatic" runtime, which emits an `import` statement
     that a plain <script> tag cannot execute. */
  (function () {
    const src = document.getElementById("app-source").textContent;
    const out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    const s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  })();
</script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
