// Everything the app needs to know about the signed-in user's company.
// Returns { membership, org, pendingInvites } — membership is null when solo.
async function loadOrgContext(userId, email){
  const { data: m, error: mErr } = await sb
    .from("memberships").select("*").eq("user_id", userId).maybeSingle();
  if (mErr) throw mErr;

  if (m) {
    const { data: org, error: oErr } = await sb
      .from("organizations").select("*").eq("id", m.org_id).maybeSingle();
    if (oErr) throw oErr;
    return { membership:m, org, pendingInvites:[] };
  }

  // No company yet — is somebody waiting for them to accept?
  const { data: invites } = await sb
    .from("invites").select("*").is("accepted_at", null);
  const mine = (invites||[]).filter(i => (i.email||"").toLowerCase() === (email||"").toLowerCase());
  if (mine.length) {
    const { data: orgs } = await sb
      .from("organizations").select("id,name").in("id", mine.map(i=>i.org_id));
    const withOrgNames = mine.map(i => ({ ...i, orgName:(orgs||[]).find(o=>o.id===i.org_id)?.name || "a company" }));
    return { membership:null, org:null, pendingInvites:withOrgNames };
  }

  // No membership and no pending invites — auto-create default workspace
  try {
    const namePart = (email || "My").split("@")[0];
    const cleanName = namePart.charAt(0).toUpperCase() + namePart.slice(1);
    const { org, membership } = await createOrg(`${cleanName}'s Workspace`, userId);
    return { membership, org, pendingInvites:[] };
  } catch (err) {
    return { membership:null, org:null, pendingInvites:[] };
  }
}

async function createOrg(name, userId){
  const { data: org, error } = await sb
    .from("organizations").insert({ name, created_by:userId }).select().single();
  if (error) throw error;
  const { data: m, error: mErr } = await sb
    .from("memberships").insert({ org_id:org.id, user_id:userId, role:"owner" }).select().single();
  if (mErr) throw mErr;
  return { org, membership:m };
}

    org_id: invite.org_id, user_id: userId,

  const { data: org } = await sb.from("organizations").select("*").eq("id", invite.org_id).maybeSingle();

/* ================================================================== */
/*  Goals layer — KRAs and KPIs (Phase 3)                              */
/*  KRA = a responsibility area. KPI = one number with a target,       */
/*  measured per period. Targets are set by management; the actual is  */
/*  reported by the person (or corrected by their manager).            */
/* ================================================================== */
const pad2n = (n) => String(n).padStart(2,"0");
const monthPeriod   = (d=new Date()) => `${d.getFullYear()}-${pad2n(d.getMonth()+1)}`;
const quarterPeriod = (d=new Date()) => `${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)+1}`;
const periodFor = (cadence, d=new Date()) => cadence==="quarterly" ? quarterPeriod(d) : monthPeriod(d);

const shiftPeriod = (period, n) => {
  const q = period.match(/^(\d{4})-Q([1-4])$/);
  if (q) {
    let y = +q[1], idx = +q[2] - 1 + n;
    y += Math.floor(idx/4); idx = ((idx%4)+4)%4;
    return `${y}-Q${idx+1}`;
  }
  const m = period.match(/^(\d{4})-(\d{2})$/);
  if (!m) return period;
  let y = +m[1], idx = +m[2] - 1 + n;
  y += Math.floor(idx/12); idx = ((idx%12)+12)%12;
  return `${y}-${pad2n(idx+1)}`;
};

const prettyPeriod = (period) => {
  const q = period.match(/^(\d{4})-Q([1-4])$/);
  if (q) return `Q${q[2]} ${q[1]}`;
  const m = period.match(/^(\d{4})-(\d{2})$/);
  return m ? `${MONTHS[+m[2]-1]} ${m[1]}` : period;
};

// How close is `actual` to `target`, as a percentage where 100 = on target.
// For 'down' KPIs (cost, delay) a smaller actual is better, so the ratio flips.
const kpiAttainment = (kpi, actual) => {
  if (actual === null || actual === undefined || actual === "") return null;
  const a = Number(actual), t = Number(kpi.target);
  if (isNaN(a)) return null;
  if (kpi.direction === "down") {
    if (a <= 0) return 200;                 // nothing at all beats any target
    return t <= 0 ? (a > 0 ? 0 : 100) : Math.round((t / a) * 100);
  }
  if (t <= 0) return a > 0 ? 200 : 100;
  return Math.round((a / t) * 100);
};

const kpiTone = (attain) =>
  attain === null ? "none" : attain >= 100 ? "green" : attain >= 80 ? "amber" : "red";

const TONE_CLS = {

      .in("kpi_id", kpis.map(k=>k.id)).in("period", periods);

}

    sb.from("plans").select("*").order("sort_order"),

  return { sub: subRes.data || null, plans: planRes.data || [] };

// Seats in use = members + invites nobody has accepted yet, mirroring
// org_seats_used() in SQL so the UI and the trigger agree.
async function loadSeatUsage(orgId){
  const [m, i] = await Promise.all([
    sb.from("memberships").select("id").eq("org_id", orgId),
    sb.from("invites").select("id").eq("org_id", orgId).is("accepted_at", null),
  ]);
  return ((m.data||[]).length) + ((i.data||[]).length);
}

// A trial whose end date has passed counts as lapsed, mirroring org_seat_limit()
// in SQL. Paid plans are NOT expired by date here — same reasoning as the
// migration: a late webhook shouldn't downgrade someone who has paid.
const trialExpired = (sub) =>
  !!sub && sub.status === "trialing" && !!sub.current_period_end &&
  new Date(sub.current_period_end) < new Date();

const seatLimitOf = (sub, plans) => {
  if (!sub) return null;
  const plan = plans.find(p => p.code === sub.plan_code);
  const lapsed = !["active","trialing"].includes(sub.status) || trialExpired(sub);
  if (lapsed) { const free = plans.find(p => p.code === "free"); return free ? free.seat_limit : null; }
  return sub.seats != null ? sub.seats : (plan ? plan.seat_limit : null);
};

// The seat trigger raises "SEAT_LIMIT: ..." — turn that into something a
// person can act on rather than showing them a Postgres exception.
const isSeatLimitError = (msg) => /SEAT_LIMIT/i.test(msg || "");
const friendlyError = (msg) => isSeatLimitError(msg)
  ? "You've used every seat on your current plan. Free one up by removing a member or revoking an invite, or move to a bigger plan in Settings → Billing."
  : msg;

// Which payment provider can sell this plan. Razorpay first — the customers

const providerForPlan = (plan) =>

const CHECKOUT_FN = { razorpay: "razorpay-checkout", stripe: "stripe-checkout" };

async function startCheckout(planCode, provider){
  const fn = CHECKOUT_FN[provider];
  if (!fn) throw new Error("This plan isn't set up for online payment yet.");
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("Please sign in again.");
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${fn}`, {
    method: "POST",
    headers: { "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` },
    body: JSON.stringify({ plan_code: planCode }),
  });
  const body = await res.json().catch(()=>({}));
  if (!res.ok || !body.url) throw new Error(body.error || "Couldn't start checkout.");
  window.location.href = body.url;
}

/*  Every one of these calls is gated in Postgres by                  */
/*  is_platform_admin(). For a normal user they return nothing or     */
/*  touch zero rows; the UI check is only there to hide dead buttons. */
/* ================================================================== */
async function amPlatformAdmin(userId){
  // The policy on platform_admins lets a person see only their own row, so an
  // empty result genuinely means "not an admin" rather than "can't tell".
  const { data, error } = await sb.from("platform_admins").select("user_id").eq("user_id", userId).maybeSingle();
  if (error) return false;           // table missing = phase 5 not run = no admin
  return !!data;
}

async function loadAdminData(){
  const [orgs, subs, plans, members, profiles, requests] = await Promise.all([
    sb.from("organizations").select("id,name,created_at"),
    sb.from("subscriptions").select("*"),
    sb.from("plans").select("*").order("sort_order"),
    sb.from("memberships").select("id,org_id,user_id,role"),
    sb.from("profiles").select("id,email,full_name"),
    sb.from("plan_requests").select("*").order("created_at", { ascending: false }),
  ]);
  const firstError = [orgs,subs,plans,members,profiles,requests].find(r => r.error);
  if (firstError) throw firstError.error;

  const byId = {};
  (profiles.data||[]).forEach(p => { byId[p.id] = p; });
  const companies = (orgs.data||[]).map(o => {
    const mine = (members.data||[]).filter(m => m.org_id === o.id);
    const owner = mine.find(m => m.role === "owner");
    return {
      ...o,
      seats: mine.length,
      owner: owner ? (byId[owner.user_id] || {}) : {},
      sub: (subs.data||[]).find(s => s.org_id === o.id) || null,
    };
  }).sort((a,b) => (a.name||"").localeCompare(b.name||""));

  return { companies, plans: plans.data||[], requests: requests.data||[], profiles: profiles.data||[], members: members.data||[] };
}

// The one call that actually grants or removes seats. `until` is the trial end
// (or null); everything else is the plan the company lands on.
async function setSubscription(orgId, { plan_code, status, seats, until }){
  const { error } = await sb.from("subscriptions").upsert({
    org_id: orgId, plan_code, status,
    seats: seats === "" || seats == null ? null : Number(seats),
    current_period_end: until || null,
    provider: "razorpay",
    updated_at: new Date().toISOString(),
  }, { onConflict: "org_id" });
  if (error) throw error;
}

async function withdrawRequest(id){

async function decideRequest(id, status, adminId){
  const { error } = await sb.from("plan_requests")
    .update({ status, decided_by: adminId, decided_at: new Date().toISOString() })
    .eq("id", id);

}

// Everything I'm allowed to see, for the org-wide dashboard column.
async function loadAllVisibleKpis(periods){
  const { data: kpis, error } = await sb.from("kpis").select("*");
  if (error) throw error;
  let values = [];
  if ((kpis||[]).length) {
    const { data } = await sb.from("kpi_values").select("*")
      .in("kpi_id", kpis.map(k=>k.id)).in("period", periods);
    values = data || [];
  }
  return { kpis: kpis || [], values };
}

const navigate = (path) => {
  window.history.pushState({}, "", path);
  window.dispatchEvent(new Event("popstate"));
};

function usePath() {
  const [path, setPath] = useState(window.location.pathname);
  useEffect(() => {
    const onPop = () => setPath(window.location.pathname);
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  return path;
}

const SOLO_KEY = "cc-solo-mode";
const readSolo = () => false;
const writeSolo = () => {};

function Root(){
  const path = usePath();
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);
  const [recovery, setRecovery] = useState(false);
  const [orgCtx, setOrgCtx] = useState(null);      // {membership, org, pendingInvites}
  const [orgReady, setOrgReady] = useState(false);
  const [orgError, setOrgError] = useState("");
  const [solo, setSolo] = useState(false);

  useEffect(() => {
    if (!CONFIGURED) { setReady(true); return; }
    sb.auth.getSession().then(({data}) => { setSession(data.session); setReady(true); });
    const { data:sub } = sb.auth.onAuthStateChange((event, s) => {
      setSession(s);
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
      if (event === "SIGNED_OUT") { setOrgCtx(null); setOrgReady(false); }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  // Company context loads once per signed-in user. A failure here (e.g. the
  // Phase 1 SQL hasn't been run yet) must not lock anyone out of their own
  // planner — fall back to solo rather than showing a dead screen.
  useEffect(() => {
    if (!session) { setOrgReady(false); return; }
    let cancelled = false;
    setOrgReady(false);
    loadOrgContext(session.user.id, session.user.email)
      .then(ctx => { if (!cancelled) { setOrgCtx(ctx); setOrgReady(true); } })
      .catch(() => { if (!cancelled) { setOrgCtx({membership:null, org:null, pendingInvites:[], degraded:true}); setOrgReady(true); } });
    return () => { cancelled = true; };
  }, [session && session.user.id]);

  // --- Route Handlers -----------------------------------------------------
  if (path === "/privacy") return <PrivacyPage session={session} />;
  if (path === "/terms") return <TermsPage session={session} />;
  if (path === "/contact") return <ContactPage session={session} />;
  if (path === "/refund" || path === "/refund-policy") return <RefundPage session={session} />;

  if (!CONFIGURED) return <ConfigNotice />;
  if (!ready) return <FullScreen>Starting up…</FullScreen>;
  if (recovery) return <ResetPasswordScreen onDone={()=>setRecovery(false)} />;

  if (!session) {
    if (path === "/signup" || path === "/trial") return <AuthScreen initialMode="up" onBack={() => navigate("/")} />;
    if (path === "/login" || path === "/signin") return <AuthScreen initialMode="in" onBack={() => navigate("/")} />;
    return <LandingScreen onSignIn={() => navigate("/login")} onSignUp={() => navigate("/signup")} />;
  }

  // Signed in — if still on auth routes, navigate to main app
  if (path === "/login" || path === "/signin" || path === "/signup" || path === "/trial") {
    navigate("/");
  }

  if (!orgReady) return <FullScreen>Loading your workspace…</FullScreen>;

  const joined = (ctx) => { setOrgCtx(ctx); setSolo(false); };

  // "Set up a company" retries the org lookup rather than assuming it will
  // work. If the company tables still aren't reachable (the usual cause: the
  // Phase 1 SQL hasn't been run) we say so instead of doing nothing visible.
  const startCompany = async () => {
    setOrgError("");
    try {
      const ctx = await loadOrgContext(session.user.id, session.user.email);
      setOrgCtx(ctx);
      setSolo(false);
    } catch (e) {
      setOrgCtx(c => ({ ...c, degraded:true }));
      setOrgError(e.message || "Company features aren't available yet.");
    }
  };

  if (!orgCtx.membership && orgCtx.pendingInvites && orgCtx.pendingInvites.length > 0) {
    return <OnboardingScreen session={session} pendingInvites={orgCtx.pendingInvites}
             onJoined={joined} />;
  }

  return <Planner session={session} orgCtx={orgCtx} orgError={orgError}
           onLeftOrg={()=>{ setOrgCtx({membership:null, org:null, pendingInvites:[]}); }}
           onStartCompany={startCompany} />;
}

/*  Auth                                                               */
/* ================================================================== */
function AuthScreen({ initialMode = "in", onBack }){
  const [mode, setMode] = useState(initialMode); // in | up | reset
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true); setMsg("");
    try {
      if (mode === "in") {
        const { error } = await sb.auth.signInWithPassword({ email, password: pw });
        if (error) throw error;
      } else if (mode === "up") {
        writeSolo(false);
        const { data, error } = await sb.auth.signUp({ email, password: pw });
        if (error) throw error;
        if (data && data.session) {
          try {
            const rawName = email.split("@")[0];
            const companyName = rawName.charAt(0).toUpperCase() + rawName.slice(1) + "'s Workspace";
            await createOrg(companyName, data.session.user.id);
          } catch (orgErr) {
            // Org may already exist
          }
          writeSolo(false);
          setMsg("Workspace created! Opening Razorpay payment mandate setup…");
          try {
            await startCheckout("team", "razorpay");
          } catch (checkoutErr) {
            const reason = checkoutErr.message || "";
            if (reason.includes("razorpay_plan_id") || reason.includes("online payment")) {
              setMsg("Workspace created with 15-Day Free Trial! Set your Razorpay Plan ID in Settings → Billing to test live mandate checkout.");
            } else {
              setMsg("Workspace created with 15-Day Free Trial! (" + reason + ")");
            }
          }
        } else {
          setMsg("Account created! Please check your inbox if confirmation is on, then sign in.");
          setMode("in");
        }
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
        if (error) throw error;
        setMsg("Reset link sent — check your inbox and follow the link to set a new password.");
      }
    } catch (e) {
      let msg = e.message || "Something went wrong.";
      if (/signups not allowed/i.test(msg)) {
        msg = "Public signups are currently disabled in your Supabase project. Enable 'Allow new users to sign up' under Supabase Dashboard → Authentication → Providers → Email.";
      }
      setMsg(msg);
    }
    setBusy(false);
  };

  return (
    <div className="flex min-h-screen flex-col items-center justify-center bg-slate-900 px-4 py-8">
      {onBack && (
        <button onClick={onBack} className="mb-6 flex items-center gap-1.5 text-xs font-semibold text-amber-400 hover:text-amber-300">
          ← Back to FlowDirector Home
        </button>
      )}
      <div className="w-full max-w-sm rounded-2xl border border-slate-800 bg-[#121a25] p-6 text-white shadow-xl">
        <Logo height={44} className="mb-4 justify-center flex" />
        <p className="mt-1 text-sm text-slate-400">
          {mode==="in" && "Sign in to your planner."}
          {mode==="up" && "Start your 15-Day Free Trial (Mandate Required)."}
          {mode==="reset" && "Enter your email and we'll send you a reset link."}
        </p>

        <div className="mt-5 space-y-3">
          <input value={email} onChange={e=>setEmail(e.target.value)} type="email" placeholder="Email"
            onKeyDown={e=>e.key==="Enter"&&mode==="reset"&&submit()}
            className="w-full rounded-md border border-slate-600 bg-slate-900 px-3 py-2 text-sm outline-none focus:border-amber-400" />
          {mode!=="reset" &&
            <input value={pw} onChange={e=>setPw(e.target.value)} type="password" placeholder="Password"
              onKeyDown={e=>e.key==="Enter"&&submit()}
              className="w-full rounded-md border border-slate-600 bg-slate-900 px-3 py-2 text-sm outline-none focus:border-amber-400" />}
          <button onClick={submit} disabled={busy}
            className="w-full rounded-md bg-amber-400 px-4 py-2 text-sm font-semibold text-slate-900 hover:bg-amber-300 disabled:opacity-60">
            {busy ? "…" : mode==="in" ? "Sign in" : mode==="up" ? "Start Trial & Setup Mandate" : "Send reset link"}
          </button>
        </div>

        {msg && <p className="mt-3 text-xs text-amber-300">{msg}</p>}

        <div className="mt-4 flex flex-col items-start gap-1.5">
          {mode==="in" &&
            <button onClick={()=>{setMode("reset"); setMsg("");}} className="text-xs text-slate-400 hover:text-white">
              Forgot password?
            </button>}
          {mode!=="reset" &&
            <button onClick={()=>{setMode(mode==="in"?"up":"in"); setMsg("");}} className="text-xs text-slate-400 hover:text-white">
              {mode==="in" ? "Need an account? Start Trial & Mandate" : "Already have an account? Sign in"}
            </button>}
          {mode==="reset" &&
            <button onClick={()=>{setMode("in"); setMsg("");}} className="text-xs text-slate-400 hover:text-white">
              Back to sign in
            </button>}
        </div>
      </div>
    </div>
  );
}

function ResetPasswordScreen({ onDone }){
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setMsg("");
    if (pw.length < 6) { setMsg("Password must be at least 6 characters."); return; }
    if (pw !== pw2) { setMsg("Passwords don't match."); return; }
    setBusy(true);
    try {
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) throw error;
      setMsg("Password updated. Taking you to your planner…");
      setTimeout(onDone, 1200);
    } catch (e) { setMsg(e.message || "Something went wrong."); }
    setBusy(false);
  };

  return (
    <div className="flex min-h-screen items-center justify-center bg-slate-900 px-4">
      <div className="w-full max-w-sm rounded-2xl border border-slate-700 bg-slate-800 p-6 text-white shadow-xl">
        <div className="mono text-xs uppercase tracking-widest text-amber-400">Time Domination</div>
        <h1 className="mt-1 text-xl font-semibold">Set a new password</h1>
        <p className="mt-1 text-sm text-slate-400">Choose a new password for your account.</p>

        <div className="mt-5 space-y-3">
          <input value={pw} onChange={e=>setPw(e.target.value)} type="password" placeholder="New password"
            className="w-full rounded-md border border-slate-600 bg-slate-900 px-3 py-2 text-sm outline-none focus:border-amber-400" />
          <input value={pw2} onChange={e=>setPw2(e.target.value)} type="password" placeholder="Confirm new password"
            onKeyDown={e=>e.key==="Enter"&&submit()}
            className="w-full rounded-md border border-slate-600 bg-slate-900 px-3 py-2 text-sm outline-none focus:border-amber-400" />
          <button onClick={submit} disabled={busy}
            className="w-full rounded-md bg-amber-400 px-4 py-2 text-sm font-semibold text-slate-900 hover:bg-amber-300 disabled:opacity-60">
            {busy ? "…" : "Update password"}
          </button>
        </div>

        {msg && <p className="mt-3 text-xs text-amber-300">{msg}</p>}
      </div>
    </div>
  );
}

function OnboardingScreen({ session, pendingInvites, onJoined, onSolo }){
  const [name, setName] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  const create = async () => {
    const n = name.trim();
    if (!n) { setMsg("Give your company a name first."); return; }
    setBusy(true); setMsg("");
    try {
      const { org, membership } = await createOrg(n, session.user.id);
      onJoined({ membership, org, pendingInvites:[] });
    } catch (e) { setMsg(e.message || "Couldn't create the company."); setBusy(false); }
  };

  const accept = async (inv) => {
    setBusy(true); setMsg("");
    try {
      const { membership, org } = await acceptInvite(inv, session.user.id);
      onJoined({ membership, org, pendingInvites:[] });
    } catch (e) {
      setMsg(isSeatLimitError(e.message)
        ? "That company has run out of seats. Ask the owner to free one up or move to a bigger plan, then try again."
        : (e.message || "Couldn't join that company."));
      setBusy(false);

  return (
    <div className="flex min-h-screen items-center justify-center bg-slate-900 px-4 py-10">

        <h1 className="mt-1 text-xl font-semibold">Set up your workspace</h1>
        <p className="mt-1 text-sm text-slate-400">Signed in as {session.user.email}</p>

        {pendingInvites.length > 0 && (
          <div className="mt-5 rounded-lg border border-amber-400/40 bg-amber-400/10 p-4">
            <div className="text-xs font-semibold uppercase tracking-wide text-amber-400">You've been invited</div>

                <button onClick={()=>accept(inv)} disabled={busy}

        {msg && <p className="mt-3 text-xs text-amber-300">{msg}</p>}

function Planner({ session, orgCtx, orgError, onLeftOrg, onStartCompany }){
  const userId = session.user.id;
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("capture");
  const [saving, setSaving] = useState(false);
  const [syncError, setSyncError] = useState(false);
  const [dailyDate, setDailyDate] = useState(todayKey());
  const [isAdmin, setIsAdmin] = useState(false);
  const notifiedRef = useRef(false);

  const [sub, setSub] = useState(null);
  const [subLoading, setSubLoading] = useState(true);

  useEffect(() => { loadState(userId).then(setData).catch(()=>setData(structuredClone(SEED))); }, [userId]);
  useEffect(() => { amPlatformAdmin(userId).then(setIsAdmin); }, [userId]);

  useEffect(() => {
    if (!orgCtx || !orgCtx.membership) {
      setSubLoading(false);
      return;
    }
    setSubLoading(true);
    loadBilling(orgCtx.membership.org_id)
      .then(b => setSub(b.sub))
      .catch(() => setSub(null))
      .finally(() => setSubLoading(false));
  }, [orgCtx && orgCtx.membership && orgCtx.membership.org_id]);

  useEffect(() => {
    if (!data) return;
    setSaving(true);
    const t = setTimeout(async () => {
      try { await saveState(userId, data); setSyncError(false); }
      catch { setSyncError(true); }
      finally { setSaving(false); }
    }, 600);
    return () => clearTimeout(t);
  }, [data, userId]);

  useEffect(() => {
    if (!data || notifiedRef.current) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    const { overdue, today } = collectDueItems(data);
    if (overdue.length + today.length > 0) {
      new Notification("FlowDirector", { body: `${overdue.length} overdue, ${today.length} due today.` });
    }
    notifiedRef.current = true;
  }, [data]);

  const patch = (fn) => setData(d => { const c = structuredClone(d); fn(c); return c; });

  const isCompanyUser = orgCtx && orgCtx.membership;
  const isAuthorized = !isCompanyUser || isAdmin || (sub && sub.status === "active");

  if (isCompanyUser && subLoading) return <FullScreen>Verifying workspace subscription status…</FullScreen>;
  if (!data) return <FullScreen>Loading your system…</FullScreen>;

  if (isCompanyUser && !isAuthorized) {
    return (
      <div className="flex min-h-screen flex-col items-center justify-center bg-slate-900 px-4 text-center text-white">
        <div className="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-800 p-8 shadow-2xl">
          <div className="mono text-xs uppercase tracking-widest text-amber-400">Authorization Required</div>
          <h2 className="mt-2 text-2xl font-bold">Activate Your Workspace</h2>
          <p className="mt-3 text-xs leading-relaxed text-slate-300">
            To start using <b>{orgCtx.org?.name || "your workspace"}</b>, authorize your subscription payment mandate via Razorpay.
          </p>

          <div className="mt-6 rounded-xl border border-amber-400/30 bg-amber-400/10 p-4 text-left">
            <div className="text-xs font-semibold text-amber-300">15-Day Free Trial Mandate</div>
            <p className="mt-1 text-[11px] text-slate-300">
              Authorize your recurring mandate today. No charges will be incurred during your 15-day trial.
            </p>
          </div>

          <div className="mt-6 space-y-3">
            <button onClick={() => startCheckout("team", "razorpay").catch(e => alert(e.message || "Couldn't start checkout."))}
              className="w-full rounded-xl bg-amber-400 py-3 text-sm font-bold text-slate-950 shadow-md shadow-amber-400/20 transition hover:bg-amber-300">
              Authorize via Razorpay →
            </button>
            <button onClick={() => sb.auth.signOut()}
              className="w-full rounded-xl border border-slate-700 bg-slate-900 py-2.5 text-xs font-medium text-slate-300 hover:bg-slate-800">
              Sign Out
            </button>
          </div>
        </div>
      </div>
    );
  }

  const ohv = Math.round((data.settings.income||0)/(data.settings.hours||1));
  const role = orgCtx && orgCtx.membership ? orgCtx.membership.role : null;
  const canSeeOthers = role === "owner" || role === "manager";
  const TABS = [
    ["capture","Capture"],["followup","Follow-up"],["daily","Daily"],["weekly","Weekly"],
    ["monthly","Monthly"],["maybe","Maybe"],["reference","Reference"],

    ...(canSeeOthers ? [["people","Dashboard"]] : []),
    ...(role === "owner" ? [["team","Team"]] : []),
    ...(isAdmin ? [["admin","Admin"]] : []),
    ["settings","Settings"],

        <div className="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-3 sm:px-6">
          <div className="flex items-center gap-4">
            <Logo height={64} onClick={() => setTab("capture")} className="py-0.5" />
            {orgCtx && orgCtx.org && (
              <div className="hidden sm:flex items-center gap-2 border-l border-slate-700/80 pl-4 py-1">
                <span className="text-xs font-semibold text-slate-200 tracking-wide">{orgCtx.org.name}</span>
                <span className="rounded-full bg-amber-400/10 border border-amber-400/30 px-2.5 py-0.5 text-[10px] font-bold uppercase tracking-wider text-amber-400">
                  {ROLE_LABEL[role]}
                </span>
              </div>
            )}
          </div>

          <div className="flex items-center gap-3">
            <div className="flex items-center gap-2 rounded-xl border border-slate-700/80 bg-slate-900/90 px-3.5 py-1.5 shadow-inner">
              <span className="mono text-[11px] font-medium uppercase tracking-wider text-slate-400">Hour Value</span>
              <span className="mono text-base font-extrabold text-amber-400">₹{ohv.toLocaleString("en-IN")}</span>
            </div>
            <div className="flex items-center gap-2 rounded-xl border border-slate-800 bg-slate-900/60 px-3 py-1.5">
              <span className="text-xs font-medium text-slate-300 hidden md:inline">{session.user.email}</span>
              <button 
                onClick={() => sb.auth.signOut()} 
                className="rounded-lg bg-slate-800 px-2.5 py-1 text-xs font-semibold text-amber-400 hover:bg-amber-400 hover:text-slate-950 transition-all duration-150"

        {/* Tier 2: Premium Navigation Menu Bar */}

                    active

      <main className="mx-auto max-w-6xl px-4 py-6">
        {tab!=="daily" && tab!=="weekly" && <DueBanner data={data} />}
        {tab==="capture" && <CaptureView data={data} patch={patch} ohv={ohv} />}

      <footer className="mx-auto max-w-6xl px-4 pb-8 pt-2 text-center text-xs text-slate-400">

function CaptureView({ data, patch, ohv }){
  const [text, setText] = useState("");
  const add = () => { const t=text.trim(); if(!t) return; patch(d=>d.captures.unshift({id:uid(),date:new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short"}),item:t,category:"",taskType:"",details:"",status:"Open"})); setText(""); };

/*  2 · DAILY                                                          */
/* ================================================================== */
const pad2 = (n) => String(n).padStart(2,"0");
const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const shiftDay = (k,n)=>{const d=new Date(k+"T00:00:00");d.setDate(d.getDate()+n);return dateKey(d);};
const prettyDate = (k)=>new Date(k+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
const PMARKS=[{v:"",label:"○",cls:"text-slate-400"},{v:"done",label:"✓",cls:"text-emerald-600"},{v:"moved",label:"→",cls:"text-amber-600"},{v:"delegated",label:"o",cls:"text-sky-600"},{v:"dropped",label:"✗",cls:"text-rose-500"}];

const dueStatus = (dateStr) => {
  if (!dateStr) return null;
  const t = todayKey();
  if (dateStr < t) return "overdue";
  if (dateStr === t) return "today";
  return null;
};
const collectDueItems = (data) => {
  const overdue=[], today=[];
  const check=(text,due)=>{ const s=dueStatus(due); if(s==="overdue") overdue.push(text); else if(s==="today") today.push(text); };
  data.captures.filter(c=>c.status!=="Transferred"&&c.status!=="Done").forEach(c=>check(c.item,c.due));
  data.dailyBackup.filter(b=>!b.done).forEach(b=>check(b.text,b.due));
  data.weeklySomeday.filter(b=>!b.done).forEach(b=>check(b.text,b.due));
  data.monthlyTray.filter(b=>!b.done).forEach(b=>check(b.text,b.due));
  return { overdue, today };
};
// Every item with a due date, indexed by that exact "YYYY-MM-DD" — shared by
// Daily/Weekly/Monthly so a due date set anywhere in Capture shows up
// everywhere, without ever writing into the freeform editable text cells.
// Full item identity (id/source/done), not just display text — so anywhere this
// is rendered (Daily/Weekly panels, the Daily slot chart) can edit or mark the
// underlying item done in place, not just show a read-only string.
const dueItemsByDate = (data) => {
  const map = {};
  const push=(dateStr,entry)=>{ if(!dateStr) return; if(!map[dateStr]) map[dateStr]=[]; map[dateStr].push(entry); };
  data.captures.filter(c=>c.status!=="Transferred"&&c.status!=="Done").forEach(c=>push(c.due,{id:c.id,text:c.item,tag:c.category,time:c.time,source:"captures"}));
  data.dailyBackup.forEach(b=>push(b.due,{id:b.id,text:b.text,tag:b.tag,taskType:b.taskType,due:b.due,time:b.time,assignee:b.assignee,done:!!b.done,source:"dailyBackup"}));
  data.weeklySomeday.forEach(b=>push(b.due,{id:b.id,text:b.text,tag:b.tag,taskType:b.taskType,due:b.due,time:b.time,assignee:b.assignee,done:!!b.done,source:"weeklySomeday"}));
  data.monthlyTray.forEach(b=>push(b.due,{id:b.id,text:b.text,tag:b.tag,taskType:b.taskType,due:b.due,time:b.time,assignee:b.assignee,done:!!b.done,source:"monthlyTray"}));
  Object.values(map).forEach(list=>list.sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")));
  return map;
};

const DOW_KEYS = ["sun","mon","tue","wed","thu","fri","sat"]; // Date#getDay() index
const dayOfWeekKey = (dateStr) => DOW_KEYS[new Date(dateStr+"T00:00:00").getDay()];
// DAILY_SLOTS/WEEK_SLOTS are hourly ranges starting 7 AM, so an item's HH:MM
// maps to slot index (hour - 7); anything outside 7 AM–the last slot has no match.
const slotIndexForTime = (time, slotCount) => {
  if (!time) return -1;
  const hour = parseInt(time.split(":")[0], 10);
  if (isNaN(hour)) return -1;
  const idx = hour - 7;
  return (idx >= 0 && idx < slotCount) ? idx : -1;
};
// Per-hour-slot items for one calendar day: that day's due items, DAILY routine
// items (every day), WEEKLY-recurring items whose day-of-week matches, and
// MONTHLY-recurring items whose day-of-month matches — each at their own time.
const dailySlotItems = (data, dateStr, dueMap) => {
  const slots = DAILY_SLOTS.map(()=>[]);
  const place=(entry)=>{ const idx=slotIndexForTime(entry.time, slots.length); if(idx>=0) slots[idx].push(entry); };
  // Items with an exact due date match carry full id/source/done, so the Daily
  // slot chart can edit or mark them done in place, not just display them.
  (dueMap[dateStr]||[]).forEach(place);
  data.dailyBackup.filter(b=>b.taskType==="DAILY"&&b.time).forEach(b=>place({text:b.text,tag:b.tag,time:b.time}));
  const dow = dayOfWeekKey(dateStr);
  data.weeklySomeday.filter(b=>b.taskType==="WEEKLY"&&b.due&&dayOfWeekKey(b.due)===dow).forEach(b=>place({text:b.text,tag:b.tag,time:b.time}));
  const dom = parseInt(dateStr.slice(8,10),10);
  (data.recurringMonthly||[]).filter(r=>r.day===dom).forEach(r=>place({text:r.text,tag:r.tag,time:r.time}));
  return slots;
};
// Same idea across a whole Mon–Sun week, keyed by "slotIdx|dayKey" for the grid.
const weeklySlotItems = (data, wk, dueMap) => {
  const map = {};
  const add=(slotIdx,dayKey,text,tag)=>{ if(slotIdx<0) return; const k=`${slotIdx}|${dayKey}`; if(!map[k]) map[k]=[]; map[k].push({text,tag}); };
  DAY_KEYS.forEach((dayKey,i)=>{
    const dateStr = shiftDay(wk,i);
    const dow = dayOfWeekKey(dateStr);
    const dom = parseInt(dateStr.slice(8,10),10);
    (dueMap[dateStr]||[]).forEach(it=>add(slotIndexForTime(it.time, WEEK_SLOTS.length), dayKey, it.text, it.tag));
    data.dailyBackup.filter(b=>b.taskType==="DAILY"&&b.time).forEach(b=>add(slotIndexForTime(b.time,WEEK_SLOTS.length), dayKey, b.text, b.tag));
    data.weeklySomeday.filter(b=>b.taskType==="WEEKLY"&&b.due&&dayOfWeekKey(b.due)===dow).forEach(b=>add(slotIndexForTime(b.time,WEEK_SLOTS.length), dayKey, b.text, b.tag));
    (data.recurringMonthly||[]).filter(r=>r.day===dom).forEach(r=>add(slotIndexForTime(r.time,WEEK_SLOTS.length), dayKey, r.text, r.tag));
  });
  return map;
};
// Which live array a due-map entry's `source` points at, and how to edit or
// remove it there. Shared by Daily/Weekly so both can make an overdue or
// due-today item actionable in place, not just print its name.
const SOURCE_ARRAY = { dailyBackup:"dailyBackup", weeklySomeday:"weeklySomeday", monthlyTray:"monthlyTray" };
const updateSourceItem = (patch, source, id, field, value) => {
  const arr = SOURCE_ARRAY[source]; if (!arr) return;
  patch(d => { const item = d[arr].find(x=>x.id===id); if (item) item[field]=value; });
};
const removeSourceItem = (patch, source, id) => {
  const arr = SOURCE_ARRAY[source]; if (!arr) return;
  if (!confirm("Delete this item? This can't be undone.")) return;
  patch(d => { d[arr] = d[arr].filter(x=>x.id!==id); });
};

// Every NOT-DONE item whose due date has already passed, across every source,
// with full identity (id/source/tag/time) so it's as actionable as "Due
// today" — not a dead-end list of names. Once marked done it drops out, same
// as the top summary banner: a finished task isn't overdue anymore.
const overdueEntries = (data) => {
  const map = dueItemsByDate(data);
  const t = todayKey();
  const out = [];
  Object.keys(map).filter(k=>k<t).sort().forEach(k => {
    map[k].forEach(it => { if (!it.done) out.push({ ...it, due:k }); });
  });
  return out;
};

// Shared render for an Overdue / Due-today chip list — click to toggle done
// when the item traces back to a live array, read-only badge otherwise (e.g.
// a capture still sitting in the inbox, which has no done flag of its own).
function DueChips({ items, patch, tone="rose", stack=false }){
  const dateCls = tone==="rose" ? "text-rose-500" : "text-sky-600";
  const openCls = tone==="rose" ? "border-rose-200 bg-white text-slate-700" : "border-sky-200 bg-white text-slate-700";
  return (
    <div className={stack ? "flex flex-col items-start gap-1" : "flex flex-wrap gap-2"}>
      {items.map((it,idx)=>{
        const toggleable = it.source && SOURCE_ARRAY[it.source];
        const Tag = toggleable ? "button" : "span";
        return (
          <Tag key={it.id||idx}
            onClick={toggleable ? ()=>updateSourceItem(patch, it.source, it.id, "done", !it.done) : undefined}
            title={toggleable ? (it.done?"Mark not done":"Mark done") : undefined}
            className={"rounded-full border px-3 py-1 text-xs "+(stack?"block max-w-full truncate text-left ":"")+(it.done
              ? "border-emerald-200 bg-emerald-50 text-emerald-700 line-through"
              : openCls)}>
            {it.due && tone==="rose" && <span className={"mono "+dateCls}>{it.due}{it.time?` ${it.time}`:""} · </span>}
            {it.time && tone!=="rose" && <span className={"mono "+dateCls}>{it.time} · </span>}
            {it.text}
            {it.tag && <span className="ml-1 text-slate-400">({it.tag})</span>}
          </Tag>
        );
      })}
    </div>
  );
}

function OverduePanel({ data, patch }){
  const items = overdueEntries(data);
  if (items.length===0) return null;
  return (
    <div className="mb-4 rounded-lg border border-rose-200 bg-rose-50 p-3">
      <div className="mb-1 text-xs font-semibold uppercase tracking-wide text-rose-700">⚠ Overdue ({items.length})</div>
      <DueChips items={items} patch={patch} />
    </div>
  );
}

function DueBanner({ data }){
  const { overdue, today } = collectDueItems(data);

// Shared click-to-edit row for anything shaped like {id,text,tag,taskType,due,time,assignee} —

function MonthlyView({ data, patch, onGoToDay }){
  const now=new Date();
  const [y,setY]=useState(now.getFullYear());
  const [m,setM]=useState(now.getMonth()+1);
  const mk=`${y}-${m}`;
  const month=data.monthly[mk]||{days:{},buffers:[]};
  const upd=(fn)=>patch(d=>{ if(!d.monthly[mk]) d.monthly[mk]={days:{},buffers:[]}; fn(d.monthly[mk]); });
  const daysInMonth=new Date(y,m,0).getDate();
  const firstDow=(new Date(y,m-1,1).getDay()+6)%7;
  const nav=(n)=>{let nm=m+n,ny=y;if(nm>12){nm=1;ny++;}if(nm<1){nm=12;ny--;}setM(nm);setY(ny);};
  const toggleBuffer=(n)=>upd(x=>{x.buffers=x.buffers.includes(n)?x.buffers.filter(b=>b!==n):[...x.buffers,n];});
  const cells=[]; for(let i=0;i<firstDow;i++)cells.push(null); for(let n=1;n<=daysInMonth;n++)cells.push(n);
  const place=(item,n)=>patch(d=>{
    if(!d.monthly[mk])d.monthly[mk]={days:{},buffers:[]};
    const prev=d.monthly[mk].days[n]||"";
    d.monthly[mk].days[n]=prev?prev+" · "+item.text:item.text;
    d.monthlyTray=d.monthlyTray.filter(t=>t.id!==item.id);
    if(!d.recurringMonthly) d.recurringMonthly=[];
    d.recurringMonthly.push({id:item.id,text:item.text,tag:item.tag,day:n,time:item.time||""});
  });
  const dropTray=(id)=>{ if(!confirm("Delete this item? This can't be undone.")) return; patch(d=>{d.monthlyTray=d.monthlyTray.filter(t=>t.id!==id);}); };
  const stopRecurring=(id)=>patch(d=>{d.recurringMonthly=(d.recurringMonthly||[]).filter(r=>r.id!==id);});
  const updateTrayField=(id,field,value)=>patch(d=>{const t=d.monthlyTray.find(x=>x.id===id); if(t) t[field]=value;});
  const updateRecurringField=(id,field,value)=>patch(d=>{const r=(d.recurringMonthly||[]).find(x=>x.id===id); if(r) r[field]=value;});
  const dueMap = dueItemsByDate(data);

  useEffect(() => {
    const recurring=data.recurringMonthly||[];
    if(recurring.length===0) return;
    const monthDays=(data.monthly[mk]||{days:{}}).days||{};
    const additions=recurring.filter(r=>r.day<=daysInMonth && !(monthDays[r.day]||"").includes(r.text));
    if(additions.length===0) return;
    patch(d=>{
      if(!d.monthly[mk]) d.monthly[mk]={days:{},buffers:[]};
      additions.forEach(r=>{
        const cur=d.monthly[mk].days[r.day]||"";
        if(!cur.includes(r.text)) d.monthly[mk].days[r.day]=cur?cur+" · "+r.text:r.text;
      });
    });

  return (

          <div className="space-y-2">
            {data.monthlyTray.map(t=>(
              <BackupItemRow key={t.id} item={t} data={data}
                onUpdate={(f,v)=>updateTrayField(t.id,f,v)} onRemove={()=>dropTray(t.id)}
                onToggleDone={()=>updateTrayField(t.id,"done",!t.done)}
                extra={<PlaceControl max={daysInMonth} onPlace={n=>place(t,n)} />} />

          </div>
        </div>
      )}
      {(data.recurringMonthly||[]).length>0 && (
        <details className="mb-4 rounded-lg border border-slate-200 bg-white p-3">
          <summary className="cursor-pointer text-xs font-semibold uppercase tracking-wide text-slate-500">Recurring every month ({data.recurringMonthly.length})</summary>
          <div className="mt-2 space-y-1">
            {data.recurringMonthly.map(r=>(
              <RecurringMonthlyRow key={r.id} item={r} daysInMonth={daysInMonth}
                onUpdate={(f,v)=>updateRecurringField(r.id,f,v)} onStop={()=>stopRecurring(r.id)} />
            ))}
          </div>
        </details>
      )}
      <div className="overflow-x-auto rounded-lg border border-slate-200 bg-white p-3">
        <div className="grid grid-cols-7 gap-1">
          {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=><div key={d} className="pb-1 text-center text-xs font-semibold uppercase tracking-wide text-slate-400">{d}</div>)}
          {cells.map((n,i)=>{
            if(n===null) return <div key={"e"+i} className="rounded-md bg-stone-50" style={{minHeight:"86px"}} />;
            const isBuffer=month.buffers.includes(n);

function CategoriesSection({ data, patch }){
  const [name,setName]=useState("");
  const list = data.categories||DEFAULT_CATEGORIES;
  const add=()=>{ const n=name.trim(); if(!n || list.includes(n)) return; patch(d=>{ if(!d.categories) d.categories=[...DEFAULT_CATEGORIES]; d.categories.push(n); }); setName(""); };
  const rename=(oldName,newName)=>{
    const n=newName.trim();
    if(!n || n===oldName) return;
    patch(d=>{
      if(!d.categories) d.categories=[...DEFAULT_CATEGORIES];
      const idx=d.categories.indexOf(oldName);
      if(idx>=0) d.categories[idx]=n;
      d.captures.forEach(c=>{ if(c.category===oldName) c.category=n; });
      d.maybe.forEach(m=>{ if(m.category===oldName) m.category=n; });
    });
  };
  const remove=(catName)=>{
    if(!confirm(`Remove "${catName}" from your category list? Items already tagged with it keep the label — it just won't be offered for new items.`)) return;
    patch(d=>{ d.categories=(d.categories||DEFAULT_CATEGORIES).filter(x=>x!==catName); });
  };
  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4">
      <h3 className="mb-3 font-semibold text-slate-700">Categories</h3>
      <p className="mb-3 text-xs text-slate-400">Used in Capture and Maybe. Renaming updates it everywhere already tagged with it; removing just stops offering it going forward.</p>
      <div className="flex gap-2">
        <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="New category name"
          className="flex-1 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm outline-none focus:border-amber-400" />
        <button onClick={add} className="flex items-center gap-1 rounded-md bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-700"><Ic n="plus"/> Add</button>
      </div>
      <div className="mt-3 space-y-1">
        {list.map(catName=>(
          <div key={catName} className="flex items-center gap-2">
            <input defaultValue={catName} onBlur={e=>rename(catName,e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); }}
              className="flex-1 rounded-md border border-slate-200 bg-white px-2 py-1 text-sm outline-none focus:border-amber-400" />
            <button onClick={()=>remove(catName)} className="text-slate-300 hover:text-rose-500"><Ic n="trash"/></button>
          </div>
        ))}
      </div>
    </div>
  );
}

const quarterOfMonth = (mp) => {
  const m = mp.match(/^(\d{4})-(\d{2})$/);
  return m ? `${m[1]}-Q${Math.floor((+m[2]-1)/3)+1}` : mp;
};

function GoalsView({ orgCtx, meId }){
  const role = orgCtx.membership.role;
  const [members, setMembers] = useState(null);
  const [who, setWho] = useState(meId);
  const [period, setPeriod] = useState(monthPeriod());
  const [goals, setGoals] = useState(null);
  const [msg, setMsg] = useState("");
  const [kraDraft, setKraDraft] = useState(null); // {id?, title, description}
  const [kpiDraft, setKpiDraft] = useState(null); // {id?, kra_id, name, unit, target, direction, cadence}

  const quarter = quarterOfMonth(period);
  const periods = [period, quarter];

  useEffect(() => {
    if (role === "employee") { setMembers([]); return; }
    loadTeam(orgCtx.org.id).then(setMembers).catch(()=>setMembers([]));
  }, [orgCtx.org.id, role]);

  const refresh = () => loadGoals(who, periods)
    .then(setGoals)
    .catch(e => { setMsg(e.message || "Couldn't load goals."); setGoals({kras:[],kpis:[],values:[]}); });

  useEffect(() => { setGoals(null); refresh(); }, [who, period]);

  // Mirror can_manage_person() so we don't offer controls the server will refuse.
  const targetMember = (members || []).find(m => m.user_id === who);
  const canManage = role === "owner"
    || (role === "manager" && targetMember && targetMember.manager_id === meId);
  const visible = (members || []).filter(m =>
    m.user_id === meId || role === "owner" || (role === "manager" && m.manager_id === meId));

  const act = async (fn) => {
    setMsg("");
    try { await fn(); await refresh(); }
    catch (e) { setMsg(e.message || "That didn't work."); }
  };

  if (goals === null) return <Ghost>Loading goals…</Ghost>;

  // A KPI is measured against the selected month, or the quarter containing it.
  const valueOf = (kpi) => (goals.values || [])
    .find(v => v.kpi_id === kpi.id && v.period === (kpi.cadence === "quarterly" ? quarter : period)) || null;

  const kpisOfKra = (kraId) => goals.kpis.filter(k => k.kra_id === kraId);
  const looseKpis  = goals.kpis.filter(k => !k.kra_id || !goals.kras.some(r => r.id === k.kra_id));

  const saveActual = (kpi, raw) => act(() =>
    setKpiActual(kpi.id, kpi.cadence === "quarterly" ? quarter : period, raw, meId));

  return (
    <div>
      <Callout>
        {canManage && who !== meId
          ? "Set a few responsibility areas, and one number per area that says whether it's working. Resist adding more than a handful — a scoreboard nobody reads is worse than none."
          : "Your responsibility areas and the numbers attached to them. Fill in the actual as you go — the target was set for you, the number is yours to report."}
      </Callout>
      {msg && <p className="mb-3 rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-600">{msg}</p>}

      <div className="mb-4 flex flex-wrap items-center gap-2 rounded-lg border border-slate-200 bg-white p-2">
        {role !== "employee" && visible.length > 1 && (
          <select value={who} onChange={e=>{ setWho(e.target.value); setKraDraft(null); setKpiDraft(null); }}
            className="rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm text-slate-700 outline-none">
            {visible.map(m => <option key={m.user_id} value={m.user_id}>
              {m.name}{m.user_id===meId ? " (you)" : ""}
            </option>)}
          </select>
        )}
        <div className="flex items-center gap-1">
          <button onClick={()=>setPeriod(shiftPeriod(period,-1))} className="rounded px-2 py-1 text-slate-500 hover:bg-slate-100"><Ic n="left"/></button>
          <span className="min-w-[9rem] text-center text-sm font-semibold text-slate-800">
            {prettyPeriod(period)} <span className="font-normal text-slate-400">· {quarter.split("-")[1]}</span>
          </span>
          <button onClick={()=>setPeriod(shiftPeriod(period,1))} className="rounded px-2 py-1 text-slate-500 hover:bg-slate-100"><Ic n="right"/></button>
          {period !== monthPeriod() &&
            <button onClick={()=>setPeriod(monthPeriod())} className="text-xs text-amber-600 hover:underline">this month</button>}
        </div>
        {canManage && (
          <button onClick={()=>setKraDraft({ title:"", description:"" })}
            className="ml-auto flex items-center gap-1 rounded-md bg-slate-900 px-3 py-1.5 text-sm text-white hover:bg-slate-700">
            <Ic n="plus"/> Responsibility area
          </button>
        )}
      </div>

      {kraDraft && (
        <KraEditor draft={kraDraft} onCancel={()=>setKraDraft(null)}
          onSave={(d)=>act(async ()=>{
            await saveKra(d.id ? d : { ...d, org_id:orgCtx.org.id, user_id:who, created_by:meId });
            setKraDraft(null);
          })} />
      )}

      {goals.kras.length === 0 && looseKpis.length === 0 && !kraDraft && (
        <Ghost>{canManage
          ? "No responsibility areas set yet. Add one, then hang a number off it."
          : "Nothing has been set for you yet."}</Ghost>
      )}

      <div className="space-y-4">
        {goals.kras.sort((a,b)=>a.sort_order-b.sort_order).map(kra => (
          <div key={kra.id} className="rounded-lg border border-slate-200 bg-white p-4">
            <div className="flex flex-wrap items-start justify-between gap-2">
              <div className="min-w-0 flex-1">
                <h3 className="font-semibold text-slate-800">{kra.title}</h3>
                {kra.description && <p className="mt-0.5 text-xs text-slate-500">{kra.description}</p>}
              </div>
              {canManage && (

/* ================================================================== */
/*  Rollup metrics (Phase 2)                                           */
/*  Everything here is derived from data the planner already records.  */
/*  Where the stored shape can't answer a question honestly, the       */
/*  metric is omitted rather than estimated.                           */
/* ================================================================== */
const PERIODS = [
  { id:"today", label:"Today",        days:1  },
  { id:"7",     label:"Last 7 days",  days:7  },
  { id:"30",    label:"Last 30 days", days:30 },
];

const lastNDayKeys = (n) => {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(shiftDay(todayKey(), -i));
  return out;
};

const mondaysInPeriod = (dayKeys) => [...new Set(dayKeys.map(mondayOf))];

// closure.score defaults to 0 AND 0 is a legitimate score, so "not scored" and
// "scored zero" are indistinguishable from the number alone. Treat a day as
// genuinely closed only when the person left some other trace of the ritual.
const dayWasClosed = (rec) => {
  if (!rec || !rec.closure) return false;
  const c = rec.closure;
  return (c.score || 0) > 0 || !!(c.ate || "").trim() || !!(c.family || "").trim();
};

function personMetrics(plan, dayKeys){
  let daysPlanned = 0, prioSet = 0, prioDone = 0, prioMoved = 0, prioDropped = 0, prioDelegated = 0;
  let scoreSum = 0, scoreDays = 0;
  const scoreSeries = [];

  dayKeys.forEach(k => {
    const rec = (plan.daily || {})[k];
    if (!rec) { scoreSeries.push(null); return; }
    if ((rec.outcome || "").trim()) daysPlanned++;
    (rec.priorities || []).forEach((p, i) => {
      if (!(p || "").trim()) return;
      prioSet++;
      switch ((rec.marks || [])[i] || "") {
        case "done":      prioDone++; break;
        case "moved":     prioMoved++; break;
        case "dropped":   prioDropped++; break;
        case "delegated": prioDelegated++; break;
      }
    });
    if (dayWasClosed(rec)) { scoreSum += (rec.closure.score || 0); scoreDays++; scoreSeries.push(rec.closure.score || 0); }
    else scoreSeries.push(null);
  });

  // Weekly non-negotiables across whatever weeks the period touches.
  const weeks = mondaysInPeriod(dayKeys);
  let nnHit = 0, nnPossible = 0;
  weeks.forEach(wk => {
    const w = (plan.weekly || {})[wk];
    ["focus","review","family"].forEach(k => {
      nnPossible++;
      if (w && w.nonneg && w.nonneg[k]) nnHit++;
    });
  });

  const { overdue, today } = collectDueItems(plan);
  const openDelegated = (plan.dailyBackup || [])
    .filter(b => ["DELEGATE","WAITING-FOR"].includes(b.taskType) && !b.done);
  const overdueDelegated = openDelegated.filter(b => b.due && b.due < todayKey());

  return {
    daysPlanned, daysInPeriod: dayKeys.length,
    prioSet, prioDone, prioMoved, prioDropped, prioDelegated,
    prioCompletion: prioSet ? Math.round((prioDone / prioSet) * 100) : null,
    avgScore: scoreDays ? (scoreSum / scoreDays) : null,
    scoreDays, scoreSeries,
    nnHit, nnPossible,
    nnRate: nnPossible ? Math.round((nnHit / nnPossible) * 100) : null,
    overdue: overdue.length, dueToday: today.length,
    openDelegated: openDelegated.length,
    overdueDelegated: overdueDelegated.length,
    openBackup: (plan.dailyBackup || []).filter(b => !b.done).length,
  };
}

// Tiny inline bar chart. Null entries render as a faint "no data" tick so a
// gap reads as "didn't close the day" rather than "scored zero".
function Sparkline({ series, width=104, height=26 }){
  if (!series.length) return null;
  const n = series.length;
  const bw = width / n;
  return (
    <svg width={width} height={height} role="img" aria-label="Daily score trend"
      className="overflow-visible">
      {series.map((v, i) => {
        const x = i * bw;
        if (v === null || v === undefined)
          return <rect key={i} x={x} y={height-2} width={Math.max(bw-1,1)} height={2} fill="#e2e8f0" />;
        const h = Math.max((v / 3) * height, 2);
        const tone = v >= 3 ? "#059669" : v === 2 ? "#fbbf24" : v === 1 ? "#f97316" : "#f43f5e";
        return <rect key={i} x={x} y={height-h} width={Math.max(bw-1,1)} height={h} fill={tone} rx="1" />;
      })}
    </svg>
  );
}

const Metric = ({ label, value, sub, tone }) => (
  <div className={"rounded-lg border p-3 "+(tone==="rose"?"border-rose-200 bg-rose-50":tone==="emerald"?"border-emerald-200 bg-emerald-50":"border-slate-200 bg-white")}>
    <div className={"mono text-xl font-bold "+(tone==="rose"?"text-rose-600":tone==="emerald"?"text-emerald-700":"text-slate-800")}>{value}</div>
    <div className="text-xs text-slate-500">{label}</div>
    {sub && <div className="mt-0.5 text-[11px] text-slate-400">{sub}</div>}
  </div>
);

const pct = (v) => v === null ? "—" : v + "%";
const avg = (v) => v === null ? "—" : v.toFixed(1);

/* ================================================================== */
/*  DASHBOARD — team rollup + per-person drill-down                    */
/* ================================================================== */
function PeopleView({ orgCtx, meId }){
  const [members, setMembers] = useState(null);
  const [planners, setPlanners] = useState(null); // [{userId, plan}]
  const [kpiData, setKpiData] = useState(null);   // {kpis, values} or null if unavailable
  const [period, setPeriod] = useState("7");
  const [sel, setSel] = useState(null);           // drilled-into membership row
  const [err, setErr] = useState("");
  const role = orgCtx.membership.role;

  useEffect(() => {
    let cancelled = false;
    Promise.all([loadTeam(orgCtx.org.id), loadAllVisiblePlanners()])
      .then(([m, p]) => { if (!cancelled) { setMembers(m); setPlanners(p); } })
      .catch(e => { if (!cancelled) { setErr(e.message || "Couldn't load your team."); setMembers([]); setPlanners([]); } });
    // KPIs are a separate, optional concern: if the Phase 3 tables aren't there
    // the dashboard must still work, just without the goals column.
    loadAllVisibleKpis([monthPeriod(), quarterPeriod()])
      .then(k => { if (!cancelled) setKpiData(k); })
      .catch(() => { if (!cancelled) setKpiData(null); });
    return () => { cancelled = true; };
  }, [orgCtx.org.id]);

  // Average attainment across a person's KPIs for the CURRENT month/quarter.
  // Deliberately not tied to the 7/30-day selector above — KPI periods are
  // months and quarters, and pretending otherwise would be a false number.
  const kpiAttainFor = (userId) => {
    if (!kpiData) return null;
    const scores = kpiData.kpis
      .filter(k => k.user_id === userId)
      .map(k => {
        const v = kpiData.values.find(x => x.kpi_id === k.id && x.period === periodFor(k.cadence));
        return kpiAttainment(k, v && v.actual);
      })
      .filter(x => x !== null);
    return scores.length ? Math.round(scores.reduce((a,b)=>a+b,0) / scores.length) : null;
  };

  if (members === null || planners === null) return <Ghost>Loading your team…</Ghost>;

  // Mirror the server-side rule so we never offer a row RLS will refuse.
  const visible = members.filter(m =>
    m.user_id === meId || role === "owner" || (role === "manager" && m.manager_id === meId));

  const days = lastNDayKeys(PERIODS.find(p => p.id === period).days);
  const planOf = (uid) => (planners.find(p => p.userId === uid) || {}).plan || null;

  const rows = visible.map(m => {
    const plan = planOf(m.user_id);
    return { member:m, plan, metrics: plan ? personMetrics(plan, days) : null,
             kpiAttain: kpiAttainFor(m.user_id) };
  });
  const kpiScores = rows.map(r => r.kpiAttain).filter(v => v !== null);
  const teamKpi = kpiScores.length ? Math.round(kpiScores.reduce((a,b)=>a+b,0)/kpiScores.length) : null;
  const anyKpis = !!(kpiData && kpiData.kpis.length);

  const withData = rows.filter(r => r.metrics);
  const agg = (pick) => {
    const vals = withData.map(r => pick(r.metrics)).filter(v => v !== null && v !== undefined);
    return vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
  };
  const total = (pick) => withData.reduce((a,r) => a + (pick(r.metrics) || 0), 0);

  const teamCompletion = agg(m => m.prioCompletion);
  const teamScore      = agg(m => m.avgScore);
  const teamOverdue    = total(m => m.overdue);
  const teamDelegated  = total(m => m.openDelegated);
  const teamPlanRate   = withData.length
    ? Math.round((total(m => m.daysPlanned) / (withData.length * days.length)) * 100) : null;

  const selPlan = sel ? planOf(sel.user_id) : null;

  return (
    <div>
      <Callout>
        {role === "owner"
          ? "The whole picture — how the team is actually planning and following through. Read-only: you can see the work, not rewrite it for them."
          : "How your direct reports are planning and following through. Read-only — coach with it, don't edit it."}
      </Callout>
      {err && <p className="mb-3 rounded-md bg-rose-50 px-3 py-2 text-sm text-rose-600">{err}</p>}

      <div className="mb-4 flex flex-wrap items-center gap-1 rounded-lg border border-slate-200 bg-white p-1.5">
        {PERIODS.map(p => (
          <button key={p.id} onClick={()=>setPeriod(p.id)}
            className={"rounded-md px-3 py-1.5 text-sm transition "+
              (period===p.id ? "bg-slate-900 font-semibold text-white" : "text-slate-600 hover:bg-stone-100")}>
            {p.label}
          </button>
        ))}
        <span className="ml-auto pr-2 text-xs text-slate-400">{withData.length} of {visible.length} have planner data</span>
      </div>

      <div className={"mb-5 grid grid-cols-2 gap-3 "+(anyKpis ? "md:grid-cols-6" : "md:grid-cols-5")}>
        <Metric label="Priorities completed" value={pct(teamCompletion)} sub="team average" />
        <Metric label="Days planned" value={pct(teamPlanRate)} sub="outcome set" />
        <Metric label="Avg day score" value={avg(teamScore)} sub="out of 3" />
        <Metric label="Overdue items" value={teamOverdue} tone={teamOverdue ? "rose" : "emerald"} sub="right now" />
        <Metric label="Waiting on others" value={teamDelegated} sub="open delegations" />
        {anyKpis && <Metric label="KPI attainment" value={pct(teamKpi)} sub="this month / quarter"
          tone={teamKpi === null ? undefined : teamKpi >= 100 ? "emerald" : teamKpi < 80 ? "rose" : undefined} />}
      </div>

      <div className="mb-2 flex items-baseline justify-between">
        <h2 className="font-semibold text-slate-700">By person</h2>
        <span className="text-xs text-slate-400">Click a row for the detail</span>
      </div>
      <div className="space-y-2">
        {rows.length === 0 && <Ghost>Nobody to show yet.</Ghost>}
        {rows.map(({member:m, metrics:x, kpiAttain}) => (
          <button key={m.id} onClick={()=>setSel(sel && sel.id===m.id ? null : m)}
            className={"block w-full rounded-lg border p-3 text-left transition "+
              (sel && sel.id===m.id ? "border-amber-400 bg-amber-50" : "border-slate-200 bg-white hover:border-slate-300")}>
            <div className="flex flex-wrap items-center gap-x-4 gap-y-2">
              <div className="min-w-[8rem] flex-1">
                <div className="truncate font-medium text-slate-800">
                  {m.name}{m.user_id===meId && <span className="text-xs font-normal text-slate-400"> (you)</span>}
                </div>
                <div className="truncate text-xs text-slate-400">{ROLE_LABEL[m.role]}</div>
              </div>
              {!x && <span className="text-xs text-slate-400">No planner data yet</span>}
              {x && <>
                <div className="text-center">
                  <div className="mono text-sm font-bold text-slate-800">{pct(x.prioCompletion)}</div>
                  <div className="text-[11px] text-slate-400">priorities</div>
                </div>
                <div className="text-center">
                  <div className="mono text-sm font-bold text-slate-800">{x.daysPlanned}<span className="text-slate-400">/{x.daysInPeriod}</span></div>
                  <div className="text-[11px] text-slate-400">days planned</div>
                </div>
                <div className="text-center">
                  <div className="mono text-sm font-bold text-slate-800">{avg(x.avgScore)}</div>
                  <div className="text-[11px] text-slate-400">avg score</div>
                </div>
                <div className="text-center">
                  <div className={"mono text-sm font-bold "+(x.overdue?"text-rose-600":"text-slate-800")}>{x.overdue}</div>
                  <div className="text-[11px] text-slate-400">overdue</div>
                </div>
                <div className="text-center">
                  <div className={"mono text-sm font-bold "+(x.overdueDelegated?"text-amber-600":"text-slate-800")}>{x.openDelegated}</div>
                  <div className="text-[11px] text-slate-400">waiting on</div>
                </div>
                {anyKpis && (
                  <div className="text-center">
                    <div className={"mono text-sm font-bold "+
                      (kpiAttain === null ? "text-slate-400"
                        : kpiAttain >= 100 ? "text-emerald-600"
                        : kpiAttain >= 80 ? "text-amber-600" : "text-rose-600")}>
                      {pct(kpiAttain)}
                    </div>
                    <div className="text-[11px] text-slate-400">KPIs</div>
                  </div>
                )}
                <div className="hidden sm:block"><Sparkline series={x.scoreSeries} /></div>
              </>}
            </div>
          </button>
        ))}
      </div>

      {sel && (
        <div className="mt-5">
          {!selPlan
            ? <Ghost>{sel.name} hasn't set up a planner yet, or you don't have access to it.</Ghost>
            : <PersonSnapshot person={sel} plan={selPlan}
                metrics={personMetrics(selPlan, days)}
                periodLabel={PERIODS.find(p=>p.id===period).label} />}
        </div>
      )}
    </div>
  );
}

function PersonSnapshot({ person, plan, metrics, periodLabel }){
  const dk = todayKey();
  const day = plan.daily[dk] || {};
  const { overdue, today } = collectDueItems(plan);
  const delegated = plan.dailyBackup.filter(b=>["DELEGATE","WAITING-FOR"].includes(b.taskType) && !b.done);
  const stat = (label, value, tone="slate") => (
    <div className={"rounded-lg border p-3 "+(tone==="rose"?"border-rose-200 bg-rose-50":"border-slate-200 bg-white")}>
      <div className={"mono text-xl font-bold "+(tone==="rose"?"text-rose-600":"text-slate-800")}>{value}</div>
      <div className="text-xs text-slate-500">{label}</div>
    </div>
  );

  return (
    <div className="space-y-4">
      <div className="rounded-lg border border-slate-200 bg-white p-4">
        <div className="flex flex-wrap items-baseline justify-between gap-2">
          <h3 className="font-semibold text-slate-800">{person.name}</h3>
          <span className="text-xs text-slate-400">{person.email} · {ROLE_LABEL[person.role]}</span>
        </div>
        <div className="mt-3">
          <div className="text-xs font-semibold uppercase tracking-wide text-amber-600">★ Today's main outcome</div>
          <p className="mt-1 text-sm text-slate-700">{day.outcome || <span className="text-slate-400">Not set for today.</span>}</p>
        </div>
        <div className="mt-3">
          <div className="text-xs font-semibold uppercase tracking-wide text-slate-500">Priorities</div>
          <div className="mt-1 space-y-1">
            {[0,1,2].map(i => {
              const t = (day.priorities||[])[i];
              if (!t) return null;
              const mark = PMARKS.find(m=>m.v===((day.marks||[])[i]||"")) || PMARKS[0];
              return (
                <div key={i} className="flex items-center gap-2 text-sm text-slate-700">
                  <span className={"mono w-4 text-center "+mark.cls}>{mark.label}</span>{t}
                </div>
              );
            })}
            {!(day.priorities||[]).some(Boolean) && <p className="text-sm text-slate-400">No priorities set for today.</p>}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
        {stat("Due today", today.length)}
        {stat("Overdue", overdue.length, overdue.length ? "rose" : "slate")}
        {stat("In backup", plan.dailyBackup.filter(b=>!b.done).length)}
        {stat("Waiting on others", delegated.length)}
      </div>

      {delegated.length > 0 && (
        <div className="rounded-lg border border-slate-200 bg-white p-4">
          <div className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500">Delegated / waiting-for</div>
          <div className="space-y-1">
            {delegated.map(b => (
              <div key={b.id} className="flex flex-wrap items-center gap-2 rounded-md bg-stone-50 px-2 py-1.5 text-sm text-slate-700">
                <span className="min-w-0 flex-1">{b.text}</span>
                {b.assignee && <span className="rounded bg-sky-50 px-1.5 py-0.5 text-xs text-sky-600">→ {b.assignee}</span>}
                {b.due && <span className="mono text-xs text-slate-400">📅 {b.due}</span>}
              </div>
            ))}
          </div>
        </div>
      )}

      {metrics && (
        <div className="rounded-lg border border-slate-200 bg-white p-4">
          <div className="mb-3 flex flex-wrap items-baseline justify-between gap-2">
            <div className="text-xs font-semibold uppercase tracking-wide text-slate-500">Trend · {periodLabel}</div>
            <Sparkline series={metrics.scoreSeries} width={160} height={30} />
          </div>

          <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
            {stat("Days planned", `${metrics.daysPlanned}/${metrics.daysInPeriod}`)}
            {stat("Priorities completed", pct(metrics.prioCompletion))}
            {stat("Avg day score", avg(metrics.avgScore))}
            {stat("Non-negotiables", pct(metrics.nnRate))}
          </div>

          {metrics.prioSet > 0 && (
            <div className="mt-4">
              <div className="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-500">
                What happened to {metrics.prioSet} {metrics.prioSet===1?"priority":"priorities"}
              </div>
              <div className="flex h-3 overflow-hidden rounded-full bg-stone-100">
                {[["done",metrics.prioDone,"bg-emerald-500"],
                  ["moved",metrics.prioMoved,"bg-amber-400"],
                  ["delegated",metrics.prioDelegated,"bg-sky-400"],
                  ["dropped",metrics.prioDropped,"bg-rose-400"]].map(([k,v,cls]) =>
                    v > 0 ? <div key={k} className={cls} style={{width:`${(v/metrics.prioSet)*100}%`}} title={`${v} ${k}`} /> : null)}
              </div>
              <div className="mt-1.5 flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-slate-500">
                <span><span className="mr-1 inline-block h-2 w-2 rounded-full bg-emerald-500 align-middle"/>Done {metrics.prioDone}</span>
                <span><span className="mr-1 inline-block h-2 w-2 rounded-full bg-amber-400 align-middle"/>Moved {metrics.prioMoved}</span>
                <span><span className="mr-1 inline-block h-2 w-2 rounded-full bg-sky-400 align-middle"/>Delegated {metrics.prioDelegated}</span>
                <span><span className="mr-1 inline-block h-2 w-2 rounded-full bg-rose-400 align-middle"/>Dropped {metrics.prioDropped}</span>
                <span className="text-slate-400">Unmarked {metrics.prioSet - metrics.prioDone - metrics.prioMoved - metrics.prioDelegated - metrics.prioDropped}</span>
              </div>
            </div>
          )}

          <p className="mt-3 text-[11px] text-slate-400">
            Avg score covers the {metrics.scoreDays} {metrics.scoreDays===1?"day":"days"} they actually closed out —
            days with no evening closure are left out rather than counted as zero.
          </p>
        </div>
      )}

      <p className="text-center text-xs text-slate-400">
        Read-only. Nobody but {person.name} can change this plan.
      </p>
    </div>
  );
}
