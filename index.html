            </label>
            <label className="text-xs text-slate-500">Free Trial Mandate (Days)
              <input value={draft.trial_days ?? 15} onChange={e=>setDraft({...draft, trial_days:e.target.value})}
                type="number" min="0" placeholder="15"
                className="mt-0.5 block w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-sm" />
            </label>
            <label className="text-xs text-slate-500">Monthly Price Text
              <input value={draft.price_display||""} onChange={e=>setDraft({...draft, price_display:e.target.value})}

function AccountSection({ userId }){
  const [email, setEmail] = useState("");
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [roleTitle, setRoleTitle] = useState("");
  const [savedName, setSavedName] = useState("");
  const [savedPhone, setSavedPhone] = useState("");
  const [savedRoleTitle, setSavedRoleTitle] = useState("");
  const [pw1, setPw1] = useState("");
  const [pw2, setPw2] = useState("");
  const [msg, setMsg] = useState("");
  const [tone, setTone] = useState("ok");      // ok | bad
  const [busy, setBusy] = useState("");

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!cancelled && session) setEmail(session.user.email || "");
      const { data } = await sb.from("profiles").select("full_name, phone, role_title").eq("id", userId).maybeSingle();
      if (!cancelled && data) {
        setName(data.full_name || ""); setSavedName(data.full_name || "");
        setPhone(data.phone || ""); setSavedPhone(data.phone || "");
        setRoleTitle(data.role_title || ""); setSavedRoleTitle(data.role_title || "");
      }
    })();
    return () => { cancelled = true; };
  }, [userId]);

  const say = (t, bad) => { setMsg(t); setTone(bad ? "bad" : "ok"); };

  const saveProfile = async () => {
    setBusy("profile"); setMsg("");
    const { error } = await sb.from("profiles").update({
      full_name: name.trim() || null,
      phone: phone.trim() || null,
      role_title: roleTitle.trim() || null
    }).eq("id", userId);
    if (error) say(error.message || "Couldn't save your profile details.", true);
    else {
      setSavedName(name.trim());
      setSavedPhone(phone.trim());
      setSavedRoleTitle(roleTitle.trim());
      say("Profile details saved successfully.");
    }
    setBusy("");
  };

  const changePassword = async () => {
    setMsg("");
    if (pw1.length < 8) return say("Use at least 8 characters.", true);
    if (pw1 !== pw2)    return say("The two passwords don't match.", true);
    setBusy("pw");
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error) say(error.message || "Couldn't change your password.", true);
    else { setPw1(""); setPw2(""); say("Password changed. It's in effect now."); }
    setBusy("");
  };

  return (
    <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-xs space-y-5">
      <h3 className="font-bold text-slate-900 text-sm">Your Account & Executive Profile</h3>

      <div>
        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Signed in as</label>
        <div className="mono mt-1 text-sm font-semibold text-slate-900">{email || "…"}</div>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label className="text-xs font-bold text-slate-700 uppercase tracking-wider block mb-1">Full Name</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your Name"
            className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2 text-xs font-semibold text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />
        </div>
        <div>
          <label className="text-xs font-bold text-slate-700 uppercase tracking-wider block mb-1">Mobile / WhatsApp</label>
          <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+91 98765 43210"
            className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2 text-xs font-semibold text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />
        </div>
        <div>
          <label className="text-xs font-bold text-slate-700 uppercase tracking-wider block mb-1">Role / Title</label>
          <input value={roleTitle} onChange={e=>setRoleTitle(e.target.value)} placeholder="Founder / CEO"
            className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2 text-xs font-semibold text-slate-900 outline-none focus:border-blue-600 focus:bg-white transition" />
        </div>
      </div>

      <div>
        <button onClick={saveProfile} disabled={busy==="profile" || (name.trim()===savedName && phone.trim()===savedPhone && roleTitle.trim()===savedRoleTitle)}
          className="rounded-xl bg-slate-950 px-4 py-2 text-xs font-bold text-white hover:bg-slate-800 disabled:opacity-40 transition shadow-xs">
          {busy==="profile" ? "Saving..." : "Save Profile Details"}
        </button>
      </div>

      <div className="pt-4 border-t border-slate-100">
        <label className="text-xs font-bold text-slate-700 uppercase tracking-wider block mb-2">Change Password</label>
        <div className="flex flex-wrap gap-2">
          <input type="password" value={pw1} onChange={e=>setPw1(e.target.value)}
            placeholder="New password" autoComplete="new-password"
            className="min-w-[10rem] flex-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs outline-none focus:border-blue-600 focus:bg-white transition" />
          <input type="password" value={pw2} onChange={e=>setPw2(e.target.value)}
            placeholder="Repeat password" autoComplete="new-password"
            onKeyDown={e=>e.key==="Enter"&&changePassword()}
            className="min-w-[10rem] flex-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs outline-none focus:border-blue-600 focus:bg-white transition" />
          <button onClick={changePassword} disabled={busy==="pw" || !pw1 || !pw2}
            className="rounded-xl bg-slate-950 px-4 py-2 text-xs font-bold text-white hover:bg-slate-800 disabled:opacity-40 transition shadow-xs">
            {busy==="pw" ? "…" : "Change"}
          </button>
        </div>
      </div>

      {msg && <p className={"rounded-xl border px-3.5 py-2.5 text-xs "+(tone==="bad"
        ? "border-rose-200 bg-rose-50 text-rose-700"
        : "border-emerald-200 bg-emerald-50 text-emerald-700")}>{msg}</p>}
    </div>
  );
}

function CompanySection({ orgCtx, orgError, userId, onLeftOrg, onStartCompany }){
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  const pendingInvites = (orgCtx && orgCtx.pendingInvites) || [];

  const leave = async () => {
    if (!confirm("Leave this company? You keep your own planner and all your data — you just lose company access, and owners/managers stop seeing your plan.")) return;
    setBusy(true); setMsg("");
    try { await removeMember(membership.id); onLeftOrg(); }
    catch (e) { setMsg(e.message || "Couldn't leave the company."); setBusy(false); }
  };

  const acceptInv = async (inv) => {
    setBusy(true); setMsg("");
    try {
      await acceptInvite(inv, userId);
      window.location.reload();
    } catch (e) {
      setMsg(e.message || "Couldn't accept that invite.");
      setBusy(false);
    }
  };

  return (
    <div className="space-y-4">
      {/* Show any pending invitations */}

            <div className="text-xs font-black uppercase tracking-wider text-emerald-900">Pending Invitation Available for You</div>

            <div key={inv.id} className="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-xl border border-emerald-200 shadow-xs">
              <div>
                <div className="text-sm font-extrabold text-slate-900">{inv.orgName}</div>
                <div className="text-xs text-slate-500">Role: <span className="font-semibold text-slate-800">{ROLE_LABEL[inv.role] || inv.role}</span></div>

                onClick={() => acceptInv(inv)}
                disabled={busy}

              >
                {busy ? "Joining…" : `Join ${inv.orgName} →`}
              </button>
            </div>
          ))}
        </div>
      )}

      {!membership ? (
        <div className="rounded-lg border border-slate-200 bg-white p-4">
          <h3 className="mb-3 font-semibold text-slate-700">Company</h3>
          <p className="mb-3 text-xs text-slate-400">

            or accept a pending invite if someone has already invited you.
          </p>
          <button onClick={onStartCompany}
            className="rounded-md bg-slate-900 px-3 py-2 text-sm text-white hover:bg-slate-700">
            Set up a company

          {(!!orgError || (orgCtx && orgCtx.degraded)) && (
            <div className="mt-3 rounded-md border border-amber-200 bg-amber-50 p-3">
              <p className="text-sm font-medium text-amber-800">Company features aren't switched on yet</p>
              {/does not exist|schema cache|relation|find the table/i.test(orgError || "") || !orgError ? (
                <p className="mt-1 text-xs text-amber-700">
                  The database tables they need don't exist yet. In Supabase → SQL Editor, run
                  <b> supabase-phase1-orgs.sql</b> (it's in your project folder, next to
                  <span className="mono"> index.html</span>), then come back and press the button again.
                </p>
              ) : (
                <p className="mt-1 text-xs text-amber-700">Couldn't reach the company tables. Check your connection and try again.</p>
              )}
              {orgError && <p className="mt-2 mono text-[11px] text-amber-600">{orgError}</p>}
            </div>
          )}
        </div>
      ) : (
        <div className="rounded-lg border border-slate-200 bg-white p-4">
          <h3 className="mb-3 font-semibold text-slate-700">Company</h3>
          <div className="flex flex-wrap items-center gap-2 text-sm">
            <span className="font-medium text-slate-800">{orgCtx.org ? orgCtx.org.name : "Your company"}</span>
            <span className="rounded bg-stone-100 px-1.5 py-0.5 text-xs font-semibold uppercase tracking-wide text-slate-600">
              {ROLE_LABEL[membership.role]}
            </span>
          </div>
          <p className="mt-2 text-xs text-slate-400">{ROLE_HELP[membership.role]}</p>
          {msg && <p className="mt-2 text-xs text-rose-500">{msg}</p>}
          <button onClick={leave} disabled={busy}
            className="mt-3 rounded-md border border-rose-200 px-3 py-1.5 text-xs text-rose-600 hover:bg-rose-50 disabled:opacity-60">
            {busy ? "…" : "Leave company"}
          </button>

            <p className="mt-2 text-xs text-slate-400">
              If you're the only owner, promote someone else to Owner in the Team tab first — a company can't be left without one.

    </div>
  );
}
function CalendarIntegrationSection({ data, userId }){
  const [copiedFeed, setCopiedFeed] = useState(false);
  const actualUserId = userId || (typeof sb !== "undefined" && (sb.auth?.currentUser?.id || sb.auth?.user?.()?.id || sb.auth?.session?.()?.user?.id)) || "";
  const feedUrl = actualUserId ? `${SUPABASE_URL}/functions/v1/calendar-feed?u=${actualUserId}` : "";
  const webcalUrl = feedUrl ? feedUrl.replace(/^https?:\/\//i, "webcal://") : "";

  const copyFeedUrl = () => {
    if (!feedUrl) return;
    navigator.clipboard.writeText(feedUrl);
    setCopiedFeed(true);
    setTimeout(() => setCopiedFeed(false), 3000);
  };

  const downloadIcs = () => {
    const dk = todayKey(data?.settings?.timezone || "Asia/Kolkata");
    const icsData = generateDayIcs(data, dk);
    const blob = new Blob([icsData], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `flowdirector-focus-${dk}.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-xs space-y-4">
      <div className="flex items-center gap-2.5">
        <span className="text-xl">🗓️</span>
        <div>
          <h3 className="font-bold text-sm text-slate-900">Live Calendar Sync &amp; Feed</h3>
          <p className="text-xs text-slate-500">Keep Google Calendar, Apple Calendar, and Outlook continuously updated in real-time</p>
        </div>
      </div>

      {/* Live Continuous WebCal Subscription */}
      <div className="rounded-2xl border border-indigo-200 bg-indigo-50/60 p-4 space-y-3">
        <div className="flex items-center justify-between">
          <span className="text-xs font-black uppercase tracking-wider text-indigo-900 flex items-center gap-1.5">
            <span className="h-2 w-2 rounded-full bg-indigo-600 animate-pulse"></span>
            <span>Live Auto-Updating Subscription (Always in Sync)</span>
          </span>
        </div>
        <p className="text-xs text-slate-700">
          Subscribe once. Whenever you edit time blocks, priorities, or outcomes in FlowDirector, your calendar updates automatically in the background.
        </p>
        
        <div className="flex flex-wrap gap-2 pt-1">
          {webcalUrl ? (
            <a
              href={webcalUrl}
              target="_blank"
              rel="noopener noreferrer"
              className="rounded-xl bg-slate-950 hover:bg-slate-800 text-white py-2 px-4 text-xs font-bold transition shadow-xs flex items-center justify-center gap-1.5"
            >
              <span>🍏</span>
              <span>1-Click Subscribe in Apple Calendar</span>
            </a>
          ) : null}
          <button
            onClick={copyFeedUrl}
            className="rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-800 py-2 px-4 text-xs font-bold transition shadow-xs flex items-center gap-1.5"
          >
            <span>{copiedFeed ? "✓" : "📋"}</span>
            <span>{copiedFeed ? "URL Copied!" : "Copy Live Feed URL"}</span>
          </button>
        </div>

        <div className="pt-2 border-t border-indigo-100 text-[11px] text-slate-600 space-y-1">
          <p><b>Google Calendar setup:</b> Copy Feed URL &gt; Go to Google Calendar &gt; <i>Other calendars (+)</i> &gt; <i>From URL</i> &gt; Paste.</p>
          <p><b>Apple Calendar (Mac / iPhone):</b> Click the Apple Calendar button above or subscribe via <code>webcal://</code>.</p>
        </div>
      </div>

      {/* Static 1-Click .ICS Download */}
      <div className="rounded-2xl border border-slate-200 bg-slate-50/70 p-4 space-y-2">
        <div className="flex items-center justify-between">
          <span className="text-xs font-black uppercase tracking-wider text-slate-700">
            Snapshot Export: Single-Day .ICS File
          </span>
        </div>
        <p className="text-xs text-slate-600">
          Download a standalone snapshot of today's One Main Outcome and planned hourly focus blocks for offline use.
        </p>
        <button
          onClick={downloadIcs}
          className="rounded-xl border border-slate-300 bg-white hover:bg-slate-100 text-slate-800 px-4 py-2 text-xs font-bold transition shadow-xs flex items-center gap-1.5"
        >
          <span>📥</span>
          <span>Download Today's Focus Blocks (.ICS)</span>
        </button>
      </div>
    </div>
  );
}

  { id: "company", label: "Company & Team", icon: "🏢" },

];

function SettingsView({ data, patch, setData, userId, orgCtx, orgError, onLeftOrg, onStartCompany, onOpenTraining, isAdmin, initialSubTab = "general" }){
  const role = orgCtx && orgCtx.membership ? orgCtx.membership.role : null;
  const isEmployee = role === "employee" || role === "member" || role === "assistant";
  const isManager = role === "manager";

  const visibleSettingsTabs = SETTINGS_TABS.filter(t => {
    if (isEmployee && (t.id === "company" || t.id === "billing")) return false;
    if (isManager && t.id === "billing") return false;
    return true;
  });

  const [subTab, setSubTabState] = useState(initialSubTab);

  useEffect(() => {
    if (initialSubTab && initialSubTab !== subTab) {
      setSubTabState(initialSubTab);
    }
  }, [initialSubTab]);

  const setSubTab = (st) => {
    setSubTabState(st);
    navigate(`/settings/${st}`);
  };

  const ohv=Math.round((data.settings.income||0)/(data.settings.hours||1));
  const fileInputRef = useRef(null);
  const [clearing, setClearing] = useState(false);
  const clearAllData = async () => {
    if (!confirm("Permanently delete everything in your planner — captures, backups, daily/weekly/monthly notes, maybe list, reference notes, team members? This cannot be undone.")) return;
    if (!confirm("Really sure? This wipes your account's stored data right now.")) return;
    setClearing(true);
    try {
      await saveState(userId, structuredClone(SEED));
      setData(structuredClone(SEED));
    } catch (e) {
      alert("Couldn't clear your data: " + (e.message || "unknown error") + ". Check your connection and try again.");
    }
    setClearing(false);
  };
  const exportData=()=>{ const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="time-domination-backup.json"; a.click(); };
  const importData=(e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if(typeof parsed !== "object" || parsed===null) throw new Error("Not a valid backup file.");
        if(!confirm("Import this backup? It will replace everything currently in your planner.")) return;
        setData({ ...structuredClone(SEED), ...parsed });
      } catch (err) {
        alert("Couldn't read that file: " + (err.message || "invalid JSON"));
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div className="space-y-6">
      {/* Submenu Tabs Navigation Strip */}
      <div className="rounded-3xl border border-slate-200 bg-white p-2.5 shadow-xs">
        {/* Mobile Dropdown View (< sm) */}
        <div className="block sm:hidden">
          <select
            value={subTab}
            onChange={e => setSubTab(e.target.value)}
            className="w-full rounded-2xl border-2 border-amber-300 bg-amber-50/70 p-3 text-xs font-black text-slate-950 outline-none"
          >
            {visibleSettingsTabs.map(st => (
              <option key={st.id} value={st.id}>
                {st.icon} {st.label}
              </option>
            ))}
          </select>
        </div>

        {/* Desktop / Tablet Horizontal Strip (>= sm) */}
        <div className="hidden sm:flex items-center gap-1.5 overflow-x-auto [ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
          {visibleSettingsTabs.map(st => {
            const active = subTab === st.id;
            return (
              <button
                key={st.id}
                onClick={() => setSubTab(st.id)}
                className={`flex shrink-0 items-center gap-2 rounded-2xl px-4 py-2.5 text-xs font-black transition-all ${
                  active
                    ? "bg-slate-950 text-white shadow-md shadow-slate-950/10 scale-[1.02]"
                    : "text-slate-600 hover:bg-slate-100 hover:text-slate-950"
                }`}
              >
                <span className="text-sm">{st.icon}</span>
                <span>{st.label}</span>
              </button>
            );
          })}
        </div>
      </div>

      {/* Sub-tab 1: General & Working Hours */}
      {subTab === "general" && (
        <div className="space-y-6">
          <Callout>Any task below your Owner Hour Value should not be in your hands. Set it, then delegate ruthlessly.</Callout>

          {orgCtx?.org && (
            <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-xs">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-lg">📹</span>
                    <h3 className="text-sm font-bold text-slate-900">1-on-1 Executive Strategy & Onboarding Call</h3>
                  </div>
                  <p className="text-xs text-slate-500 mt-1">Complimentary 20-minute Google Meet coaching session to configure your KRAs and calculate delegation velocity.</p>
                </div>
                <button 
                  onClick={onOpenTraining}
                  className={`rounded-xl px-4 py-2 text-xs font-bold transition shadow-xs flex items-center gap-1.5 ${
                    orgCtx.org.training_status === "booked"
                      ? "bg-emerald-100 text-emerald-950 border border-emerald-300 hover:bg-emerald-200"
                      : "bg-slate-950 text-white hover:bg-slate-800"
                  }`}
                >
                  <span>{orgCtx.org.training_status === "booked" ? "📅 View / Reschedule Session" : "📹 Book Google Meet Session"}</span>
                </button>
              </div>
              {orgCtx.org.training_status === "booked" && (
                <div className="mt-4 rounded-xl border border-emerald-200 bg-emerald-50/70 p-3.5 text-xs text-emerald-950 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <b>Scheduled:</b> {orgCtx.org.training_notes || "1-on-1 Strategy Call"}
                  </div>
                  <a 
                    href={orgCtx.org.training_meet_link || "https://meet.google.com"} 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="font-bold underline hover:no-underline text-emerald-800"
                  >
                    Join Google Meet Room ↗
                  </a>
                </div>
              )}
            </div>
          )}

          {isAdmin && (
            <div className="rounded-2xl border border-slate-900 bg-slate-950 p-6 text-white shadow-xl space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <span className="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-800 text-lg">🔐</span>
                  <div>
                    <h3 className="font-bold text-sm text-white">Platform Administrator Console</h3>
                    <p className="text-xs text-slate-400 mt-0.5">Standalone control panel to manage platform companies, pricing plans, and real revenue metrics.</p>
                  </div>
                </div>
                <button 
                  onClick={() => navigate("/admin")}
                  className="rounded-xl bg-amber-400 px-4 py-2.5 text-xs font-bold text-slate-950 hover:bg-amber-300 transition shadow-md"
                >
                  Launch Admin Console →
                </button>
              </div>
            </div>
          )}

          <div className="rounded-2xl border border-slate-200 bg-white p-5 space-y-4 shadow-xs">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="font-extrabold text-sm text-slate-950">Owner Hour Value (OHV) Threshold</h3>
                <p className="text-xs text-slate-500 mt-0.5">Tasks priced below this hourly rate will be flagged for aggressive delegation or elimination.</p>
              </div>
              <div className="rounded-xl bg-slate-950 px-4 py-2 text-right shadow-xs">
                <span className="text-[10px] uppercase font-bold text-slate-400 block">Calculated OHV</span>
                <span className="text-lg font-black text-amber-400">₹{ohv.toLocaleString("en-IN")}<span className="text-xs text-slate-300 font-medium"> /hr</span></span>
              </div>
            </div>

            <div className="grid gap-4 sm:grid-cols-3 pt-1">
              <div>
                <label className="mb-1 block text-xs font-bold text-slate-700 uppercase">Target Monthly Net Income (₹)</label>
                <Field 
                  type="number" 
                  value={data.settings.income || 400000} 
                  onChange={e => patch(d => { d.settings.income = Number(e.target.value) || 0; })} 
                />
              </div>

              <div>
                <label className="mb-1 block text-xs font-bold text-slate-700 uppercase">Working Days / Week (1 - 7)</label>
                <div className="flex items-center gap-1 pt-0.5">
                  {[1, 2, 3, 4, 5, 6, 7].map(d => {
                    const currentDays = data.settings.daysPerWeek || Math.min(7, Math.max(1, Math.round((data.settings.hours || 180) / (4.33 * 8)))) || 6;
                    const isSelected = currentDays === d;
                    return (
                      <button
                        key={d}
                        type="button"
                        onClick={() => patch(x => {
                          x.settings.daysPerWeek = d;
                          const hrsPerDay = x.settings.hoursPerDay || 8;
                          x.settings.hours = Math.round(d * hrsPerDay * 4.33);
                        })}
                        className={`flex-1 py-2 rounded-xl text-xs font-black border transition ${
                          isSelected 
                            ? "bg-slate-950 text-white border-slate-950 shadow-xs" 
                            : "bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100"
                        }`}
                      >
                        {d}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div>
                <label className="mb-1 block text-xs font-bold text-slate-700 uppercase">
                  Hours / Day ({data.settings.hoursPerDay || 8} hrs/day)
                </label>
                <input 
                  type="range"
                  min="2"
                  max="16"
                  step="1"
                  value={data.settings.hoursPerDay || 8}
                  onChange={e => {
                    const hpd = Number(e.target.value);
                    patch(x => {
                      x.settings.hoursPerDay = hpd;
                      const dpw = x.settings.daysPerWeek || 6;
                      x.settings.hours = Math.round(dpw * hpd * 4.33);
                    });
                  }}
                  className="w-full accent-amber-500 h-2 bg-slate-100 rounded-lg cursor-pointer mt-2"
                />
                <span className="text-[10px] text-slate-400 font-bold block mt-1">
                  ~{data.settings.hours || 180} working hours per month
                </span>
              </div>
            </div>

            {/* Timezone Selector */}
            <div className="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
              <div className="space-y-0.5">
                <label className="text-xs font-bold text-slate-800 uppercase flex items-center gap-1.5">
                  <span>🕒</span>
                  <span>Default Timezone &amp; Regional Clock</span>
                </label>
                <p className="text-[11px] text-slate-500">
                  Current local time in selected timezone: <b className="text-slate-800">{new Intl.DateTimeFormat("en-IN", { timeZone: data.settings.timezone || "Asia/Kolkata", dateStyle: "full", timeStyle: "short" }).format(new Date())}</b>
                </p>
              </div>
              <select
                value={data.settings.timezone || "Asia/Kolkata"}
                onChange={e => patch(x => { x.settings.timezone = e.target.value; })}
                className="rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2 text-xs font-bold text-slate-800 outline-none focus:border-blue-600 focus:bg-white transition"
              >
                {TIMEZONES.map(tz => <option key={tz.value} value={tz.value}>{tz.label}</option>)}
              </select>
            </div>
          </div>

          <div className="rounded-lg border border-slate-200 bg-white p-4">
            <h3 className="mb-3 font-semibold text-slate-700">Day themes</h3>
            <p className="mb-3 text-xs text-slate-400">These headline every week. Edit freely — e.g. Monday for employee meetings, Tuesday for accounts.</p>
            <div className="grid gap-2 sm:grid-cols-2">
              {DAY_KEYS.map(d=>(
                <label key={d} className="flex items-center gap-2 text-sm">
                  <span className="w-10 mono text-xs text-slate-500">{DAY_LABEL[d]}</span>
                  <Field value={data.dayThemes[d]||""} onChange={e=>patch(x=>{x.dayThemes[d]=e.target.value;})} />
                </label>
              ))}
            </div>
          </div>

          <NotificationSection />
        </div>
      )}

      {/* Sub-tab 2: Calendar & Tax Compliance */}
      {subTab === "calendar" && (
        <div className="space-y-6">
          <CalendarIntegrationSection data={data} userId={userId} />

          <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-xs space-y-4">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center gap-2.5">
                <span className="text-xl">🏛️</span>
                <div>
                  <h3 className="font-bold text-sm text-slate-900">Statutory Tax, GST &amp; Holiday Calendars</h3>
                  <p className="text-xs text-slate-500">Optional 1-click import of gazetted holidays and statutory business compliance deadlines</p>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
              {/* Card 1: Indian Festivals */}
              <div className="rounded-2xl border border-amber-200 bg-amber-50/50 p-4 space-y-2 flex flex-col justify-between">
                <div className="space-y-1">
                  <span className="text-xs font-black uppercase text-amber-900 block">
                    🎆 Indian Festivals &amp; Gazetted Holidays (2026–2027)
                  </span>
                  <p className="text-xs text-slate-600">
                    Diwali, Holi, Independence Day, Republic Day, Eid, Gandhi Jayanti, Dussehra, Christmas &amp; more.
                  </p>
                </div>
                <button
                  onClick={() => {
                    let added = 0;
                    patch(d => {
                      d.holidays = d.holidays || [];
                      d.dailyBackup = (d.dailyBackup || []).filter(b => !isHolidayItem(b));
                      d.captures = (d.captures || []).filter(c => !isHolidayItem(c));
                      d.weeklySomeday = (d.weeklySomeday || []).filter(w => !isHolidayItem(w));
                      d.monthlyTray = (d.monthlyTray || []).filter(m => !isHolidayItem(m));

                      INDIAN_HOLIDAYS_CATALOG.forEach(hol => {
                        if (!d.holidays.some(h => h.text === hol.text && h.due === hol.due)) {
                          d.holidays.push({
                            id: hol.id,
                            text: hol.text,
                            due: hol.due,
                            tag: "Holiday"
                          });
                          added++;
                        }
                      });
                    });
                    alert(`✓ Indian festivals & gazetted holidays enabled — visible on calendar without adding chores to your task list!`);
                  }}
                  className="w-full rounded-xl bg-slate-950 hover:bg-slate-800 text-white py-2 text-xs font-bold transition shadow-xs flex items-center justify-center gap-1.5"
                >
                  <span>📥</span>
                  <span>Import Holidays ({INDIAN_HOLIDAYS_CATALOG.length})</span>
                </button>
              </div>

              {/* Card 2: Business Tax Deadlines */}
              <div className="rounded-2xl border border-blue-200 bg-blue-50/50 p-4 space-y-2 flex flex-col justify-between">
                <div className="space-y-1">
                  <span className="text-xs font-black uppercase text-blue-900 block">
                    📊 Business Tax, TDS, GST &amp; Filing Deadlines
                  </span>
                  <p className="text-xs text-slate-600">
                    Monthly TDS (7th), GSTR-1 (11th), PF/ESIC (15th), GSTR-3B (20th) + Advance Tax &amp; Annual Return dates.
                  </p>
                </div>
                <button
                  onClick={() => {
                    let recCount = 0;
                    let deadCount = 0;
                    const tz = data?.settings?.timezone || "Asia/Kolkata";
                    const t = todayKey(tz);
                    patch(d => {
                      d.recurringMonthly = d.recurringMonthly || [];
                      d.dailyBackup = d.dailyBackup || [];
                      TAX_COMPLIANCE_CATALOG.recurring.forEach(item => {
                        if (!d.recurringMonthly.some(r => r.text === item.text)) {
                          d.recurringMonthly.push({ id: uid(), day: item.day, text: item.text, tag: item.tag, time: "" });
                          recCount++;
                        }
                      });
                      TAX_COMPLIANCE_CATALOG.quarterlyAnnual.forEach(item => {
                        if (!d.dailyBackup.some(b => b.text === item.text && b.due === item.due)) {
                          d.dailyBackup.push({ id: uid(), text: item.text, due: item.due, time: "", tag: item.tag, taskType: item.taskType, done: item.due < t });
                          deadCount++;
                        }
                      });
                    });
                    alert(`✓ Imported ${recCount} monthly tax rules and ${deadCount} annual compliance deadlines!`);
                  }}
                  className="w-full rounded-xl bg-blue-900 hover:bg-blue-950 text-white py-2 text-xs font-bold transition shadow-xs flex items-center justify-center gap-1.5"
                >
                  <span>📥</span>
                  <span>Import Tax &amp; GST Deadlines</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Sub-tab 3: Company & Team */}
      {subTab === "company" && (
        <div className="space-y-6">
          <CompanySection orgCtx={orgCtx} orgError={orgError} userId={userId} onLeftOrg={onLeftOrg} onStartCompany={onStartCompany} />
          {orgCtx?.org && (
            <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-xs space-y-6">
              <div>
                <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                  <span>👥</span>
                  <span>Team Directory &amp; Member Invites</span>
                </h3>
                <p className="text-xs text-slate-500 mt-1">
                  Invite your executives, managers, and assistants. Assign direct reporting hierarchies and permissions.
                </p>
              </div>
              <TeamView orgCtx={orgCtx} meId={userId} />
            </div>
          )}
          <TeamSection data={data} patch={patch} inCompany={!!(orgCtx && orgCtx.membership)} />
        </div>
      )}

      {/* Sub-tab 4: Categories & Task Labels */}
      {subTab === "labels" && (
        <div className="space-y-6">
          <CategoriesSection data={data} patch={patch} />
          <TaskTypeLabelsSection data={data} patch={patch} />
        </div>
      )}

      {/* Sub-tab 5: Billing & Invoices */}
      {subTab === "billing" && (
        <div className="space-y-6">
          <BillingSection orgCtx={orgCtx} userId={userId} />
        </div>
      )}

      {/* Sub-tab 6: Account & Data Backup */}
      {subTab === "account" && (
        <div className="space-y-6">
          <AccountSection userId={userId} />
          <div className="rounded-lg border border-slate-200 bg-white p-4">
            <h3 className="mb-3 font-semibold text-slate-700">Data</h3>
            <div className="flex flex-wrap gap-2">
              <button onClick={exportData} className="flex items-center gap-1 rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50"><Ic n="download"/> Export backup (JSON)</button>
              <input ref={fileInputRef} type="file" accept="application/json" onChange={importData} className="hidden" />
              <button onClick={()=>fileInputRef.current.click()} className="flex items-center gap-1 rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50"><Ic n="download"/> Import backup (JSON)</button>
            </div>
            <p className="mt-2 text-xs text-slate-400">Everything syncs to your account and is visible only to you. Sign in from any device to pick up where you left off.</p>
          </div>
          <div className="rounded-lg border border-rose-200 bg-white p-4">
            <h3 className="mb-3 font-semibold text-rose-600">Danger zone</h3>
            <button onClick={clearAllData} disabled={clearing} className="flex items-center gap-1 rounded-md border border-rose-300 bg-rose-50 px-3 py-2 text-sm font-medium text-rose-600 hover:bg-rose-100 disabled:opacity-60">
              <Ic n="trash"/> {clearing ? "Clearing…" : "Clear all my data"}
            </button>
            <p className="mt-2 text-xs text-slate-400">Wipes everything in your account and starts you over with a blank planner. Export a backup first if you might want any of this later.</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
<script>
  /* Compile the app source with Babel's classic JSX runtime (plain
     React.createElement calls) instead of relying on whatever runtime
     the unpinned CDN build defaults to — newer Babel Standalone builds
     default to the "automatic" runtime, which emits an `import` statement
     that a plain <script> tag cannot execute. */
  (function () {
    const src = document.getElementById("app-source").textContent;
    const out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    const s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
