name: Build FlowDirector Mobile Apps (Android and iOS)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. ANDROID BUILD JOB (Runs on Ubuntu Cloud Runner)
  # ============================================================================
  build-android:
    name: Build Android App (APK and AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Dist Assets
        run: npm run build

      - name: Initialize and Sync Android Native Project
        run: |
          if [ ! -d "android" ]; then
            echo "Initializing Android container..."
            npx cap add android
          fi
          echo "Syncing web assets and plugins to Android..."
          npx cap sync android
          
          # Auto-increment version code for Google Play Store compliance
          VERSION_CODE=${{ github.run_number }}
          if [ "$VERSION_CODE" -lt 2 ]; then
            VERSION_CODE=2
          fi
          echo "Setting versionCode to $VERSION_CODE in android/app/build.gradle"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$VERSION_CODE\"/g" android/app/build.gradle
          
          # Target API Level 36 (Android 16) for Google Play Store requirements
          echo "Setting compileSdkVersion and targetSdkVersion to 36..."
          if [ -f "android/variables.gradle" ]; then
            sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g" android/variables.gradle
            sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g" android/variables.gradle
          fi
          sed -i "s/compileSdkVersion rootProject.ext.compileSdkVersion/compileSdkVersion 36/g" android/app/build.gradle || true
          sed -i "s/targetSdkVersion rootProject.ext.targetSdkVersion/targetSdkVersion 36/g" android/app/build.gradle || true
          echo "android.builder.sdkDownload=true" >> android/gradle.properties

      - name: Compile Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Compile and Sign Android Release AAB (App Bundle)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace
          
          # Check if permanent keystore exists in repository
          if [ -f "../flowdirector-release.keystore" ]; then
            echo "Using permanent repository keystore..."
            cp ../flowdirector-release.keystore release.keystore
          else
            echo "Generating permanent upload keystore..."
            keytool -genkey -v -keystore release.keystore -alias flowdirector -keyalg RSA -keysize 2048 -validity 10000 -storepass flowdirector123 -keypass flowdirector123 -dname "CN=FlowDirector, OU=Productivity, O=FlowDirector, L=Global, ST=State, C=US"
            cp release.keystore ../flowdirector-release.keystore
            cd ..
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add flowdirector-release.keystore
            git commit -m "chore: persist permanent mobile release signing keystore" || true
            git push origin master || true
            cd android
          fi
          
          # Export public PEM certificate for Google Play Console upload key registration/reset
          keytool -exportcert -rfc -keystore release.keystore -alias flowdirector -file upload_certificate.pem -storepass flowdirector123
          
          echo "=== CERTIFICATE FINGERPRINT DETAILS ==="
          keytool -list -v -keystore release.keystore -alias flowdirector -storepass flowdirector123
          
          # Sign the AAB with release upload key
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass flowdirector123 -keypass flowdirector123 app/build/outputs/bundle/release/app-release.aab flowdirector
          echo "Successfully signed AAB with release upload key."

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowDirector-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed Google Play AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowDirector-Android-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Google Play Upload Certificate (.pem & .keystore)
        uses: actions/upload-artifact@v4
        with:
          name: FlowDirector-Google-Play-Upload-Certificate
          path: |
            android/upload_certificate.pem
            android/release.keystore
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # 2. iOS BUILD JOB (Runs on macOS Cloud Runner with Xcode pre-installed)
  # ============================================================================
  build-ios:
    name: Build iOS App (IPA Archive)
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_16.0.app || sudo xcode-select -switch /Applications/Xcode_15.4.app || xcode-select -p

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Dist Assets
        run: npm run build

      - name: Initialize and Sync iOS Native Project
        run: |
          if [ ! -d "ios" ]; then
            echo "Initializing iOS container..."
            npx cap add ios
          fi
          echo "Syncing web assets and plugins to iOS..."
          npx cap sync ios

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          pod install

      - name: Archive iOS App with Xcodebuild
        run: |
          mkdir -p ios/build
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -archivePath ios/build/App.xcarchive \
            archive

      - name: Package iOS Unsigned IPA
        run: |
          mkdir -p ios/build/Payload
          cp -r ios/build/App.xcarchive/Products/Applications/App.app ios/build/Payload/
          cd ios/build
          zip -r FlowDirector-Unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowDirector-iOS-IPA
          path: ios/build/FlowDirector-Unsigned.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload iOS xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: FlowDirector-iOS-Archive
          path: ios/build/App.xcarchive
          if-no-files-found: warn
          retention-days: 14